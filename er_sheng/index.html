  <script>

    const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let pdfSpeed = parseFloat(localStorage.getItem('user_pdf_speed_preference') || '1.0');
    if (isNaN(pdfSpeed) || pdfSpeed < 0.5 || pdfSpeed > 2.5) pdfSpeed = 1.0;

    let compareSpeed = parseFloat(localStorage.getItem('user_compare_speed_preference') || '1.0');

    const APPS_SCRIPT_URL = GAS_BACKEND_URL;

    const slotR1 = document.getElementById('slot-r1');

    function getNormalizedDateStr() {
      const now = new Date();
      return now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    }

    function saveCurrentAppState() {
      if (!hasEnteredReciting) return;
      const state = {
        currentMode: currentMode,
        pdfSubMode: pdfSubMode,
        practicePhase: practicePhase,
        currentCycleCount: currentCycleCount,
        videoCurrentTime: (currentMode === 'mp4' ? video.currentTime : 0),
        currentLineIndex: currentLineIndex,
        markA_Index: markA_Index,
        markB_Index: markB_Index,
        isManualSelected: isManualSelected,
        savedDateStr: getNormalizedDateStr(),
        timestamp: Date.now()
      };
      localStorage.setItem('APP_SAVED_STATE_V573', JSON.stringify(state));
    }

    function checkAndPrepareRestoreState() {
      const savedStr = localStorage.getItem('APP_SAVED_STATE_V573');
      if (!savedStr) return false;
      try {
        const state = JSON.parse(savedStr);
        const todayStr = getNormalizedDateStr();

        if (state.savedDateStr !== todayStr) {
          localStorage.removeItem('APP_SAVED_STATE_V573');
          return false;
        }

        pendingRestoredState = state;
        const phaseName = getPhaseName(pendingRestoredState.practicePhase || 'new_gendu');
        const modeName = (pendingRestoredState.currentMode === 'mp4') ? '跟讀模式' : '自讀模式';
        restoreDescText.innerHTML = `上次背書進度：<br><strong style="color: #34D399;">${phaseName} (${modeName})</strong><br>準備好後請按下方按鈕回到畫面。`;
        restoreModalOverlay.style.display = 'flex';
        return true;
      } catch(e) {
        localStorage.removeItem('APP_SAVED_STATE_V573');
        return false;
      }
    }

    function confirmRestoreState() {
      if (!pendingRestoredState) {
        restoreModalOverlay.style.display = 'none';
        return;
      }

      const state = pendingRestoredState;
      currentMode = state.currentMode || 'mp4';
      pdfSubMode = state.pdfSubMode || 'guide';
      practicePhase = state.practicePhase || 'new_gendu';
      currentCycleCount = state.currentCycleCount || 0;
      currentLineIndex = state.currentLineIndex || 0;
      markA_Index = state.markA_Index !== undefined ? state.markA_Index : -1;
      markB_Index = state.markB_Index !== undefined ? state.markB_Index : -1;
      isManualSelected = state.isManualSelected || false;

      renderUI();

      if (currentMode === 'mp4') {
        video.pause();
        videoWrap.style.display = 'flex';
        pdfContainerWrap.style.display = 'none';
        guideStage.style.display = 'none';
        if (state.videoCurrentTime > 0) {
          video.currentTime = state.videoCurrentTime;
        }
      } else {
        setMode('pdf', pdfSubMode);
      }

      restoreModalOverlay.style.display = 'none';
      showToast('✨ 已回到上次進度，請按「跟讀」或「自讀」開始運行', 5000);
    }

    function getPhaseName(phase) {
      switch(phase) {
        case 'new_gendu': return '新進度跟讀';
        case 'new_zidu': return '新進度自讀';
        case 'cumulative_gendu': return '串習複習跟讀';
        case 'cumulative_zidu': return '串習複習自讀';
        case 'completed': return '已圓滿解鎖';
        default: return '定課中';
      }
    }

    window.addEventListener('beforeunload', () => { saveCurrentAppState(); });
    window.addEventListener('pagehide', () => { saveCurrentAppState(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveCurrentAppState();
      }
    });

    let swipeStartX = 0;
    let swipeStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1 && hasEnteredReciting) {
        const deltaX = e.changedTouches[0].clientX - swipeStartX;
        const deltaY = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          handleReturnToCompanionCard();
        }
      }
    }, { passive: true });

    function handleReturnToCompanionCard() {
      saveCurrentAppState();
      haltGuideRunnerImmediately();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;
      if (recordAudioElement) recordAudioElement.pause();
      releaseMicrophoneResources();
      
      try { 
        video.pause(); 
        video.currentTime = 0;
        video.removeAttribute('src');
        video.load(); 
      } catch(e) {}

      hasEnteredReciting = false;
      companionOverlay.style.display = 'flex';
      companionOverlay.style.opacity = '1';
      companionOverlay.classList.add('active');
      showToast('💤 已為您自動存檔並返回休息', 3500);
    }

    centerCore.addEventListener('scroll', () => {
      if (isGuideActive) {
        isUserManualScrolling = true;
        if (manualScrollTimer) clearTimeout(manualScrollTimer);
        manualScrollTimer = setTimeout(() => {
          isUserManualScrolling = false;
        }, 1200);
      }
    }, { passive: true });

    centerCore.addEventListener('touchstart', (e) => {
      if (currentMode === 'pdf' && pdfSubMode === 'guide' && isGuideActive) {
        isTouchingDisplay = true;
      }
    }, { passive: true });

    centerCore.addEventListener('touchend', (e) => {
      if (currentMode === 'pdf' && pdfSubMode === 'guide' && isGuideActive) {
        isTouchingDisplay = false;
      }
    }, { passive: true });

    centerCore.addEventListener('touchcancel', (e) => {
      if (currentMode === 'pdf' && pdfSubMode === 'guide' && isGuideActive) {
        isTouchingDisplay = false;
      }
    }, { passive: true });

    recordAudioElement.addEventListener('ended', () => { renderUI(); });

    function checkDailyResetOnStartup() {
      const todayStr = getNormalizedDateStr();
      const lastActiveDate = localStorage.getItem('APP_ACTIVE_DATE_V573');
      if (lastActiveDate !== todayStr) {
        localStorage.setItem('APP_ACTIVE_DATE_V573', todayStr);
        isScheduleRepeatLocked = true;
      }
    }

    function handleOrientationCheck() {
      if (hasEnteredReciting) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        portraitBlocker.style.display = 'flex';
        companionOverlay.style.display = 'none';
      } else {
        portraitBlocker.style.display = 'none';
        companionOverlay.style.display = 'flex';
      }
    }

    function orientationChangeWrapper() { setTimeout(handleOrientationCheck, 150); }
    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', orientationChangeWrapper);

    function triggerAppFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } 
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen().catch(() => {}); } 
        else if (el.msRequestFullscreen) { el.msRequestFullscreen().catch(() => {}); }
      } catch (e) {}
    }

    async function closeCompanionCard() {
      hasEnteredReciting = true;
      companionOverlay.style.opacity = '0';
      triggerAppFullscreen();

      setTimeout(async () => {
        companionOverlay.classList.remove('active');
        companionOverlay.style.display = 'none';
        
        renderUI();
        await loadAllAssetsSmartSync();

        const todayStr = getNormalizedDateStr();
        const hasPlayedBuddha = localStorage.getItem('buddha_played_' + todayStr);

        if (!hasPlayedBuddha) {
          localStorage.setItem('buddha_played_' + todayStr, 'true');
          await playDailyBuddhaVideoSequence();
        } else {
          const hasRestore = checkAndPrepareRestoreState();
          if (!hasRestore) {
            setMode('mp4');
          }
        }
      }, 350);
    }

    async function playDailyBuddhaVideoSequence() {
      // 🌟 確保播放佛號影片時，強制切換至跟讀模式 (mp4) 狀態，讓右側按鈕正確反應並可直接按暫停
      currentMode = 'mp4';
      pdfContainerWrap.style.display = 'none';
      guideStage.style.display = 'none';
      videoWrap.style.display = 'flex';
      renderUI();

      const savedBuddha = await getLocalFile('reciting_buddha_file_v573');
      let buddhaUrl = '';
      if (savedBuddha && savedBuddha.data) {
        buddhaUrl = URL.createObjectURL(new Blob([savedBuddha.data], { type: 'video/mp4' }));
      } else {
        buddhaUrl = './reciting_buddha_name.mp4';
      }

      video.src = buddhaUrl;
      video.currentTime = 0;
      video.playbackRate = 1.0;
      showToast('🙏【今日念佛清心】播放中...', 5000);

      try {
        await video.play();
      } catch(e) {
        const hasRestore = checkAndPrepareRestoreState();
        if (!hasRestore) setMode('mp4');
        return;
      }

      video.onended = () => {
        video.onended = null;
        getLocalFile('video_file_v573').then(savedVid => {
          if (savedVid && savedVid.data) {
            video.src = URL.createObjectURL(new Blob([savedVid.data], { type: 'video/mp4' }));
          } else {
            video.src = './chant_video.mp4';
          }
          showToast('✨ 念佛圓滿，開始今日定課', 3000);
          
          const hasRestore = checkAndPrepareRestoreState();
          if (!hasRestore) {
            setMode('mp4');
          }
        });
      };
    }

    if (btnPlayDedication) {
      btnPlayDedication.addEventListener('click', async () => {
        offeringOverlay.style.display = 'none';
        
        // 🌟 確保播放迴向影片時，強制切換至跟讀模式 (mp4) 狀態，方便長輩按暫停
        currentMode = 'mp4';
        pdfContainerWrap.style.display = 'none';
        guideStage.style.display = 'none';
        videoWrap.style.display = 'flex';
        renderUI();

        const savedMerit = await getLocalFile('merit_dedication_file_v573');
        let meritUrl = '';
        if (savedMerit && savedMerit.data) {
          meritUrl = URL.createObjectURL(new Blob([savedMerit.data], { type: 'video/mp4' }));
        } else {
          meritUrl = './merit_dedication.mp4';
        }

        video.src = meritUrl;
        video.currentTime = 0;
        video.playbackRate = 1.0;
        showToast('🙏【背書功德迴向】播放中...', 5000);

        try {
          await video.play();
        } catch(e) {
          setMode('mp4');
          return;
        }

        video.onended = () => {
          video.onended = null;
          getLocalFile('video_file_v573').then(savedVid => {
            if (savedVid && savedVid.data) {
              video.src = URL.createObjectURL(new Blob([savedVid.data], { type: 'video/mp4' }));
            } else {
              video.src = './chant_video.mp4';
            }
            showToast('✨ 迴向圓滿，隨喜功德', 3000);
            setMode('mp4');
          });
        };
      });
    }

    async function activateMainReciteEntry() {
      closeCompanionCard();
    }

    async function loadAllAssetsSmartSync() {
      const timestamp = Date.now();
      const todayStr = getNormalizedDateStr();
      const lastCheckDate = localStorage.getItem('LAST_ASSET_CHECK_DATE_V573');
      const isFirstCheckToday = (lastCheckDate !== todayStr);

      let hasAnyUpdateDetected = false;
      let logMsg = "📦 【v573.16 系統更新檢查】\n";

      let schedParsed = null;
      const localSchedStr = localStorage.getItem('OFFLINE_SCHEDULE_CACHE_V573');
      if (localSchedStr) {
        try { schedParsed = JSON.parse(localSchedStr); } catch(e){}
      }
      try {
        const res = await fetch('./schedule.json?nocache=' + timestamp, { cache: 'no-store' });
        if (res.ok) {
          const freshSched = await res.json();
          const freshStr = JSON.stringify(freshSched);
          if (freshStr !== localSchedStr) {
            localStorage.setItem('OFFLINE_SCHEDULE_CACHE_V573', freshStr);
            schedParsed = freshSched;
            hasAnyUpdateDetected = true;
            logMsg += "- schedule.json: 偵測遠端更新 🔄\n";
          }
        }
      } catch (e) {}
      if (!schedParsed) {
        try {
          const res = await fetch('./schedule.json?nocache=' + timestamp);
          if (res.ok) {
            schedParsed = await res.json();
            localStorage.setItem('OFFLINE_SCHEDULE_CACHE_V573', JSON.stringify(schedParsed));
            hasAnyUpdateDetected = true;
            logMsg += "- schedule.json: 首次載入 ✅\n";
          }
        } catch (e) {}
      }

      let localSentStr = localStorage.getItem('OFFLINE_SENTENCES_CACHE_V573');
      try {
        const res = await fetch('./sentences.json?nocache=' + timestamp, { cache: 'no-store' });
        if (res.ok) {
          const freshSent = await res.json();
          const freshSentStr = JSON.stringify(freshSent);
          if (freshSentStr !== localSentStr) {
            localStorage.setItem('OFFLINE_SENTENCES_CACHE_V573', freshSentStr);
            scriptureData = freshSent;
            hasAnyUpdateDetected = true;
            logMsg += "- sentences.json: 偵測遠端更新 🔄\n";
          }
        }
      } catch (e) {}
      if (scriptureData.length === 0) {
        if (localSentStr) {
          try { scriptureData = JSON.parse(localSentStr); } catch(e){}
        } else {
          try {
            const res = await fetch('./sentences.json?nocache=' + timestamp);
            if (res.ok) {
              scriptureData = await res.json();
              localStorage.setItem('OFFLINE_SENTENCES_CACHE_V573', JSON.stringify(scriptureData));
              hasAnyUpdateDetected = true;
            }
          } catch (e) {}
        }
      }

      const savedPdf = await getLocalFile('pdf_file_v573');
      if (savedPdf && savedPdf.data) {
        cachedPdfBuffer = savedPdf.data;
      } else {
        try {
          const res = await fetch('./scripture.pdf?nocache=' + timestamp);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            await saveLocalFile('pdf_file_v573', buf, 'pdf_cached');
            cachedPdfBuffer = buf;
            hasAnyUpdateDetected = true;
            logMsg += "- scripture.pdf: 首次載入 ✅\n";
          }
        } catch (e) {}
      }
      if (cachedPdfBuffer && parsedTextLines.length === 0) {
        await renderPdfOnValidDimensions();
      }

      const savedVid = await getLocalFile('video_file_v573');
      if (savedVid && savedVid.data) {
        video.src = URL.createObjectURL(new Blob([savedVid.data], { type: 'video/mp4' }));
      } else {
        try {
          const res = await fetch('./chant_video.mp4?nocache=' + timestamp);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            await saveLocalFile('video_file_v573', buf, 'vid_cached');
            video.src = URL.createObjectURL(new Blob([buf], { type: 'video/mp4' }));
            hasAnyUpdateDetected = true;
            logMsg += "- chant_video.mp4: 首次載入 ✅\n";
          }
        } catch (e) { video.src = './chant_video.mp4'; }
      }

      const savedBuddhaVid = await getLocalFile('reciting_buddha_file_v573');
      if (!savedBuddhaVid || !savedBuddhaVid.data) {
        try {
          const res = await fetch('./reciting_buddha_name.mp4?nocache=' + timestamp);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            await saveLocalFile('reciting_buddha_file_v573', buf, 'buddha_cached');
            hasAnyUpdateDetected = true;
          }
        } catch (e) {}
      }

      const savedMeritVid = await getLocalFile('merit_dedication_file_v573');
      if (!savedMeritVid || !savedMeritVid.data) {
        try {
          const res = await fetch('./merit_dedication.mp4?nocache=' + timestamp);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            await saveLocalFile('merit_dedication_file_v573', buf, 'merit_cached');
            hasAnyUpdateDetected = true;
          }
        } catch (e) {}
      }

      if (isFirstCheckToday) {
        localStorage.setItem('LAST_ASSET_CHECK_DATE_V573', todayStr);
        if (hasAnyUpdateDetected) {
          showToast(logMsg + "\n✨ 資源已自動更新至最新版本", 6000);
        }
      }

      applyScheduleToState("");
    }

    function applyScheduleToState(prefixMsg = "") {
      if (isManualSelected) return false;

      try {
        let scheduleData = null;
        const localSched = localStorage.getItem('OFFLINE_SCHEDULE_CACHE_V573');

        if (localSched) {
          try { scheduleData = JSON.parse(localSched); } catch(e){}
        }

        if (!scheduleData || !Array.isArray(scheduleData)) {
          currentDayPlan = { day: 1, start: 2, end: 5, repeat: 3, cStart: null, cEnd: null, cRepeat: 0 };
          practicePhase = 'new_gendu';
          currentCycleCount = 0;
          if (prefixMsg) showToast(prefixMsg + `\n⚠️ 警告：排程資料解析失敗，預設退回第 1 天`, 14000);
          return false;
        }
        
        let targetDay = 1;
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.get('start')) {
          const startStr = urlParams.get('start');
          const parts = startStr.split('-');
          if (parts.length === 3) {
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) - 1;
            const d = parseInt(parts[2], 10);
            const userStartDate = new Date(y, m, d);
            
            const now = new Date();
            const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const diffDays = Math.floor((todayDate - userStartDate) / (1000 * 60 * 60 * 24)) + 1;
            targetDay = Math.max(1, diffDays);
          }
        } else if (urlParams.get('day')) {
          targetDay = parseInt(urlParams.get('day'), 10) || 1;
        } else {
          targetDay = 1;
        }

        currentDayPlan = scheduleData.find(item => Number(item.day) === Number(targetDay)) || scheduleData[scheduleData.length - 1];
        if (!currentDayPlan) currentDayPlan = scheduleData[0];

        practicePhase = 'new_gendu';
        currentCycleCount = 0;

        setupStageRange();
        isScheduleRepeatLocked = false;

        const sA = markA_Index + 1;
        const sB = markB_Index + 1;

        let cumulativeInfoStr = '';
        if (currentDayPlan.cRepeat && currentDayPlan.cRepeat > 0 && currentDayPlan.cStart && currentDayPlan.cEnd) {
          cumulativeInfoStr = `\n- 串習複習: 第 ${currentDayPlan.cStart} 句 ～ 第 ${currentDayPlan.cEnd} 句 (${currentDayPlan.cRepeat}遍)`;
        } else {
          cumulativeInfoStr = `\n- 串習複習: 無`;
        }

        if (prefixMsg) {
          showToast(prefixMsg + 
                    `\n📅 【排程解析成功 v573.16】\n` +
                    `- 目標天數: 第 ${targetDay} 天\n` +
                    `- 新進度範圍: 第 ${sA} 句 ～ 第 ${sB} 句 (${currentDayPlan.repeat}遍)` +
                    cumulativeInfoStr, 16000);
        }

        return true;
      } catch (err) {
        if (prefixMsg) showToast("⚠️ 排程發生例外錯誤：" + err.message, 8000);
      }
      return false;
    }

    function setupStageRange() {
      if (!currentDayPlan) return;
      const maxIdx = Math.max(0, (parsedTextLines.length > 0 ? parsedTextLines.length - 1 : 100));

      if (practicePhase === 'new_gendu' || practicePhase === 'new_zidu') {
        markA_Index = Math.max(0, (currentDayPlan.start || 1) - 1);
        markB_Index = Math.min(maxIdx, (currentDayPlan.end || 1) - 1);
      } else if (practicePhase === 'cumulative_gendu' || practicePhase === 'cumulative_zidu') {
        markA_Index = Math.max(0, (currentDayPlan.cStart || 1) - 1);
        markB_Index = Math.min(maxIdx, (currentDayPlan.cEnd || 1) - 1);
      }

      currentLineIndex = markA_Index;
      currentCharIndexFloat = 0.0;
      isLineHeadLocked = true;
      videoPausedAt = -1;

      updateVisualDisplay();
      scrollToAlignTop(markA_Index);
    }

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(cachedPdfBuffer),
            cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/cmaps/',
            cMapPacked: true
          });

          currentPdfDoc = await loadingTask.promise;
          const page = await currentPdfDoc.getPage(1);

          pdfCanvas.width = 0;
          pdfCanvas.height = 0;

          const availableWidth = Math.max(centerCore.clientWidth || 0, window.innerWidth - 130);
          const pageRotation = page.rotate || 0;
          const unscaledViewport = page.getViewport({ scale: 1.0, rotation: pageRotation });
          const pageScale = availableWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: pageScale, rotation: pageRotation });

          pdfCanvas.width = viewport.width;
          pdfCanvas.height = viewport.height;
          const ctx = pdfCanvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const textContent = await page.getTextContent();
          const items = textContent.items;
          const validSpans = [];
          const chineseCharRegex = /[\u4e00-\u9fa5]/;

          items.forEach(it => {
            const str = it.str || '';
            if (!str.trim()) return;

            const tx = it.transform;
            const pdfX = tx[4];
            const pdfY = tx[5];

            const fontScale = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]) * pageScale;
            const fontWidth = it.width * pageScale;

            const p0 = pdfjsLib.Util.applyTransform([pdfX, pdfY], viewport.transform);
            const screenX0 = p0[0];

            const pdfFontH = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]) || (fontScale / pageScale);
            const pTop = pdfjsLib.Util.applyTransform([pdfX, pdfY + pdfFontH], viewport.transform);

            const realTop = Math.min(p0[1], pTop[1]);
            const realBottom = Math.max(p0[1], pTop[1]);

            const charWidth = fontWidth / Math.max(1, str.length);
            for (let c = 0; c < str.length; c++) {
              const char = str[c];
              if (chineseCharRegex.test(char)) {
                const charX0 = screenX0 + (c * charWidth);
                const charX1 = charX0 + charWidth;
                validSpans.push({ x0: charX0, x1: charX1, topY: realTop, bottomY: realBottom, fs: fontScale, char: char });
              }
            }
          });

          validSpans.sort((a, b) => a.topY - b.topY);
          const rowGroups = [];

          validSpans.forEach(span => {
            let matched = false;
            for (let g of rowGroups) {
              if (Math.abs(g.topY - span.topY) <= (span.fs * 0.45)) {
                g.spans.push(span);
                matched = true;
                break;
              }
            }
            if (!matched) rowGroups.push({ topY: span.topY, spans: [span] });
          });

          const analyzedRows = rowGroups.map(g => {
            g.spans.sort((a, b) => a.x0 - b.x0);
            const avgFs = g.spans.reduce((sum, s) => sum + s.fs, 0) / g.spans.length;
            const minTop = Math.min(...g.spans.map(s => s.topY));
            const lineX0 = g.spans[0].x0;
            const lineX1 = g.spans[g.spans.length - 1].x1;

            return { spans: g.spans, chineseCount: g.spans.length, avgFs: avgFs, minTop: minTop, lineX0: lineX0, lineX1: lineX1 };
          });

          analyzedRows.forEach(r => {
            r.maxBottom = Math.max(...r.spans.map(s => s.bottomY));
            r.underLineY = r.maxBottom + 7;
          });

          const candidateLargeRows = analyzedRows.filter(r => r.chineseCount >= 4 && (r.lineX1 - r.lineX0) >= 80);
          let mainTextFontSize = 0;
          if (candidateLargeRows.length > 0) {
            const sortedSizes = candidateLargeRows.map(r => r.avgFs).sort((a, b) => b - a);
            mainTextFontSize = sortedSizes[Math.min(sortedSizes.length - 1, 2)];
          }

          parsedTextLines = [];
          let internalIndex = 0;

          analyzedRows.forEach(r => {
            const isNormalOrLarge = (r.avgFs >= mainTextFontSize * 0.80);
            if (r.chineseCount >= 4 && (r.lineX1 - r.lineX0) >= 80 && isNormalOrLarge) {
              parsedTextLines.push({
                lineIndex: internalIndex++, x0: r.lineX0, x1: r.lineX1, topGlobal: r.minTop, bottomGlobal: r.maxBottom, underLineY: r.underLineY, charItems: r.spans
              });
            }
          });

          parsedTextLines.sort((a, b) => a.underLineY - b.underLineY);
          guideStage.style.height = viewport.height + 'px';

          updateVisualDisplay();
          scrollToAlignTop(markA_Index !== -1 ? markA_Index : 0);
      } catch(e) {
          console.error("PDF 解析錯誤: ", e);
      }
    }

    const DB_NAME = 'HappyReciteDB_' + CURRENT_CLASSIC_ID;
    const STORE_NAME = 'app_offline_files';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }

    async function getLocalFile(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveLocalFile(key, data, tag) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ data: data, tag: tag }, key);
      } catch (e) {}
    }

    function getActiveVideoRange() {
      if (!scriptureData || scriptureData.length === 0) {
        return { start: 0, end: 0, sentenceA: 0, sentenceB: 0, valid: false };
      }

      let aIdx = markA_Index >= 0 ? markA_Index : 0;
      let bIdx = markB_Index >= 0 ? markB_Index : (scriptureData.length - 1);

      if (bIdx < aIdx) bIdx = aIdx;
      aIdx = Math.min(aIdx, scriptureData.length - 1);
      bIdx = Math.min(bIdx, scriptureData.length - 1);

      const startObj = scriptureData[aIdx];
      const endObj = scriptureData[bIdx];

      if (!startObj || typeof startObj.start !== 'number' || !endObj || typeof endObj.end !== 'number') {
        return { start: 0, end: 0, sentenceA: 0, sentenceB: 0, valid: false };
      }

      return {
        start: startObj.start,
        end: endObj.end,
        sentenceA: aIdx + 1,
        sentenceB: bIdx + 1,
        valid: true
      };
    }
