<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>歡喜背書橫式單介面播放器 v309 (三態循環與動態錄音鍵版)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡喜背書">
  <meta name="theme-color" content="#0B0F19">

  <script>
    const CURRENT_CLASSIC_ID = 'er_sheng';
    const GAS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzKop9lC3br5VKWaIkT27kfv_bCpKtpZCxTFAJNLl4yeegqFhVA-RwCwN2h0WrfJ6qo/exec';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0B0F19;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    #line-browser-overlay, #portrait-blocker-overlay, #companion-overlay {
      display: none;
    }

    #landscape-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      position: relative;
      overflow: hidden;
    }

    #debug-panel {
      position: fixed;
      top: 10px; left: 80px; right: 80px;
      background: rgba(147, 51, 234, 0.92);
      color: #FFFFFF;
      border: 2px solid #C084FC;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      z-index: 999999;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    #schedule-toast {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.96);
      color: #FFFFFF;
      border: 3px solid #FFFFFF;
      padding: 14px 32px;
      border-radius: 40px;
      font-size: 20px;
      font-weight: 900;
      z-index: 100000;
      pointer-events: none;
    }

    .side-wing {
      flex-shrink: 0;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      z-index: 60;
    }
    #left-wing { width: 68px; }
    #right-wing { width: 68px; }
    .slot { width: 100%; height: 25%; display: flex; align-items: center; justify-content: center; }

    .circle-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2.5px solid #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900; color: #FFFFFF;
      cursor: pointer;
      background: #334155;
    }

    .square-btn {
      width: 60px !important;
      height: 60px !important;
      border-radius: 14px !important;
      border: 2.5px solid #BAE6FD !important;
      background-color: #000000 !important;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 17px !important; font-weight: 900;
      color: #FB923C !important;
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .square-btn:active { transform: scale(0.90); }

    /* 🟢 第 1 下：綠燈（模式就緒） */
    .square-btn.mode-green {
      background-color: #15803D !important;
      background: radial-gradient(circle, #22C55E 0%, #15803D 100%) !important;
      border-color: #DCFCE7 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.7) !important;
    }

    /* 🟣 第 2 下：紫燈（功能啟動） */
    .square-btn.func-purple {
      background-color: #7E22CE !important;
      background: radial-gradient(circle, #A855F7 0%, #6B21A8 100%) !important;
      border-color: #F3E8FF !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 22px rgba(168, 85, 247, 0.9) !important;
    }

    #center-core {
      flex: 1; height: 100%;
      background-color: #FFFFFF;
      position: relative;
      overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
    }

    #guide-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: block; }
    #pdf-container-wrap { position: relative; width: 100%; background-color: #FAFAFA; display: none; justify-content: center; }
    #pdf-canvas { display: block; width: 100% !important; height: auto !important; }
    #video-container-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 55; }
    #my-chant-video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div id="debug-panel">✨ v309：第 1 下綠燈(切換模式)，第 2 下紫燈(啟動功能)</div>
  <div id="schedule-toast">通知訊息</div>

  <div id="landscape-container">
    <!-- 左側翼鍵 -->
    <div class="side-wing" id="left-wing">
      <div class="slot"><button class="circle-btn" style="background:#10B981;">快+</button></div>
      <div class="slot"><button class="circle-btn" style="background:#0D9488;">慢-</button></div>
      <div class="slot"><button class="circle-btn" id="left-action-btn" style="visibility:hidden;">定位</button></div>
      <div class="slot"><button class="circle-btn" style="background:#EF4444;">離</button></div>
    </div>

    <!-- 中央核心區 -->
    <div id="center-core">
      <div id="guide-stage"></div>
      <div id="pdf-container-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div id="video-container-wrap">
        <video id="my-chant-video" playsinline webkit-playsinline preload="auto"></video>
      </div>
    </div>

    <!-- 右側翼鍵 -->
    <div class="side-wing" id="right-wing">
      <div class="slot"><button class="square-btn mode-green" id="btn-mode-mp4">跟讀</button></div>
      <div class="slot"><button class="square-btn" id="btn-mode-pdf">自讀</button></div>
      <div class="slot"><button class="square-btn" id="btn-mode-record">比對</button></div>
      <div class="slot"><button class="circle-btn" style="background:#B45309;">供養</button></div>
    </div>
  </div>

  <script>
    const debugPanel = document.getElementById('debug-panel');
    function logDebug(msg) {
      console.log(msg);
      if (debugPanel) debugPanel.textContent = '📢 ' + msg;
    }

    const pdfContainerWrap = document.getElementById('pdf-container-wrap');
    const pdfCanvas = document.getElementById('pdf-canvas');
    const videoWrap = document.getElementById('video-container-wrap');
    const video = document.getElementById('my-chant-video');
    const leftActionBtn = document.getElementById('left-action-btn');

    const btnModeMp4 = document.getElementById('btn-mode-mp4');
    const btnModePdf = document.getElementById('btn-mode-pdf');
    const btnModeRecord = document.getElementById('btn-mode-record');

    let currentMode = 'mp4';
    let currentPdfDoc = null;
    let cachedPdfBuffer = null;

    // 🌟 嚴謹的三態燈號管理 (黑 -> 綠 -> 紫，紫再按維持紫)
    function handleModeButtonPress(btnTarget, modeName, layoutSwitchCallback, functionActivateCallback) {
      const isGreen = btnTarget.classList.contains('mode-green');
      const isPurple = btnTarget.classList.contains('func-purple');

      if (!isGreen && !isPurple) {
        // 🟢 【黑 ➡️ 綠】：切換模式（其他按鈕全部歸黑，自己變綠）
        [btnModeMp4, btnModePdf, btnModeRecord].forEach(b => {
          if (b) {
            b.classList.remove('mode-green');
            b.classList.remove('func-purple');
          }
        });
        
        // 恢復比對按鈕預設文字
        btnModeRecord.textContent = '比對';

        btnTarget.classList.add('mode-green');
        currentMode = modeName;
        layoutSwitchCallback();
        logDebug(`【切換模式】已就緒 ${modeName}（請再按一下啟動功能）`);

      } else if (isGreen) {
        // 🟣 【綠 ➡️ 紫】：真正啟動功能
        btnTarget.classList.remove('mode-green');
        btnTarget.classList.add('func-purple');
        
        // 若是比對模式的紫燈，文字改為「錄音」
        if (modeName === 'record') {
          btnTarget.textContent = '錄音';
        }

        functionActivateCallback();
        logDebug(`【啟動功能】${modeName} 核心引擎全速運行中！`);

      } else if (isPurple) {
        // 🟣【紫 ➡️ 紫】：已經在紫色狀態，再次點擊維持紫色不變
        logDebug(`【保持運行】目前已在 ${modeName} 紫燈執行狀態中`);
      }
    }

    // 1. 跟讀按鈕
    btnModeMp4.addEventListener('click', () => {
      handleModeButtonPress(
        btnModeMp4, 
        'mp4',
        () => {
          leftActionBtn.style.visibility = 'hidden';
          pdfContainerWrap.style.display = 'none';
          videoWrap.style.display = 'flex';
          centerCore.scrollTop = 0;
          logDebug("已切換至跟讀介面");
        },
        async () => {
          video.currentTime = 0;
          try {
            await video.play();
            logDebug("🚀 [v226對接] 跟讀循環播放已啟動！");
          } catch (e) {
            logDebug("⚠️ 播放受阻，請再點一下畫面");
          }
        }
      );
    });

    // 2. 自讀按鈕
    btnModePdf.addEventListener('click', () => {
      handleModeButtonPress(
        btnModePdf,
        'pdf',
        async () => {
          leftActionBtn.style.visibility = 'visible';
          leftActionBtn.textContent = '定位';
          video.pause();
          videoWrap.style.display = 'none';
          pdfContainerWrap.style.display = 'flex';

          if (!currentPdfDoc && cachedPdfBuffer) {
            await renderPdf(cachedPdfBuffer);
          }
          logDebug("已切換至自讀介面");
        },
        () => {
          logDebug("🚀 [v226對接] 自讀 VAD 語音感應導引已正式啟動！");
        }
      );
    });

    // 3. 比對按鈕（帶有動態「比對 ➡️ 錄音」文字切換與左3播放鍵）
    btnModeRecord.addEventListener('click', () => {
      handleModeButtonPress(
        btnModeRecord,
        'record',
        async () => {
          leftActionBtn.style.visibility = 'visible';
          leftActionBtn.textContent = '播放'; // 左3為播放鍵
          video.pause();
          videoWrap.style.display = 'none';
          pdfContainerWrap.style.display = 'flex';

          if (!currentPdfDoc && cachedPdfBuffer) {
            await renderPdf(cachedPdfBuffer);
          }
          logDebug("已切換至比對介面（左3為播放鍵）");
        },
        () => {
          logDebug("🚀 [v226對接] 比對錄音功能已啟動（此時按鈕為錄音鍵）！");
        }
      );
    });

    async function renderPdf(buf) {
      try {
        const loadingTask = pdfjsLib.getDocument({ data: buf });
        currentPdfDoc = await loadingTask.promise;
        const page = await currentPdfDoc.getPage(1);
        const viewport = page.getViewport({ scale: 1.2 });
        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        const ctx = pdfCanvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      } catch (e) {
        logDebug("PDF 渲染例外: " + e.message);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('./scripture.pdf');
        if (res.ok) {
          const buf = await res.arrayBuffer();
          cachedPdfBuffer = buf;
          await renderPdf(new Uint8Array(buf));
        }
      } catch (e) {}
      video.src = './chant_video.mp4';
    });
  </script>
</body>
</html>
