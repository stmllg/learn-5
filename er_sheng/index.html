    /* =========================================================================
       1. 第一優先層：LINE 三點以預設瀏覽器開啟提示
       ========================================================================= */
    #line-browser-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      z-index: 100000;
      background: rgba(4, 7, 15, 0.94);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #line-browser-overlay.active {
      display: flex;
      opacity: 1;
    }

    .line-guide-card {
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      border: 2px solid #D97706;
      border-radius: 18px;
      max-width: 420px;
      width: 90%;
      padding: 24px 22px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    .line-guide-title {
      font-size: 20px;
      font-weight: 900;
      color: #FBBF24;
      letter-spacing: 2px;
    }
    .line-guide-content {
      font-size: 16px;
      line-height: 1.8;
      color: #E2E8F0;
      text-align: left;
      background: rgba(15, 23, 42, 0.7);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px dashed rgba(245, 158, 11, 0.45);
    }
    .line-guide-content strong {
      color: #38BDF8;
    }

    /* =========================================================================
       2. 第二順位層：物理直立螢幕旋轉鎖定層
       ========================================================================= */
    #portrait-blocker-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at center, #1E293B 0%, #080D1A 100%);
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      pointer-events: all;
      box-sizing: border-box;
      gap: 16px;
    }

    .rotate-phone-icon {
      width: 62px;
      height: 100px;
      border: 3px solid #F59E0B;
      border-radius: 12px;
      position: relative;
      margin-bottom: 8px;
      animation: rotatePhoneAnim 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }
    .rotate-phone-icon::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #F59E0B;
    }

    @keyframes rotatePhoneAnim {
      0%   { transform: rotate(0deg); }
      35%  { transform: rotate(-90deg); }
      70%  { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    .rotate-hint-title {
      font-size: 25px;
      font-weight: 900;
      color: #FBBF24;
      letter-spacing: 2px;
    }
    .rotate-hint-subtitle {
      font-size: 16px;
      color: #CBD5E1;
      letter-spacing: 1.5px;
      line-height: 1.6;
    }

    /* =========================================================================

    }
    #companion-overlay.active {
      display: flex;
      opacity: 1;
    }

    .companion-wrapper {

      max-height: 88vh;
      max-width: 95vw;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
      border-radius: 14px;
      overflow: hidden;
      
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .companion-wrapper.ready {
      opacity: 1;
      transform: scale(1);
    }

    #companion-img-display {
      max-height: 86vh;
      max-width: 95vw;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 14px;
    }

    .btn-card-orange {
      position: absolute;
      bottom: 14px;
      right: 14px;
      padding: 8px clamp(20px, 4vw, 36px);
      font-size: clamp(15px, 2.2vh, 20px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #431407;
      background: linear-gradient(135deg, #FFEDD5 0%, #FDBA74 100%);
      border: 1.5px solid #F97316;
      border-radius: 26px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease-out;
      z-index: 10;
    }
    .btn-card-orange:active {
      transform: scale(0.95);
      background: linear-gradient(135deg, #FDBA74 0%, #FB923C 100%);
    }

    #mode-grand-banner {
      display: none;

      top: 50%;
      left: 50%;

      z-index: 150000;

      pointer-events: none;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      letter-spacing: 2px;
    }
    #mode-grand-banner.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* 🔴 錄音時強效呼吸閃爍特效樣式 */
    @keyframes recordingPulseStrong {
      0%   { box-shadow: 0 0 15px rgba(239, 68, 68, 0.9), inset 0 0 8px rgba(239, 68, 68, 0.5); border-color: #EF4444; transform: scale(1.0); }
      50%  { box-shadow: 0 0 35px rgba(239, 68, 68, 1), inset 0 0 18px rgba(255, 255, 255, 0.8); border-color: #FCA5A5; transform: scale(1.06); }

    }
    .recording-flashing {
      animation: recordingPulseStrong 0.9s infinite ease-in-out !important;
    }

    }
    .voice-breathing-anim {
      animation: voiceBreathingActive 1.1s infinite ease-in-out !important;
    }
