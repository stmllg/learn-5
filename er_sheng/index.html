<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第1天到第30天相片輪播測試</title>
    <style>
        body {
            background-color: #0B0F19;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: #1E293B;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #38BDF8;
        }
        .day-indicator {
            font-size: 24px;
            font-weight: bold;
            color: #FBBF24;
            margin-bottom: 15px;
        }
        .photo-frame {
            width: 100%;
            height: 400px;
            background: #0F172A;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px dashed #64748B;
        }
        .photo-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .photo-frame img.active {
            display: block;
        }
        .placeholder-text {
            color: #94A3B8;
            font-size: 18px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            background: linear-gradient(135deg, #34D399 0%, #059669 100%);
            color: #064E3B;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.secondary {
            background: #334155;
            color: #E2E8F0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="day-indicator" id="dayIndicator">第 1 天 / 共 30 天</div>
    <div class="photo-frame" id="photoFrame">
        <!-- 這裡模擬載入圖片，您可以將檔名改為您的實際檔名，例如 card_001.webp 等 -->
        <div class="placeholder-text" id="placeholder">正在載入第 1 天圖片...</div>
    </div>
    <div class="controls">
        <button class="secondary" onclick="prevPhoto()">上一張</button>
        <button id="playPauseBtn" onclick="togglePlay()">暫停自動輪播</button>
        <button class="secondary" onclick="nextPhoto()">下一張</button>
    </div>
</div>

<script>
    let currentDay = 1;
    const totalDays = 30;
    let isPlaying = true;
    let timer = null;

    const dayIndicator = document.getElementById('dayIndicator');
    const photoFrame = document.getElementById('photoFrame');

    function updateDisplay() {
        dayIndicator.textContent = `第 ${currentDay} 天 / 共 30 天`;
        
        // 清空並重新建立內容
        // 假設您的圖片命名規則為 cards/card_001.webp 到 cards/card_030.webp，或 bg_01.webp 等
        // 這裡我們做一個靈活的實作：嘗試載入檔名，若找不到則顯示文字提示
        
        // 格式化編號，例如 1 -> "001" 或 "01"
        const paddedDay3 = String(currentDay).padStart(3, '0');
        const paddedDay2 = String(currentDay).padStart(2, '0');
        
        photoFrame.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #38BDF8;">
                <div style="font-size: 32px; font-weight: bold; margin-bottom: 10px;">Day ${currentDay}</div>
                <div style="font-size: 14px; color: #94A3B8;">正在讀取圖片: card_${paddedDay3}.webp (或 bg_${paddedDay2}.webp)</div>
            </div>
            <img src="cards/card_${paddedDay3}.webp" onerror="this.style.display='none';" alt="Day ${currentDay}">
        `;
    }

    function nextPhoto() {
        currentDay++;
        if (currentDay > totalDays) {
            currentDay = 1; // 循環回到第一天
        }
        updateDisplay();
    }

    function prevPhoto() {
        currentDay--;
        if (currentDay < 1) {
            currentDay = totalDays; // 倒回最後一天
        }
        updateDisplay();
    }

    function startSlideshow() {
        timer = setInterval(() => {
            if (isPlaying) {
                nextPhoto();
            }
        }, 2000); // 每 2 秒切換一次
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playPauseBtn');
        if (isPlaying) {
            btn.textContent = "暫停自動輪播";
        } else {
            btn.textContent = "開始自動輪播";
        }
    }

    // 初始化
    updateDisplay();
    startSlideshow();
</script>

</body>
</html>
