  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0B0F19;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* LINE 瀏覽器提示 */
    #line-browser-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      z-index: 100000;
      background: rgba(4, 7, 15, 0.96);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #line-browser-overlay.active {
      display: flex;
    }
    .line-guide-card {
      background: #1E293B;
      border: 2px solid #D97706;
      border-radius: 18px;
      max-width: 400px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .line-guide-title {
      font-size: 20px;
      font-weight: 900;
      color: #FBBF24;
    }
    .line-guide-content {
      font-size: 16px;
      line-height: 1.8;
      color: #E2E8F0;
      text-align: left;
    }

    /* 旋轉提示 */
    #portrait-blocker-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      background: #080D1A;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .rotate-phone-icon {
      width: 50px; height: 80px;
      border: 3px solid #F59E0B;
      border-radius: 10px;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(-90deg); }
      70% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    /* 陪伴卡層 */
    #companion-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      z-index: 20000;
      background: rgba(4, 7, 15, 0.94);
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }
    .companion-wrapper {
      position: relative;
      display: inline-block;
      max-height: 88vh;
      max-width: 92vw;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
    }
    #companion-img-display {
      max-height: 86vh;
      max-width: 92vw;
      display: block;
      object-fit: contain;
    }
    .btn-card-orange {
      position: absolute;
      bottom: 14px;
      right: 14px;
      padding: 8px 24px;
      font-size: 18px;
      font-weight: 900;
      color: #431407;
      background: linear-gradient(135deg, #FFEDD5 0%, #FDBA74 100%);
      border: 1.5px solid #F97316;
      border-radius: 24px;
      cursor: pointer;
    }

    /* 主畫面佈局 */
    #landscape-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
    }

    .side-wing {
      width: calc(68px + env(safe-area-inset-left, 0px));
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      z-index: 60;
    }
    #right-wing {
      width: calc(68px + env(safe-area-inset-right, 0px));
    }
    .slot {
      width: 100%;
      height: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 圓形按鈕 */
    .circle-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2.5px solid #FFFFFF;
      background: #000000;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-btn:active { transform: scale(0.92); }

    /* 長方形方塊按鈕 (模式三鍵) */
    .square-btn {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      border: 2.5px solid #BAE6FD;
      background: #000000;
      color: #FB923C;
      font-size: 17px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .square-btn:active { transform: scale(0.92); }

    /* 模式顏色 */
    .btn-green-standby {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%) !important;
      border-color: #A7F3D0 !important;
      color: #FFFFFF !important;
    }
    .btn-purple-running {
      background: linear-gradient(135deg, #9333EA 0%, #7E22CE 100%) !important;
      border-color: #E9D5FF !important;
      color: #FFFFFF !important;
    }

    /* 各別按鈕特殊樣式 */
    .btn-color-offering { background: #B45309; border-color: #FDE68A; color: #FEF3C7; }
    .btn-color-mark-a { background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%); border-color: #BAE6FD; }
    .btn-color-mark-b { background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%); border-color: #FFEDD5; }
    .btn-color-play { background: linear-gradient(135deg, #10B981 0%, #059669 100%); border-color: #A7F3D0; }
    .btn-color-speed { background: #0F172A; border-color: #38BDF8; color: #38BDF8; font-size: 22px !important; }
