<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>歡喜背書橫式單介面播放器 v312 (穩定防護版)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡喜背書">
  <meta name="theme-color" content="#0B0F19">

  <script>
    const CURRENT_CLASSIC_ID = 'er_sheng';
    const GAS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzKop9lC3br5VKWaIkT27kfv_bCpKtpZCxTFAJNLl4yeegqFhVA-RwCwN2h0WrfJ6qo/exec';
  </script>

  <!-- 引入 PDF.js 主程式與 Worker -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0B0F19;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    #landscape-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      position: relative;
      overflow: hidden;
    }

    /* 頂端狀態與錯誤顯示面板 */
    #debug-panel {
      position: fixed;
      top: 10px; left: 80px; right: 80px;
      background: rgba(16, 185, 129, 0.92);
      color: #FFFFFF;
      border: 2px solid #34D399;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      z-index: 999999;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .side-wing {
      flex-shrink: 0;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      z-index: 60;
    }
    #left-wing { width: 68px; }
    #right-wing { width: 68px; }
    .slot { width: 100%; height: 25%; display: flex; align-items: center; justify-content: center; }

    .circle-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2.5px solid #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900; color: #FFFFFF;
      cursor: pointer;
      background: #334155;
    }

    .square-btn {
      width: 60px !important;
      height: 60px !important;
      border-radius: 14px !important;
      border: 2.5px solid #BAE6FD !important;
      background-color: #000000 !important;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 17px !important; font-weight: 900;
      color: #FB923C !important;
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .square-btn:active { transform: scale(0.90); }

    /* 🌟 選中時變為綠燈 */
    .square-btn.active-mode {
      background-color: #15803D !important;
      background: radial-gradient(circle, #22C55E 0%, #15803D 100%) !important;
      border-color: #DCFCE7 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.85) !important;
    }

    #center-core {
      flex: 1; height: 100%;
      background-color: #FFFFFF;
      position: relative;
      overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
    }

    #guide-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: block; }
    #pdf-container-wrap { position: relative; width: 100%; background-color: #FAFAFA; display: none; justify-content: center; }
    #pdf-canvas { display: block; width: 100% !important; height: auto !important; }
    #video-container-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 55; }
    #my-chant-video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div id="debug-panel">✨ v312 執行中：系統初始化正常</div>

  <div id="landscape-container">
    <!-- 左側翼鍵 -->
    <div class="side-wing" id="left-wing">
      <div class="slot"><button class="circle-btn" style="background:#10B981;">快+</button></div>
      <div class="slot"><button class="circle-btn" style="background:#0D9488;">慢-</button></div>
      <div class="slot"><button class="circle-btn" id="left-action-btn" style="visibility:hidden;">定位</button></div>
      <div class="slot"><button class="circle-btn" style="background:#EF4444;">離</button></div>
    </div>

    <!-- 中央核心區 -->
    <div id="center-core">
      <div id="guide-stage"></div>
      <div id="pdf-container-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div id="video-container-wrap">
        <video id="my-chant-video" playsinline webkit-playsinline preload="auto"></video>
      </div>
    </div>

    <!-- 右側翼鍵 -->
    <div class="side-wing" id="right-wing">
      <div class="slot"><button class="square-btn active-mode" id="btn-mode-mp4">跟讀</button></div>
      <div class="slot"><button class="square-btn" id="btn-mode-pdf">自讀</button></div>
      <div class="slot"><button class="square-btn" id="btn-mode-record">比對</button></div>
      <div class="slot"><button class="circle-btn" style="background:#B45309;">供養</button></div>
    </div>
  </div>

  <script>
    const debugPanel = document.getElementById('debug-panel');
    function logDebug(msg, isError = false) {
      console.log(msg);
      if (debugPanel) {
        debugPanel.textContent = (isError ? '❌ ' : '📢 ') + msg;
        if (isError) debugPanel.style.background = 'rgba(239, 68, 68, 0.92)';
      }
    }

    const pdfContainerWrap = document.getElementById('pdf-container-wrap');
    const pdfCanvas = document.getElementById('pdf-canvas');
    const videoWrap = document.getElementById('video-container-wrap');
    const video = document.getElementById('my-chant-video');
    const leftActionBtn = document.getElementById('left-action-btn');

    const btnModeMp4 = document.getElementById('btn-mode-mp4');
    const btnModePdf = document.getElementById('btn-mode-pdf');
    const btnModeRecord = document.getElementById('btn-mode-record');

    let currentMode = 'mp4';
    let currentPdfDoc = null;
    let cachedPdfBuffer = null;

    function updateActiveButton(activeBtn) {
      [btnModeMp4, btnModePdf, btnModeRecord].forEach(b => {
        if (b) b.classList.remove('active-mode');
      });
      if (activeBtn) activeBtn.classList.add('active-mode');
    }

    // 1. 跟讀模式
    async function switchToMp4Mode() {
      try {
        currentMode = 'mp4';
        updateActiveButton(btnModeMp4);

        leftActionBtn.style.visibility = 'hidden';
        pdfContainerWrap.style.display = 'none';
        videoWrap.style.display = 'flex';
        centerCore.scrollTop = 0;

        video.currentTime = 0;
        await video.play();
        logDebug("📖 跟讀模式：影片播放中");
      } catch (e) {
        logDebug("📖 跟讀模式已就緒（點擊畫面即可播放）");
      }
    }

    // 2. 自讀模式
    async function switchToPdfMode() {
      try {
        currentMode = 'pdf';
        updateActiveButton(btnModePdf);

        leftActionBtn.style.visibility = 'visible';
        leftActionBtn.textContent = '定位';

        video.pause();
        videoWrap.style.display = 'none';
        pdfContainerWrap.style.display = 'flex';

        if (!currentPdfDoc && cachedPdfBuffer) {
          await renderPdf(cachedPdfBuffer);
        }
        logDebug("📖 自讀模式：已就緒");
      } catch (err) {
        logDebug("自讀切換錯誤: " + err.message, true);
      }
    }

    // 3. 比對模式
    async function switchToRecordMode() {
      try {
        currentMode = 'record';
        updateActiveButton(btnModeRecord);

        leftActionBtn.style.visibility = 'visible';
        leftActionBtn.textContent = '播放';

        video.pause();
        videoWrap.style.display = 'none';
        pdfContainerWrap.style.display = 'flex';

        if (!currentPdfDoc && cachedPdfBuffer) {
          await renderPdf(cachedPdfBuffer);
        }
        logDebug("🎙️ 比對模式：已就緒");
      } catch (err) {
        logDebug("比對切換錯誤: " + err.message, true);
      }
    }

    btnModeMp4.addEventListener('click', switchToMp4Mode);
    btnModePdf.addEventListener('click', switchToPdfMode);
    btnModeRecord.addEventListener('click', switchToRecordMode);

    // 點擊畫面解鎖影片播放
    window.addEventListener('pointerdown', () => {
      if (currentMode === 'mp4' && video.paused) {
        video.play().catch(() => {});
      }
    }, { once: false });

    async function renderPdf(buf) {
      try {
        if (!window.pdfjsLib) {
          throw new Error("PDF.js 尚未載入");
        }
        const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(buf) });
        currentPdfDoc = await loadingTask.promise;
        const page = await currentPdfDoc.getPage(1);
        const viewport = page.getViewport({ scale: 1.2 });
        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        const ctx = pdfCanvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      } catch (e) {
        logDebug("PDF 渲染失敗: " + e.message, true);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        logDebug("正在載入經文檔案...");
        const res = await fetch('./scripture.pdf');
        if (res.ok) {
          const buf = await res.arrayBuffer();
          cachedPdfBuffer = buf;
          await renderPdf(buf);
          logDebug("經文 PDF 載入成功");
        } else {
          logDebug("找不到 scripture.pdf 檔案", true);
        }
      } catch (e) {
        logDebug("初始化錯誤: " + e.message, true);
      }

      try {
        video.src = './chant_video.mp4';
      } catch (e) {}

      switchToMp4Mode();
    });
  </script>
</body>
</html>
