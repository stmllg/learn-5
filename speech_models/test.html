<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小模型吐字測試 V01</title><style>body{font:22px system-ui,sans-serif;max-width:850px;margin:auto;padding:18px;background:#f4f7f3;color:#17251d}button{font:inherit;padding:12px;margin:5px;border:1px solid #587363;border-radius:9px;background:white}button:disabled{opacity:.4}section{background:white;padding:18px;border-radius:12px;margin:12px 0}#target{font-size:34px;font-weight:bold}#out{font-size:30px;color:#17643a;overflow-wrap:anywhere}pre{font-size:16px;white-space:pre-wrap;max-height:250px;overflow:auto}#status{overflow-wrap:anywhere}</style><h2>小模型吐字測試 V01</h2><div id="status">請先載入模型</div><button id="load">① 載入模型</button><button id="start" disabled>② 開始20句</button><section><div id="progress">尚未開始</div><div id="target"></div><hr><div>辨識吐字：</div><div id="out">—</div><div id="count"></div></section><button id="retry" disabled>重念本句</button><button id="skip" disabled>跳過本句</button><button id="stop" disabled>停止</button><button id="save" disabled>下載 JSON 紀錄</button><section><b>吐字時間紀錄</b><pre id="log"></pre></section><script src="test_sentences.js"></script><script>
const $=id=>document.getElementById(id),han=t=>(t.match(/\p{Script=Han}/gu)||[]).length;let w,ctx,mic,node,records=[],idx=0,running=false,startedAt='',engineLogs=[];function status(t){$('status').textContent=t}function controls(v){running=v;for(const id of ['retry','skip','stop'])$(id).disabled=!v;}async function closeMic(){controls(false);mic?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')await ctx.close();}function error(t){status('錯誤：'+t);closeMic();$('load').disabled=false;$('start').disabled=true;w?.terminate();} $('load').onclick=()=>{$('load').disabled=true;w=new Worker('test_worker.js');w.onerror=e=>error(e.message);w.onmessage=({data:m})=>{switch(m.type){case 'status':status(m.text);break;case 'log':engineLogs.push(m.text);break;case 'ready':status('模型載入成功，請開始測試');$('start').disabled=false;break;case 'sentence':idx=m.idx;$('progress').textContent=`第 ${idx+1} / 20 句（第 ${m.attempt} 次）`;$('target').textContent=SENTENCES[idx].text;$('out').textContent='—';$('count').textContent=`0 / ${han(SENTENCES[idx].text)} 字`;$('log').textContent='';break;case 'output':$('out').textContent=m.text;$('count').textContent=`${m.characters} / ${han(SENTENCES[idx].text)} 字`;$('log').textContent+=`${m.ms} ms｜${m.characters} 字｜${m.text}\n`;$('log').scrollTop=$('log').scrollHeight;break;case 'record':records.push(m.record);$('save').disabled=false;break;case 'done':status('20句測試完成，請下載 JSON');closeMic();$('start').disabled=false;break;case 'error':error(m.text);break;}};w.postMessage({type:'init'});};
$('start').onclick=async()=>{try{$('start').disabled=true;ctx=new AudioContext();await ctx.resume();mic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await ctx.audioWorklet.addModule('test_pcm.js');node=new AudioWorkletNode(ctx,'test-pcm');const source=ctx.createMediaStreamSource(mic),mute=ctx.createGain();mute.gain.value=0;source.connect(node).connect(mute).connect(ctx.destination);records=[];startedAt=new Date().toISOString();$('save').disabled=true;w.postMessage({type:'start',sentences:SENTENCES});controls(true);node.port.onmessage=({data:a})=>{if(running)w.postMessage({type:'pcm',samples:a,at:performance.timeOrigin+performance.now()},[a.buffer]);};status('收音中，請依畫面念誦');}catch(e){error(e.message);}};for(const type of ['retry','skip'])$(type).onclick=()=>w.postMessage({type});$('stop').onclick=()=>{w.postMessage({type:'stop'});closeMic();status('已停止');$('start').disabled=false;};$('save').onclick=()=>{const blob=new Blob([JSON.stringify({version:'小模型吐字測試V01',startedAt,createdAt:new Date().toISOString(),sampleRate:16000,settings:{decoding:'greedy_search',autoAdvance:'Han count >= target',continuousMic:true},sentences:SENTENCES,records,engineLogs},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='小模型吐字測試V01_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};</script></html>
