<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>歡喜背書橫式播放器 v139 (影音全診斷版)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡喜背書">
  <meta name="theme-color" content="#000000">

  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      if (/Line/i.test(ua)) {
        document.documentElement.classList.add('is-line-app');
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }

    #landscape-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      position: relative;
      overflow: hidden;
    }

    /* 影音偵測黑盒子面板 */
    #video-debug-panel {
      position: absolute;
      top: 8px;
      left: 70px;
      right: 70px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid #F59E0B;
      border-radius: 10px;
      padding: 8px 12px;
      z-index: 9999;
      font-size: 12px;
      line-height: 1.4;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .debug-row { display: flex; justify-content: space-between; align-items: center; }
    .debug-tag { font-weight: 900; color: #38BDF8; }
    .debug-val { font-weight: 700; color: #FBBF24; font-family: monospace; }
    .btn-copy-debug {
      background: #D97706;
      color: #FFF;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    /* LINE 警示層 */
    #line-warning-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #DC2626 0%, #991B1B 100%);
      color: #FFFFFF;
      z-index: 999999 !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .line-warning-card {
      background: rgba(0, 0, 0, 0.85);
      border: 2.5px solid #FEF08A;
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 500px;
      width: 92%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .line-warning-title { font-size: 22px; font-weight: 900; color: #FEF08A; }
    .line-warning-text { font-size: 16px; line-height: 1.7; font-weight: 700; color: #FFFFFF; text-align: left; }
    .line-warning-highlight { color: #38BDF8; font-weight: 900; }

    #welcome-start-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 12, 22, 0.98);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .welcome-board, .welcome-board * { pointer-events: none !important; }
    html:not(.is-line-app) #welcome-start-overlay { display: flex; }
    html.is-line-app #line-warning-banner { display: flex !important; }
    html.is-line-app #welcome-start-overlay { display: none !important; }

    .welcome-board {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 96vh;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      border: 2px solid #F59E0B;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .welcome-board-title { font-size: clamp(16px, 4vw, 21px); font-weight: 900; color: #FBBF24; }
    .welcome-board-footer { width: 100%; background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #FFFFFF; border-radius: 14px; padding: 10px 16px; text-align: center; font-size: clamp(15px, 2.8vh, 18px); font-weight: 900; }

    .side-wing {
      flex-shrink: 0;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding-top: 4px;
      padding-bottom: 4px;
      z-index: 60;
      box-sizing: border-box;
    }
    #left-wing { width: calc(56px + env(safe-area-inset-left, 0px)); padding-left: env(safe-area-inset-left, 4px); padding-right: 4px; }
    #right-wing { width: calc(56px + env(safe-area-inset-right, 0px)); padding-right: env(safe-area-inset-right, 4px); padding-left: 4px; }
    .slot { width: 100%; height: 25%; display: flex; align-items: center; justify-content: center; position: relative; }

    .circle-btn {
      width: 48px !important;
      height: 48px !important;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12.5px !important;
      font-weight: 900;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s ease-out;
      text-align: center;
      line-height: 1.1;
      touch-action: manipulation;
    }
    .circle-btn:active { transform: scale(0.92); opacity: 0.85; }

    .btn-color-mark-a { background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%); border-color: #BAE6FD; }
    #btn-mark-a.active-mark { box-shadow: 0 0 16px #38BDF8, inset 0 0 8px #FFFFFF; }
    .btn-color-mark-b { background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%); border-color: #FFEDD5; }
    #btn-mark-b.active-mark { box-shadow: 0 0 16px #FB923C, inset 0 0 8px #FFFFFF; }
    .btn-color-repeat { background: linear-gradient(135deg, #6366F1 0%, #4338CA 100%); border-color: #E0E7FF; font-size: 13px !important; }
    .btn-color-shutdown { background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); border-color: #FECACA; }

    .btn-color-guide { background: radial-gradient(circle, #EF4444 0%, #B91C1C 100%); border-color: #FECACA; }
    #btn-guide-toggle.guide-waiting { background: radial-gradient(circle, #EAB308 0%, #CA8A04 100%) !important; border-color: #FEF08A !important; }
    #btn-guide-toggle.guide-active { background: radial-gradient(circle, #22C55E 0%, #15803D 100%) !important; border-color: #DCFCE7 !important; }

    .btn-color-offering { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); border-color: #FDE68A; color: #78350F; }
    .btn-color-speed-up { background: linear-gradient(135deg, #10B981 0%, #059669 100%); border-color: #A7F3D0; }
    .btn-color-speed-down { background: linear-gradient(135deg, #0D9488 0%, #0F766E 100%); border-color: #CCFBF1; }

    #center-core {
      flex: 1;
      height: 100%;
      background-color: #FFFFFF;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-left: 2px solid #1E293B;
      border-right: 2px solid #1E293B;
      scroll-behavior: smooth;
      touch-action: pan-y;
    }

    #guide-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: block; }
    #guide-line { position: absolute; height: 5px; background-color: #00E676; border-radius: 3px; box-shadow: 0 0 8px rgba(0, 230, 118, 0.85); display: none; }
    #red-dot { position: absolute; width: min(18px, 5.5vh); height: min(18px, 5.5vh); background: radial-gradient(circle, #FF5252 20%, #FF1744 100%); border: 2px solid #FFFFFF; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
    #mark-a-line { position: absolute; height: 5px; background-color: #0284C7; border-radius: 3px; box-shadow: 0 0 10px #38BDF8; z-index: 48; display: none; }
    #mark-b-line { position: absolute; height: 5px; background-color: #EA580C; border-radius: 3px; box-shadow: 0 0 10px #FB923C; z-index: 48; display: none; }

    #pdf-container-wrap { position: relative; width: 100%; background-color: #FAFAFA; pointer-events: none; display: flex; justify-content: center; }
    #pdf-canvas { display: block; width: 100% !important; height: auto !important; image-rendering: -webkit-optimize-contrast; transform: translateZ(0); }

    #video-container-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 55;
    }
    #my-chant-video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- 影音即時診斷黑盒子 -->
  <div id="video-debug-panel">
    <div class="debug-row">
      <span class="debug-tag">【影音診斷黑盒子】</span>
      <button class="btn-copy-debug" onclick="copyDebugLog()">複製診斷紀錄</button>
    </div>
    <div class="debug-row">
      <span>1. 檔案狀態 (chant_video.mp4)：</span>
      <span class="debug-val" id="dbg-file-status">檢測中...</span>
    </div>
    <div class="debug-row">
      <span>2. 影片核心 ReadyState：</span>
      <span class="debug-val" id="dbg-ready-state">0 (未載入)</span>
    </div>
    <div class="debug-row">
      <span>3. 影片時間 (Current / Duration)：</span>
      <span class="debug-val" id="dbg-time-info">0.0s / 0.0s</span>
    </div>
    <div class="debug-row">
      <span>4. 播放狀態 (Play / Error)：</span>
      <span class="debug-val" id="dbg-play-state" style="color: #F87171;">無</span>
    </div>
  </div>

  <div id="landscape-container">
    <div class="side-wing" id="left-wing">
      <div class="slot"><button class="circle-btn btn-color-mark-a" id="btn-mark-a">起點</button></div>
      <div class="slot"><button class="circle-btn btn-color-mark-b" id="btn-mark-b">終點</button></div>
      <div class="slot"><button class="circle-btn btn-color-repeat" id="btn-repeat-count">1次</button></div>
      <div class="slot"><button class="circle-btn btn-color-shutdown" id="btn-shutdown-exit">關機</button></div>
    </div>

    <div id="center-core">
      <div id="guide-stage">
        <div id="mark-a-line"></div>
        <div id="mark-b-line"></div>
        <div id="guide-line"></div>
        <div id="red-dot"></div>
      </div>

      <div id="pdf-container-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>

      <div id="video-container-wrap">
        <video id="my-chant-video" playsinline webkit-playsinline x5-playsinline preload="auto" src="./chant_video.mp4"></video>
      </div>
    </div>

    <div class="side-wing" id="right-wing">
      <div class="slot"><button class="circle-btn btn-color-guide" id="btn-guide-toggle">背書</button></div>
      <div class="slot"><button class="circle-btn btn-color-offering" id="btn-offering">供養</button></div>
      <div class="slot"><button class="circle-btn btn-color-speed-up" id="btn-speed-up">語快</button></div>
      <div class="slot"><button class="circle-btn btn-color-speed-down" id="btn-speed-down">語慢</button></div>
    </div>
  </div>

  <script>
    const dbgFileStatus = document.getElementById('dbg-file-status');
    const dbgReadyState = document.getElementById('dbg-ready-state');
    const dbgTimeInfo = document.getElementById('dbg-time-info');
    const dbgPlayState = document.getElementById('dbg-play-state');

    const video = document.getElementById('my-chant-video');
    const centerCore = document.getElementById('center-core');
    const pdfWrap = document.getElementById('pdf-container-wrap');
    const videoWrap = document.getElementById('video-container-wrap');
    const btnGuideToggle = document.getElementById('btn-guide-toggle');

    let currentMode = 'pdf'; // 'pdf' 或 'mp4'
    let scriptureData = [];
    let markA_Index = 1;
    let markB_Index = 4;
    let totalTargetCycles = 1;
    let completedCycles = 0;
    let isGuideActive = false;

    // =========================================================================
    // 【診斷監控】：檢測 chant_video.mp4 是否真的存在伺服器上
    // =========================================================================
    async function checkVideoFileExistence() {
      try {
        const res = await fetch('./chant_video.mp4', { method: 'HEAD' });
        if (res.ok) {
          const len = res.headers.get('content-length');
          const mb = len ? (len / (1024 * 1024)).toFixed(1) + 'MB' : '未知大小';
          dbgFileStatus.textContent = `200 OK (${mb})`;
          dbgFileStatus.style.color = '#34D399';
        } else {
          dbgFileStatus.textContent = `HTTP 錯誤：${res.status} (找不到檔案)`;
          dbgFileStatus.style.color = '#EF4444';
        }
      } catch (e) {
        dbgFileStatus.textContent = `網路攔截 / 跨域錯誤`;
        dbgFileStatus.style.color = '#EF4444';
      }
    }

    video.addEventListener('loadedmetadata', () => {
      dbgReadyState.textContent = `${video.readyState} (已取得影片長度)`;
      dbgTimeInfo.textContent = `0.0s / ${video.duration.toFixed(1)}s`;
    });

    video.addEventListener('canplay', () => {
      dbgReadyState.textContent = `${video.readyState} (可開始播放)`;
      dbgReadyState.style.color = '#34D399';
    });

    video.addEventListener('error', () => {
      const err = video.error;
      let msg = "未知錯誤";
      if (err) {
        if (err.code === 1) msg = "取回中斷 (Aborted)";
        if (err.code === 2) msg = "網路中斷 (Network Error)";
        if (err.code === 3) msg = "格式解碼失敗 (Decode Error)";
        if (err.code === 4) msg = "找不到檔案或格式不支援 (SRC Not Supported)";
      }
      dbgPlayState.textContent = `錯誤：${msg}`;
      dbgPlayState.style.color = '#EF4444';
    });

    video.addEventListener('timeupdate', () => {
      dbgTimeInfo.textContent = `${video.currentTime.toFixed(1)}s / ${video.duration.toFixed(1)}s`;
      if (currentMode !== 'mp4') return;
      if (!scriptureData || scriptureData.length === 0) return;

      const tStart = scriptureData[markA_Index] ? scriptureData[markA_Index].start : 0;
      const tEnd = scriptureData[markB_Index] ? scriptureData[markB_Index].end : video.duration;

      if (video.currentTime >= tEnd) {
        completedCycles++;
        if (completedCycles >= totalTargetCycles) {
          video.pause();
          btnGuideToggle.textContent = '背書';
          btnGuideToggle.classList.remove('guide-active');
        } else {
          video.currentTime = tStart;
          video.play().catch(() => {});
        }
      }
    });

    // 複製診斷紀錄給開發者
    window.copyDebugLog = function() {
      const log = `【背書影音診斷數據】\n檔案狀態: ${dbgFileStatus.textContent}\nReadyState: ${dbgReadyState.textContent}\n時間: ${dbgTimeInfo.textContent}\n播放狀態: ${dbgPlayState.textContent}\n目前模式: ${currentMode}\nUA: ${navigator.userAgent}`;
      navigator.clipboard.writeText(log).then(() => {
        alert("已成功複製診斷資料！請直接貼給我看。");
      }).catch(() => {
        alert(log);
      });
    };

    // =========================================================================
    // 【單指滑動切換模式】
    // =========================================================================
    let touchStartX = 0;
    centerCore.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    }, { passive: true });

    centerCore.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(deltaX) > 60) {
          toggleMode();
        }
      }
    }, { passive: true });

    function toggleMode() {
      if (currentMode === 'pdf') {
        currentMode = 'mp4';
        pdfWrap.style.display = 'none';
        videoWrap.style.display = 'flex';
        dbgPlayState.textContent = '切換至影片，等待播放';
        dbgPlayState.style.color = '#38BDF8';
        if (scriptureData && scriptureData[markA_Index]) {
          video.currentTime = scriptureData[markA_Index].start;
        }
      } else {
        currentMode = 'pdf';
        video.pause();
        videoWrap.style.display = 'none';
        pdfWrap.style.display = 'flex';
        dbgPlayState.textContent = '已切換回經文模式';
      }
    }

    // =========================================================================
    // 【背書開關：解決播放權限】
    // =========================================================================
    btnGuideToggle.addEventListener('click', () => {
      if (currentMode === 'mp4') {
        const tStart = scriptureData[markA_Index] ? scriptureData[markA_Index].start : 0;
        const tEnd = scriptureData[markB_Index] ? scriptureData[markB_Index].end : video.duration;

        if (video.paused) {
          dbgPlayState.textContent = '正在啟動播放...';
          video.play().then(() => {
            dbgPlayState.textContent = '正常播放中';
            dbgPlayState.style.color = '#34D399';
            btnGuideToggle.textContent = '暫停';
            btnGuideToggle.classList.add('guide-active');
            if (video.currentTime < tStart || video.currentTime >= tEnd) {
              video.currentTime = tStart;
            }
          }).catch(err => {
            dbgPlayState.textContent = `播放攔截: ${err.name} - ${err.message}`;
            dbgPlayState.style.color = '#EF4444';
          });
        } else {
          video.pause();
          btnGuideToggle.textContent = '背書';
          btnGuideToggle.classList.remove('guide-active');
          dbgPlayState.textContent = '手動暫停';
        }
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      checkVideoFileExistence();
      try {
        const sRes = await fetch('./sentences.json?nocache=' + Date.now());
        if (sRes.ok) scriptureData = await sRes.json();
      } catch (e) {}
    });
  </script>
</body>
</html>
