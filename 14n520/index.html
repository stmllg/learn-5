      </div>
    </div>
  </div>

    <div class="schedule-modal-card">
      <div class="schedule-modal-title">⚙️ 萬用智慧排程設定 (v677)</div>
      <div class="schedule-grid-layout">
        <div class="schedule-field-row">
          <span class="schedule-field-label">經典總句數 / 已學：</span>
          <div style="display: flex; gap: 4px; align-items: center;">
            <div id="display-total-sentences" class="schedule-field-readonly">--句</div>
            <input type="number" id="input-completed-sentences" class="schedule-field-input" min="0" max="999" readonly style="width: 75px; background: #1E293B; color: #94A3B8;">
          </div>
        </div>
        <div class="schedule-field-row">
          <span class="schedule-field-label">每日推進步幅：</span>
          <div class="step-btn-group">
            <button type="button" class="step-btn" data-step="1" onclick="selectDailyStep(1)">1句</button>
            <button type="button" class="step-btn" data-step="2" onclick="selectDailyStep(2)">2句</button>
            <button type="button" class="step-btn active" data-step="4" onclick="selectDailyStep(4)">4句</button>
          </div>
        </div>
        <div class="schedule-field-row">
          <span class="schedule-field-label">定課預設遍數：</span>
          <input type="number" id="input-repeat-new" class="schedule-field-input" min="1" max="50" oninput="previewScheduleChanges()">
        </div>
        <div class="schedule-field-row">
          <span class="schedule-field-label">串習預設遍數：</span>
          <input type="number" id="input-repeat-cum" class="schedule-field-input" min="0" max="50" oninput="previewScheduleChanges()">
        </div>
      </div>
      <div class="schedule-preview-single">
        <div class="schedule-preview-title">✨ 滾雪球串習排程預覽</div>
        <div id="preview-new-list" class="schedule-preview-list">計算中...</div>
      </div>
      <div class="schedule-modal-actions">
        <button id="btn-close-schedule" class="btn-sched-action" onclick="closeScheduleModal()">取消</button>
        <button id="btn-save-schedule" class="btn-sched-action" onclick="saveAndApplySchedule()">確認更新排程</button>
      </div>
    </div>
  </div>

  <div id="restore-modal-overlay">
    <div class="restore-card">

      <button class="btn-restore-confirm" onclick="confirmRestoreState()">🙏 隨喜回來，準備好了</button>
    </div>
  </div>

  <script>

    function getNormalizedDateStr() {
      const now = new Date();
      return now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    }

    function saveCurrentAppState() {
      if (!hasEnteredReciting) return;
      const state = {
        coreMode: currentCoreMode, practicePhase: practicePhase, currentCycleCount: currentCycleCount,
        videoCurrentTime: (currentCoreMode === 'mode2' ? video.currentTime : 0),

        savedDateStr: getNormalizedDateStr(), timestamp: Date.now()
      };
      localStorage.setItem('APP_SAVED_STATE_V677_' + CURRENT_CLASSIC_ID, JSON.stringify(state));

    function checkAndPrepareRestoreState() {
      const savedStr = localStorage.getItem('APP_SAVED_STATE_V677_' + CURRENT_CLASSIC_ID);
      if (!savedStr) return false;
      try {
        const state = JSON.parse(savedStr);
        if (state.savedDateStr !== getNormalizedDateStr()) {
          localStorage.removeItem('APP_SAVED_STATE_V677_' + CURRENT_CLASSIC_ID);
          return false;
        }
        pendingRestoredState = state;
        restoreModalOverlay.style.display = 'flex';
        return true;
      } catch(e) { return false; }
    }

    function confirmRestoreState() {
      if (!pendingRestoredState) { restoreModalOverlay.style.display = 'none'; return; }
      const state = pendingRestoredState;
      currentCoreMode = state.coreMode || 'mode2';
      practicePhase = state.practicePhase || 'new_gendu';
      currentCycleCount = state.currentCycleCount || 0;
      currentLineIndex = state.currentLineIndex || 0;
      markA_Index = state.markA_Index !== undefined ? state.markA_Index : -1;
      markB_Index = state.markB_Index !== undefined ? state.markB_Index : -1;
      isManualSelected = state.isManualSelected || false;
      restoreModalOverlay.style.display = 'none';

      loadAllAssetsSmartSync().then(() => {
        setCoreMode(currentCoreMode);
        if (state.videoCurrentTime > 0) video.currentTime = state.videoCurrentTime;
        showToast('✨ 已回到上次進度', 3000);
      });
    }

    // 🌟 GAS 代理下載輔助
    function fetchFileViaGASProxy(fileUrl) {
      return new Promise((resolve, reject) => {
        if (!fileUrl) { reject('無效的檔案網址'); return; }
        const callbackName = 'proxyCallback_' + Math.floor(Math.random() * 1000000);
        let timeout = setTimeout(() => { delete window[callbackName]; reject('代理下載逾時'); }, 30000);

        window[callbackName] = (res) => {
          clearTimeout(timeout);
          delete window[callbackName];
          if (res && res.success && res.base64) {
            const binaryString = atob(res.base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
            resolve({ contentType: res.contentType, arrayBuffer: bytes.buffer, text: new TextDecoder('utf-8').decode(bytes) });
          } else { reject(res ? res.error : '代理下載失敗'); }
        };

        const script = document.createElement('script');
        script.src = `${APPS_SCRIPT_URL}?action=proxyFile&url=${encodeURIComponent(fileUrl)}&callback=${callbackName}&t=${Date.now()}`;
        script.onerror = () => { clearTimeout(timeout); delete window[callbackName]; reject('網路連線失敗'); };
        document.body.appendChild(script);
      });
    }

    function fetchClassicCatalogFromGAS() {
      return new Promise((resolve) => {
        const callbackName = 'onCatalogLoaded_' + Math.floor(Math.random() * 1000000);
        let timeout = setTimeout(() => { delete window[callbackName]; resolve(null); }, 8000);
        window[callbackName] = (res) => {
          clearTimeout(timeout);
          delete window[callbackName];
          if (res && res.status === 'catalog' && res.classic) { resolve(res.classic); } else { resolve(null); }
        };
        const script = document.createElement('script');
        script.src = `${APPS_SCRIPT_URL}?classicId=${encodeURIComponent(CURRENT_CLASSIC_ID)}&callback=${callbackName}&t=${Date.now()}`;
        script.onerror = () => { clearTimeout(timeout); delete window[callbackName]; resolve(null); };
        document.body.appendChild(script);
      });
    }

    async function loadAllAssetsSmartSync() {
      let statusLog = `📦 【v677 雲端代理載入中】<br>`;
      showToast(statusLog, 12000);

      let catalogInfo = { pdfUrl: '', videoUrl: '', sentencesUrl: '' };
      try {
        const fetchedCatalog = await fetchClassicCatalogFromGAS();
        if (fetchedCatalog) {
          catalogInfo = fetchedCatalog;
          statusLog += `✅ 成功取得雲端目錄: ${catalogInfo.name || CURRENT_CLASSIC_ID}<br>`;
        }
      } catch (e) { statusLog += `⚠️ 雲端目錄載入略過<br>`; }
      showToast(statusLog, 12000);

      // 1. sentences.json
      let localSentStr = localStorage.getItem('OFFLINE_SENTENCES_CACHE_V677_' + CURRENT_CLASSIC_ID);
      let sentencesFetchUrl = catalogInfo.sentencesUrl || './sentences.json';
      if (localSentStr) {
        try { scriptureData = JSON.parse(localSentStr); } catch (e) {}
      }
      if (!scriptureData || scriptureData.length === 0) {
        try {
          const proxyRes = await fetchFileViaGASProxy(sentencesFetchUrl);
          scriptureData = JSON.parse(proxyRes.text);
          localStorage.setItem('OFFLINE_SENTENCES_CACHE_V677_' + CURRENT_CLASSIC_ID, JSON.stringify(scriptureData));
          statusLog += `✅ sentences.json [下載並快取成功]<br>`;
        } catch (e) { statusLog += `❌ sentences.json 錯誤<br>`; }
      }
      if (scriptureData.length > 0) CLASSIC_TOTAL_SENTENCES = scriptureData.length;

      // 2. PDF
      const savedPdf = await getLocalFile('pdf_file_v677');
      let pdfFetchUrl = catalogInfo.pdfUrl || './scripture.pdf';
      if (savedPdf && savedPdf.data) {
        cachedPdfBuffer = savedPdf.data;
      } else {
        try {
          const proxyRes = await fetchFileViaGASProxy(pdfFetchUrl);
          cachedPdfBuffer = proxyRes.arrayBuffer;
          await saveLocalFile('pdf_file_v677', cachedPdfBuffer, 'pdf_cached');
          statusLog += `✅ PDF經文 [下載並快取成功]<br>`;
        } catch (e) { statusLog += `❌ PDF 錯誤<br>`; }
      }
      if (cachedPdfBuffer && parsedTextLines.length === 0) { await renderPdfOnValidDimensions(); }

      // 3. 影片
      video.src = catalogInfo.videoUrl || './chant_video.mp4';
      showToast('✨ 資源載入就緒！', 4000);
      generateAlgorithmicSchedule(JSON.parse(localStorage.getItem('USER_SCHEDULE_SETTINGS_V677_' + CURRENT_CLASSIC_ID) || '{}'));
      applyScheduleToState("");
    }

    // 排程相關函式
    function getCurrentActiveDayNumber() {
      if (currentDayPlan && currentDayPlan.day) return currentDayPlan.day;
      if (urlParams.get('start')) {
        const parts = urlParams.get('start').split('-');
        if (parts.length === 3) {
          const diff = Math.floor((new Date() - new Date(parts[0], parts[1]-1, parts[2])) / (1000*60*60*24)) + 1;
          return Math.max(1, diff);
        }
      }
      return 1;
    }

    function getCurrentProgressEnd() {
      const saved = localStorage.getItem('USER_CURRENT_PROGRESS_END_V677_' + CURRENT_CLASSIC_ID);
      return saved !== null ? parseInt(saved, 10) : 0;
    }

    function openScheduleModal() {
      const savedSettings = JSON.parse(localStorage.getItem('USER_SCHEDULE_SETTINGS_V677_' + CURRENT_CLASSIC_ID) || '{}');
      selectedDailyStep = savedSettings.dailyStep || DEFAULT_DAILY_STEP;
      const rNew = savedSettings.repeatNew || DEFAULT_REPEAT_NEW;
      const rCum = savedSettings.repeatCum !== undefined ? savedSettings.repeatCum : DEFAULT_REPEAT_CUMULATIVE;

      document.getElementById('display-total-sentences').textContent = CLASSIC_TOTAL_SENTENCES + '句';
      let completedEnd = getCurrentProgressEnd();
      document.getElementById('input-completed-sentences').value = completedEnd;

      updateStepButtonsUI(selectedDailyStep);
      document.getElementById('input-repeat-new').value = rNew;
      document.getElementById('input-repeat-cum').value = rCum;

      renderPreviewList('preview-new-list', generateTempScheduleList({ dailyStep: selectedDailyStep, repeatNew: rNew, repeatCum: rCum, testCompleted: completedEnd }));
      scheduleModalOverlay.style.display = 'flex';
    }

    function closeScheduleModal() { scheduleModalOverlay.style.display = 'none'; }
    function selectDailyStep(step) { selectedDailyStep = step; updateStepButtonsUI(step); previewScheduleChanges(); }
    function updateStepButtonsUI(active) {
      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.getAttribute('data-step'), 10) === active);
      });
    }
    function previewScheduleChanges() {
      const testCompleted = parseInt(document.getElementById('input-completed-sentences').value, 10) || 0;
      renderPreviewList('preview-new-list', generateTempScheduleList({
        dailyStep: selectedDailyStep,
        repeatNew: parseInt(document.getElementById('input-repeat-new').value, 10) || DEFAULT_REPEAT_NEW,
        repeatCum: parseInt(document.getElementById('input-repeat-cum').value, 10) || DEFAULT_REPEAT_CUMULATIVE,
        testCompleted: testCompleted
      }));
    }
    function generateTempScheduleList(settings) {
      const total = CLASSIC_TOTAL_SENTENCES || 10;
      let simStart = Math.min(total, settings.testCompleted + 1);
      return [`預覽: 新進度第 [${simStart}~${Math.min(total, simStart + settings.dailyStep - 1)}] 句 (${settings.repeatNew}遍)`];
    }
    function renderPreviewList(id, items) { const el = document.getElementById(id); if (el) el.innerHTML = items.join('<br>'); }
    
    function saveAndApplySchedule() {
      const testCompleted = parseInt(document.getElementById('input-completed-sentences').value, 10) || 0;
      const repeatNew = parseInt(document.getElementById('input-repeat-new').value, 10) || DEFAULT_REPEAT_NEW;
      const repeatCum = parseInt(document.getElementById('input-repeat-cum').value, 10) || DEFAULT_REPEAT_CUMULATIVE;
      localStorage.setItem('USER_CURRENT_PROGRESS_END_V677_' + CURRENT_CLASSIC_ID, testCompleted.toString());
      localStorage.setItem('USER_SCHEDULE_SETTINGS_V677_' + CURRENT_CLASSIC_ID, JSON.stringify({ dailyStep: selectedDailyStep, repeatNew, repeatCum, testCompleted }));
      generateAlgorithmicSchedule({ dailyStep: selectedDailyStep, repeatNew, repeatCum, testCompleted });
      closeScheduleModal();
      showToast('✨ 排程參數已更新！', 3000);
      applyScheduleToState("");
    }

    function generateAlgorithmicSchedule(settings) {
      const total = CLASSIC_TOTAL_SENTENCES || 10;
      const step = settings.dailyStep || DEFAULT_DAILY_STEP;
      const rNew = settings.repeatNew || DEFAULT_REPEAT_NEW;
      const rCum = settings.repeatCum !== undefined ? settings.repeatCum : DEFAULT_REPEAT_CUMULATIVE;
      const testCompleted = settings.testCompleted !== undefined ? settings.testCompleted : getCurrentProgressEnd();
      const list = [];
      let simStart = Math.min(total, testCompleted + 1);

      for (let day = 1; day <= 10; day++) {
        let end = Math.min(total, simStart + step - 1);
        list.push({ day, start: simStart, end, repeat: rNew, cStart: 1, cEnd: end, cRepeat: rCum });
        if (end >= total) break;
        simStart = end + 1;
      }
      localStorage.setItem('OFFLINE_SCHEDULE_CACHE_V677_' + CURRENT_CLASSIC_ID, JSON.stringify(list));
    }

    function applyScheduleToState() {
      try {
        const cache = JSON.parse(localStorage.getItem('OFFLINE_SCHEDULE_CACHE_V677_' + CURRENT_CLASSIC_ID));
        if (cache && cache.length > 0) {
          currentDayPlan = cache[0];
          setupStageRange();
          return true;
        }
      } catch (e) {}
      currentDayPlan = { start: 1, end: Math.min(4, CLASSIC_TOTAL_SENTENCES || 10), cStart: 1, cEnd: 4 };
      setupStageRange();
      return false;
    }

    function setupStageRange() {
      if (!currentDayPlan) return;
      markA_Index = Math.max(0, (currentDayPlan.start || 1) - 1);
      markB_Index = Math.min(parsedTextLines.length - 1, (currentDayPlan.end || 1) - 1);
      currentLineIndex = markA_Index;
      updateVisualDisplay();
    }

    async function closeCompanionCard() {
      hasEnteredReciting = true;
      companionOverlay.style.opacity = '0';
      setTimeout(async () => {
        companionOverlay.classList.remove('active');
        companionOverlay.style.display = 'none';
        await loadAllAssetsSmartSync();
        setCoreMode('mode2');
      }, 350);
    }

    // 資料庫與初始化
    const DB_NAME = 'HappyReciteDB_V677_' + CURRENT_CLASSIC_ID;
    const STORE_NAME = 'app_offline_files';
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => { e.target.result.createObjectStore(STORE_NAME); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function getLocalFile(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          tx.objectStore(STORE_NAME).get(key).onsuccess = (e) => resolve(e.target.result || null);
        });
      } catch (e) { return null; }
    }
    async function saveLocalFile(key, data, tag) {
      try {
        const db = await openDatabase();
        db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put({ data, tag }, key);
      } catch (e) {}
    }
    function showToast(msg, duration = 5000) {
      scheduleToast.innerHTML = msg;
      scheduleToast.style.display = 'block';
      scheduleToast.style.opacity = '1';
      clearTimeout(scheduleToast._t);
      scheduleToast._t = setTimeout(() => { scheduleToast.style.opacity = '0'; setTimeout(() => scheduleToast.style.display = 'none', 300); }, duration);
    }

    window.addEventListener('DOMContentLoaded', () => {
      let cardFileName = "card_001.webp";

      renderUI();

    function renderUI() {
      slotR1.innerHTML = '<button class="square-btn" id="btn-gendu" onclick="handleGenduClick()">跟讀</button>';
      slotR2.innerHTML = '<button class="square-btn" id="btn-zidu" onclick="handleZiduClick()">自讀</button>';
    }

    function handleGenduClick() {
      setCoreMode('mode2');
      video.play().catch(() => {});
    }

    function handleZiduClick() {
      setCoreMode('mode3');
    }

    function setCoreMode(mode) {
      currentCoreMode = mode;
      if (mode === 'mode2') {
        pdfContainerWrap.style.display = 'none';
        guideStage.style.display = 'none';
        videoWrap.style.display = 'flex';
      } else if (mode === 'mode3') {
        video.pause();
        videoWrap.style.display = 'none';
        pdfContainerWrap.style.display = 'flex';
        guideStage.style.display = 'block';
      }
    }

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(cachedPdfBuffer) }).promise;
        const page = await doc.getPage(1);
        const viewport = page.getViewport({ scale: 1.5 });
        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport }).promise;
        
        parsedTextLines = [{ lineIndex: 0, x0: 50, x1: viewport.width - 50, topGlobal: 100, bottomGlobal: 150, underLineY: 155, charItems: [] }];
        for(let i=1; i<15; i++) {
          parsedTextLines.push({ lineIndex: i, x0: 50, x1: viewport.width - 50, topGlobal: 150 + i*50, bottomGlobal: 200 + i*50, underLineY: 205 + i*50, charItems: [] });
        }
      } catch(e) {}
    }

    function updateVisualDisplay() {}
  </script>
