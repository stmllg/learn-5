    let currentCoreMode = 'mode2';

    let audioContext = null;

    let scriptureData = [];

    function getNormalizedDateStr() {
      const now = new Date();
      return now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    }

    function isIndependentModeUnlocked() {
      if (practicePhase === 'completed') return true;
      const savedStr = classicStorage.getItem('APP_SAVED_STATE_SENIOR_V1');
      if (!savedStr) return false;
      try {
        const savedState = JSON.parse(savedStr);
        return savedState.savedDateStr === getNormalizedDateStr() &&
          savedState.practicePhase === 'completed' &&
          classicStorage.getItem('INDEPENDENT_UNLOCKED_DATE_SENIOR') === getNormalizedDateStr();
      } catch (e) {
        return false;
      }
    }

    function saveCurrentAppState() {
      if (!hasEnteredReciting) return;
      if (practicePhase === 'completed') {
        classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_SENIOR', getNormalizedDateStr());
      }
      const state = {
        coreMode: currentCoreMode,
        practicePhase: practicePhase,
        currentCycleCount: currentCycleCount,
        videoCurrentTime: (currentCoreMode === 'mode2' ? video.currentTime : 0),
        currentLineIndex: currentLineIndex,
        markA_Index: markA_Index,
        markB_Index: markB_Index,
        savedDateStr: getNormalizedDateStr(),
        timestamp: Date.now()
      };
      classicStorage.setItem('APP_SAVED_STATE_SENIOR_V1', JSON.stringify(state));
    }

    function checkAndPrepareRestoreState() {
      const savedStr = classicStorage.getItem('APP_SAVED_STATE_SENIOR_V1');
      if (!savedStr) return false;
      try {
        const state = JSON.parse(savedStr);
        const todayStr = getNormalizedDateStr();

        if (state.savedDateStr !== todayStr) {
          classicStorage.removeItem('APP_SAVED_STATE_SENIOR_V1');
          return false;
        }

        pendingRestoredState = state;
        const phaseName = getPhaseName(pendingRestoredState.practicePhase || 'new_gendu');
        restoreDescText.innerHTML = `上次背書進度：<br><strong style="color: #34D399;">${phaseName}</strong><br>準備好後請按下方按鈕回到畫面。`;
        restoreModalOverlay.style.display = 'flex';
        return true;
      } catch(e) {
        classicStorage.removeItem('APP_SAVED_STATE_SENIOR_V1');
        return false;
      }
    }

    function confirmRestoreState() {
      if (!pendingRestoredState) {
        restoreModalOverlay.style.display = 'none';
        return;
      }

      const state = pendingRestoredState;
      currentCoreMode = state.coreMode || 'mode2';
      practicePhase = state.practicePhase || 'new_gendu';
      currentCycleCount = state.currentCycleCount || 0;
      currentLineIndex = state.currentLineIndex || 0;
      markA_Index = state.markA_Index !== undefined ? state.markA_Index : -1;
      markB_Index = state.markB_Index !== undefined ? state.markB_Index : -1;

      restoreModalOverlay.style.display = 'none';

      loadAllAssetsSmartSync().then(() => {
        setCoreMode(currentCoreMode);
        if (currentCoreMode === 'mode2' && state.videoCurrentTime > 0) video.currentTime = state.videoCurrentTime;
        renderUI();
        showToast('✨ 已回到上次進度，請繼續精進', 3000);
      });
    }

    function getPhaseName(phase) {
      switch(phase) {
        case 'new_gendu': return '今日定課：跟讀';
        case 'new_compare': return '今日定課：比對錄音';
        case 'cumulative_gendu': return '串習複習：跟讀';
        case 'cumulative_compare': return '串習複習：比對錄音';
        case 'completed': return '今日定課已圓滿';
        default: return '定課中';
      }
    }

    window.addEventListener('beforeunload', () => { saveCurrentAppState(); releaseMicrophoneResources(); });
    window.addEventListener('pagehide', () => { saveCurrentAppState(); releaseMicrophoneResources(); });

    let swipeStartX = 0;
    let swipeStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1 && hasEnteredReciting) {
        const deltaX = e.changedTouches[0].clientX - swipeStartX;
        const deltaY = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          handleReturnToCompanionCard();
        }
      }
    }, { passive: true });

    standaloneOverlay.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    standaloneOverlay.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - swipeStartX;
        const deltaY = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          standaloneVideo.pause();
          standaloneOverlay.style.display = 'none';
          handleReturnToCompanionCard();
        }
      }
    }, { passive: true });

    function handleReturnToCompanionCard() {
      saveCurrentAppState();
      haltGuideRunnerImmediately();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;
      if (recordAudioElement) recordAudioElement.pause();
      releaseMicrophoneResources();
      
      try { 
        video.pause(); 
        video.currentTime = 0;
        video.removeAttribute('src');
        video.load(); 
      } catch(e) {}

      hasEnteredReciting = false;
      companionOverlay.style.display = 'flex';
      companionOverlay.style.opacity = '1';
      companionOverlay.classList.add('active');
      showToast('💤 已為您自動存檔並返回休息', 3000);
    }

    centerCore.addEventListener('scroll', () => {
      if (isGuideActive) {
        isUserManualScrolling = true;
        if (manualScrollTimer) clearTimeout(manualScrollTimer);
        manualScrollTimer = setTimeout(() => { isUserManualScrolling = false; }, 1200);
      }
    }, { passive: true });

    recordAudioElement.addEventListener('ended', () => { renderUI(); });

    function checkDailyResetOnStartup() {
      const todayStr = getNormalizedDateStr();
      const lastActiveDate = classicStorage.getItem('APP_ACTIVE_DATE_SENIOR');
      if (lastActiveDate !== todayStr) {
        classicStorage.setItem('APP_ACTIVE_DATE_SENIOR', todayStr);
      }
    }

    function handleOrientationCheck() {
      if (hasEnteredReciting) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        portraitBlocker.style.display = 'flex';
        companionOverlay.style.display = 'none';

        portraitBlocker.style.display = 'none';
        companionOverlay.style.display = 'flex';
      }

    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', () => setTimeout(handleOrientationCheck, 150));

    function triggerAppFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } 
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen().catch(() => {}); } 
      } catch (e) {}
    }

    async function playStandaloneVideo(modeType, startSeekSec = 0, onEndedCallback) {
      currentCoreMode = modeType; 
      haltGuideRunnerImmediately();
      if (video && !video.paused) video.pause();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;

      standaloneVideo.onerror = cleanupAndExit;

      try {
        await standaloneVideo.play();
      } catch(e) {

      }

      setTimeout(async () => {
        companionOverlay.classList.remove('active');

    function getCurrentProgressEnd() {
      if (currentDayPlan && currentDayPlan.end) return currentDayPlan.end;
      const saved = classicStorage.getItem('USER_CURRENT_PROGRESS_END_SENIOR');
      if (saved !== null) return parseInt(saved, 10);
      return 0;
    }

    function getCurrentActiveDayNumber() {
      if (currentDayPlan && currentDayPlan.day) return currentDayPlan.day;
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('start')) {
        const startStr = urlParams.get('start');
        const parts = startStr.split('-');
        if (parts.length === 3) {
          const userStartDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const now = new Date();
          const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return Math.max(1, Math.floor((todayDate - userStartDate) / (1000 * 60 * 60 * 24)) + 1);
        }
      }
      return 1;
    }

    if (btnPlayDedication) {
      btnPlayDedication.addEventListener('click', async () => {

          setCoreMode('mode2');

    async function prefetchSentenceCountOnStartup() {
      const timestamp = Date.now();
      let localSentStr = classicStorage.getItem('OFFLINE_SENTENCES_CACHE_SENIOR');
      try {
        const res = await fetch(CLASSIC_ASSETS.sentences + '?nocache=' + timestamp, { cache: 'no-store' });
        if (res.ok) {
          const freshSent = await res.json();
          if (Array.isArray(freshSent) && freshSent.length > 0) {
            scriptureData = freshSent;
            classicStorage.setItem('OFFLINE_SENTENCES_CACHE_SENIOR', JSON.stringify(freshSent));
          }
        }
      } catch (e) {}

      if (scriptureData.length === 0 && localSentStr) {
        try { scriptureData = JSON.parse(localSentStr); } catch(e){}
      }

      if (Array.isArray(scriptureData) && scriptureData.length > 0) {
        CLASSIC_TOTAL_SENTENCES = scriptureData.length;
      }

      if (!classicStorage.getItem('OFFLINE_SCHEDULE_CACHE_SENIOR') || CLASSIC_TOTAL_SENTENCES > 0) {
        generateAlgorithmicSchedule({
          totalSentences: CLASSIC_TOTAL_SENTENCES,
          dailyStep: DEFAULT_DAILY_STEP,
          repeatNew: DEFAULT_REPEAT_NEW,
          repeatCum: DEFAULT_REPEAT_CUMULATIVE
        });
      }
    }

    async function loadAllAssetsSmartSync() {
      const timestamp = Date.now();
      await prefetchSentenceCountOnStartup();

      const savedPdf = await getLocalFile('pdf_file_senior');
      if (savedPdf && savedPdf.data) {
        cachedPdfBuffer = savedPdf.data;
      } else {
        try {
          const res = await fetch(CLASSIC_ASSETS.pdf + '?nocache=' + timestamp);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            await saveLocalFile('pdf_file_senior', buf, 'pdf_cached');
            cachedPdfBuffer = buf;
          }
        } catch (e) {}
      }
      if (cachedPdfBuffer && parsedTextLines.length === 0) {
        await renderPdfOnValidDimensions();
      }

      video.src = CLASSIC_ASSETS.video;
      video.load();

      applyScheduleToState();
    }

    function generateAlgorithmicSchedule(settings) {
      const total = CLASSIC_TOTAL_SENTENCES;
      const step = settings.dailyStep || DEFAULT_DAILY_STEP;
      const rNew = settings.repeatNew;
      const rCum = settings.repeatCum;
      const scheduleList = [];

      let simDay = 1;
      let simStart = 1;

      for (let dayIdx = 1; dayIdx <= 100; dayIdx++) {
        let end = (simDay === 1) ? 1 : Math.min(total, simStart + step - 1);
        let cStart = null, cEnd = null, cRepeat = 0;

        if (simDay > 1) {
          cStart = 1;
          cEnd = end;
          cRepeat = rCum;
        }

        scheduleList.push({
          day: simDay,
          start: simStart,
          end: end,
          repeat: rNew,
          cStart: cStart,
          cEnd: cEnd,
          cRepeat: cRepeat
        });

        if (end >= total) break;
        simStart = (simDay === 1) ? 2 : Math.min(total, end + 1);
        simDay++;
      }

      classicStorage.setItem('OFFLINE_SCHEDULE_CACHE_SENIOR', JSON.stringify(scheduleList));
    }

    function applyScheduleToState() {
      try {
        let scheduleData = null;
        const localSched = classicStorage.getItem('OFFLINE_SCHEDULE_CACHE_SENIOR');
        if (localSched) {
          try { scheduleData = JSON.parse(localSched); } catch(e){}
        }

        if (!scheduleData || !Array.isArray(scheduleData)) {
          currentDayPlan = { day: 1, start: 1, end: 1, repeat: DEFAULT_REPEAT_NEW, cStart: null, cEnd: null, cRepeat: 0 };
          return false;
        }
        
        let targetDay = getCurrentActiveDayNumber();
        currentDayPlan = scheduleData.find(item => Number(item.day) === Number(targetDay)) || scheduleData[scheduleData.length - 1];
        if (!currentDayPlan) currentDayPlan = scheduleData[0];

        classicStorage.setItem('USER_CURRENT_PROGRESS_END_SENIOR', currentDayPlan.end.toString());

        if (classicStorage.getItem('INDEPENDENT_UNLOCKED_DATE_SENIOR') === getNormalizedDateStr()) {
          practicePhase = 'completed';
        } else {
          practicePhase = 'new_gendu';
        }
        currentCycleCount = 0;

        setupStageRange();
        return true;
      } catch (err) {}
      return false;
    }

    function setupStageRange() {
      if (!currentDayPlan) return;
      const maxIdx = Math.max(0, (parsedTextLines.length > 0 ? parsedTextLines.length - 1 : CLASSIC_TOTAL_SENTENCES - 1));

      if (practicePhase === 'new_gendu' || practicePhase === 'new_compare') {
        markA_Index = Math.max(0, (currentDayPlan.start || 1) - 1);
        markB_Index = Math.min(maxIdx, (currentDayPlan.end || 1) - 1);
      } else if (practicePhase === 'cumulative_gendu' || practicePhase === 'cumulative_compare') {
        markA_Index = Math.max(0, (currentDayPlan.cStart || 1) - 1);
        markB_Index = Math.min(maxIdx, (currentDayPlan.cEnd || 1) - 1);
      }

      currentLineIndex = markA_Index;
      currentCharIndexFloat = 0.0;
      isLineHeadLocked = true;
      videoPausedAt = -1;

      scrollToAlignTop(markA_Index);
    }

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(cachedPdfBuffer),
            cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/cmaps/',
            cMapPacked: true
          });

          currentPdfDoc = await loadingTask.promise;
          const page = await currentPdfDoc.getPage(1);

          pdfCanvas.width = 0;
          pdfCanvas.height = 0;

          const availableWidth = Math.max(centerCore.clientWidth || 0, window.innerWidth - 150);
          const pageRotation = page.rotate || 0;
          const unscaledViewport = page.getViewport({ scale: 1.0, rotation: pageRotation });
          const pageScale = availableWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: pageScale, rotation: pageRotation });

          pdfCanvas.width = viewport.width;
          pdfCanvas.height = viewport.height;
          const ctx = pdfCanvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const textContent = await page.getTextContent();
          const items = textContent.items;
          const validSpans = [];
          const chineseCharRegex = /[\u4e00-\u9fa5]/;

          items.forEach(it => {
            const str = it.str || '';
            if (!str.trim()) return;

            const tx = it.transform;
            const pdfX = tx[4];
            const pdfY = tx[5];

            const fontScale = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]) * pageScale;
            const fontWidth = it.width * pageScale;

            const p0 = pdfjsLib.Util.applyTransform([pdfX, pdfY], viewport.transform);
            const screenX0 = p0[0];

            const pdfFontH = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]) || (fontScale / pageScale);
            const pTop = pdfjsLib.Util.applyTransform([pdfX, pdfY + pdfFontH], viewport.transform);

            const realTop = Math.min(p0[1], pTop[1]);
            const realBottom = Math.max(p0[1], pTop[1]);

            const charWidth = fontWidth / Math.max(1, str.length);
            for (let c = 0; c < str.length; c++) {
              const char = str[c];
              if (chineseCharRegex.test(char)) {
                const charX0 = screenX0 + (c * charWidth);
                const charX1 = charX0 + charWidth;
                validSpans.push({ x0: charX0, x1: charX1, topY: realTop, bottomY: realBottom, fs: fontScale, char: char });
              }
            }
          });

          validSpans.sort((a, b) => a.topY - b.topY);
          const rowGroups = [];

          validSpans.forEach(span => {
            let matched = false;
            for (let g of rowGroups) {
              if (Math.abs(g.topY - span.topY) <= (span.fs * 0.45)) {
                g.spans.push(span);
                matched = true;
                break;
              }
            }
            if (!matched) rowGroups.push({ topY: span.topY, spans: [span] });
          });

          const analyzedRows = rowGroups.map(g => {
            g.spans.sort((a, b) => a.x0 - b.x0);
            const avgFs = g.spans.reduce((sum, s) => sum + s.fs, 0) / g.spans.length;
            const minTop = Math.min(...g.spans.map(s => s.topY));
            const lineX0 = g.spans[0].x0;
            const lineX1 = g.spans[g.spans.length - 1].x1;
            return { spans: g.spans, chineseCount: g.spans.length, avgFs: avgFs, minTop: minTop, lineX0: lineX0, lineX1: lineX1 };
          });

          analyzedRows.forEach(r => {
            r.maxBottom = Math.max(...r.spans.map(s => s.bottomY));
            r.underLineY = r.maxBottom + 7;
          });

          const candidateLargeRows = analyzedRows.filter(r => r.chineseCount >= 2 && (r.lineX1 - r.lineX0) >= 30);
          let mainTextFontSize = 0;
          if (candidateLargeRows.length > 0) {
            const sortedSizes = candidateLargeRows.map(r => r.avgFs).sort((a, b) => b - a);
            mainTextFontSize = sortedSizes[Math.min(sortedSizes.length - 1, 2)];
          }

          parsedTextLines = [];
          let internalIndex = 0;

          analyzedRows.forEach(r => {
            const isNormalOrLarge = (r.avgFs >= mainTextFontSize * 0.70);
            if (r.chineseCount >= 2 && (r.lineX1 - r.lineX0) >= 30 && isNormalOrLarge) {
              parsedTextLines.push({
                lineIndex: internalIndex++, x0: r.lineX0, x1: r.lineX1, topGlobal: r.minTop, bottomGlobal: r.maxBottom, underLineY: r.underLineY, charItems: r.spans
              });
            }
          });

          parsedTextLines.sort((a, b) => a.underLineY - b.underLineY);
          guideStage.style.height = viewport.height + 'px';

          scrollToAlignTop(markA_Index !== -1 ? markA_Index : 0);
      } catch(e) {}
    }

    const DB_NAME = 'SeniorReciteDB_' + CURRENT_CLASSIC_ID;
    const STORE_NAME = 'app_offline_files';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }

    async function getLocalFile(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveLocalFile(key, data, tag) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ data: data, tag: tag }, key);
      } catch (e) {}
    }

    function showToast(msg, duration = 4000) {
      if (!scheduleToast) return;
      scheduleToast.innerHTML = msg.replace(/\n/g, '<br>');
      scheduleToast.style.display = 'block';
      scheduleToast.style.opacity = '1';
      clearTimeout(scheduleToast._timer);
      scheduleToast._timer = setTimeout(() => {
        scheduleToast.style.opacity = '0';
        setTimeout(() => { scheduleToast.style.display = 'none'; }, 300);
      }, duration);
    }

    function releaseMicrophoneResources() {
      if (micStream) {
        try { micStream.getTracks().forEach(track => track.stop()); } catch (e) {}
        micStream = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        try { audioContext.suspend(); } catch (e) {}
      }
    }

    function setCoreMode(mode) {
      haltGuideRunnerImmediately();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;
      if (recordAudioElement) recordAudioElement.pause();

      currentCoreMode = mode;
      standaloneOverlay.style.display = 'none';

      if (mode === 'mode2') {
        releaseMicrophoneResources();
        pdfContainerWrap.style.display = 'none';
        guideStage.style.display = 'none';
        videoWrap.style.display = 'flex';
        video.playbackRate = mp4Speed;

        const range = getActiveVideoRange();
        videoPausedAt = -1;
        if (range.valid) {
          try { video.currentTime = range.start; } catch (e) {}
        }
      } else if (mode === 'mode4') {
        video.pause();
        videoWrap.style.display = 'none';
        pdfContainerWrap.style.display = 'flex';
        guideStage.style.display = 'block';

        setTimeout(async () => {
          if (!cachedPdfBuffer || parsedTextLines.length === 0) {
            await renderPdfOnValidDimensions();
          } else {
            scrollToAlignTop(markA_Index !== -1 ? markA_Index : 0);
          }
        }, 120);
      }

      saveCurrentAppState();
      renderUI();
    }

    function renderUI() {
      try {
        // Left Wing: Offering at top, Gendu / Compare status in middle
        slotL1.innerHTML = '<button class="square-btn btn-color-offering" id="btn-offering">背書<br>供養</button>';
        const btnOffering = document.getElementById('btn-offering');
        if (btnOffering) btnOffering.addEventListener('click', handleOfferingClick);

        slotL2.innerHTML = '<button class="square-btn btn-color-gendu" id="btn-gendu">跟讀</button>';
        slotR3.innerHTML = '<button class="square-btn btn-color-compare" id="btn-record">比對</button>';

        const btnGendu = document.getElementById('btn-gendu');
        if (btnGendu) btnGendu.addEventListener('click', handleGenduClick);

        const btnRecord = document.getElementById('btn-record');
        if (btnRecord) btnRecord.addEventListener('click', handleRecordModeClick);

        updateModeButtonsStyle();
      } catch (err) {}
    }

    function updateModeButtonsStyle() {
      const btnGendu = document.getElementById('btn-gendu');
      const btnRecord = document.getElementById('btn-record');

      const isMode2 = (currentCoreMode === 'mode2');
      const isMode4 = (currentCoreMode === 'mode4');
      const isGenduPlaying = isMode2 && (video && !video.paused);
      const isRecordRunning = isMode4 && isUserRecording;

      if (btnGendu) {
        btnGendu.textContent = isGenduPlaying ? '暫停' : (practicePhase.includes('cumulative') ? '串習跟讀' : '今日跟讀');
      }

      if (btnRecord) {
        btnRecord.textContent = isRecordRunning ? '播放中' : (practicePhase.includes('cumulative') ? '串習比對' : '比對錄音');
      }
    }

    function handleGenduClick() {
      triggerAppFullscreen();
      if (currentCoreMode !== 'mode2') {
        setCoreMode('mode2');
      }
      
      if (video.paused) {
        const range = getActiveVideoRange();
        if (!range.valid) { showToast('⚠️ 資料不完整', 3000); return; }
        
        if (video.currentTime < range.start || video.currentTime >= range.end) {
          video.currentTime = range.start;
        }

        video.play().then(() => {
          updateModeButtonsStyle();
          startMp4PrecisionCheck();
          saveCurrentAppState();
        }).catch(() => {
          video.currentTime = range.start;
          video.play().then(() => { updateModeButtonsStyle(); startMp4PrecisionCheck(); }).catch(() => {});
        });
      } else {
        video.pause();
        updateModeButtonsStyle();
        saveCurrentAppState();
      }
    }

    async function handleRecordModeClick() {
      triggerAppFullscreen();
      if (currentCoreMode !== 'mode4') {
        setCoreMode('mode4');
        showToast('🎙️ 已進入比對畫面，點擊按鈕即可開始錄音與回放', 3000);
        return;
      }

      const ok = await ensureMicrophoneActive();
      if (!ok) {
        showToast("⚠️ 無法取得麥克風授權", 3000);
        return;
      }

      if (isUserRecording) {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isUserRecording = false;
        renderUI();
        setTimeout(() => {
          if (recordedAudioBlobUrl) {
            togglePlaybackAction();
          }
        }, 200);
      } else {
        audioChunks = [];
        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedAudioBlobUrl = URL.createObjectURL(recordedBlob);
          recordAudioElement.src = recordedAudioBlobUrl;
          recordAudioElement.playbackRate = compareSpeed;
          renderUI();
        };
        mediaRecorder.start();
        isUserRecording = true;
        renderUI();
        showToast('🔴 正在錄音中... 唸完後再按一次停止並比對', 3000);
      }
    }

    function togglePlaybackAction() {
      if (!recordedAudioBlobUrl) return;
      if (recordAudioElement.paused) {
        recordAudioElement.play().then(() => {
          showToast('▶️ 正在播放您的錄音比對', 2500);
          renderUI();
        }).catch(() => {});
      } else {
        recordAudioElement.pause();
        renderUI();
      }
    }

    async function ensureMicrophoneActive() {
      if (micStream) return true;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === 'suspended') await audioContext.resume();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        return true;
      } catch (err) {
        return false;
      }
    }

    let mp4PrecisionCheckAnimId = null;
    function startMp4PrecisionCheck() {
      if (mp4PrecisionCheckAnimId) cancelAnimationFrame(mp4PrecisionCheckAnimId);
      function check() {
        if (currentCoreMode === 'mode2' && !video.paused && !video.ended) {
          const range = getActiveVideoRange();
          if (range.valid && video.currentTime >= range.end) {
            video.pause();
            video.currentTime = range.end;
            handleMp4CycleEnd(range);
            return;
          }
        }
        mp4PrecisionCheckAnimId = requestAnimationFrame(check);
      }
      mp4PrecisionCheckAnimId = requestAnimationFrame(check);
    }

    function getActiveVideoRange() {
      if (!scriptureData || scriptureData.length === 0) {
        return { start: 0, end: 0, valid: false };
      }
      let aIdx = markA_Index >= 0 ? markA_Index : 0;
      let bIdx = markB_Index >= 0 ? markB_Index : (scriptureData.length - 1);
      if (bIdx < aIdx) bIdx = aIdx;
      
      const startObj = scriptureData[aIdx];
      const endObj = scriptureData[bIdx];
      if (!startObj || !endObj) return { start: 0, end: 0, valid: false };

      return { start: startObj.start, end: endObj.end, valid: true };
    }

    function handleCycleCompletion() {
      video.pause();
      currentCycleCount++;
      addCoins(calculateSentenceCount());

      const repeatNew = currentDayPlan.repeat || DEFAULT_REPEAT_NEW;
      const cRepeat = currentDayPlan.cRepeat || DEFAULT_REPEAT_CUMULATIVE;
      const hasCumulative = currentDayPlan.cStart && currentDayPlan.cEnd;

      if (practicePhase === 'new_gendu') {
        if (currentCycleCount < repeatNew) {
          showToast(`✅ 今日定課跟讀完成第 ${currentCycleCount} 遍`, 2500);
          setupStageRange();
          video.currentTime = getActiveVideoRange().start;
          setTimeout(() => handleGenduClick(), 500);
        } else {
          practicePhase = 'new_compare';
          currentCycleCount = 0;
          setupStageRange();
          setCoreMode('mode4');
          showToast(`🎉 今日跟讀圓滿！\n請點擊右側「比對」按鈕進行錄音比對。`, 5000);
        }
      } else if (practicePhase === 'new_compare') {
        if (hasCumulative) {
          practicePhase = 'cumulative_gendu';
          currentCycleCount = 0;
          setupStageRange();
          setCoreMode('mode2');
          showToast(`🎉 準備進入串習複習跟讀...`, 3000);
          setTimeout(() => handleGenduClick(), 1000);
        } else {
          practicePhase = 'completed';
          classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_SENIOR', getNormalizedDateStr());
          renderUI();
          triggerSevenColoredLotusFlowerRain();
          showToast(`🎉 今日定課全部圓滿！隨喜功德`, 5000);
        }
      } else if (practicePhase === 'cumulative_gendu') {
        if (currentCycleCount < cRepeat) {
          showToast(`✅ 串習複習跟讀完成第 ${currentCycleCount} 遍`, 2500);
          setupStageRange();
          video.currentTime = getActiveVideoRange().start;
          setTimeout(() => handleGenduClick(), 500);
        } else {
          practicePhase = 'cumulative_compare';
          currentCycleCount = 0;
          setupStageRange();
          setCoreMode('mode4');
          showToast(`🎉 串習跟讀圓滿！\n請點擊右側「比對」進行錄音比對。`, 5000);
        }
      } else if (practicePhase === 'cumulative_compare') {
        practicePhase = 'completed';
        classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_SENIOR', getNormalizedDateStr());
        renderUI();
        triggerSevenColoredLotusFlowerRain();
        showToast(`🎉 今日定課與串習全部圓滿！隨喜功德`, 6000);
      }
      saveCurrentAppState();
    }

    function handleMp4CycleEnd(range) {
      videoPausedAt = -1;
      video.currentTime = range.start;
      handleCycleCompletion();
    }

    function triggerSevenColoredLotusFlowerRain() {
      const canvas = document.getElementById('flowerCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const flowers = [];
      const lotusColors = ['#FF94B8', '#FFB300', '#F1F5F9', '#22C55E', '#C084FC', '#E11D48', '#3B82F6'];
      
      for (let i = 0; i < 70; i++) {
        flowers.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 10 + 10,
          speedY: Math.random() * 1.8 + 1.0,
          speedX: (Math.random() - 0.5) * 1.2,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 2.5,
          color: lotusColors[Math.floor(Math.random() * lotusColors.length)],
          opacity: 0.94
        });
      }

      let startTime = performance.now();
      const duration = 5800;

      function animateLotusRain(now) {
        let elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        flowers.forEach(f => {
          f.y += f.speedY;
          f.x += f.speedX + Math.sin(f.y / 45) * 0.7;
          f.rotation += f.rotationSpeed;

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.rotate((f.rotation * Math.PI) / 180);
          ctx.globalAlpha = f.opacity;

          for (let j = 0; j < 5; j++) {
            const angle = (j * 2 * Math.PI) / 5;
            const dist = f.size * 0.40;
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, f.size * 0.42, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(0, 0, f.size * 0.30, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (f.y > canvas.height + 30) {
            f.y = -30;
            f.x = Math.random() * canvas.width;
          }
        });

        if (elapsed < duration) {
          requestAnimationFrame(animateLotusRain);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }
      requestAnimationFrame(animateLotusRain);
    }

    function triggerOfferingCoinRain() {
      const canvas = document.getElementById('flowerCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const coins = [];
      for (let i = 0; i < 50; i++) {
        coins.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          radius: Math.random() * 12 + 14,
          speedY: Math.random() * 1.5 + 0.8,
          speedX: (Math.random() - 0.5) * 0.8,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.04,
          label: i % 2 === 0 ? '福' : '慧'
        });
      }

      let startTime = performance.now();
      function animateCoinRain(now) {
        let elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        coins.forEach(c => {
          c.y += c.speedY;
          c.x += c.speedX;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.fillStyle = '#F59E0B';
          ctx.beginPath();
          ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold ${Math.floor(c.radius * 0.9)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(c.label, 0, 1);
          ctx.restore();
        });
        if (elapsed < 5000) {
          requestAnimationFrame(animateCoinRain);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }
      requestAnimationFrame(animateCoinRain);
    }

    function handleOfferingClick() {
      displayCoinsCount.textContent = (classicStorage.getItem('user_accumulated_coins') || '0') + ' 枚';
      inputClassId.value = classicStorage.getItem('user_class_id') || '';
      inputUserName.value = classicStorage.getItem('user_profile_name') || '';
      offeringOverlay.style.display = 'flex';
    }

    function getStoredCoins() { return parseInt(classicStorage.getItem('user_accumulated_coins') || '0', 10); }
    function addCoins(amount) {
      const total = getStoredCoins() + amount;
      classicStorage.setItem('user_accumulated_coins', total.toString());
      saveCurrentAppState();
      return total;
    }
    function resetCoins() { classicStorage.setItem('user_accumulated_coins', '0'); saveCurrentAppState(); }
    function calculateSentenceCount() {
      if (parsedTextLines.length === 0) return 1;
      return Math.max(1, Math.abs(markB_Index - markA_Index) + 1);
    }

    btnCancelOffering.addEventListener('click', () => { offeringOverlay.style.display = 'none'; });

    btnConfirmOffering.addEventListener('click', () => {
      const classId = inputClassId.value.trim();
      const userName = inputUserName.value.trim();
      if (!classId || !userName) { alert("請輸入班號與姓名！"); return; }

      classicStorage.setItem('user_class_id', classId);
      classicStorage.setItem('user_profile_name', userName);

      const coinsToOffer = getStoredCoins();
      if (coinsToOffer <= 0) { alert("目前福慧幣為 0 枚！"); return; }

      btnConfirmOffering.disabled = true;
      btnConfirmOffering.textContent = '供養中...';

      const callbackName = 'onRankDataLoaded_' + Math.floor(Math.random() * 1000000);
      let isDone = false;

      function cleanup() {
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
      }

      window[callbackName] = (res) => {
        if (isDone) return;
        isDone = true;
        cleanup();
        resetCoins();
        offeringOverlay.style.display = 'none';
        btnConfirmOffering.disabled = false;
        btnConfirmOffering.textContent = '確認供養';
        renderLeaderboards(res, classId, userName, coinsToOffer);
        leaderboardOverlay.style.display = 'flex';
        triggerOfferingCoinRain();
      };

      const scriptTag = document.createElement('script');
      scriptTag.src = `${APPS_SCRIPT_URL}?classId=${encodeURIComponent(classId)}&userName=${encodeURIComponent(userName)}&coins=${coinsToOffer}&classicId=${encodeURIComponent(CURRENT_CLASSIC_ID)}&callback=${callbackName}&t=${Date.now()}`;
      document.body.appendChild(scriptTag);
    });

    function renderLeaderboards(data, curClass, curName, curCoins) {
      const medals = ['🥇', '🥈', '🥉'];
      function buildListHtml(list) {
        const fullList = (list && Array.isArray(list)) ? [...list] : [];
        while (fullList.length < 3) fullList.push({ isPlaceholder: true });
        return fullList.slice(0, 3).map((item, idx) => {
          const medal = medals[idx] || `第${idx + 1}名`;
          if (item.isPlaceholder) return `<div class="rank-item"><span>${medal} 虛位以待</span><span class="rank-coins">--</span></div>`;
          return `<div class="rank-item"><span>${medal} ${item.maskName || item.name}</span><span class="rank-coins">${item.coins} 枚</span></div>`;
        }).join('');
      }
      todayRankList.innerHTML = buildListHtml(data ? data.todayTop3 : null);
      totalRankList.innerHTML = buildListHtml(data ? data.totalTop3 : null);
    }

    btnRejoiceClose.addEventListener('click', () => { leaderboardOverlay.style.display = 'none'; });

    function haltGuideRunnerImmediately() {
      isGuideActive = false;
      if (guideAnimId) { cancelAnimationFrame(guideAnimId); guideAnimId = null; }
      if (cycleWaitTimer) { clearTimeout(cycleWaitTimer); cycleWaitTimer = null; }
    }

    function scrollToAlignTop(idx) {
      const line = parsedTextLines[idx];
      if (line) {
        const canvasRect = pdfCanvas.getBoundingClientRect();
        const scaleY = canvasRect.height / pdfCanvas.height;
        centerCore.scrollTo({ top: Math.max(0, line.topGlobal * scaleY - 18), behavior: 'smooth' });
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await prefetchSentenceCountOnStartup();
      checkDailyResetOnStartup();

      const cardFileName = "card_001.webp";
      const imgDisplay = document.getElementById('companion-img-display');
      const compWrapper = document.querySelector('.companion-wrapper');

      imgDisplay.onload = () => { compWrapper.classList.add('ready'); };
      imgDisplay.onerror = () => { compWrapper.classList.add('ready'); };
      imgDisplay.src = 'cards/' + cardFileName;
      
      document.getElementById('companion-overlay').style.display = 'flex';
      document.getElementById('companion-overlay').classList.add('active');

      handleOrientationCheck();
    });
  </script>
