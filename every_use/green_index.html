  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
    }

    const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const classicStorage = {
      getItem(key) {
        return localStorage.getItem(NAMESPACE_KEY + '::' + key);
      },
      setItem(key, value) {
        localStorage.setItem(NAMESPACE_KEY + '::' + key, value);
      },
      removeItem(key) {
        localStorage.removeItem(NAMESPACE_KEY + '::' + key);
      }
    };

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
        const loadingTask = pdfjsLib.getDocument({
          data: new Uint8Array(cachedPdfBuffer),
          cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/cmaps/',
          cMapPacked: true
        });

        currentPdfDoc = await loadingTask.promise;
        const page = await currentPdfDoc.getPage(1);
        pdfCanvas.width = 0; pdfCanvas.height = 0;

        const availableWidth = Math.max(centerCore.clientWidth || 0, window.innerWidth - 130);
        const pageRotation = page.rotate || 0;
        const unscaledViewport = page.getViewport({ scale: 1.0, rotation: pageRotation });
        const pageScale = availableWidth / unscaledViewport.width;
        const viewport = page.getViewport({ scale: pageScale, rotation: pageRotation });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        const ctx = pdfCanvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const textContent = await page.getTextContent();
        const validSpans = [];
        const chineseCharRegex = /[\u4e00-\u9fa5]/;

        textContent.items.forEach(it => {
          const str = it.str || '';
          if (!str.trim()) return;
          const tx = it.transform;
          const pdfX = tx[4], pdfY = tx[5];
          const fontScale = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]) * pageScale;
          const fontWidth = it.width * pageScale;
          const p0 = pdfjsLib.Util.applyTransform([pdfX, pdfY], viewport.transform);
          const pTop = pdfjsLib.Util.applyTransform([pdfX, pdfY + (Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]) || (fontScale / pageScale))], viewport.transform);
          const realTop = Math.min(p0[1], pTop[1]), realBottom = Math.max(p0[1], pTop[1]);
          const charWidth = fontWidth / Math.max(1, str.length);

          for (let c = 0; c < str.length; c++) {
            if (chineseCharRegex.test(str[c])) {
              validSpans.push({ x0: p0[0] + c * charWidth, x1: p0[0] + (c + 1) * charWidth, topY: realTop, bottomY: realBottom, fs: fontScale, char: str[c] });
            }
          }
        });

        validSpans.sort((a, b) => a.topY - b.topY);
        const rowGroups = [];
        validSpans.forEach(span => {
          let matched = false;
          for (let g of rowGroups) {
            if (Math.abs(g.topY - span.topY) <= (span.fs * 0.45)) { g.spans.push(span); matched = true; break; }
          }
          if (!matched) rowGroups.push({ topY: span.topY, spans: [span] });
        });

        const analyzedRows = rowGroups.map(g => {
          g.spans.sort((a, b) => a.x0 - b.x0);
          return { spans: g.spans, chineseCount: g.spans.length, avgFs: g.spans.reduce((s, x) => s + x.fs, 0) / g.spans.length, minTop: Math.min(...g.spans.map(s => s.topY)), lineX0: g.spans[0].x0, lineX1: g.spans[g.spans.length - 1].x1 };
        });

        analyzedRows.forEach(r => { r.maxBottom = Math.max(...r.spans.map(s => s.bottomY)); r.underLineY = r.maxBottom + 7; });

        parsedTextLines = [];
        let internalIndex = 0;
        analyzedRows.forEach(r => {
          if (r.chineseCount >= 2 && (r.lineX1 - r.lineX0) >= 30) {
            parsedTextLines.push({ lineIndex: internalIndex++, x0: r.lineX0, x1: r.lineX1, topGlobal: r.minTop, bottomGlobal: r.maxBottom, underLineY: r.underLineY, charItems: r.spans });
          }
        });

        parsedTextLines.sort((a, b) => a.underLineY - b.underLineY);
        guideStage.style.height = viewport.height + 'px';
      } catch(e) {}
    }

    const DB_NAME = 'HappyReciteDB_' + CURRENT_CLASSIC_ID;
    const STORE_NAME = 'app_offline_files';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }

    async function getLocalFile(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveLocalFile(key, data, tag) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ data: data, tag: tag }, key);
      } catch (e) {}
    }

      return { start: startObj.start, end: endObj.end, valid: true };

                <path d="M30 14 C34 14 42 16 46 22 C42 20 36 18 30 18 Z" fill="#FB7185"/>
                <circle cx="34" cy="28" r="3" fill="#1E293B"/>
                <path d="M17 35 C13 35 13 41 18 42 C21 42 22 38 17 35 Z" fill="#BE123C"/>
              </svg>`;
          } else {
            btnRecord.innerHTML = '<span style="font-size:12px; font-weight:900;">比對</span>';
          }
          
          slotR3.innerHTML = '';
          slotR3.appendChild(btnRecord);
          btnRecord.addEventListener('click', handleRecordModeClick);
        } else {
          slotL1.innerHTML = ''; slotL2.innerHTML = ''; slotL3.innerHTML = ''; slotR3.innerHTML = '';
        }

        slotL4.innerHTML = '';
        slotR4.innerHTML = '';

        slotR1.innerHTML = '<button class="square-btn" id="btn-gendu">跟讀</button>';
        slotR2.innerHTML = '';

        document.getElementById('btn-gendu')?.addEventListener('click', handleGenduClick);

        updateModeButtonsStyle();
      } catch (err) {}
    }

    async function ensureMicrophoneActive() {
      if (micStream && audioContext) return true;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        return true;
      } catch (e) { return false; }
    }

    async function handleRecordModeClick() {
      triggerAppFullscreen();
      if (!isIndependentModeUnlocked()) { showToast("⚠️ 請先完成今日定課後方可解鎖比對", 3000); return; }

      if (currentCoreMode !== 'mode4') {
        setCoreMode('mode4');
        showToast('🎙️ 已切換至比對模式，再按一下開始錄音', 2500);
        return;
      }

      if (isUserRecording) {
        if (recordingTimeoutTimer) { clearTimeout(recordingTimeoutTimer); recordingTimeoutTimer = null; }
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isUserRecording = false;
        renderUI();
        setTimeout(() => {
          if (recordedAudioBlobUrl) {
            recordAudioElement.play();
            showToast('▶️ 錄音完成，正在播放比對聲音', 2500);
          }
        }, 200);
      } else {
        const ok = await ensureMicrophoneActive();
        if (!ok) { showToast("⚠️ 無法取得麥克風授權", 3000); return; }

        audioChunks = [];
        try {
          mediaRecorder = new MediaRecorder(micStream);
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            recordedAudioBlobUrl = URL.createObjectURL(new Blob(audioChunks, mediaRecorder.mimeType ? { type: mediaRecorder.mimeType } : {}));
            recordAudioElement.src = recordedAudioBlobUrl;
            recordAudioElement.playbackRate = compareSpeed;
            renderUI();
          };
          mediaRecorder.start();
          isUserRecording = true;
          renderUI();
          showToast('🔴 開始錄音中...（最多 10 分鐘）', 3000);

          if (recordingTimeoutTimer) clearTimeout(recordingTimeoutTimer);
          recordingTimeoutTimer = setTimeout(() => {
            if (isUserRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
              mediaRecorder.stop();
              isUserRecording = false;
              renderUI();
              showToast('⏱️ 已達 10 分鐘錄音上限，自動停止並儲存檔案', 4000);
            }
          }, 600000);
        } catch(err) {
          showToast('⚠️ 啟動錄音失敗', 3000);
        }
      }
    }

    function updateModeButtonsStyle() {
      const btnGendu = document.getElementById('btn-gendu');
      const isMode2 = (currentCoreMode === 'mode2');
      const isGenduPlaying = isMode2 && (video && !video.paused);

      if (btnGendu) {
        btnGendu.textContent = isGenduPlaying ? '跟著唸' : '跟讀';
        btnGendu.style.background = isGenduPlaying ? 'linear-gradient(135deg, #9333EA 0%, #7E22CE 100%)' : (isMode2 ? 'linear-gradient(135deg, #10B981 0%, #059669 100%)' : '#000000');
      }
    }

    function handleGenduClick() {
      triggerAppFullscreen();
      if (currentCoreMode !== 'mode2') { setCoreMode('mode2'); return; }

      if (video.paused) {
        const range = getActiveVideoRange();
        if (!range.valid) return;
        video.currentTime = (videoPausedAt >= range.start && videoPausedAt < range.end) ? videoPausedAt : range.start;
        video.play().then(() => { updateModeButtonsStyle(); startMp4PrecisionCheck(); saveCurrentAppState(); }).catch(() => {
          video.currentTime = range.start; video.play().then(() => { updateModeButtonsStyle(); startMp4PrecisionCheck(); });
        });
      } else {
        video.pause(); videoPausedAt = video.currentTime; updateModeButtonsStyle(); showToast('❚❚ 已暫停', 3000); saveCurrentAppState();
      }
    }

    let mp4PrecisionCheckAnimId = null;
    function startMp4PrecisionCheck() {
      if (mp4PrecisionCheckAnimId) cancelAnimationFrame(mp4PrecisionCheckAnimId);
      function check() {
        if (currentCoreMode === 'mode2' && !video.paused && !video.ended) {
          const range = getActiveVideoRange();
          if (range.valid && video.currentTime >= range.end) {
            video.pause(); video.currentTime = range.end;
            handleMp4CycleEnd(range); return;
          }
        }
        mp4PrecisionCheckAnimId = requestAnimationFrame(check);
      }
      mp4PrecisionCheckAnimId = requestAnimationFrame(check);
    }

    function handleCycleCompletion() {
      if (currentCoreMode === 'mode2') video.pause();

      currentCycleCount++;

      if (currentCycleCount < DEFAULT_REPEAT_NEW) {
        showToast(`✅ 跟讀完成第 ${currentCycleCount} 遍`, 2000);
        const range = getActiveVideoRange(); if (range.valid) video.currentTime = range.start;
        setTimeout(handleGenduClick, 500);
      } else {
        practicePhase = 'completed';
        classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_V608', getNormalizedDateStr());
        renderUI();
        speakPrompt("今日定課已圓滿，功能已全部解鎖");
        showToast("🎉 今日定課已圓滿！左側已解鎖背書供養", 6000);
        openLeaderboardModal();
      }
      saveCurrentAppState();
    }

    function handleMp4CycleEnd(range) {
      videoPausedAt = -1; video.currentTime = range.start; handleCycleCompletion();
    }

    function handleOfferingClick() {
      offeringOverlay.style.display = 'flex';
    }

    if (btnCancelOffering) {
      btnCancelOffering.addEventListener('click', () => { offeringOverlay.style.display = 'none'; });
    }

    if (btnConfirmOffering) {
      btnConfirmOffering.addEventListener('click', () => {
        offeringOverlay.style.display = 'none';
        showToast('🙏 供養功德圓滿，隨喜讚嘆！', 3000);
        openLeaderboardModal();
      });
    }

    function openLeaderboardModal() {
      leaderboardOverlay.style.display = 'flex';
      loadLeaderboardData();
    }

    if (btnRejoiceClose) {
      btnRejoiceClose.addEventListener('click', () => {
        leaderboardOverlay.style.display = 'none';
      });
    }

    async function loadLeaderboardData() {
      todayRankList.innerHTML = '<div style="text-align:center; color:#94A3B8; padding:20px;">載入中...</div>';
      totalRankList.innerHTML = '<div style="text-align:center; color:#94A3B8; padding:20px;">載入中...</div>';
      try {
        const res = await fetch(APPS_SCRIPT_URL + '?action=get_ranks&classic=' + CURRENT_CLASSIC_ID);
        if (res.ok) {
          const data = await res.json();
          renderRankList(todayRankList, data.today || []);
          renderRankList(totalRankList, data.total || []);
          return;
        }
      } catch(e) {}
      todayRankList.innerHTML = '<div style="text-align:center; color:#EF4444; padding:20px;">無法取得排行榜資料</div>';
      totalRankList.innerHTML = '<div style="text-align:center; color:#EF4444; padding:20px;">無法取得排行榜資料</div>';
    }

    function renderRankList(container, list) {
      if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#94A3B8; padding:15px;">暫無紀錄</div>';
        return;
      }
      container.innerHTML = list.slice(0, 5).map((item, idx) => `
        <div class="rank-item">
          <span>${idx + 1}. ${item.name || '善士'} (${item.classId || ''})</span>
          <span class="rank-coins">${item.coins || 0} 枚</span>
        </div>
      `).join('');
    }
  </script>
</body>
