    const btnPlayDedication = document.getElementById('btn-play-dedication');

    const leaderboardOverlay = document.getElementById('leaderboard-modal-overlay');
    const todayRankList = document.getElementById('today-rank-list');
    const totalRankList = document.getElementById('total-rank-list');
    const btnRejoiceClose = document.getElementById('btn-rejoice-close');

    let currentCoreMode = 'mode2'; 
    let practicePhase = 'new_gendu'; 

    let scriptureData = [];
    let currentPdfDoc = null;
    let parsedTextLines = [];
    let cachedPdfBuffer = null;

    let markA_Index = -1;
    let markB_Index = -1;
    let currentDayPlan = null; 
    let currentCycleCount = 0; 
    let hasEnteredReciting = false;

    function getNormalizedDateStr() {
      const now = new Date();
      return now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    }

    function isIndependentModeUnlocked() {
      if (practicePhase === 'completed') return true;
      const savedStr = classicStorage.getItem('APP_SAVED_STATE_V608');
      if (!savedStr) return false;
      try {
        const savedState = JSON.parse(savedStr);
        return savedState.savedDateStr === getNormalizedDateStr() &&
          savedState.practicePhase === 'completed' &&
          classicStorage.getItem('INDEPENDENT_UNLOCKED_DATE_V608') === getNormalizedDateStr();
      } catch (e) { return false; }
    }

    function saveCurrentAppState() {
      if (!hasEnteredReciting) return;
      if (currentCoreMode === 'mode1' || currentCoreMode === 'mode5') return;

      if (practicePhase === 'completed') {
        classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_V608', getNormalizedDateStr());
      }
      const state = {
        coreMode: currentCoreMode,
        practicePhase: practicePhase,
        currentCycleCount: currentCycleCount,
        videoCurrentTime: (currentCoreMode === 'mode2' ? video.currentTime : 0),
        savedDateStr: getNormalizedDateStr(),
        timestamp: Date.now()
      };
      classicStorage.setItem('APP_SAVED_STATE_V608', JSON.stringify(state));
    }

    window.addEventListener('beforeunload', () => { saveCurrentAppState(); });
    window.addEventListener('pagehide', () => { saveCurrentAppState(); });

    function handleOrientationCheck() {
      if (hasEnteredReciting) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        portraitBlocker.style.display = 'flex';
        companionOverlay.style.display = 'none';
      } else {
        portraitBlocker.style.display = 'none';
        companionOverlay.style.display = 'flex';
      }
    }
    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', () => setTimeout(handleOrientationCheck, 150));

    function triggerAppFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } 
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen().catch(() => {}); } 
      } catch (e) {}
    }

    async function playStandaloneVideo(modeType, startSeekSec = 0, onEndedCallback) {
      currentCoreMode = modeType; 
      if (video && !video.paused) video.pause();
      standaloneOverlay.style.display = 'flex';
      
      let defaultUrl = (modeType === 'mode1') ? CLASSIC_ASSETS.buddha : CLASSIC_ASSETS.dedication;
      let toastText = (modeType === 'mode1') ? '🙏【老師帶前行：念佛清心】播放中...' : '🙏【模式5：功德迴向】播放中...';

      let mediaUrl = defaultUrl;
      standaloneVideo.src = mediaUrl;
      standaloneVideo.currentTime = startSeekSec;
      standaloneVideo.playbackRate = 1.0;
      showToast(toastText, 4000);

      const cleanupAndExit = () => {
        standaloneVideo.onended = null;
        standaloneVideo.onerror = null;
        standaloneVideo.pause();
        standaloneVideo.removeAttribute('src');
        standaloneVideo.load();
        standaloneOverlay.style.display = 'none';
        if (typeof onEndedCallback === 'function') onEndedCallback();
      };

      standaloneVideo.onended = cleanupAndExit;
      standaloneVideo.onerror = cleanupAndExit;

      try { await standaloneVideo.play(); } catch(e) { cleanupAndExit(); }
    }

    async function playTeacherGuideAndRecite() {
      hasEnteredReciting = true;
      triggerAppFullscreen();
      companionOverlay.style.opacity = '0';
      setTimeout(async () => {
        companionOverlay.classList.remove('active');
        companionOverlay.style.display = 'none';

        playStandaloneVideo('mode1', 0, async () => {
          showToast('✨ 前行圓滿，正在進入今日定課...', 3000);
          await loadAllAssetsSmartSync();
          setCoreMode('mode2');
          autoPlayCurrentCycle();
        });
      }, 350);
    }

    async function closeCompanionCard() {
      hasEnteredReciting = true;
      triggerAppFullscreen();
      companionOverlay.style.opacity = '0';
      setTimeout(async () => {
        companionOverlay.classList.remove('active');
        companionOverlay.style.display = 'none';

        await loadAllAssetsSmartSync();
        
        const savedStr = classicStorage.getItem('APP_SAVED_STATE_V608');
        if (savedStr) {
          try {
            const state = JSON.parse(savedStr);
            if (state.savedDateStr === getNormalizedDateStr()) {
              practicePhase = state.practicePhase || 'new_gendu';
              currentCycleCount = state.currentCycleCount || 0;
            }
          } catch(e) {}
        }

        setCoreMode('mode2');
        autoPlayCurrentCycle();
      }, 350);
    }

    function getCurrentActiveDayNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('start')) {
        const startStr = urlParams.get('start');
        const parts = startStr.split('-');
        if (parts.length === 3) {
          const userStartDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const now = new Date();
          const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return Math.max(1, Math.floor((todayDate - userStartDate) / (1000 * 60 * 60 * 24)) + 1);
        }
      } else if (urlParams.get('day')) {
        return parseInt(urlParams.get('day'), 10) || 1;
      }
      return 1;
    }

    async function prefetchSentenceCountOnStartup() {
      try {
        const res = await fetch(CLASSIC_ASSETS.sentences + '?nocache=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const freshSent = await res.json();
          if (Array.isArray(freshSent) && freshSent.length > 0) {
            scriptureData = freshSent;
            classicStorage.setItem('OFFLINE_SENTENCES_CACHE_V608', JSON.stringify(freshSent));
          }
        }
      } catch (e) {}

      if (scriptureData.length === 0) {
        try { scriptureData = JSON.parse(classicStorage.getItem('OFFLINE_SENTENCES_CACHE_V608') || '[]'); } catch(e){}
      }
      if (Array.isArray(scriptureData) && scriptureData.length > 0) {
        CLASSIC_TOTAL_SENTENCES = scriptureData.length;
      }

      generateAlgorithmicSchedule();
    }

    async function loadAllAssetsSmartSync() {
      await prefetchSentenceCountOnStartup();
      try {
        const res = await fetch(CLASSIC_ASSETS.pdf + '?nocache=' + Date.now());
        if (res.ok) cachedPdfBuffer = await res.arrayBuffer();
      } catch (e) {}
      if (cachedPdfBuffer && parsedTextLines.length === 0) await renderPdfOnValidDimensions();

      video.src = CLASSIC_ASSETS.video;
      video.load();
      applyScheduleToState();
    }

    function generateAlgorithmicSchedule() {
      const total = CLASSIC_TOTAL_SENTENCES;
      const scheduleList = [];

      let simStart = 1;
      for (let simDay = 1; simDay <= 100; simDay++) {
        let end = (simDay === 1) ? 1 : Math.min(total, simStart);
        let cStart = (simDay > 1) ? 1 : null;
        let cEnd = (simDay > 1) ? end : null;

        scheduleList.push({ day: simDay, start: simStart, end: end, cStart: cStart, cEnd: cEnd });
        if (end >= total) break;
        simStart = Math.min(total, end + 1);
      }
      classicStorage.setItem('OFFLINE_SCHEDULE_CACHE_V608', JSON.stringify(scheduleList));
    }

    function applyScheduleToState() {
      try {
        const scheduleData = JSON.parse(classicStorage.getItem('OFFLINE_SCHEDULE_CACHE_V608') || '[]');
        const targetDay = getCurrentActiveDayNumber();
        currentDayPlan = scheduleData.find(item => Number(item.day) === Number(targetDay)) || scheduleData[scheduleData.length - 1] || { start: 1, end: 1 };
        setupStageRange();
      } catch (err) {}
    }

    function setupStageRange() {
      if (!currentDayPlan) return;
      const maxIdx = Math.max(0, (parsedTextLines.length > 0 ? parsedTextLines.length - 1 : CLASSIC_TOTAL_SENTENCES - 1));

      if (practicePhase === 'new_gendu') {
        markA_Index = Math.max(0, (currentDayPlan.start || 1) - 1);
        markB_Index = Math.min(maxIdx, (currentDayPlan.end || 1) - 1);
      } else if (practicePhase === 'cumulative_gendu') {
        markA_Index = 0;
        markB_Index = Math.min(maxIdx, (currentDayPlan.cEnd || 1) - 1);
      }
    }

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
        const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(cachedPdfBuffer) });
        currentPdfDoc = await loadingTask.promise;
        const page = await currentPdfDoc.getPage(1);

        pdfCanvas.width = 0;
        pdfCanvas.height = 0;

        const availableWidth = Math.max(centerCore.clientWidth || 0, window.innerWidth - 136);
        const pageRotation = page.rotate || 0;
        const unscaledViewport = page.getViewport({ scale: 1.0, rotation: pageRotation });
        const pageScale = availableWidth / unscaledViewport.width;
        const viewport = page.getViewport({ scale: pageScale, rotation: pageRotation });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        const ctx = pdfCanvas.getContext('2d');

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const textContent = await page.getTextContent();
        parsedTextLines = textContent.items.filter(it => (it.str || '').trim().length > 0).map((it, idx) => ({ lineIndex: idx }));
      } catch(e) {}
    }

    function showToast(msg, duration = 4000) {
      if (!scheduleToast) return;
      scheduleToast.innerHTML = msg.replace(/\n/g, '<br>');
      scheduleToast.style.display = 'block';
      clearTimeout(scheduleToast._timer);
      scheduleToast._timer = setTimeout(() => { scheduleToast.style.display = 'none'; }, duration);
    }

    function setCoreMode(mode) {
      currentCoreMode = mode;
      standaloneOverlay.style.display = 'none';
      if (mode === 'mode2') {
        pdfContainerWrap.style.display = 'none';
        videoWrap.style.display = 'flex';
      } else {
        video.pause();
        videoWrap.style.display = 'none';
        pdfContainerWrap.style.display = 'flex';
        setTimeout(() => { renderPdfOnValidDimensions(); }, 100);
      }
      renderUI();
    }

    function renderUI() {
      slotL1.innerHTML = `<button class="chocolate-coin-btn" id="btn-offering" title="福慧金幣供養"><span class="max-icon">🪙</span></button>`;
      document.getElementById('btn-offering').addEventListener('click', handleOfferingClick);

      slotL4.innerHTML = `<button class="square-btn" id="btn-slow"><span class="max-icon" id="icon-slow">🚲</span></button>`;
      slotR4.innerHTML = `<button class="square-btn" id="btn-fast"><span class="max-icon" id="icon-fast">✈️</span></button>`;

      document.getElementById('btn-slow').addEventListener('touchstart', () => { document.getElementById('icon-slow').textContent = '慢'; });
      document.getElementById('btn-slow').addEventListener('touchend', () => { document.getElementById('icon-slow').textContent = '🚲'; });
      document.getElementById('btn-fast').addEventListener('touchstart', () => { document.getElementById('icon-fast').textContent = '快'; });
      document.getElementById('btn-fast').addEventListener('touchend', () => { document.getElementById('icon-fast').textContent = '✈️'; });

      if (practicePhase === 'completed') {
        slotR1.innerHTML = `<button class="btn-repeat-again" id="btn-repeat">再學一次</button>`;
        document.getElementById('btn-repeat').addEventListener('click', handleRepeatAgain);

        slotR3.innerHTML = `<button class="square-btn" id="btn-record"><span class="max-icon">📻</span></button>`;
        document.getElementById('btn-record').addEventListener('click', handleRecordModeClick);
      } else {
        slotR1.innerHTML = '';
        slotR3.innerHTML = '';
      }
    }

    function getActiveVideoRange() {
      if (!scriptureData || scriptureData.length === 0) return { start: 0, end: 10, valid: false };
      let aIdx = Math.max(0, markA_Index);
      let bIdx = Math.min(scriptureData.length - 1, markB_Index);
      if (bIdx < aIdx) bIdx = aIdx;
      return { start: scriptureData[aIdx].start, end: scriptureData[bIdx].end, valid: true };
    }

    function autoPlayCurrentCycle() {
      setCoreMode('mode2');
      const range = getActiveVideoRange();
      if (!range.valid) return;

      video.currentTime = range.start;
      
      let rate = 1.0;
      if (practicePhase === 'new_gendu') {
        rate = Math.round((0.8 + (currentCycleCount * (0.4 / (DEFAULT_REPEAT_NEW - 1)))) * 100) / 100;
      } else if (practicePhase === 'cumulative_gendu') {
        rate = Math.round((0.9 + (currentCycleCount * (0.2 / (DEFAULT_REPEAT_CUMULATIVE - 1)))) * 100) / 100;
      }
      video.playbackRate = Math.max(0.5, Math.min(2.5, rate));

      video.play().catch(() => {});

      video.onetimeupdate = () => {
        if (video.currentTime >= range.end) {
          video.pause();
          video.onetimeupdate = null;
          handleCycleCompletion();
        }
      };
    }

    function handleCycleCompletion() {
      currentCycleCount++;
      addCoins(1);

      if (practicePhase === 'new_gendu') {
        if (currentCycleCount < DEFAULT_REPEAT_NEW) {
          setTimeout(autoPlayCurrentCycle, 500);
        } else {
          practicePhase = 'cumulative_gendu';
          currentCycleCount = 0;
          setupStageRange();
          speakPrompt("從頭開始背", () => {
            showToast("✨ 新進度圓滿！\n自動進入串習複習...", 3000);
            setTimeout(autoPlayCurrentCycle, 1500);
          });
        }
      } else if (practicePhase === 'cumulative_gendu') {
        if (currentCycleCount < DEFAULT_REPEAT_CUMULATIVE) {
          setTimeout(autoPlayCurrentCycle, 500);
        } else {
          practicePhase = 'completed';
          classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_V608', getNormalizedDateStr());
          renderUI();
          triggerSevenColoredLotusFlowerRain();
          speakPrompt("今日定課與串習全部圓滿");
          showToast("🎉 今日定課與串習全部圓滿！\n右側已解鎖『再學一次』與『比對』", 6000);
        }
      }
      saveCurrentAppState();
    }

    function handleRepeatAgain() {
      practicePhase = 'new_gendu';
      currentCycleCount = 0;
      setupStageRange();
      renderUI();
      autoPlayCurrentCycle();
      showToast("🔄 重新開始今日定課", 2500);
    }

    async function handleRecordModeClick() {
      triggerAppFullscreen();
      setCoreMode('mode4');
      showToast('🎙️ 已切換至比對模式，請對照上方經文', 2500);
    }

    function speakPrompt(text, onEnded) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-TW';
          utterance.rate = 1.1;
          if (typeof onEnded === 'function') {
            utterance.onend = onEnded;
            utterance.onerror = onEnded;
          }
          window.speechSynthesis.speak(utterance);
        } else if (typeof onEnded === 'function') { onEnded(); }
      } catch (e) { if (typeof onEnded === 'function') onEnded(); }
    }

    function triggerSevenColoredLotusFlowerRain() {
      const canvas = document.getElementById('flowerCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const flowers = [];
      const lotusColors = ['#FF94B8', '#FFB300', '#F1F5F9', '#22C55E', '#C084FC'];
      for (let i = 0; i < 50; i++) {
        flowers.push({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 12 + 10, speedY: Math.random() * 1.5 + 1.0, color: lotusColors[i % lotusColors.length]
        });
      }
      let start = performance.now();
      function anim(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        flowers.forEach(f => {
          f.y += f.speedY;
          ctx.fillStyle = f.color;
          ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2); ctx.fill();
          if (f.y > canvas.height + 20) f.y = -20;
        });
        if (now - start < 5000) requestAnimationFrame(anim);
        else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.style.display = 'none'; }
      }
      requestAnimationFrame(anim);
    }

    function handleOfferingClick() {
      displayCoinsCount.textContent = (classicStorage.getItem('user_accumulated_coins') || '0') + ' 枚';
      inputClassId.value = classicStorage.getItem('user_class_id') || '';
      inputUserName.value = classicStorage.getItem('user_profile_name') || '';
      offeringOverlay.style.display = 'flex';
    }

    function getStoredCoins() { return parseInt(classicStorage.getItem('user_accumulated_coins') || '0', 10); }
    function addCoins(amount) {
      const total = getStoredCoins() + amount;
      classicStorage.setItem('user_accumulated_coins', total.toString());
      return total;
    }

    btnCancelOffering.addEventListener('click', () => { offeringOverlay.style.display = 'none'; });
    btnConfirmOffering.addEventListener('click', () => {
      const classId = inputClassId.value.trim();
      const userName = inputUserName.value.trim();
      if (!classId || !userName) { alert("請輸入班號與姓名！"); return; }
      classicStorage.setItem('user_class_id', classId);
      classicStorage.setItem('user_profile_name', userName);
      alert("🙏 供養成功，隨喜功德！");
      offeringOverlay.style.display = 'none';
    });

    window.addEventListener('DOMContentLoaded', async () => {
      if (/Line/i.test(navigator.userAgent)) {
        lineBrowserOverlay.classList.add('active');
        return;
      }
      handleOrientationCheck();

      const targetDay = getCurrentActiveDayNumber();
      const cardFileName = (targetDay >= 22) ? "card_021.webp" : ('card_' + String(targetDay).padStart(3, "0") + '.webp');
      
      companionImgDisplay.onload = () => { document.querySelector('.companion-wrapper').classList.add('ready'); };
      companionImgDisplay.onerror = () => { document.querySelector('.companion-wrapper').classList.add('ready'); };
      companionImgDisplay.src = 'cards/' + cardFileName;
      
      companionOverlay.style.display = 'flex';
      companionOverlay.classList.add('active');
    });
  </script>
</body>
