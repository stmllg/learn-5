  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
    }

    const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const classicStorage = {
      getItem(key) {
        return localStorage.getItem(NAMESPACE_KEY + '::' + key);
      },
      setItem(key, value) {
        localStorage.setItem(NAMESPACE_KEY + '::' + key, value);
      },
      removeItem(key) {
        localStorage.removeItem(NAMESPACE_KEY + '::' + key);
      }
    };

    let mp4Speed = parseFloat(classicStorage.getItem('user_mp4_speed_preference') || '1.0');
    if (isNaN(mp4Speed) || mp4Speed < 0.5 || mp4Speed > 2.5) mp4Speed = 1.0;

    let compareSpeed = parseFloat(classicStorage.getItem('user_compare_speed_preference') || '1.0');
    if (isNaN(compareSpeed) || compareSpeed < 0.5 || compareSpeed > 2.5) compareSpeed = 1.0;

    const APPS_SCRIPT_URL = GAS_BACKEND_URL;

    const lineBrowserOverlay = document.getElementById('line-browser-overlay');
    const portraitBlocker = document.getElementById('portrait-blocker-overlay');
    const companionOverlay = document.getElementById('companion-overlay');
    const restoreModalOverlay = document.getElementById('restore-modal-overlay');
    const restoreDescText = document.getElementById('restore-desc-text');

    const centerCore = document.getElementById('center-core');

    const pdfContainerWrap = document.getElementById('pdf-container-wrap');
    const pdfCanvas = document.getElementById('pdf-canvas');
    const videoWrap = document.getElementById('video-container-wrap');
    const video = document.getElementById('my-chant-video');

    const standaloneOverlay = document.getElementById('standalone-video-overlay');
    const standaloneVideo = document.getElementById('standalone-video');

    const scheduleToast = document.getElementById('schedule-toast');
    const speedToastBadge = document.getElementById('speed-toast-badge');

    const leftWing = document.getElementById('left-wing');
    const rightWing = document.getElementById('right-wing');

    const slotL1 = document.getElementById('slot-l1');
    const slotL2 = document.getElementById('slot-l2');
    const slotL3 = document.getElementById('slot-l3');
    const slotL4 = document.getElementById('slot-l4');

    const slotR1 = document.getElementById('slot-r1');
    const slotR2 = document.getElementById('slot-r2');
    const slotR3 = document.getElementById('slot-r3');
    const slotR4 = document.getElementById('slot-r4');

    const offeringOverlay = document.getElementById('offering-modal-overlay');
    const inputClassId = document.getElementById('input-class-id');
    const inputUserName = document.getElementById('input-user-name');
    const displayCoinsCount = document.getElementById('display-coins-count');
    const btnConfirmOffering = document.getElementById('btn-confirm-offering');
    const btnCancelOffering = document.getElementById('btn-cancel-offering');
    const btnPlayDedication = document.getElementById('btn-play-dedication');

    const leaderboardOverlay = document.getElementById('leaderboard-modal-overlay');
    const todayRankList = document.getElementById('today-rank-list');
    const totalRankList = document.getElementById('total-rank-list');
    const btnRejoiceClose = document.getElementById('btn-rejoice-close');

    let currentCoreMode = 'mode2'; 
    let practicePhase = 'new_gendu'; 

    let audioContext = null;
    let analyser = null;
    let micStream = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isUserRecording = false;
    let recordedAudioBlobUrl = null;
    let recordAudioElement = new Audio();

    let scriptureData = [];
    let currentPdfDoc = null;
    let cachedPdfBuffer = null;

    let currentDayPlan = null; 
    let currentCycleCount = 0; 
    let videoPausedAt = -1;

    let hasEnteredReciting = false;
    let pendingRestoredState = null;

    function getNormalizedDateStr() {
      const now = new Date();
      return now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    }

    function isIndependentModeUnlocked() {
      return true;
    }

    function saveCurrentAppState() {
      if (!hasEnteredReciting) return;
      if (currentCoreMode === 'mode1' || currentCoreMode === 'mode5') return;

      if (practicePhase === 'completed') {
        classicStorage.setItem('INDEPENDENT_UNLOCKED_DATE_V971', getNormalizedDateStr());
      }
      const state = {
        coreMode: currentCoreMode,
        practicePhase: practicePhase,
        currentCycleCount: currentCycleCount,
        videoCurrentTime: (currentCoreMode === 'mode2' ? video.currentTime : 0),
        savedDateStr: getNormalizedDateStr(),
        timestamp: Date.now()
      };
      classicStorage.setItem('APP_SAVED_STATE_V971', JSON.stringify(state));
    }

    function checkAndPrepareRestoreState() {
      const savedStr = classicStorage.getItem('APP_SAVED_STATE_V971');
      if (!savedStr) return false;
      try {
        const state = JSON.parse(savedStr);
        const todayStr = getNormalizedDateStr();

        if (state.savedDateStr !== todayStr) {
          classicStorage.removeItem('APP_SAVED_STATE_V971');
          return false;
        }

        pendingRestoredState = state;
        const phaseName = getPhaseName(pendingRestoredState.practicePhase || 'new_gendu');
        let modeDesc = '跟讀模式 (模式2)';
        if (state.coreMode === 'mode4') modeDesc = '比對模式 (模式4)';

        restoreDescText.innerHTML = `上次背書進度：<br><strong style="color: #34D399;">${phaseName} (${modeDesc})</strong><br>準備好後請按下方按鈕回到畫面。`;
        restoreModalOverlay.style.display = 'flex';
        return true;
      } catch(e) {
        classicStorage.removeItem('APP_SAVED_STATE_V971');
        return false;
      }
    }

    function confirmRestoreState() {
      if (!pendingRestoredState) {
        restoreModalOverlay.style.display = 'none';
        return;
      }

      const state = pendingRestoredState;
      currentCoreMode = state.coreMode || 'mode2';
      practicePhase = state.practicePhase || 'new_gendu';
      currentCycleCount = state.currentCycleCount || 0;

      restoreModalOverlay.style.display = 'none';

      loadAllAssetsSmartSync().then(() => {
        if (currentCoreMode === 'mode2') {
          setCoreMode('mode2');
          if (state.videoCurrentTime > 0) video.currentTime = state.videoCurrentTime;
        } else if (currentCoreMode === 'mode4') {
          setCoreMode('mode4');
        }
        renderUI();
        showToast('✨ 已回到上次進度，請開始精進', 4000);
      });
    }

    function getPhaseName(phase) {
      switch(phase) {
        case 'new_gendu': return '新進度跟讀';
        case 'cumulative_gendu': return '串習複習跟讀';
        case 'completed': return '已圓滿解鎖';
        default: return '定課中';
      }
    }

    window.addEventListener('beforeunload', () => { saveCurrentAppState(); releaseMicrophoneResources(); });
    window.addEventListener('pagehide', () => { saveCurrentAppState(); releaseMicrophoneResources(); });
    
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveCurrentAppState();
        releaseMicrophoneResources();
      } else if (document.visibilityState === 'visible') {
        setTimeout(() => {
          handleOrientationCheck();
          if (classicStorage.getItem('INDEPENDENT_UNLOCKED_DATE_V971') === getNormalizedDateStr()) {
            practicePhase = 'completed';
          }
          renderUI();
          if (currentCoreMode === 'mode4') {
            setTimeout(() => {
              renderPdfOnValidDimensions();
            }, 500);
          }
        }, 300);
      }
    });

    let swipeStartX = 0;
    let swipeStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1 && hasEnteredReciting) {
        const deltaX = e.changedTouches[0].clientX - swipeStartX;
        const deltaY = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          handleReturnToCompanionCard();
        }
      }
    }, { passive: true });

    standaloneOverlay.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    standaloneOverlay.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - swipeStartX;
        const deltaY = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          standaloneVideo.pause();
          standaloneOverlay.style.display = 'none';
          handleReturnToCompanionCard();
        }
      }
    }, { passive: true });

    function handleReturnToCompanionCard() {
      saveCurrentAppState();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;
      if (recordAudioElement) recordAudioElement.pause();
      releaseMicrophoneResources();
      
      try { 
        video.pause(); 
        video.currentTime = 0;
        video.removeAttribute('src');
        video.load(); 
      } catch(e) {}

      const targetDay = getRealTargetDay();
      initCompanionCard(targetDay);

      hasEnteredReciting = false;
      companionOverlay.style.display = 'flex';
      companionOverlay.style.opacity = '1';
      companionOverlay.classList.add('active');
      showToast('💤 已為您自動存檔並返回休息', 3500);
    }

    recordAudioElement.addEventListener('ended', () => { renderUI(); });

    function checkDailyResetOnStartup() {
      const todayStr = getNormalizedDateStr();
      const lastActiveDate = classicStorage.getItem('APP_ACTIVE_DATE_V971');
      if (lastActiveDate !== todayStr) {
        classicStorage.setItem('APP_ACTIVE_DATE_V971', todayStr);
      }
    }

    function handleOrientationCheck() {
      if (hasEnteredReciting) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        portraitBlocker.style.display = 'flex';
        companionOverlay.style.display = 'none';
      } else {
        portraitBlocker.style.display = 'none';
        companionOverlay.style.display = 'flex';
      }
    }

    function orientationChangeWrapper() { setTimeout(handleOrientationCheck, 150); }
    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', orientationChangeWrapper);

    function triggerAppFullscreen() {
      const el = document.documentElement;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        window.scrollTo(0, 1);
      } else {
        try {
          if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } 
          else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen().catch(() => {}); } 
          else if (el.msRequestFullscreen) { el.msRequestFullscreen().catch(() => {}); }
        } catch (e) {}
      }
    }

    function getUserMediaWithTimeout(constraints, timeoutMs = 6000) {
      return new Promise((resolve, reject) => {
        let timer = setTimeout(() => {
          reject(new Error('Timeout'));
        }, timeoutMs);

        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            clearTimeout(timer);
            resolve(stream);
          })
          .catch(err => {
            clearTimeout(timer);
            reject(err);
          });
      });
    }

    async function preWarmMicrophonePermission() {
      try {
        const stream = await getUserMediaWithTimeout({ 
          audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } 
        }, 4000);
        stream.getTracks().forEach(track => track.stop());
      } catch (e) {}
    }

    async function playStandaloneVideo(modeType, startSeekSec = 0, onEndedCallback) {
      currentCoreMode = modeType; 
      if (video && !video.paused) video.pause();
      if (isUserRecording && mediaRecorder) mediaRecorder.stop();
      isUserRecording = false;

      standaloneOverlay.style.display = 'flex';
      
      let defaultUrl = (modeType === 'mode1') ? CLASSIC_ASSETS.buddha : CLASSIC_ASSETS.dedication;
      let toastText = (modeType === 'mode1') ? '🙏【老師帶前行：念佛清心】播放中...' : '🙏【模式5：功德迴向】播放中...';

      let mediaUrl = defaultUrl;
      try {
        let fileKey = (modeType === 'mode1') ? 'reciting_buddha_file_v905' : 'merit_dedication_file_v905';
        const savedFile = await getLocalFile(fileKey);
        if (savedFile && savedFile.data) {
          mediaUrl = URL.createObjectURL(new Blob([savedFile.data], { type: 'video/mp4' }));
        }
      } catch(e) {}

      standaloneVideo.src = mediaUrl;
      standaloneVideo.currentTime = startSeekSec;
      standaloneVideo.playbackRate = 1.0;
      showToast(toastText, 4000);

      const cleanupAndExit = () => {
        standaloneVideo.onended = null;
        standaloneVideo.onerror = null;
        standaloneVideo.pause();
        standaloneVideo.removeAttribute('src');
        standaloneVideo.load();
        standaloneOverlay.style.display = 'none';

        if (typeof onEndedCallback === 'function') {
          onEndedCallback();
        }
      };

      standaloneVideo.onended = cleanupAndExit;
      standaloneVideo.onerror = cleanupAndExit;

      try {
        await standaloneVideo.play();
      } catch(e) {
        cleanupAndExit();
      }
    }

    async function playTeacherGuideAndRecite() {
      triggerAppFullscreen();
      const compOverlay = document.getElementById('companion-overlay');
      compOverlay.style.opacity = '0';
      compOverlay.classList.remove('active');
      compOverlay.style.pointerEvents = 'none';

      setTimeout(async () => {
        compOverlay.style.display = 'none';
        compOverlay.style.pointerEvents = 'auto';

        await preWarmMicrophonePermission();

        hasEnteredReciting = true;
        classicStorage.setItem('SETTING_BTN_USED_DATE_V971', getNormalizedDateStr());

        triggerAppFullscreen();

        playStandaloneVideo('mode1', 0, async () => {
          showToast('✨ 前行圓滿，正在進入今日定課...', 3000);
          await loadAllAssetsSmartSync();

          const savedStr = classicStorage.getItem('APP_SAVED_STATE_V971');
          if (savedStr) {
            try {
              const state = JSON.parse(savedStr);
              if (state.savedDateStr === getNormalizedDateStr()) {
                pendingRestoredState = state;
                confirmRestoreState();
                return;
              }
            } catch(e) {}
          }

          setCoreMode('mode2');
        });
      }, 200);
    }

    async function closeCompanionCard() {
      triggerAppFullscreen();
      
      const compOverlay = document.getElementById('companion-overlay');
      compOverlay.style.opacity = '0';
      compOverlay.classList.remove('active');
      compOverlay.style.pointerEvents = 'none';

      setTimeout(async () => {
        compOverlay.style.display = 'none';
        compOverlay.style.pointerEvents = 'auto';

        await preWarmMicrophonePermission();

        hasEnteredReciting = true;
        classicStorage.setItem('SETTING_BTN_USED_DATE_V971', getNormalizedDateStr());

        triggerAppFullscreen();

        await loadAllAssetsSmartSync();

        const savedStr = classicStorage.getItem('APP_SAVED_STATE_V971');
        if (savedStr) {
          try {
            const state = JSON.parse(savedStr);
            if (state.savedDateStr === getNormalizedDateStr()) {
              pendingRestoredState = state;
              confirmRestoreState();
              return;
            }
          } catch(e) {}
        }

        const hasRestore = checkAndPrepareRestoreState();
        if (!hasRestore) {
          setCoreMode('mode2');
        }
      }, 200);
    }

    function getCurrentProgressEnd() {
      if (currentDayPlan && currentDayPlan.end) {
        return currentDayPlan.end;
      }
      const saved = classicStorage.getItem('USER_CURRENT_PROGRESS_END_V971');
      if (saved !== null) return parseInt(saved, 10);
      return 0;
    }

    function getRealTargetDay() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetDay = 1;
      if (urlParams.get('start')) {
        const startStr = urlParams.get('start');
        const parts = startStr.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          const userStartDate = new Date(y, m, d);
          const now = new Date();
          const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const diffDays = Math.floor((todayDate - userStartDate) / (1000 * 60 * 60 * 24)) + 1;
          targetDay = Math.max(1, diffDays);
        }
      } else if (urlParams.get('day')) {
        targetDay = parseInt(urlParams.get('day'), 10) || 1;
      } else {
        const currentSchedDay = classicStorage.getItem('CURRENT_SCHEDULE_DAY_V971');
        if (currentSchedDay) {
          targetDay = parseInt(currentSchedDay, 10) || 1;
        } else {
          targetDay = 1;
        }
      }
      return targetDay;
    }

    function getCurrentActiveDayNumber() {
      if (currentDayPlan && currentDayPlan.day) {
        return currentDayPlan.day;
      }
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('start')) {
        const startStr = urlParams.get('start');
        const parts = startStr.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          const userStartDate = new Date(y, m, d);
          const now = new Date();
          const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const diffDays = Math.floor((todayDate - userStartDate) / (1000 * 60 * 60 * 24)) + 1;
          return Math.max(1, diffDays);
        }
      } else if (urlParams.get('day')) {
        return parseInt(urlParams.get('day'), 10) || 1;
      } else {
        const currentSchedDay = classicStorage.getItem('CURRENT_SCHEDULE_DAY_V971');
        if (currentSchedDay) {
          return parseInt(currentSchedDay, 10) || 1;
        }
      }
      return 1;
    }

    if (btnPlayDedication) {
      btnPlayDedication.addEventListener('click', async () => {
        offeringOverlay.style.display = 'none';
        playStandaloneVideo('mode5', 0, () => {
          showToast('✨ 迴向圓滿，隨喜功德', 3000);

          setCoreMode('mode2');
          renderUI();
        });

    }

    async function prefetchSentenceCountOnStartup() {
      const timestamp = Date.now();
      let localSentStr = classicStorage.getItem('OFFLINE_SENTENCES_CACHE_V971');
      try {
        const res = await fetch(CLASSIC_ASSETS.sentences + '?nocache=' + timestamp, { cache: 'no-store' });
        if (res.ok) {
          const freshSent = await res.json();
          if (Array.isArray(freshSent) && freshSent.length > 0) {
            scriptureData = freshSent;
            classicStorage.setItem('OFFLINE_SENTENCES_CACHE_V971', JSON.stringify(freshSent));
          }
        }
      } catch (e) {}

      if (scriptureData.length === 0 && localSentStr) {
        try { scriptureData = JSON.parse(localSentStr); } catch(e){}
      }

      if (Array.isArray(scriptureData) && scriptureData.length > 0) {

        const scheduleNeedsResize = !Array.isArray(savedSchedule) ||

    function generateAlgorithmicSchedule(settings) {
      const total = CLASSIC_TOTAL_SENTENCES;
      const step = settings.dailyStep || DEFAULT_DAILY_STEP;
      const rNew = settings.repeatNew;
      const rCum = settings.repeatCum;
      const testCompleted = settings.testCompleted !== undefined ? settings.testCompleted : getCurrentProgressEnd();
      const scheduleList = [];

      let currentDay = getCurrentActiveDayNumber();
      let simDay = currentDay;
      let simStart = Math.min(total, testCompleted + 1);
      if (simDay === 1) simStart = 1;

      for (let dayIdx = 1; dayIdx <= 100; dayIdx++) {
        let end = (simDay === 1) ? 1 : Math.min(total, simStart + step - 1);
        let cStart = null, cEnd = null, cRepeat = 0;

        if (simDay > 1) {
          cStart = 1;
          cEnd = end;
          cRepeat = rCum;
        }

        scheduleList.push({
          day: simDay,
          start: simStart,
          end: end,
          repeat: rNew,
          cStart: cStart,
          cEnd: cEnd,
          cRepeat: cRepeat
        });

        if (end >= total) break;
        if (simDay === 1) {
          simStart = 2;
        } else {
          simStart = Math.min(total, end + 1);
        }
        simDay++;
      }

      classicStorage.setItem('OFFLINE_SCHEDULE_CACHE_V971', JSON.stringify(scheduleList));
    }

    }

    async function renderPdfOnValidDimensions() {
      if (!cachedPdfBuffer) return;
      try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(cachedPdfBuffer),
            cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/cmaps/',
            cMapPacked: true
          });

          currentPdfDoc = await loadingTask.promise;
          const page = await currentPdfDoc.getPage(1);

          pdfCanvas.width = 0;
          pdfCanvas.height = 0;

          const availableWidth = Math.max(centerCore.clientWidth || 0, window.innerWidth - 130);
          const pageRotation = page.rotate || 0;
          const unscaledViewport = page.getViewport({ scale: 1.0, rotation: pageRotation });
          const pageScale = availableWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: pageScale, rotation: pageRotation });

          pdfCanvas.width = viewport.width;
          pdfCanvas.height = viewport.height;
          const ctx = pdfCanvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      } catch(e) {}
    }

    const DB_NAME = 'HappyReciteDB_' + CURRENT_CLASSIC_ID;
    const STORE_NAME = 'app_offline_files';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }

    async function getLocalFile(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveLocalFile(key, data, tag) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ data: data, tag: tag }, key);
      } catch (e) {}
    }

    function getActiveVideoRange() {
      if (!scriptureData || scriptureData.length === 0) {
        return { start: 0, end: 0, valid: false };
      }
      let aIdx = 0;
      let bIdx = scriptureData.length - 1;
      if (currentDayPlan) {
        if (practicePhase === 'new_gendu') {
          aIdx = Math.max(0, (currentDayPlan.start || 1) - 1);
          bIdx = Math.min(scriptureData.length - 1, (currentDayPlan.end || 1) - 1);
        } else if (practicePhase === 'cumulative_gendu') {
          aIdx = Math.max(0, (currentDayPlan.cStart || 1) - 1);
          bIdx = Math.min(scriptureData.length - 1, (currentDayPlan.cEnd || 1) - 1);
        }
      }

      const startObj = scriptureData[aIdx];
      const endObj = scriptureData[bIdx];

      if (!startObj || typeof startObj.start !== 'number' || !endObj || typeof endObj.end !== 'number') {
        return { start: 0, end: 0, valid: false };
      }

      return {
        start: startObj.start,
        end: endObj.end,
        valid: true
      };
    }

      const flowers = [];
      const lotusColors = ['#FF94B8', '#FFB300', '#F1F5F9', '#22C55E', '#C084FC', '#E11D48', '#3B82F6'];
      
      for (let i = 0; i < 70; i++) {
        flowers.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 10 + 10,
          speedY: Math.random() * 1.8 + 1.0,
          speedX: (Math.random() - 0.5) * 1.2,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 2.5,
          color: lotusColors[Math.floor(Math.random() * lotusColors.length)],
          opacity: 0.94
        });
      }

      let startTime = performance.now();
      const duration = 5800;

      function animateLotusRain(now) {
        let elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        flowers.forEach(f => {
          f.y += f.speedY;
          f.x += f.speedX + Math.sin(f.y / 45) * 0.7;
          f.rotation += f.rotationSpeed;

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.rotate((f.rotation * Math.PI) / 180);
          ctx.globalAlpha = f.opacity;

          for (let j = 0; j < 5; j++) {
            const angle = (j * 2 * Math.PI) / 5;
            const dist = f.size * 0.40;
            const cx = Math.cos(angle) * dist;
            const cy = Math.sin(angle) * dist;
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(cx, cy, f.size * 0.42, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = (f.color === '#F1F5F9') ? '#FEF08A' : '#FFFFFF';
          ctx.beginPath();
          ctx.arc(0, 0, f.size * 0.30, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          if (f.y > canvas.height + 40) {
            f.y = -40;
            f.x = Math.random() * canvas.width;
          }
        });

        if (elapsed < duration) {
          requestAnimationFrame(animateLotusRain);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }

      requestAnimationFrame(animateLotusRain);
    }

    function triggerFireworks(showToastFlag = false) {
      const canvas = document.getElementById('flowerCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let startX = window.innerWidth / 2;
      let startY = window.innerHeight - 40;

      const targetX = startX + (Math.random() - 0.5) * 160;
      const targetY = window.innerHeight * 0.2 + Math.random() * (window.innerHeight * 0.25);

      let firework = {
        x: startX,
        y: startY,
        targetX: targetX,
        targetY: targetY,
        speed: 14,
        angle: Math.atan2(targetY - startY, targetX - startX),
        exploded: false
      };

      let particles = [];
      const colors = ['#FF94B8', '#FFB300', '#34D399', '#38BDF8', '#C084FC', '#F43F5E', '#FBBF24', '#FFFFFF'];

      function explode() {
        const particleCount = 80;
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 7 + 2;
          particles.push({
            x: firework.targetX,
            y: firework.targetY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 7 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1.0,
            decay: Math.random() * 0.012 + 0.008,
            shape: Math.random() > 0.4 ? 'flower' : 'circle'
          });
        }
      }

      let startTime = performance.now();
      const duration = 3200;

      function animateFireworks(now) {
        let elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!firework.exploded) {
          let dx = firework.targetX - firework.x;
          let dy = firework.targetY - firework.y;
          firework.x += Math.cos(firework.angle) * firework.speed;
          firework.y += Math.sin(firework.angle) * firework.speed;

          ctx.fillStyle = '#FEF08A';
          ctx.beginPath();
          ctx.arc(firework.x, firework.y, 5, 0, Math.PI * 2);
          ctx.fill();

          if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
            firework.exploded = true;
            explode();
          }
        }

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.10;
          p.vx *= 0.97;
          p.alpha -= p.decay;
          if (p.alpha < 0) p.alpha = 0;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.globalAlpha = p.alpha;

          if (p.shape === 'flower') {
            ctx.fillStyle = p.color;
            for (let j = 0; j < 5; j++) {
              const angle = (j * 2 * Math.PI) / 5;
              ctx.beginPath();
              ctx.arc(Math.cos(angle) * (p.size * 0.4), Math.sin(angle) * (p.size * 0.4), p.size * 0.45, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(0, 0, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });

        if (elapsed < duration) {
          requestAnimationFrame(animateFireworks);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }

      requestAnimationFrame(animateFireworks);

      if (showToastFlag) {
        showToast(`🎆 為自己第 ${window.CURRENT_TARGET_DAY || 22} 天的堅持放一場燦爛煙火，隨喜功德！`, 3000);
      }
    }

    let cardDayTimer = null;
    function handleDayBtnClick() {
      triggerAppFullscreen();
      const todayStr = getNormalizedDateStr();
      const lastToastDate = classicStorage.getItem('FIREWORKS_TOAST_DATE_V971');
      let showToastFlag = (lastToastDate !== todayStr);
      if (showToastFlag) {
        classicStorage.setItem('FIREWORKS_TOAST_DATE_V971', todayStr);
      }

      const dayStr = String(window.CURRENT_TARGET_DAY || 22).padStart(3, '0');
      const btnDays = document.getElementById('btn-card-days');
      if (btnDays) {
        btnDays.textContent = dayStr;
      }

      if (cardDayTimer) clearTimeout(cardDayTimer);
      cardDayTimer = setTimeout(() => {
        if (btnDays) {
          btnDays.textContent = '皈依祈求';
        }
      }, 3000);
    }

    function triggerOfferingCoinRain() {
      const canvas = document.getElementById('flowerCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const coins = [];
      const labels = ['福', '慧'];
      
      for (let i = 0; i < 55; i++) {
        coins.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          radius: Math.random() * 12 + 14,
          speedY: Math.random() * 1.5 + 0.8,
          speedX: (Math.random() - 0.5) * 0.8,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.04,
          label: labels[i % labels.length],
          opacity: 0.98
        });
      }

      let startTime = performance.now();
      const duration = 5500;

      function animateCoinRain(now) {
        let elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        coins.forEach(c => {
          c.y += c.speedY;
          c.x += c.speedX + Math.sin(c.y / 50) * 0.5;
          c.rotation += c.rotationSpeed;

          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.globalAlpha = c.opacity;

          const grad = ctx.createRadialGradient(-2, -2, 2, 0, 0, c.radius);
          grad.addColorStop(0, '#FEF08A');
          grad.addColorStop(0.5, '#F59E0B');
          grad.addColorStop(1, '#B45309');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#FEF3C7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, c.radius * 0.82, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = `bold ${Math.floor(c.radius * 0.9)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(c.label, 0, 1);

          ctx.restore();

          if (c.y > canvas.height + 40) {
            c.y = -40;
            c.x = Math.random() * canvas.width;
          }
        });

        if (elapsed < duration) {
          requestAnimationFrame(animateCoinRain);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }

      requestAnimationFrame(animateCoinRain);
    }

    async function ensureMicrophoneActive() {
      if (micStream) return true;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === 'suspended') await audioContext.resume();

        micStream = await getUserMediaWithTimeout({
          audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false }
        }, 6000);
        return true;
      } catch (err) {
        showToast("⚠️ 麥克風回應逾時或未授權", 4000);
        releaseMicrophoneResources();
        return false;
      }
    }

    async function toggleReliableRecordAction() {
      const ok = await ensureMicrophoneActive();
      if (!ok) return;

      audioChunks = [];
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const options = mediaRecorder.mimeType ? { type: mediaRecorder.mimeType } : {};
        const recordedBlob = new Blob(audioChunks, options);
        recordedAudioBlobUrl = URL.createObjectURL(recordedBlob);
        recordAudioElement.src = recordedAudioBlobUrl;
        recordAudioElement.playbackRate = compareSpeed;
        renderUI();
      };
      mediaRecorder.start(); 
      isUserRecording = true;
      renderUI();
    }

    function togglePlaybackAction() {
      if (!recordedAudioBlobUrl) return;

      if (recordAudioElement.paused) {
        recordAudioElement.playbackRate = compareSpeed;
        recordAudioElement.play().then(() => renderUI()).catch(() => {});
      } else {
        recordAudioElement.pause();
        renderUI();
      }
    }

    function handleOfferingClick() {
      triggerFireworks(false);
      const displayCoinsCount = document.getElementById('display-coins-count');
      const inputClassId = document.getElementById('input-class-id');
      const inputUserName = document.getElementById('input-user-name');
      const offeringOverlay = document.getElementById('offering-modal-overlay');

      if (displayCoinsCount) displayCoinsCount.textContent = (classicStorage.getItem('user_accumulated_coins') || '0') + ' 枚';
      if (inputClassId) inputClassId.value = classicStorage.getItem('user_class_id') || '';
      if (inputUserName) inputUserName.value = classicStorage.getItem('user_profile_name') || '';
      if (offeringOverlay) offeringOverlay.style.display = 'flex';
    }

    function getStoredCoins() {
      return parseInt(classicStorage.getItem('user_accumulated_coins') || '0', 10);
    }
    function addCoins(amount) {
      const total = getStoredCoins() + amount;
      classicStorage.setItem('user_accumulated_coins', total.toString());
      saveCurrentAppState();
      return total;
    }
    function resetCoins() {
      classicStorage.setItem('user_accumulated_coins', '0');
      saveCurrentAppState();
    }

    btnCancelOffering.addEventListener('click', () => { offeringOverlay.style.display = 'none'; });

    btnConfirmOffering.addEventListener('click', () => {
      const classId = inputClassId.value.trim();
      const userName = inputUserName.value.trim();

      if (!classId || !userName) {
        alert("請輸入班號與姓名！");
        return;
      }

      classicStorage.setItem('user_class_id', classId);
      classicStorage.setItem('user_profile_name', userName);

      const coinsToOffer = getStoredCoins();
      if (coinsToOffer <= 0) {
        alert("目前福慧幣為 0 枚，請先精進背誦！");
        return;
      }

      btnConfirmOffering.disabled = true;
      btnConfirmOffering.textContent = '連線供養中...';

      const urlParams = new URLSearchParams(window.location.search);
      const startDateParam = urlParams.get('start') || '';
      const groupParam = urlParams.get('group') || '';
      const callbackName = 'onRankDataLoaded_' + Math.floor(Math.random() * 1000000);

      let isDone = false;
      let timeoutTimer = null;
      let scriptTag = null;

      function cleanup() {
        if (timeoutTimer) clearTimeout(timeoutTimer);
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
      }

      function handleFailure(message) {
        if (isDone) return;
        isDone = true;
        cleanup();
        btnConfirmOffering.disabled = false;
        btnConfirmOffering.textContent = '確認供養';
        showToast(message, 5000);
      }

      function handleSuccess(data) {
        if (isDone) return;
        if (!data || !Array.isArray(data.todayTop3) || !Array.isArray(data.totalTop3)) {
          handleFailure('未取得完整排行榜資料，請稍後重試');
          return;
        }
        isDone = true;
        cleanup();
        resetCoins();
        displayCoinsCount.textContent = '0 枚';
        offeringOverlay.style.display = 'none';
        btnConfirmOffering.disabled = false;
        btnConfirmOffering.textContent = '確認供養';
        renderLeaderboards(data, classId, userName, coinsToOffer);
        leaderboardOverlay.style.display = 'flex';
        
        triggerOfferingCoinRain();
      }

      timeoutTimer = setTimeout(() => { handleFailure('連線逾時，請稍後重試'); }, 20000);
      window[callbackName] = (res) => handleSuccess(res);

      scriptTag = document.createElement('script');
      scriptTag.async = true;
      scriptTag.crossOrigin = 'anonymous';
      scriptTag.src = `${APPS_SCRIPT_URL}?classId=${encodeURIComponent(classId)}&userName=${encodeURIComponent(userName)}&coins=${coinsToOffer}&classicId=${encodeURIComponent(CURRENT_CLASSIC_ID)}&startDate=${encodeURIComponent(startDateParam)}&groupName=${encodeURIComponent(groupParam)}&callback=${callbackName}&t=${Date.now()}`;
      scriptTag.onerror = () => { handleFailure('連線失敗，請檢查網路'); };
      document.body.appendChild(scriptTag);
    });

    function renderLeaderboards(data, curClass, curName, curCoins) {
      const medals = ['🥇', '🥈', '🥉'];
      function buildListHtml(list) {
        const fullList = (list && Array.isArray(list)) ? [...list] : [];
        while (fullList.length < 3) fullList.push({ isPlaceholder: true });
        return fullList.slice(0, 3).map((item, idx) => {
          const medal = medals[idx] || `第${idx + 1}名`;
          if (item.isPlaceholder) {
            return `<div class="rank-item"><span>${medal} <i style="color:#94A3B8;">虛位以待</i></span><span class="rank-coins">--</span></div>`;
          }
          const displayName = item.maskName || item.name || curName;
          const displayClass = item.classId ? `(${item.classId})` : '';
          const coinsVal = (typeof item.coins === 'number') ? item.coins : curCoins;
          return `<div class="rank-item"><span>${medal} ${displayName} <small style="color:#94A3B8;">${displayClass}</small></span><span class="rank-coins">${coinsVal} 枚</span></div>`;
        }).join('');
      }
      todayRankList.innerHTML = buildListHtml(data ? data.todayTop3 : null);
      totalRankList.innerHTML = buildListHtml(data ? data.totalTop3 : null);
    }

    btnRejoiceClose.addEventListener('click', () => { leaderboardOverlay.style.display = 'none'; });

    let cardTexts = {};
    let textKeys = [];

    let backgroundConfig = { firstNum: 1, lastNum: 40 };
    async function loadBackgroundConfig() {
      try {
        const res = await fetch('images_config.json?t=' + Date.now());
        if (res.ok) {
          const cfg = await res.json();
          if (cfg && cfg.first && cfg.last) {
            const mF = cfg.first.match(/\d+/);
            const mL = cfg.last.match(/\d+/);
            if (mF && mL) {
              backgroundConfig.firstNum = parseInt(mF[0], 10);
              backgroundConfig.lastNum = parseInt(mL[0], 10);
            }
          }
        }
      } catch (e) {}
    }

    async function loadRandomCardData() {
      await loadBackgroundConfig();
      const cardStage = document.getElementById('cardStage');
      const bottomRightBadge = document.getElementById('bottomRightBadge');
      const textContainer = document.getElementById('textContainer');
      const cardTitle = document.getElementById('cardTitle');
      const cardContent = document.getElementById('cardContent');
      if (bottomRightBadge) bottomRightBadge.style.display = 'block';
      if (textContainer) textContainer.style.display = 'block';

      const totalImgs = backgroundConfig.lastNum - backgroundConfig.firstNum + 1;
      const randomImgNum = backgroundConfig.firstNum + Math.floor(Math.random() * Math.max(1, totalImgs));
      const paddedImgNum = String(randomImgNum).padStart(2, '0');
      const imgPath = `images/bg_${paddedImgNum}.webp`;

      if (cardStage) cardStage.classList.add('fade-out');

      setTimeout(() => {
        if (textKeys.length > 0) {
          const randomTextKey = textKeys[Math.floor(Math.random() * textKeys.length)];
          const selectedData = cardTexts[randomTextKey];

          let titleText = selectedData.title;
          let rawContent = selectedData.content;
          if (titleText.length > 16) titleText = titleText.substring(0, 16);

          if (cardTitle) cardTitle.textContent = titleText;
          if (cardContent) cardContent.textContent = rawContent;

          const displayId = selectedData.id || randomTextKey;
          const cardIdInline = document.getElementById('cardIdInline');
          if (cardIdInline) cardIdInline.textContent = displayId;

          const stageHeight = (cardStage && cardStage.clientHeight > 50) ? cardStage.clientHeight : window.innerHeight;
          const maxH = (cardStage ? cardStage.clientHeight : window.innerHeight) * 0.78;

          let size = 33; 
          const minSize = 14; 

          cardContent.style.fontSize = size + "px";
          cardTitle.style.fontSize = (size + 6) + "px";
          if (cardIdInline) cardIdInline.style.fontSize = "12px";

          let tH = cardTitle.offsetHeight + cardContent.offsetHeight + (cardIdInline ? cardIdInline.offsetHeight : 0);

          while (tH > maxH && size > minSize) {
            size--;
            cardContent.style.fontSize = size + "px";
            cardTitle.style.fontSize = (size + 6) + "px";
            if (cardIdInline) cardIdInline.style.fontSize = "12px";
            tH = cardTitle.offsetHeight + cardContent.offsetHeight + (cardIdInline ? cardIdInline.offsetHeight : 0);
          }

          if (bottomRightBadge) bottomRightBadge.style.display = 'none';
        }
        if (cardStage) {
          cardStage.style.backgroundImage = `url('${imgPath}')`;
          cardStage.classList.remove('fade-out');
        }
      }, 200);
    }

    async function initCompanionCard(targetDay) {
      await loadBackgroundConfig();
      window.CURRENT_TARGET_DAY = targetDay;
      const cardStage = document.getElementById('cardStage');
      const bottomRightBadge = document.getElementById('bottomRightBadge');
      const textContainer = document.getElementById('textContainer');
      const cardTitle = document.getElementById('cardTitle');
      const cardContent = document.getElementById('cardContent');
      const btnDays = document.getElementById('btn-card-days');

      if (btnDays) {
        btnDays.style.display = 'inline-block';
        btnDays.textContent = '皈依祈求';
        btnDays.onclick = handleDayBtnClick;
      }

      if (Object.keys(cardTexts).length === 0) {
        try {
          const res = await fetch('images_text.json');
          if (res.ok) {
            cardTexts = await res.json();
            textKeys = Object.keys(cardTexts);
          }
        } catch(e) {}
      }

      if (targetDay <= 21) {
        const cardFileName = 'cards/' + ('card_' + String(targetDay).padStart(3, "0") + '.webp');
        if (cardStage) cardStage.style.backgroundImage = `url('${cardFileName}')`;
        if (bottomRightBadge) bottomRightBadge.style.display = 'none';
        if (textContainer) textContainer.style.display = 'none';
      } else {
        if (bottomRightBadge) bottomRightBadge.style.display = 'block';
        if (textContainer) textContainer.style.display = 'block';

        if (Object.keys(cardTexts).length > 0) {
          loadRandomCardData();
        } else {
          fetch('images_text.json')
            .then(res => res.json())
            .then(data => {
              cardTexts = data;
              textKeys = Object.keys(cardTexts);
              loadRandomCardData();
            })
            .catch(err => {
              if (cardTitle) cardTitle.textContent = "陪伴卡載入";
              if (cardContent) cardContent.textContent = "請確認 images_text.json 是否存在";
              if (cardStage) cardStage.style.backgroundImage = `url('images/bg_01.webp')`;
            });
        }
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (/Line/i.test(navigator.userAgent)) {
        const overlay = document.getElementById('line-browser-overlay');
        const guideContent = overlay.querySelector('.line-guide-content');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) {
          guideContent.innerHTML = `請留意畫面<strong>右下角或右上角</strong>的圖示（<strong>「⋯」</strong>或<strong>「指南針/Safari圖示」</strong>），點選<strong><strong>在 Safari 中開啟」</strong>以獲得最佳全螢幕體驗。`;
        } else {
          guideContent.innerHTML = `請留意畫面<strong>右下角或右上角</strong>的三點圖示<strong>「⋮」</strong>，點選<strong>「以預設瀏覽器開啟」</strong>（Chrome）。`;
        }
        overlay.classList.add('active');
        return; 
      }

      await prefetchSentenceCountOnStartup();
      checkDailyResetOnStartup();

      let targetDay = getRealTargetDay();
      classicStorage.setItem('CURRENT_SCHEDULE_DAY_V971', targetDay.toString());

      initCompanionCard(targetDay);

      const compWrapper = document.querySelector('.companion-wrapper');
      if (compWrapper) compWrapper.classList.add('ready');

      const compOverlay = document.getElementById('companion-overlay');
      compOverlay.style.display = 'flex';
      compOverlay.classList.add('active');

      handleOrientationCheck();
    });
  </script>
