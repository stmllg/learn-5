<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時時歡喜・經典背誦供養登記</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #eef4f1 100%);
            color: #2c3e50;
            max-width: 520px;
            margin: 30px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            border: 1px solid #e8f5e9;
        }
        h2 { 
            text-align: center; 
            color: #2e7d32; 
            margin-bottom: 8px; 
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #607d8b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .info-box {
            background: #f1f8e9;
            border: 1px solid #c8e6c9;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #33691e;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .info-box p { margin: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #37474f; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #43a047;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.15);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: all 0.2s ease;
        }
        button:hover { 
            background: linear-gradient(135deg, #388e3c 0%, #1b5e20 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.35);
        }
        #result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f1f8e9;
            border: 1px solid #aed581;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .link-text {
            word-break: break-all;
            background: #ffffff;
            padding: 12px;
            border: 1px solid #c5e1a5;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 13px;
            color: #2e7d32;
            line-height: 1.5;
        }
        .btn-copy { 
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%); 
            margin-top: 8px; 
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.25);
        }
        .btn-copy:hover { 
            background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%); 
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #90a4ae;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📖 時時歡喜・背書供養</h2>
    <div class="subtitle">培福修慧，每日與法相伴同行</div>
    
    <div class="info-box">
        <p><strong>👥 群組代號</strong><br><span id="display-group" style="font-size: 16px; font-weight: bold;">讀取中...</span></p>
        <p><strong>📅 起跑日期</strong><br><span id="display-start" style="font-size: 16px; font-weight: bold;">讀取中...</span></p>
    </div>

    <!-- 1. 發起人與共同發起人 -->
    <div class="form-group">
        <label for="initiator">🌟 發起人姓名：</label>
        <input type="text" id="initiator" placeholder="請輸入您的姓名" required>
    </div>

    <div class="form-group">
        <label for="coInitiator">🤝 共同發起人姓名（選填）：</label>
        <input type="text" id="coInitiator" placeholder="若有同行好友可在此輸入">
    </div>

    <!-- 2. 隊名 -->
    <div class="form-group">
        <label for="teamName">🚩 隊名（選填）：</label>
        <input type="text" id="teamName" placeholder="例如：精進勇猛隊">
    </div>

    <!-- 3. 選擇經典 -->
    <div class="form-group">
        <label for="classicSelect">📚 選擇欲背誦的經典：</label>
        <select id="classicSelect">
            <option value="xin_jing">心經</option>
            <option value="fo_chan">三十五佛懺</option>
            <option value="xiu_xin">修心八偈</option>
            <option value="dou_shuai">兜率眾神頌</option>
            <option value="san_ba">三十八攝頌</option>
            <option value="zhen_bao">無上三珍寶讚</option>
            <option value="shi_hao">佛說十號經</option>
            <option value="er_sheng">二勝六莊嚴讚</option>
            <option value="wen_shuo">文殊讚</option>
            <option value="guang_lun">廣論祈願文</option>
            <option value="ba_da">佛說八大人覺經</option>
            <option value="pu_men">普門品</option>
            <option value="ru_01">入行論第一品</option>
            <option value="ru_02">入行論第二品</option>
            <option value="ru_03">入行論第三品</option>
            <option value="ru_04">入行論第四品</option>
            <option value="ru_05">入行論第五品</option>
            <option value="ru_06">入行論第六品</option>
            <option value="gong_de">功德之本頌</option>
            <option value="shan_hui">善慧教法廣弘文讀本</option>
            <option value="dao_ci">菩提道次第略義 45頌</option>
            <option value="du_mu">聖母度母讚</option>
            <option value="zong_qie">宗喀巴大師覆擦科本波語王名稱書</option>
            <option value="liu_bi">六臂怙主讚</option>
            <option value="jiu_zhu">廣論奢摩他 九住心</option>
        </select>
    </div>
    
    <!-- 按鈕文字已更新 -->
    <button onclick="submitSelection()">✨ 隨喜發心 確認報名</button>

    <div id="result-box">
        <strong>🎉 登記成功並已寫入雲端總表！請點擊下方按鈕複製 LINE 文案分享：</strong>
        <div class="link-text" id="generated-text"></div>
        <button class="btn-copy" onclick="copyToLine()">📋 一鍵複製 LINE 專用文案</button>
    </div>

    <div class="footer-note">願以此功德，普及於一切，我等與眾生，皆共成佛道。</div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKop9lC3br5VKWaIkT27kfv_bCpKtpZCxTFAJNLl4yeegqFhVA-RwCwN2h0WrfJ6qo/exec";

    function getRandomLetters() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let result = "";
        for (let i = 0; i < 3; i++) {
            result += letters.charAt(Math.floor(Math.random() * letters.length));
        }
        return result;
    }

    function getTodayString() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const group = urlParams.get('group') || getRandomLetters();
    const start = urlParams.get('start') || getTodayString();
    const preClassic = urlParams.get('classic');

    document.getElementById("display-group").innerText = group;
    document.getElementById("display-start").innerText = start;

    if (preClassic) {
        const selectElem = document.getElementById("classicSelect");
        for (let opt of selectElem.options) {
            if (opt.value === preClassic) {
                opt.selected = true;
                break;
            }
        }
    }

    let finalShareText = "";

    function submitSelection() {
        const initiator = document.getElementById("initiator").value.trim();
        const coInitiator = document.getElementById("coInitiator").value.trim();
        const teamName = document.getElementById("teamName").value.trim();
        const selectElem = document.getElementById("classicSelect");
        const classicCode = selectElem.value;
        const classicText = selectElem.options[selectElem.selectedIndex].text;

        if (!initiator) {
            alert("請先輸入「發起人姓名」！");
            return;
        }

        const submitBtn = document.querySelector("button[onclick='submitSelection()']");
        submitBtn.disabled = true;
        submitBtn.style.background = "#b0bec5";
        submitBtn.innerText = "⏳ 正在寫入雲端並產生文案...";

        let fullName = initiator;
        if (coInitiator) {
            fullName += ` & ${coInitiator}`;
        }

        const origin = window.location.origin;
        const pathArr = window.location.pathname.split('/');
        pathArr.pop(); 
        const basePath = pathArr.join('/') + '/';
        const personalLink = `${origin}${basePath}index.html?classic=${classicCode}&start=${start}&group=${group}`;
        
        let teamHeader = teamName ? `【${teamName}】` : "";

        // LINE 訊息已刪除「的經典背誦登記」，只保留名字、經典與起跑日
        finalShareText = `${teamHeader} ${fullName}\n📚《${classicText}》 📅 ${start}\n👉 點擊下方連結開始背誦：\n${personalLink}`;

        document.getElementById("generated-text").innerText = finalShareText;
        document.getElementById("result-box").style.display = "block";

        if (GAS_URL) {
            const targetUrl = `${GAS_URL}?teamName=${encodeURIComponent(teamName)}&groupName=${encodeURIComponent(group)}&classicId=${encodeURIComponent(classicCode)}&startDate=${encodeURIComponent(start)}&userName=${encodeURIComponent(fullName)}`;
            const script = document.createElement('script');
            script.src = targetUrl + '&callback=handleCloudResponse';
            document.body.appendChild(script);
        }
    }

    function handleCloudResponse(res) {
        console.log("總表同步結果: ", res);
    }

    function copyToLine() {
        navigator.clipboard.writeText(finalShareText).then(() => {
            alert("✨ 已成功複製 LINE 文案！快去貼給同修們吧！");
        }).catch(err => {
            alert("複製失敗，請手動複製。");
        });
    }
</script>

</body>
</html>
