<script>
    function renderUI() {
      if (practicePhase === 'completed') {
        slotL1.innerHTML = '<button class="square-btn btn-color-offering" id="btn-offering">背書<br>供養</button>';
        const btnOffering = document.getElementById('btn-offering');
        if (btnOffering) btnOffering.addEventListener('click', handleOfferingClick);

        const textA = isSelectingMarkA ? '請點句' : '起句';
        const textB = isSelectingMarkB ? '請點句' : '終句';
        const styleA = isSelectingMarkA ? 'background: linear-gradient(135deg, #9333EA 0%, #7E22CE 100%) !important; border-color: #E9D5FF !important; animation: recordingPulseStrong 0.9s infinite ease-in-out;' : '';
        const styleB = isSelectingMarkB ? 'background: linear-gradient(135deg, #9333EA 0%, #7E22CE 100%) !important; border-color: #E9D5FF !important; animation: recordingPulseStrong 0.9s infinite ease-in-out;' : '';

        slotL2.innerHTML = `<button class="circle-btn btn-color-mark-a" id="btn-mark-a" style="${styleA}">${textA}</button>`;
        slotL3.innerHTML = `<button class="circle-btn btn-color-mark-b" id="btn-mark-b" style="${styleB}">${textB}</button>`;
        slotL4.innerHTML = '<button class="circle-btn btn-color-speed-down" id="btn-speed-down" style="font-size: 22px !important; font-weight: 900; letter-spacing: 1px;">慢-</button>';
        slotR4.innerHTML = '<button class="circle-btn btn-color-speed-up" id="btn-speed-up" style="font-size: 22px !important; font-weight: 900; letter-spacing: 1px;">快+</button>';
      } else {
        slotL1.innerHTML = ''; slotL2.innerHTML = '';
        if (currentCoreMode === 'mode3') {
          slotL4.innerHTML = '<button class="circle-btn btn-color-speed-down" id="btn-speed-down" style="font-size: 22px !important; font-weight: 900; letter-spacing: 1px;">慢-</button>';
          slotR4.innerHTML = '<button class="circle-btn btn-color-speed-up" id="btn-speed-up" style="font-size: 22px !important; font-weight: 900; letter-spacing: 1px;">快+</button>';
        } else {
          slotL4.innerHTML = ''; slotR4.innerHTML = '';
        }
      }

      slotR1.innerHTML = '<button class="square-btn" id="btn-gendu">跟讀</button>';
      slotR2.innerHTML = '<button class="square-btn" id="btn-zidu">自讀</button>';
      slotR3.innerHTML = (practicePhase === 'completed') ? '<button class="square-btn" id="btn-record">比對</button>' : '';

      const btnMarkA = document.getElementById('btn-mark-a');
      if (btnMarkA) btnMarkA.addEventListener('click', handleMarkAClck);
      const btnMarkB = document.getElementById('btn-mark-b');
      if (btnMarkB) btnMarkB.addEventListener('click', handleMarkBClick);

      const btnSpeedDown = document.getElementById('btn-speed-down');
      if (btnSpeedDown) {
        btnSpeedDown.addEventListener('click', (e) => {
          e.stopPropagation();
          if (currentCoreMode === 'mode2') triggerMp4SpeedChange(-0.1); 
          else if (currentCoreMode === 'mode4') triggerCompareSpeedChange(-0.1);
          else triggerPdfSpeedChange(-0.1);
        });
      }

      const btnGendu = document.getElementById('btn-gendu');
      if (btnGendu) btnGendu.addEventListener('click', handleGenduClick);
      const btnZidu = document.getElementById('btn-zidu');
      if (btnZidu) btnZidu.addEventListener('click', handleZiduClick);
      const btnRecord = document.getElementById('btn-record');
      if (btnRecord) btnRecord.addEventListener('click', handleRecordModeClick);

      const btnSpeedUp = document.getElementById('btn-speed-up');
      if (btnSpeedUp) {
        btnSpeedUp.addEventListener('click', (e) => {
          e.stopPropagation();
          if (currentCoreMode === 'mode2') triggerMp4SpeedChange(+0.1); 
          else if (currentCoreMode === 'mode4') triggerCompareSpeedChange(+0.1);
          else triggerPdfSpeedChange(+0.1);
        });
      }
      updateModeButtonsStyle(); updateVisualDisplay();
    }

    function updateModeButtonsStyle() {
      const btnGendu = document.getElementById('btn-gendu');
      const btnZidu = document.getElementById('btn-zidu');
      const btnRecord = document.getElementById('btn-record');
      const colorBlack = '#000000', colorGreen = 'linear-gradient(135deg, #10B981 0%, #059669 100%)', colorPurple = 'linear-gradient(135deg, #9333EA 0%, #7E22CE 100%)';

      [btnGendu, btnZidu, btnRecord].forEach(btn => {
        if (btn) { btn.style.background = colorBlack; btn.style.borderColor = '#BAE6FD'; btn.style.color = '#FB923C'; btn.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.85)'; btn.classList.remove('recording-flashing'); }
      });

      if (btnGendu) {
        const isGenduActivePhase = (practicePhase === 'new_gendu' || practicePhase === 'cumulative_gendu' || practicePhase === 'completed');
        const isGenduPlaying = (currentCoreMode === 'mode2' && video && !video.paused);
        if (isGenduPlaying) {
          btnGendu.textContent = '跟著唸'; btnGendu.style.background = colorPurple; btnGendu.style.borderColor = '#E9D5FF'; btnGendu.style.color = '#FFFFFF'; btnGendu.style.boxShadow = '0 0 18px rgba(147, 51, 234, 0.9)';
        } else if (isGenduActivePhase) {
          btnGendu.textContent = '跟讀'; btnGendu.style.background = (currentCoreMode === 'mode2') ? colorGreen : colorBlack; btnGendu.style.borderColor = (currentCoreMode === 'mode2') ? '#A7F3D0' : '#BAE6FD'; btnGendu.style.color = (currentCoreMode === 'mode2') ? '#FFFFFF' : '#FB923C';
        }
      }

      if (btnZidu) {
        const isZiduActivePhase = (practicePhase === 'new_zidu' || practicePhase === 'cumulative_zidu' || practicePhase === 'completed');
        const isZiduRunning = (currentCoreMode === 'mode3' && isGuideActive);
        if (isZiduRunning) {
          btnZidu.textContent = '唸出聲'; btnZidu.style.background = colorPurple; btnZidu.style.borderColor = '#E9D5FF'; btnZidu.style.color = '#FFFFFF'; btnZidu.style.boxShadow = '0 0 18px rgba(147, 51, 234, 0.9)';
        } else if (isZiduActivePhase) {
          btnZidu.textContent = '自讀'; btnZidu.style.background = (currentCoreMode === 'mode3') ? colorGreen : colorBlack; btnZidu.style.borderColor = (currentCoreMode === 'mode3') ? '#A7F3D0' : '#BAE6FD'; btnZidu.style.color = (currentCoreMode === 'mode3') ? '#FFFFFF' : '#FB923C';
        }
      }

      if (btnRecord && practicePhase === 'completed' && currentCoreMode === 'mode4') {
        btnRecord.textContent = isUserRecording ? '錄音中' : '比對';
        btnRecord.style.background = isUserRecording ? colorPurple : colorGreen;
        btnRecord.style.borderColor = isUserRecording ? '#E9D5FF' : '#A7F3D0';
        btnRecord.style.color = '#FFFFFF';
        if (isUserRecording) btnRecord.classList.add('recording-flashing');
      }
    }

    function handleGenduClick() {
      triggerAppFullscreen();
      if (practicePhase !== 'completed' && practicePhase !== 'new_gendu' && practicePhase !== 'cumulative_gendu') {
        showToast("⚠️ 目前為自讀階段，請依照語音與紅點引導唸誦", 3000); return;
      }
      if (currentCoreMode !== 'mode2') { setCoreMode('mode2'); return; }
      
      if (video.paused) {
        const range = getActiveVideoRange();
        if (!range.valid) { showToast('⚠️ 秒數資料不完整，無法播放', 3000); return; }
        if (videoPausedAt >= range.start && videoPausedAt < range.end) { video.currentTime = videoPausedAt; }
        else if (video.currentTime < range.start || video.currentTime >= range.end) { video.currentTime = range.start; }
        video.play().then(() => { updateModeButtonsStyle(); startMp4PrecisionCheck(); saveCurrentAppState(); }).catch(() => {});
      } else {
        video.pause(); videoPausedAt = video.currentTime; updateModeButtonsStyle();
        showToast('❚❚ 已暫停在 ' + videoPausedAt.toFixed(1) + ' 秒', 3000); saveCurrentAppState();
      }
    }

    async function handleZiduClick() {
      triggerAppFullscreen();
      if (practicePhase !== 'completed' && practicePhase !== 'new_zidu' && practicePhase !== 'cumulative_zidu') {
        showToast("⚠️ 請先完成跟讀，系統將自動帶您進入自讀階段", 3000); return;
      }
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === 'suspended') await audioContext.resume();
      } catch (e) {}

      const micOk = await ensureMicrophoneActive();
      if (!micOk) { showToast("⚠️ 無法取得麥克風授權，請檢查瀏覽器設定", 3000); return; }

      if (currentCoreMode !== 'mode3') { setCoreMode('mode3'); return; }

      if (isGuideActive) {
        haltGuideRunnerImmediately(); saveCurrentAppState();
      } else {
        if (parsedTextLines.length === 0) { showToast("經文處理中，請稍候", 2000); return; }
        isGuideActive = true;
        if (cycleWaitTimer) { clearTimeout(cycleWaitTimer); cycleWaitTimer = null; }
        isVoiceActive = false; isTouchingDisplay = false; isTransitioningLine = false; hasPageFlipped = false; isLineHeadLocked = true;
        currentLineIndex = markA_Index !== -1 ? markA_Index : 0; currentCharIndexFloat = 0.0; lastVoiceTime = performance.now();
        startGuideRunner(); updateModeButtonsStyle(); saveCurrentAppState();
      }
    }

    async function handleRecordModeClick() {
      triggerAppFullscreen();
      if (practicePhase !== 'completed') { showToast("⚠️ 請先完成今日定課與串習後方可解鎖比對功能", 3000); return; }
      if (currentCoreMode !== 'mode4') {
        const micOk = await ensureMicrophoneActive();
        if (!micOk) { showToast("⚠️ 無法取得麥克風授權", 3000); return; }
        setCoreMode('mode4'); showToast('🎙️ 已切換至比對模式，再按一下開始錄音', 2500); return;
      }
      if (isUserRecording) {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isUserRecording = false; renderUI();
        setTimeout(() => { if (recordedAudioBlobUrl) { togglePlaybackAction(); showToast('▶️ 錄音完成，正在為您播放比對', 2500); } }, 200);
      } else {
        if (parsedTextLines.length === 0) { showToast("經文處理中，請稍等片刻", 2000); return; }
        toggleReliableRecordAction();
      }
    }

    function handleMarkAClck() {
      if (practicePhase !== 'completed') return;
      if (currentCoreMode !== 'mode3') setCoreMode('mode3');
      isSelectingMarkA = true; isSelectingMarkB = false;
      showToast("👆 請直接在畫面上點擊想要的句子設定起點", 4000); renderUI();
    }

    function handleMarkBClick() {
      if (practicePhase !== 'completed') return;
      if (currentCoreMode !== 'mode3') setCoreMode('mode3');
      isSelectingMarkB = true; isSelectingMarkA = false;
      showToast("👆 請直接在畫面上點擊想要的句子設定終點", 4000); renderUI();
    }

    let mp4PrecisionCheckAnimId = null;
    function startMp4PrecisionCheck() {
      if (mp4PrecisionCheckAnimId) cancelAnimationFrame(mp4PrecisionCheckAnimId);
      function check() {
        if (currentCoreMode === 'mode2' && !video.paused && !video.ended) {
          const range = getActiveVideoRange();
          if (range.valid && video.currentTime >= range.end) {
            video.pause(); video.currentTime = range.end; handleMp4CycleEnd(range); return;
          }
        }
        mp4PrecisionCheckAnimId = requestAnimationFrame(check);
      }
      mp4PrecisionCheckAnimId = requestAnimationFrame(check);
    }

    function handleCycleCompletion() {
      if (currentCoreMode === 'mode2') video.pause();
      else if (currentCoreMode === 'mode3') haltGuideRunnerImmediately();

      const settings = JSON.parse(localStorage.getItem(`USER_SCHEDULE_SETTINGS_V608_${CURRENT_CLASSIC_ID}`) || '{}');
      const newRepeat = settings.repeatNew || DEFAULT_REPEAT_NEW;
      const cRepeat = settings.repeatCum !== undefined ? settings.repeatCum : DEFAULT_REPEAT_CUMULATIVE;
      const hasCumulative = cRepeat > 0 && currentDayPlan.cStart && currentDayPlan.cEnd;

      currentCycleCount++;
      addCoins(calculateSentenceCount());

      if (practicePhase === 'new_gendu') {
        if (currentCycleCount < newRepeat) {
          showToast(`✅ 新進度跟讀完成第 ${currentCycleCount} 遍（共 ${newRepeat} 遍）`, 2000);
          setupStageRange(); const range = getActiveVideoRange(); if (range.valid) video.currentTime = range.start;
          setTimeout(() => { handleGenduClick(); }, 500);
        } else {
          practicePhase = 'new_zidu'; currentCycleCount = 0; setupStageRange(); setCoreMode('mode3');
          speakPrompt("請自己唸誦，如果不方便出聲可以直接把手指放螢幕也可以小紅點向前。");
          showToast("🎉 新進度跟讀圓滿！\n請自己唸誦，手指放螢幕小紅點即可向前", 5000);
          setTimeout(() => { handleZiduClick(); }, 1200);
        }
      } else if (practicePhase === 'new_zidu') {
        if (currentCycleCount < newRepeat) {
          showToast(`✅ 新進度自讀完成第 ${currentCycleCount} 遍（共 ${newRepeat} 遍）`, 2000);
          setupStageRange(); setTimeout(() => { handleZiduClick(); }, 500);
        } else {
          if (hasCumulative) {
            practicePhase = 'cumulative_gendu'; currentCycleCount = 0; setupStageRange(); setCoreMode('mode2');
            speakPrompt("新進度圓滿，準備進入串習複習跟讀");
            showToast("🎉 新進度圓滿！\n3秒後自動進入串習複習跟讀...", 4000);
            setTimeout(() => { const range = getActiveVideoRange(); if (range.valid) video.currentTime = range.start; handleGenduClick(); }, 3000);
          } else {
            practicePhase = 'completed'; renderUI(); triggerSevenColoredLotusFlowerRain();
            speakPrompt("今日定課已圓滿，功能已全部解鎖");
            showToast("🎉 今日定課已圓滿！\n左側已解鎖背書供養，右側已解鎖全功能自主複習與快慢調整", 6000);
          }
        }
      } else if (practicePhase === 'cumulative_gendu') {
        if (currentCycleCount < cRepeat) {
          showToast(`✅ 串習複習跟讀完成第 ${currentCycleCount} 遍（共 ${cRepeat} 遍）`, 2000);
          setupStageRange(); const range = getActiveVideoRange(); if (range.valid) video.currentTime = range.start;
          setTimeout(() => { handleGenduClick(); }, 500);
        } else {
          practicePhase = 'cumulative_zidu'; currentCycleCount = 0; setupStageRange(); setCoreMode('mode3');
          speakPrompt("請自己唸誦，如果不方便出聲可以直接把手指放螢幕也可以小紅點向前。");
          showToast("🎉 串習複習跟讀圓滿！\n請自己唸誦，手指放螢幕小紅點即可向前", 5000);
          setTimeout(() => { handleZiduClick(); }, 1200);
        }
      } else if (practicePhase === 'cumulative_zidu') {
        if (currentCycleCount < cRepeat) {
          showToast(`✅ 串習複習自讀完成第 ${currentCycleCount} 遍（共 ${cRepeat} 遍）`, 2000);
          setupStageRange(); setTimeout(() => { handleZiduClick(); }, 500);
        } else {
          practicePhase = 'completed'; renderUI(); triggerSevenColoredLotusFlowerRain();
          speakPrompt("今日串習與定課全部圓滿，功能已全部解鎖");
          showToast("🎉 今日串習與定課全部圓滿！\n左側已解鎖背書供養，右側已解鎖全功能自主複習與快慢調整", 6000);
        }
      }
      saveCurrentAppState();
    }

    function handleMp4CycleEnd(range) { videoPausedAt = -1; video.currentTime = range.start; handleCycleCompletion(); }

    function triggerSevenColoredLotusFlowerRain() {
      const canvas = document.getElementById('flowerCanvas'); if (!canvas) return;
      canvas.style.display = 'block'; const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const flowers = []; const lotusColors = ['#FF94B8', '#FFB300', '#F1F5F9', '#22C55E', '#C084FC', '#E11D48', '#3B82F6'];
      for (let i = 0; i < 70; i++) {
        flowers.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height, size: Math.random() * 10 + 10, speedY: Math.random() * 1.8 + 1.0, speedX: (Math.random() - 0.5) * 1.2, rotation: Math.random() * 360, rotationSpeed: (Math.random() - 0.5) * 2.5, color: lotusColors[Math.floor(Math.random() * lotusColors.length)], opacity: 0.94 });
      }
      let startTime = performance.now();
      function animateLotusRain(now) {
        let elapsed = now - startTime; ctx.clearRect(0, 0, canvas.width, canvas.height);
        flowers.forEach(f => {
          f.y += f.speedY; f.x += f.speedX + Math.sin(f.y / 45) * 0.7; f.rotation += f.rotationSpeed;
          ctx.save(); ctx.translate(f.x, f.y); ctx.rotate((f.rotation * Math.PI) / 180); ctx.globalAlpha = f.opacity;
          for (let j = 0; j < 5; j++) {
            const angle = (j * 2 * Math.PI) / 5; const dist = f.size * 0.40;
            ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, f.size * 0.42, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = (f.color === '#F1F5F9') ? '#FEF08A' : '#FFFFFF'; ctx.beginPath(); ctx.arc(0, 0, f.size * 0.30, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          if (f.y > canvas.height + 30) { f.y = -30; f.x = Math.random() * canvas.width; }
        });
        if (elapsed < 5800) { requestAnimationFrame(animateLotusRain); } else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.style.display = 'none'; }
      }
      requestAnimationFrame(animateLotusRain);
    }

    function renderMarkerLine(lineElement, lineObj) {
      if (!lineObj) return;
      const canvasRect = pdfCanvas.getBoundingClientRect();
      const scaleY = canvasRect.height / pdfCanvas.height;
      const scaleX = canvasRect.width / pdfCanvas.width;
      lineElement.style.top = (lineObj.underLineY * scaleY) + 'px';
      lineElement.style.left = (lineObj.x0 * scaleX) + 'px';
      lineElement.style.width = ((lineObj.x1 - lineObj.x0) * scaleX) + 'px';
      lineElement.style.display = 'block';
    }

    function updateVisualDisplay() {
      if (currentCoreMode === 'mode3' || currentCoreMode === 'mode4') {
        if (markA_Index !== -1 && parsedTextLines[markA_Index]) {
          const btnMarkADom = document.getElementById('btn-mark-a'); if (btnMarkADom) btnMarkADom.classList.add('active-mark');
          renderMarkerLine(markALine, parsedTextLines[markA_Index]);
        } else { markALine.style.display = 'none'; }

        if (markB_Index !== -1 && parsedTextLines[markB_Index]) {
          const btnMarkBDom = document.getElementById('btn-mark-b'); if (btnMarkBDom) btnMarkBDom.classList.add('active-mark');
          renderMarkerLine(markBLine, parsedTextLines[markB_Index]);
        } else { markBLine.style.display = 'none'; }
      }
      if (!isGuideActive && currentCoreMode === 'mode3') { guideLine.style.display = 'none'; redDot.style.display = 'none'; }
    }

    function getLineIndexAtClientPoint(clientX, clientY) {
      if (parsedTextLines.length === 0) return 0;
      let closestIdx = 0, minDiff = Infinity;
      const canvasRect = pdfCanvas.getBoundingClientRect();
      for (let i = 0; i < parsedTextLines.length; i++) {
        const line = parsedTextLines[i];
        const scaleY = canvasRect.height / pdfCanvas.height;
        const lineScreenY = canvasRect.top + (line.underLineY * scaleY);
        const diff = Math.abs(lineScreenY - clientY);
        if (diff < minDiff) { minDiff = diff; closestIdx = i; }
      }
      return closestIdx;
    }

    async function ensureMicrophoneActive() {
      if (micStream) return true;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === 'suspended') await audioContext.resume();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.04;
        source.connect(analyser);
        isCalibrating = true; calibrationSamples = [];
        setTimeout(() => {
          if (calibrationSamples.length > 0) {
            baseNoiseLevel = calibrationSamples.reduce((a, b) => a + b, 0) / calibrationSamples.length;
            dynamicThreshold = Math.max(0.0012, baseNoiseLevel * 1.05 + 0.0003);
          }
          isCalibrating = false;
        }, 350);
        lastVoiceTime = performance.now(); startSharedVadLoop(); return true;
      } catch (err) { return false; }
    }

    let vadDataArray = null;
    function startSharedVadLoop() {
      if (vadCheckTimer) return;
      vadDataArray = new Float32Array(analyser.frequencyBinCount);
      function loop() {
        if (currentCoreMode !== 'mode3' && currentCoreMode !== 'mode4') { vadCheckTimer = null; return; }
        if (analyser) {
          analyser.getFloatTimeDomainData(vadDataArray);
          let sumSquares = 0.0;
          for (let i = 0; i < vadDataArray.length; i++) { sumSquares += vadDataArray[i] * vadDataArray[i]; }
          const rms = Math.sqrt(sumSquares / vadDataArray.length);
          if (isCalibrating) calibrationSamples.push(rms);
          const deltaRms = rms - prevRms;
          const hasVoiceEnergy = (rms > dynamicThreshold) || isTouchingDisplay;
          if (hasVoiceEnergy) {
            lastVoiceTime = performance.now(); silentFrameCount = 0;
            if (!isVoiceActive && isGuideActive) { isVoiceActive = true; updateModeButtonsStyle(); }
          } else {
            silentFrameCount++;
            if (silentFrameCount >= 24 && isVoiceActive) { isVoiceActive = false; updateModeButtonsStyle(); }
          }
          if (isGuideActive) {
            if (isLineHeadLocked && (performance.now() - lineActivationTimestamp >= 120) && (deltaRms > (dynamicThreshold * 0.25) || isTouchingDisplay)) {
              isLineHeadLocked = false;
            }
            if (isTransitioningLine) {
              const elapsed = performance.now() - lineEndTime;
              if (elapsed > 40 && (deltaRms > (dynamicThreshold * 0.40) || isTouchingDisplay)) { proceedToNextLineImmediately(); }
              else if (elapsed >= 200) { proceedToNextLineImmediately(); }
            }
          }
          prevRms = rms;
        }
        vadCheckTimer = requestAnimationFrame(loop);
      }
      vadCheckTimer = requestAnimationFrame(loop);
    }

    async function toggleReliableRecordAction() {
      const ok = await ensureMicrophoneActive(); if (!ok) return;
      audioChunks = []; mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const recordedBlob = new Blob(audioChunks, mediaRecorder.mimeType ? { type: mediaRecorder.mimeType } : {});
        recordedAudioBlobUrl = URL.createObjectURL(recordedBlob);
        recordAudioElement.src = recordedAudioBlobUrl; recordAudioElement.playbackRate = compareSpeed; renderUI();
      };
      mediaRecorder.start(); isUserRecording = true; renderUI();
    }

    function togglePlaybackAction() {
      if (!recordedAudioBlobUrl) return;
      if (isGuideActive) haltGuideRunnerImmediately();
      if (recordAudioElement.paused) {
        recordAudioElement.playbackRate = compareSpeed; recordAudioElement.play().then(() => renderUI()).catch(() => {});
      } else { recordAudioElement.pause(); renderUI(); }
    }

    function handleOfferingClick() {
      document.getElementById('display-coins-count').textContent = (localStorage.getItem(`user_accumulated_coins_${CURRENT_CLASSIC_ID}`) || '0') + ' 枚';
      document.getElementById('input-class-id').value = localStorage.getItem('user_class_id') || '';
      document.getElementById('input-user-name').value = localStorage.getItem('user_profile_name') || '';
      document.getElementById('offering-modal-overlay').style.display = 'flex';
    }

    function getStoredCoins() { return parseInt(localStorage.getItem(`user_accumulated_coins_${CURRENT_CLASSIC_ID}`) || '0', 10); }
    function addCoins(amount) {
      const total = getStoredCoins() + amount;
      localStorage.setItem(`user_accumulated_coins_${CURRENT_CLASSIC_ID}`, total.toString());
      saveCurrentAppState(); return total;
    }
    function resetCoins() { localStorage.setItem(`user_accumulated_coins_${CURRENT_CLASSIC_ID}`, '0'); saveCurrentAppState(); }
    function calculateSentenceCount() {
      if (parsedTextLines.length === 0) return 1;
      const start = (markA_Index !== -1) ? markA_Index : 0;
      const end = (markB_Index !== -1) ? markB_Index : (parsedTextLines.length - 1);
      return Math.max(1, Math.abs(end - start) + 1);
    }

    btnCancelOffering.addEventListener('click', () => { offeringOverlay.style.display = 'none'; });

    function haltGuideRunnerImmediately() {
      isGuideActive = false;
      if (guideAnimId) { cancelAnimationFrame(guideAnimId); guideAnimId = null; }
      if (cycleWaitTimer) { clearTimeout(cycleWaitTimer); cycleWaitTimer = null; }
      guideLine.style.display = 'none'; redDot.style.display = 'none'; updateModeButtonsStyle();
    }

    function startGuideRunner() {
      if (parsedTextLines.length === 0) return;
      guideStage.style.height = Math.max(centerCore.scrollHeight, 2500) + 'px';
      scrollToAlignTop(currentLineIndex); setupActiveLine(currentLineIndex, currentCharIndexFloat);
      lastAnimTimestamp = performance.now();
      if (guideAnimId) cancelAnimationFrame(guideAnimId);
      guideAnimId = requestAnimationFrame(stepGuideMovement);
    }

    function scrollToAlignTop(idx) {
      if (isUserManualScrolling) return; 
      const line = parsedTextLines[idx];
      if (line) {
        const canvasRect = pdfCanvas.getBoundingClientRect();
        const displayTop = line.topGlobal * (canvasRect.height / pdfCanvas.height);
        centerCore.scrollTo({ top: Math.max(0, displayTop - 18), behavior: 'smooth' });
      }
    }

    function setupActiveLine(idx) {
      if (markB_Index !== -1 && idx > markB_Index) { handleCycleCompletion(); return; }
      if (idx >= parsedTextLines.length) { handleCycleCompletion(); return; }
      const line = parsedTextLines[idx];
      currentCharIndexFloat = 0.0; isLineHeadLocked = true; lineActivationTimestamp = performance.now();
      if (isGuideActive) {
        const canvasRect = pdfCanvas.getBoundingClientRect();
        const scaleY = canvasRect.height / pdfCanvas.height, scaleX = canvasRect.width / pdfCanvas.width;
        guideLine.style.top = (line.underLineY * scaleY) + 'px';
        guideLine.style.left = (line.x0 * scaleX) + 'px';
        guideLine.style.width = ((line.x1 - line.x0) * scaleX) + 'px';
        redDot.style.top = (line.underLineY * scaleY) + 'px';
        redDot.style.left = (line.x0 * scaleX) + 'px';
        guideLine.style.display = 'block'; redDot.style.display = 'block';
      }
      isTransitioningLine = false;
    }

    function stepGuideMovement(now) {
      if (!isGuideActive || isTransitioningLine) return;
      let delta = now - lastAnimTimestamp; if (delta <= 0 || delta > 120) delta = 16.6;
      lastAnimTimestamp = now;

      const curLine = parsedTextLines[currentLineIndex];
      const totalChars = (curLine && curLine.charItems) ? curLine.charItems.length : 10;

      if (isVoiceActive || isTouchingDisplay || (currentCharIndexFloat >= Math.max(1, totalChars - 2))) {
        const charPerMs = (2.8 * pdfSpeed) / 1000;
        if (isLineHeadLocked) {
          if (currentCharIndexFloat < 0.5) currentCharIndexFloat = Math.min(0.5, currentCharIndexFloat + charPerMs * delta);
        } else {
          currentCharIndexFloat += charPerMs * delta;
        }
        if (currentCharIndexFloat > totalChars) currentCharIndexFloat = totalChars;
      }

      if (currentCharIndexFloat >= totalChars) {
        currentCharIndexFloat = totalChars;
        if (guideAnimId) { cancelAnimationFrame(guideAnimId); guideAnimId = null; }
        if (markB_Index !== -1 && currentLineIndex >= markB_Index) { handleCycleCompletion(); return; }
        const nextIndex = currentLineIndex + 1;
        if (markB_Index !== -1 && nextIndex > markB_Index || nextIndex >= parsedTextLines.length) { handleCycleCompletion(); return; }
        isTransitioningLine = true; lineEndTime = performance.now(); peakRmsAtLineEnd = prevRms;
        guideLine.style.display = 'none'; return;
      }

      if (curLine) {
        const canvasRect = pdfCanvas.getBoundingClientRect();
        const scaleY = canvasRect.height / pdfCanvas.height, scaleX = canvasRect.width / pdfCanvas.width;
        let item = curLine.charItems[Math.min(totalChars - 1, Math.floor(currentCharIndexFloat))];
        if (item) redDot.style.left = ((item.x0 + (item.x1 - item.x0) * (currentCharIndexFloat - Math.floor(currentCharIndexFloat))) * scaleX) + 'px';
        redDot.style.top = (curLine.underLineY * scaleY) + 'px';
      }
      guideAnimId = requestAnimationFrame(stepGuideMovement);
    }

    function proceedToNextLineImmediately() {
      if (!isTransitioningLine || !isGuideActive) return;
      const nextIndex = currentLineIndex + 1;
      if (markB_Index !== -1 && nextIndex > markB_Index) { handleCycleCompletion(); return; }
      currentLineIndex = nextIndex; setupActiveLine(currentLineIndex);
      lastAnimTimestamp = performance.now(); guideAnimId = requestAnimationFrame(stepGuideMovement);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (/Line/i.test(navigator.userAgent)) { document.getElementById('line-browser-overlay').classList.add('active'); return; }
      checkDailyResetOnStartup();

      const shownToday = localStorage.getItem(`SCHEDULE_BTN_SHOWN_TODAY_V608_${CURRENT_CLASSIC_ID}`);
      if (!shownToday && btnCardSettingDynamic) btnCardSettingDynamic.style.display = 'inline-block';
      else if (btnCardSettingDynamic) btnCardSettingDynamic.style.display = 'none';

      let targetDay = 1;
      if (urlParams.get('start')) {
        const parts = urlParams.get('start').split('-');
        if (parts.length === 3) {
          const userStartDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const now = new Date();
          targetDay = Math.max(1, Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - userStartDate) / (1000 * 60 * 60 * 24)) + 1);
        }
      } else if (urlParams.get('day')) { targetDay = parseInt(urlParams.get('day'), 10) || 1; }
      localStorage.setItem(`CURRENT_SCHEDULE_DAY_V608_${CURRENT_CLASSIC_ID}`, targetDay.toString());

      document.getElementById('companion-img-display').src = 'cards/' + ((targetDay >= 22) ? "card_021.webp" : ('card_' + String(targetDay).padStart(3, "0") + '.webp'));
      document.getElementById('companion-overlay').style.display = 'flex';
      document.getElementById('companion-overlay').classList.add('active');
      handleOrientationCheck();
    });
  </script>
</body>
