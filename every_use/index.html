  <!-- 動態文字容器 (帶有紅色虛線偵錯框) -->
  <div class="card-text-container" id="textContainer">
    <div class="card-title" id="cardTitle">載入中...</div>
    <div class="card-content" id="cardContent">請稍候，正在讀取外部資料...</div>
  </div>

  <div class="companion-actions-row">
    <button id="btn-card-setting-dynamic" class="btn-card-setting" onclick="openScheduleModal()" style="display: none;">⚙️ 排程設定</button>
    <button class="btn-card-orange" onclick="playTeacherGuideAndRecite()">老師帶前行</button>
    <button class="btn-card-orange" onclick="closeCompanionCard()">開始背誦</button>
    <button id="btn-card-days" class="btn-card-setting" style="display: none; background: linear-gradient(135deg, #FEF08A 0%, #F59E0B 100%); color: #78350F; border: 1.5px solid #D97706; cursor: pointer;" onclick="handleDayBtnClick()">堅持第 22 天</button>
  </div>
</div>


  <div class="schedule-grid-layout">
    <div class="schedule-field-row">
      <span class="schedule-field-label">經典總句數 / 已學：</span>
      <div style="display: flex; gap: 4px; align-items: center;">
        <div id="display-total-sentences" class="schedule-field-readonly">37句</div>
        <input type="number" id="input-completed-sentences" class="schedule-field-input" min="0" max="37" readonly style="width: 75px; background: #1E293B; color: #94A3B8; border-color: #475569;">
      </div>
    </div>

    <div class="schedule-field-row">
      <span class="schedule-field-label">每日推進步幅：</span>
      <div class="step-btn-group">
        <button type="button" class="step-btn" data-step="1" onclick="selectDailyStep(1)">1句</button>
        <button type="button" class="step-btn" data-step="2" onclick="selectDailyStep(2)">2句</button>
        <button type="button" class="step-btn active" data-step="4" onclick="selectDailyStep(4)">4句</button>
      </div>
    </div>

    <div class="schedule-field-row">
      <span class="schedule-field-label">定課預設遍數：</span>
      <input type="number" id="input-repeat-new" class="schedule-field-input" min="1" max="50" oninput="previewScheduleChanges()">
    </div>
    <div class="schedule-field-row">
      <span class="schedule-field-label">串習預設遍數：</span>
      <input type="number" id="input-repeat-cum" class="schedule-field-input" min="0" max="50" oninput="previewScheduleChanges()">
    </div>
  </div>

  <div class="schedule-preview-single">
    <div class="schedule-preview-title">✨ 滾雪球串習排程預覽 (今天起接續)</div>
    <div id="preview-new-list" class="schedule-preview-list">計算中...</div>
  </div>

  <div class="schedule-modal-actions">
    <button id="btn-close-schedule" class="btn-sched-action" onclick="closeScheduleModal()">取消</button>
    <button id="btn-save-schedule" class="btn-sched-action" onclick="saveAndApplySchedule()">確認更新排程</button>
  </div>
</div>


<div id="center-core">
  <div id="guide-stage">
    <div id="mark-a-line"></div>
    <div id="mark-b-line"></div>
    <div id="guide-line"></div>
    <div id="red-dot"></div>
  </div>

  <div id="pdf-container-wrap">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <div id="video-container-wrap">
    <video id="my-chant-video" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
  </div>
</div>

<div class="side-wing" id="right-wing">
  <div class="slot" id="slot-r1"></div>
  <div class="slot" id="slot-r2"></div>
  <div class="slot" id="slot-r3"></div>
  <div class="slot" id="slot-r4"></div>
</div>
