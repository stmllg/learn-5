<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>歡喜背書V942</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #0B0F19;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        #portrait-blocker-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, #1E293B 0%, #080D1A 100%);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            pointer-events: all;
            box-sizing: border-box;
            gap: 16px;
        }

        .rotate-phone-icon {
            width: 62px; height: 100px;
            border: 3px solid #F59E0B;
            border-radius: 12px;
            position: relative;
            margin-bottom: 8px;
            animation: rotatePhoneAnim 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
            flex-shrink: 0;
        }
        .rotate-phone-icon::after {
            content: '';
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 9px; height: 9px; border-radius: 50%;
            background: #F59E0B;
        }

        @keyframes rotatePhoneAnim {
            0%   { transform: rotate(0deg); }
            35%  { transform: rotate(-90deg); }
            70%  { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        .rotate-hint-title { font-size: 25px; font-weight: 900; color: #FBBF24; letter-spacing: 2px; }
        .rotate-hint-subtitle { font-size: 16px; color: #CBD5E1; letter-spacing: 1.5px; line-height: 1.6; }

        .landscape-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #0B0F19;
            position: relative;
        }

        .card-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: calc(100dvh * (1200 / 675));
            max-height: calc(100vw * (675 / 1200));
            aspect-ratio: 1200 / 675;
            background-color: #0F172A;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 16px 45px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 2px solid #38BDF8;
            border-radius: 12px;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        .card-stage.fade-out { opacity: 0; }

        /* 將綠色徽章從右上移至右下（按鈕上方附近） */
        .bottom-right-badge {
            position: absolute;
            bottom: 15%;
            right: 5%;
            color: #10B981;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
            z-index: 40;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* 核心防護：固定比例與紅框邊界 (左 29%, 右 5%)，並將頂部上移 (top: 2.5%) */
        .card-text-container {
            position: absolute;
            top: 2.5%;
            bottom: 16%;
            left: 29%;
            right: 5%;
            display: block;
            overflow: hidden;
            border: 1.5px dashed rgba(239, 68, 68, 0.9);
            background: rgba(254, 243, 199, 0.08);
        }

        .card-title {
            font-weight: 900;
            color: #581C87;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95);
            width: 100%;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .card-content {
            font-weight: 800;
            color: #0F172A;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95);
        }

        .actions-bar {
            position: absolute;
            bottom: 2%;
            left: 5%;
            right: 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 30;
        }
        .actions-bar button {
            flex: 0 1 auto;
            min-width: 120px;
            padding: 10px 22px;
            text-align: center;
            font-size: clamp(14px, 2.2vh, 18px);
            font-weight: 900;
            border-radius: 26px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            border: 1.5px solid #F97316;
            background: linear-gradient(135deg, #FFEDD5 0%, #FDBA74 100%);
            color: #431407;
        }
    </style>
</head>
<body>

    <div id="portrait-blocker-overlay">
        <div class="rotate-phone-icon"></div>
        <div class="rotate-hint-title">請將手機橫放</div>
        <div class="rotate-hint-subtitle">靜心進入經文天地 ｜ 以獲最佳誦讀視野</div>
    </div>

    <div class="landscape-container">
        <div class="card-stage" id="cardStage">
            <div class="bottom-right-badge" id="bottomRightBadge">載入中...</div>

            <div class="card-text-container" id="textContainer">
                <div class="card-title" id="cardTitle">載入中...</div>
                <div class="card-content" id="cardContent">請稍候，正在讀取外部資料...</div>
            </div>

            <div class="actions-bar">
                <button onclick="updateRandomDisplay()">切換下一張</button>
            </div>
        </div>
    </div>

<script>
    let cardTexts = {};
    let textKeys = [];
    let randomTextKey = "";

    function handleOrientationCheck() {
        const blocker = document.getElementById('portrait-blocker-overlay');
        if (!blocker) return;
        blocker.style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
    }

    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', () => { setTimeout(handleOrientationCheck, 150); });

    function updateRandomDisplay() {
        if (textKeys.length === 0) return;
        const cardStage = document.getElementById('cardStage');
        cardStage.classList.add('fade-out');

        setTimeout(() => {
            const randomImgNum = Math.floor(Math.random() * 40) + 1;
            const paddedImgNum = String(randomImgNum).padStart(2, '0');
            cardStage.style.backgroundImage = `url('images/bg_${paddedImgNum}.webp')`;

            randomTextKey = textKeys[Math.floor(Math.random() * textKeys.length)];
            const selectedData = cardTexts[randomTextKey];

            const cardTitle = document.getElementById('cardTitle');
            const cardContent = document.getElementById('cardContent');
            const textContainer = document.getElementById('textContainer');
            const bottomRightBadge = document.getElementById('bottomRightBadge');

            cardTitle.textContent = selectedData.title;
            cardContent.textContent = selectedData.content;
            const totalChars = selectedData.title.length + selectedData.content.length;

            // 鎖定穩定容器高度基準 (cH)
            const stageHeight = cardStage.clientHeight || window.innerHeight;
            const cH = stageHeight * 0.815; // 因為 top 改為 2.5%，可用高度稍微增加
            const maxH = cH - 12; // 嚴格保留 12px 底部緩衝空間

            // ==========================================
            // 💡 最佳字體範圍：33px 到 20px
            // ==========================================
            let size = 33;
            const minSize = 20;

            cardContent.style.fontSize = size + "px";
            cardTitle.style.fontSize = (size + 2) + "px";

            let tH = cardTitle.offsetHeight + cardContent.offsetHeight;

            // 往下縮減迴圈，直到符合高度限制或達到 20px 下限
            while (tH > maxH && size > minSize) {
                size--;
                cardContent.style.fontSize = size + "px";
                cardTitle.style.fontSize = (size + 2) + "px";
                tH = cardTitle.offsetHeight + cardContent.offsetHeight;
            }

            // 取得該筆資料的完整 ID（例如 "希望新生-四季法語001"）
            const displayId = selectedData.id || randomTextKey;

            // 右下角顯示精確的 id 與調試參數
            bottomRightBadge.textContent = `${displayId} | cH:${Math.round(cH)} tH:${Math.round(tH)} sz:${size}px (${totalChars}字)`;

            cardStage.classList.remove('fade-out');
        }, 300);
    }

    fetch('images_text.json')
        .then(res => res.json())
        .then(data => {
            cardTexts = data;
            textKeys = Object.keys(cardTexts);
            updateRandomDisplay();
        })
        .catch(err => {
            document.getElementById('cardTitle').textContent = "資料載入失敗";
            document.getElementById('cardContent').textContent = "請檢查 images_text.json";
        });

    window.addEventListener('DOMContentLoaded', () => {
        handleOrientationCheck();
    });
</script>

</body>
</html>
