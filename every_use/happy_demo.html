    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #0B0F19;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        #portrait-blocker-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            background: radial-gradient(circle at center, #1E293B 0%, #080D1A 100%);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            pointer-events: all;
            box-sizing: border-box;
            gap: 16px;
        }

        .rotate-phone-icon {
            width: 62px; height: 100px;
            border: 3px solid #F59E0B;
            border-radius: 12px;
            position: relative;
            margin-bottom: 8px;
            animation: rotatePhoneAnim 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
            flex-shrink: 0;
        }
        .rotate-phone-icon::after {
            content: '';
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 9px; height: 9px; border-radius: 50%;
            background: #F59E0B;
        }

        @keyframes rotatePhoneAnim {
            0%   { transform: rotate(0deg); }
            35%  { transform: rotate(-90deg); }
            70%  { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        .rotate-hint-title { font-size: 25px; font-weight: 900; color: #FBBF24; letter-spacing: 2px; }
        .rotate-hint-subtitle { font-size: 16px; color: #CBD5E1; letter-spacing: 1.5px; line-height: 1.6; }

        .landscape-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #0B0F19;
            position: relative;
        }

        .card-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: calc(100dvh * (1200 / 675));
            max-height: calc(100vw * (675 / 1200));
            aspect-ratio: 1200 / 675;
            background-color: #0F172A;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 16px 45px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 2px solid #38BDF8;
            border-radius: 12px;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        .card-stage.fade-out { opacity: 0; }

        /* 右下角綠色字：無背景、無黑框、靠右切齊文字框右邊緣 (right: 5%)、bottom: 22% 避開按鍵，會完整顯示在截圖中 */
        .bottom-right-badge {
            position: absolute;
            bottom: 22%;
            right: 5%;
            color: #10B981;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.5px;
            z-index: 40;
            pointer-events: none;
            background: transparent;
            border: none;
            padding: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 核心文字容器：無邊框，上移至 top: 2.5% */
        .card-text-container {
            position: absolute;
            top: 2.5%;
            bottom: 16%;
            left: 29%;
            right: 5%;
            display: block;
            overflow: hidden;
            border: none;
            background: transparent;
        }

        .card-title {
            font-weight: 900;
            color: #581C87;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95);
            width: 100%;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .card-content {
            font-weight: 800;
            color: #0F172A;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95);
        }

        .actions-bar {
            position: absolute;
            bottom: 2%;
            left: 5%;
            right: 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 30;
        }
        .actions-bar button {
            flex: 1;
            max-width: 180px;
            padding: 10px 14px;
            text-align: center;
            font-size: clamp(13px, 2vh, 16px);
            font-weight: 900;
            border-radius: 26px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);

            border: 1.5px solid #F97316;
            background: linear-gradient(135deg, #FFEDD5 0%, #FDBA74 100%);
            color: #431407;
            white-space: nowrap;

        /* LINE 按鈕特殊配色 */

            border: 1.5px solid #059669 !important;
            background: linear-gradient(135deg, #D1FAE5 0%, #34D399 100%) !important;
            color: #064E3B !important;
        }
    </style>
</head>

    "id": "希望新生-四季法語034",
    "title": "高舉溝通的火把",
    "content": "要成就一個和合的團隊，不花血本的代價是得不到的。浪費那麼多時間憂悲苦惱，還不如在這輪迴的黑夜裡高舉溝通的火把，靜下心來傾聽，先去了解別人，才能把對立的狀況消融，建立溝通。而消融對立狀態的最佳武器是什麼？慈悲的心。"
  },
  "034": {
    "id": "希望新生-四季法語035",
    "title": "創造世上的溫暖",
    "content": "當許多善良、正直的人聚在一起相互幫忙，也去幫忙那些甚至是素不相識的人，就會在這個世界上創造一股溫暖的氣息。如花般的暖意，就在世上盛開。"
  },
  "035": {
    "id": "希望新生-四季法語036",
    "title": "切莫辜負好時光",
    "content": "好時光是什麼時候？就是在痛苦的時候！因為那是可以為這個世界創造美好價值的時刻，千萬不要讓心白白地受苦。能讓我們體諒他人，給這個社會更美好的回饋，這都是痛苦的價值。因為我受過那個苦了，我知道受苦的人有多痛，所以我要去幫他。"
  },
  "036": {
    "id": "希望新生-四季法語037",
    "title": "體會他人的真心",
    "content": "站在他人的角度上考慮，體諒他人的用心，想一想他為我做了什麼。雖然他為你做的那些事情可能你看不上眼，但他是出自真心為你做的。"
  },
  "037": {
    "id": "希望新生-四季法語038",
    "title": "習慣是練出來的",
    "content": "以自我為中心的這個習慣是練出來的，以他人為中心的習慣同樣是練出來的，關鍵是我們要了解其中的苦樂差別，心甘情願向以他人為中心的方向發展。"
  },
  "038": {
    "id": "希望新生-四季法語039",
    "title": "來生高貴之因",
    "content": "用自己的身語意能夠承事一個眾生，讓他得到一點快樂，這也是我們身為人能夠行善的本錢。為什麼會願意在眾人之中很虛心地承事所有的人，恭敬大眾，端茶倒水，像個僕人一樣呢？這就是我們來生會非常高貴的因啊！"
  },
  "039": {
    "id": "希望新生-四季法語040",
    "title": "細品每個人的心",
    "content": "有些人心中的美好，需要細細地品很久才能品出來，因為可能他不會或不願表達自己，可能他顯現出來的都只是他的弱點。如何真正地認識一個人，其實不是一件容易的事情，有時要花很長的時間，才能品味到他人心中的精美。"
  },
  "040": {
    "id": "希望新生-四季法語041",
    "title": "當個種花人吧",
    "content": "想要幫忙別人，想要成就別人的心，如種花人，且行且種，且種且行。雖然耕耘時，僅有路邊林下那不起眼的黑土，可一日春來，你再且行且看，那竟成——十里長堤滿眼花開。"
  },
  "041": {
    "id": "希望新生-四季法語042",
    "title": "發心與回饋",
    "content": "如果，我們供養的發心，像水晶一樣的清澈透明，折射利他的七彩慈光；那麼，將來的回饋也會是純淨光明的。純淨的回饋是什麼？就是只有「樂」，沒有苦痛與煩惱。"
  },
  "042": {
    "id": "希望新生-四季法語043",
    "title": "菩提心的利益",
    "content": "如果能夠生起對家庭、對社會、對全人類的責任感，甚至擴展到對所有生命界的慈悲心，或者希望造福一切有情的菩提心，這樣走到每一個地方，就會非常容易發現人們的美好，然後把這份美好傳遞出去。"
  },
  "043": {
    "id": "希望新生-四季法語044",
    "title": "成佛是究竟之路",
    "content": "要想自他究竟離苦得樂，沒有其他辦法，只有一條路――成佛吧！"
  },
  "044": {
    "id": "希望新生-四季法語045",
    "title": "由實踐生淨信",
    "content": "「供養三寶能生功德」這件事，是很多佛菩薩、祖師所承許的，我們可以一邊觀察抉擇、一邊供養，譬如供一盞燈、供一杯水、禮佛一拜……，一點一點去做，必須用我們的心去實踐了，淨信才會在心續中生長得非常堅固。"
  },
  "045": {
    "id": "希望新生-四季法語046",
    "title": "戰勝自己的喜悅",
    "content": "你很喜歡的一個小東西，當有一天決心把它供養出去的時候，獲得的歡喜心是什麼呢？就是戰勝了自己。當一想到這件事就會覺得：哇！今天做了一件非常棒的事情，我戰勝了自己一次！"
  },
  "046": {
    "id": "希望新生-四季法語047",
    "title": "心靈的力量",
    "content": "不要認為觀想供佛、請佛住世沒有功德，這樣的觀想有時比實際供養功德還大。千萬不要忽略心靈的力量！"
  },
  "047": {
    "id": "希望新生-四季法語048",
    "title": "普願眾生離苦得樂",
    "content": "在拜佛時可以發一個心：「願遍法界、盡虛空界，一切如母有情究竟離苦得樂這件事，全部荷擔在我的肩上。是為了令自他都能夠皈依佛、成就佛果這個目標，我來禮敬佛。」"
  },
  "048": {
    "id": "希望新生-四季法語049",
    "title": "敞開心胸接納",
    "content": "有時我們會覺得自己是世上最痛苦的人，但實際上有很多人遠比自己更痛苦，需要我們去關心。當我們敞開心胸，接納各種不同的人，不論他行走在你前面或後面，地位比你高或低，都能從內心深處隨喜他人的進步，也悲憫他人，積極勇悍地去除他人的痛苦。隨著我們心裡容納的人越來越多，自己的痛苦就越來越小。"
  },
  "049": {
    "id": "希望新生-四季法語050",
    "title": "放掉自我心自遼闊",
    "content": "懷著一顆坦蕩的心走向每一個人，那是完全利益他的心，一點也不期待從他身上索取什麼，你會在這個過程中體會到很多法味。那種莊嚴是放掉了自我，把生命投注在廣大的利他事業中所體會到的遼闊感。"
  },
  "050": {
    "id": "希望新生-四季法語051",
    "title": "可以一萬次被拒絕",
    "content": "如果把這顆利他的心，訓練得越來越皎潔、越來越堅定、越來越純粹――只是為了你能快樂，那就可以非常坦蕩地向前走。我可以一萬次地走向你、被你一萬次拒絕，第一萬零一次我又來了。過失不在你，是我還沒有找到不被你拒絕的方法啊！"
  },
  "051": {
    "id": "希望新生-四季法語052",
    "title": "病苦時心的轉機",
    "content": "當頭痛的時候，也可以觀想：「願盡法界、遍虛空一切如母有情的頭痛，全部都成熟在我身上，就讓這個業消除吧！」這樣想一下，頭還是在痛，但是心裡很快樂，這種感覺是很真實的！你會開始沒有那麼討厭病苦，因爲它帶給自己的心ㄧ種轉機，不再那麼執著身體上的痛苦。"
  },
  "052": {
    "id": "希望新生-四季法語053",
    "title": "緣他有情能離苦",
    "content": "在最痛苦、最喘不過氣來、最難受的時候想ㄧ下：啊！如果所有有情這種令人窒息的痛苦，就在此刻都用我的痛苦把它消融，那是多麽美好的一件事情！其實這樣想ㄧ想，自己的痛苦也會降低。為什麼呢？因爲很多痛苦都源於我愛執，一旦轉為緣到其他有情的時候，這個痛苦真的就會在現象界馬上減低了。"
  },
  "053": {
    "id": "希望新生-四季法語054",
    "title": "別讓難題收拾你",
    "content": "當感覺到一個問題卡了你太久的時候，要記住對佛菩薩祈求，然後要勤行懺悔、服務大眾集資糧，資糧夠了的時候你就會超越。所以要想辦法收拾難題，不要讓難題收拾你。"
  },
  "054": {
    "id": "希望新生-四季法語055",
    "title": "送一切有情禮物",
    "content": "唸一句「嗡嘛呢唄咪吽」，心裡是為所有的人唸的，會感覺好像每個人都收到了自己的禮物。有時坐在房間裡也可以送一切有情禮物，就在那個瞬間，跟別人內心的通道全部都打開了，不會覺得自己跟別人好像有層層阻隔。"
  },
  "055": {
    "id": "希望新生-四季法語056",
    "title": "大慈悲心平等無別",
    "content": "佛陀所宣說的真理，是無論對行善的、作惡的都要生起慈悲的心，要讓行善的繼續增廣善業，也要讓作惡的盡量減少惡業，用大慈悲心平等地饒益一切有情。"
  },
  "056": {
    "id": "希望新生-四季法語057",
    "title": "老師的真義",
    "content": "老師是什麼？就是在黑暗的時候，做我們的光明；孤獨的時候，是我們的朋友；在迷惘的時候，引領我們了知抉擇取捨。"
  },
  "057": {
    "id": "希望新生-四季法語058",
    "title": "寬廣如大海的心胸",
    "content": "一旦把自己對他人的責任感，擴展到越來越大、越來越大時，就會感覺到自己的心胸像大海、如天空那樣寬廣。那將是生命一種什麼樣的壯闊感，我們此生願不願意去領略它呢？"
  },
  "058": {
    "id": "希望新生-四季法語059",
    "title": "改變身心傳遞佛法",
    "content": "用你改變了的身心，用你純淳的善意，去為他人著想，而交到很多好朋友，佛法的傳播過程就是這樣。"
  },
  "059": {
    "id": "希望新生-四季法語060",
    "title": "善友相伴的美好",
    "content": "不管遭遇多少艱難，不管少年、中年、老年會有怎樣的孤獨，因為有很多善友在一起相互分擔、相互扶持，人生就會在美好中度過。"
  },
  "060": {
    "id": "希望新生-四季法語061",
    "title": "生命何其單純和美好",
    "content": "用最真摯、無染、純粹的心，想讓周遭的人快樂，如果從生到死就這一件事，生生世世就這一件事，那麼生命何其單純、何其美好！"
  },
  "061": {
    "id": "希望新生-四季法語062",
    "title": "一個樸素的願望",
    "content": "好好珍惜你面對的那個人，希望他的生命因為有你在他身邊，多一些快樂，少一些憂悲苦惱；因為有你一起承受著生命的苦難，他會過得好一些。就是這樣很簡單、很樸素的希望──凡是遇到我的人，我都想讓他更快樂一些，我要努力地為別人生命的離苦得樂奉獻自己。"
  },
  "062": {
    "id": "希望新生-四季法語063",
    "title": "和平從家庭做起",
    "content": "祈願世界和平，從哪兒做起？從家裡和平做起。多說幾句退讓的話，多說幾句感恩的話，大家的日子就會好過多了。"
  },
  "063": {
    "id": "希望新生-四季法語064",
    "title": "快樂從理解他人開始",
    "content": "理解別人真的會快樂嗎？那你試試吧！與其要求別人理解你，不如你去理解別人。快樂之道就這麼簡單，因為這樣做心就越來越寬，快樂就會越來越多了。"
  },
  "064": {
    "id": "希望新生-四季法語065",
    "title": "理解別人很容易",
    "content": "很多人覺得理解很難，其實很容易。當你不再只是想得到自己要的東西，願意忽略自己的感覺，認真地去傾聽別人的問題時，你會非常容易理解他。為什麼？因為在那個當下，自己已經不重要了，你就比較能聽明白別人的問題。"
  },
  "065": {
    "id": "希望新生-四季法語066",
    "title": "輪迴黑夜中的明月",
    "content": "輪迴的黑夜，有多少的恐怖和孤單，但有佛法明月光輝的照耀，我們得以生起勇悍和慈悲，去撫慰那些在黑暗中身心痛苦的人。"
  },
  "066": {
    "id": "希望新生-四季法語067",
    "title": "心中常念他人需",
    "content": "常常去想一想：此時此刻會不會有比我更苦的人，我能夠給予他什麼？想一想：我周邊的人心中在想什麼，我是否可以關注他什麼？"
  },
  "067": {
    "id": "希望新生-四季法語068",
    "title": "看到更多可愛的心",
    "content": "像月亮一樣皎潔的教法光輝，會讓我們不是只看著自己的影子，會開始學習看到愈來愈多的生命，生動地活在自己的周圍──那一顆一顆的心，有的時候比自己的心更有趣，更值得關注，可能還要可愛很多倍呢！"
  },
  "068": {
    "id": "希望新生-四季法語069",
    "title": "慈悲的大海水",
    "content": "你發你的火，我發我的慈悲，我用慈悲的水滅你瞋恨的火，看誰能打過誰。你堅持你的憤怒、我堅持我的慈悲，憤怒是你的火焰山，慈悲就是我的大海水。"
  },
  "069": {
    "id": "希望新生-四季法語070",
    "title": "非凡的力量",
    "content": "我一定要堅持慈悲心，絕對不捨棄；要一直堅持對你好，永遠不退。慈悲比瞋恨、比怒火更有力量，能把一切隔閡都迅速消融，它像水一樣柔和，可是卻力量非凡。"
  },
  "070": {
    "id": "希望新生-四季法語071",
    "title": "善觀緣起的道理",
    "content": "你要跟一個非常飢餓的人講道理，必須先給他一碗飯，有時候甚至讓他洗個澡、好好睡個覺，清醒一點之後，才把道理講給他聽。這就是所謂的善觀緣起，要先觀察他所關心的事情是什麼。"
  },
  "071": {
    "id": "希望新生-四季法語072",
    "title": "養成關注他人的習氣",
    "content": "隨手做善行，隨時關注別人，關注久了之後，慢慢你就會有一種習氣，好像也不用費太大的力氣，就能了解別人需要什麼。"
  },
  "072": {
    "id": "希望新生-四季法語073",
    "title": "純淨利他心的力量",
    "content": "當我們心裡非常純淨地為他人的時候，就會有無比的勇氣；一旦夾雜著以我為出發點、以自我為中心的思路，自己的力量就不能發揮到極致，因為「我」終歸在那裡作祟。"
  },
  "073": {
    "id": "希望新生-四季法語074",
    "title": "見到一無是處中的陽光",
    "content": "學習佛法的人要運用智慧，善於從非常複雜、看來一無是處的事相之中，找到可以把它蛻變成非常積極和陽光的思路，這是內心上的工夫。"
  },
  "074": {
    "id": "希望新生-四季法語075",
    "title": "念念皆善自無憂",
    "content": "每日行一善、十善，到最後熟練了就隨手都是善、念念都是善。如果眼神看出去都是善、嘴邊說出去都是善，那還愁來生嗎？來生肯定在善趣！因為念念全變成善的，怎麼可能它的果報會在惡趣呢？"
  },
  "075": {
    "id": "希望新生-四季法語076",
    "title": "布施愛語暖人心",
    "content": "語言有表情嗎？我講了，你聽了，會笑、會溫暖、會行善、會被鼓勵的，那是愛語的力量嗎？化愁苦為歡顏，化沮喪為振奮，化麻木為感動，是愛語的力量嗎？當我用微笑、柔和的眼神，對你表達我真摯的感恩，你的心會為此而充滿暖意嗎？願我的愛語如花，在你的心中綻放，香飄人間。"
  },
  "076": {
    "id": "希望新生-四季法語077",
    "title": "讓自我靠邊站",
    "content": "當發自內心地把他人放在很重要的地位，讓自己慢慢靠邊、靠邊，只剩下一個小小的角落，到最後可能連角落也沒有了，全部是以眾生為自己生命的核心，這樣苦惱就會降到最低，就會非常地快樂！"
  },
  "077": {
    "id": "希望新生-四季法語078",
    "title": "視眾生為獨一愛子",
    "content": "佛菩薩視眾生為獨一愛子。能把這麼多有情捧在自己的心上，如此細微地觀察著他們的需求和痛苦，找到切實可行的辦法援助每個人，這是一件非常不可思議的事情。"
  },
  "078": {
    "id": "希望新生-四季法語079",
    "title": "珍貴的善念種",
    "content": "發誓永遠做一個善人，不管遇到多麼強烈逼惱的境界，都不讓自己惡心萌發，保護著內心這個像光明、像燈火一樣的善種子，這是多麼珍貴的善心。"
  },
  "079": {
    "id": "希望新生-四季法語080",
    "title": "苦樂皆由業所生",
    "content": "要堅定地朝造善業的方向努力，朝止息惡業的地方撐持，因為所有樂皆由善業生，所有苦皆由惡業生，這是業果不變的法則。"
  },
  "080": {
    "id": "希望新生-四季法語081",
    "title": "也許我還是幸運的",
    "content": "只要我們留心他人的生活狀態，就會發現：也許我還是幸運的！看到很多人非常痛苦，他的精神、身體、家庭關係等等，可能在某種程度上已經是極限運作。那麼為什麼不把我的一點點關懷貢獻給他呢？"
  },
  "081": {
    "id": "希望新生-四季法語082",
    "title": "因果的法則",
    "content": "如果一直非常熱忱地去布施他人快樂、給予力量，有一天那力量就會從遠方、從近處，乃至從一個你從來沒有注意到的地方回來，這就是因果！"
  },
  "082": {
    "id": "希望新生-四季法語083",
    "title": "淨罪集資的真義",
    "content": "佛陀告訴我們斷惡修善的法，要照著去做！透過不斷地學習、實踐的過程，將以前錯誤的認知跟習慣逐漸地改過來，這個部分叫「淨罪」；從現在開始慢慢地了解如何行善，養成行善的習氣，叫作「集資」。如果我們現在就在淨罪集資的路上，即是正在離苦得樂的行進中！應該由衷地為自己感到高興，想一想，佛陀應該也會為此感到很歡喜吧！"
  },
  "083": {
    "id": "希望新生-四季法語084",
    "title": "讓善永不竭盡",
    "content": "我們在這個世界上所做的善行，即使好像只是一滴水，那麼微不足道，可是一旦把它匯歸到「進趣無上菩提」的汪洋大海時，這些善就會永無竭盡。"
  },
  "084": {
    "id": "希望新生-四季法語085",
    "title": "點滴善行成美德",
    "content": "不要期待自己一開始就全部做得很好，因為這根本不現實。透過一段時間努力，我們的生命能比過去有所改善，這就很難得了!朝著一個光明的方向在改善，哪怕只有一點點，也是多少汗水與淚水換來的，可別小看啊!善行一點一點累積，到最後就會成就內心珍貴的美德。"
  },
  "085": {
    "id": "希望新生-四季法語086",
    "title": "堅持最可貴",
    "content": "在自己的起點上，能學多快就多快，慢也不必苦惱。這樣老老實實一步一腳印地走，即使你學得最末，能始終不退，這種堅持的精神也是最為稀貴的，定會成功。"
  },
  "086": {
    "id": "希望新生-四季法語087",
    "title": "財富由布施來",
    "content": "今生的財富從哪裡來？經典上寫得非常清楚，是從布施、供養這些善業來的。當然也有人說：「是我辛苦掙的。」那為什麼有人千辛萬苦也掙不到錢，有人就能掙到錢呢?要相信佛所說的──財富是從布施來的!"
  },
  "087": {
    "id": "希望新生-四季法語088",
    "title": "幸福的依靠",
    "content": "善心是我們幸福的依靠；不是對方給你多少理解、給你多少安慰。你自己的善意才是幸福的依靠，也是幸福的起點。"
  },
  "088": {
    "id": "希望新生-四季法語089",
    "title": "正確而圓滿的願望",
    "content": "所謂正確的願望是什麼?就是「真正能給自他生命帶來快樂，而且越來越快樂、越來越快樂，徹底遠離一切痛苦」，這樣的願望應該是最圓滿的。"
  },
  "089": {
    "id": "希望新生-四季法語090",
    "title": "法是光明與希望",
    "content": "聞法，會讓絕望的心有希望，會讓陰暗的感覺變成光明，會讓苦澀的心境變得快樂，會讓暴惡的心變得調柔、自私的心變得慈悲、狹小的心變得寬容。"
  },
  "090": {
    "id": "希望新生-四季法語091",
    "title": "地球人關愛地球事",
    "content": "因為我們不是活在月亮上，所以每一個人都應該要關心這個世界的糧食、土壤、水源、教育等生存環境的問題。我們是負有責任的，不應該把所有的責任推給他人。"
  },
  "091": {
    "id": "希望新生-四季法語092",
    "title": "信仰帶來力量",
    "content": "信仰，是心靈的方向。它啟發我們內心的慈悲和智慧，為生命帶來幸福和力量。日久功深，那糾結在內心，揮之不去的煩惱，便可輕鬆打開。面對不幸和傷害，即使沒人為我們的痛苦說聲對不起，我們也有力量處理它，不會被它越套越死、不會陷在困境中不能自拔。"
  },
  "092": {
    "id": "希望新生-四季法語093",
    "title": "用心改變命運",
    "content": "一旦心被改變，命運就改變了；命運改變了，苦就越來越少、快樂就越來越多，這是我對佛法的信心。如果按照佛陀說的去做，我們一定會越來越快樂、越來越幸福。"
  },
  "093": {
    "id": "希望新生-四季法語094",
    "title": "法語如明鏡",
    "content": "法語就像心靈的明鏡一樣，每天都要照一照，把髒垢的東西即時除掉，愚癡才不會越積越厚，這樣就能成為一個快樂的修行者。"
  },
  "094": {
    "id": "希望新生-四季法語095",
    "title": "此刻就是修行好時機",
    "content": "什麼時候開始修行？就是現在，此時此刻！用什麼樣的心力修行？就用勇猛、專心致志的心。"
  },
  "095": {
    "id": "希望新生-四季法語096",
    "title": "自心即道場",
    "content": "在哪裡修行？就在各自的崗位、各自的地方，自心即是道場。"
  },
  "096": {
    "id": "希望新生-四季法語097",
    "title": "最踏實的起步",
    "content": "佛法是非常深邃的智慧，但是起步卻非常踏實，腳踩下去是落地有聲的──就從生活上開始改變自己。怎麼改變？造善業。怎麼造善業？從旁邊的人開始，給他一個微笑、對他表達感謝。"
  },
  "097": {
    "id": "希望新生-四季法語098",
    "title": "轉矛盾為橋梁",
    "content": "最美麗的風景、最明亮的燈，是我們心中的善，以及對他人的體諒和包容。一定要善於化解同行之間的矛盾，把矛盾都變成增進友誼的橋梁，這就是轉違緣為道用。"
  },
  "098": {
    "id": "希望新生-四季法語099",
    "title": "一個轉念法門",
    "content": "人與人相處不太容易，如果常常很不愉快，不妨試一試：拿一個小本，寫下那個最討厭的人的十件好事，看能找出幾件。能不能每天找出十個看他順眼的地方?比如他什麼事情做得很好。持續寫下去，慢慢就會發現：啊！這個人有很多善良處可能是被我忽略的，很多他的用心也是被我忽略的。"
  },
  "099": {
    "id": "希望新生-四季法語100",
    "title": "你的雙眼想看到什麼",
    "content": "雙眼從一個窗口看出去，是看到滿天的星辰，還是地上的泥濘，選擇權完全在自己。我選擇看什麼，我的世界裡就有什麼。"
  },
  "100": {
    "id": "希望新生-四季法語101",
    "title": "楷定心的方向",
    "content": "實際上去練習觀功念恩之後，早晨就會很留心：今天我會看到什麼好人好事，看到別人的什麼優點？心就會朝著別人的優點、功德，以及善行的部分去觀察。它楷定了我一天對待別人的心理方向。"
  },
  "101": {
    "id": "希望新生-四季法語102",
    "title": "觀功念恩看到希望",
    "content": "觀功念恩實際上就是一種生活態度。在困境和麻煩的事出現時，是否好的東西也同時存在？觀功念恩就是要在困難、麻煩、苦難和很多很多痛苦之中，發現這樣一個希望。"
  },
  "102": {
    "id": "希望新生-四季法語103",
    "title": "最幸福的人",
    "content": "當我的心對別人所做的一切感到麻木的時候，是自己的心變冷酷了吧？心變冷了，自己會幸福嗎？絕對不會。心裡裝著滿滿的感恩的人，是最幸福的。"
  },
  "103": {
    "id": "希望新生-四季法語104",
    "title": "讚美是最簡單的心鑰",
    "content": "其實跟別人說幾句讚美的話，他就開心了，但我們總把事情搞得太複雜，不會用非常簡單的方式處理。"
  },
  "104": {
    "id": "希望新生-四季法語105",
    "title": "凡事都從「好」處看",
    "content": "養成一種習慣，一看就會看到別人哪裡好、哪裡善良、哪裡無私、今天幫忙多少人，都從這樣的角度去看待別人，沿著這樣的方向，假以時日自己就會體會到越來越多的幸福感。"
  },
  "105": {
    "id": "希望新生-四季法語107",
    "title": "原諒別人的理路",
    "content": "就算這個人對我很不好，我通常都用一種方法原諒別人，就是：他在生死輪迴中，我不要跟他計較了！生死的大苦、愛別離、怨憎會等等的痛苦他都將承受，這些苦已經把他折騰得不成樣子了，所以我就原諒他，應該好好幫忙他才是。"
  },
  "106": {
    "id": "希望新生-四季法語108",
    "title": "感恩之人最富足",
    "content": "當我們慢慢練習感恩心，會更廣闊地看到更多人、更多生命在此時此刻對一切的付出。任何好的事情都不是從天而降，要學會感恩大眾。有人說：「哪裡有貧窮？抱怨的人就貧窮。哪裡有富足？感恩的人就富足。」"
  },
  "107": {
    "id": "希望新生-四季法語109",
    "title": "幸福的籌碼",
    "content": "感恩心是幸福的籌碼，心裡裝得越多，實際上幸福感會越強。"
  },
  "108": {
    "id": "希望新生-四季法語110",
    "title": "不要失去行善的力量",
    "content": "無論在家裡或者在什麼地方遇到問題，千萬不要失去行善的力量！用報復心對別人，最終會損失了自己的福報，自己傷害自己。沒有人可以真正傷害你，只有自己放棄了行善的動力、放棄善待這個人的想法，地獄之門才會為自己敞開。"
  },
  "109": {
    "id": "希望新生-四季法語111",
    "title": "離苦得樂在當下",
    "content": "對父母、對親人、對小孩，甚至老師對學生、學生對老師，員工對老闆等等，這個社會中人跟人之間的關係，如果常常能從肯定別人善意的這個角度，用一種很寬容、很感恩的心去溝通的話，這樣活過一生，真的會感覺到「離苦得樂」四個字是怎麼實現的。就這麼簡單。"
  },
  "110": {
    "id": "希望新生-四季法語112",
    "title": "快樂來自發現善",
    "content": "找一些讓自己開心的事情，就可以用非常歡樂的心情度過每一天。例如：發現別人的善心、發現自己的善心，這樣就會很開心。"
  },
  "111": {
    "id": "希望新生-四季法語113",
    "title": "念恩度越絕望谷",
    "content": "單單是「念恩」，即可幫我們度越人生多少絕望時光。僅僅照著經典上這幾行字，認真地想，就足以在最苦的時候給予我們最深的安慰，讓我們徹底振奮，不敢頹廢、不敢變成壞蛋。"
  },
  "112": {
    "id": "希望新生-四季法語114",
    "title": "期待挫折後的崛起",
    "content": "打開自己的心，會讓我們沒有太多的怖畏，尤其是與人相處的時候，願意對大家敞開心扉，就更能夠用比較積極的態度，看待自己生命中發生的那些不愉快的事情。甚至慢慢會有一種期待：在每一個不愉快、每一個挫折後面，都有一個崛起在等著我。"
  },
  "113": {
    "id": "希望新生-四季法語115",
    "title": "轉業的地平線",
    "content": "當我們由於自己或他人，生命遭到重創，而掉到深深的谷底，一無是處，一片黑暗時，徹底放棄並不是解決之道。可否將那人生低限，看成是地平線。黑暗與光明都發生在那條線上，太陽從地平線落下，又從地平線昇起，何處殞落，何處新生！"
  },
  "114": {
    "id": "希望新生-四季法語116",
    "title": "百折不撓的修行之路",
    "content": "凡夫剛開始修行有沒有可能不做錯？念頭有沒有可能不錯？不可能！所以做錯之後，第一時間不要去哀嘆，內心正念的大軍就在眼前，能立刻召集的救援部隊就是「懺悔法」，趕快整頓，讓自己重新獲得鎧甲、重新獲得寶劍，開始還擊，把善法的城池搶回來，這就是百折不撓的修行之路！"
  },
  "115": {
    "id": "希望新生-四季法語117",
    "title": "全心關注他人",
    "content": "真正想要生起菩提心的時候，就會非常在意自己有沒有為他人拚盡全力。如果自己對他人的問題有所保留，沒有想盡辦法去幫忙，就會覺得遇到這個人卻沒有徹底利益他，心裡會非常過意不去。"
  },
  "116": {
    "id": "希望新生-四季法語118",
    "title": "加油！行善的人",
    "content": "行善並非易事，先要扭轉自心的方向。風和日麗下的善行，美妙溫馨，淒風苦雨中的善行，更如彩虹亮麗。無須停下腳步，行善的人們啊！加油！"
  },
  "117": {
    "id": "希望新生-四季法語119",
    "title": "扭轉為「我」的習慣",
    "content": "（此頁面未抓取到段落）"
  },
  "118": {
    "id": "希望新生-四季法語120",
    "title": "君子和而不同",
    "content": "勇於溝通，並真心地接納不同的想法，就算有不同的想法，還是可以成為很好的道友。"
  },
  "119": {
    "id": "希望新生-四季法語121",
    "title": "省察三門斷苦因",
    "content": "一定要了知自己現在的心在想什麼、嘴在說什麼、身在做什麼。必須有了知自心的能力，當它趣向傷害別人的方向時，要如馴馬師一般把它拉回來，因為斷除了從三門自害害人的行為，我們的未來才會快樂。"
  },
  "120": {
    "id": "希望新生-四季法語122",
    "title": "改變痛苦的記憶",
    "content": "當感覺被傷害的時候，要去緣念三寶，這樣的話，事後回憶到那段痛苦時，也會同時憶起緣念三寶的心。當痛苦強烈地一直揮之不去，一定要把三寶的力量注入自己的痛苦之中，去改變那種記憶。"
  },
  "121": {
    "id": "希望新生-四季法語123",
    "title": "守護意業不容緩",
    "content": "很多痛苦都是從意業開始的。發現自己的意業已經開始在犯罪的時候，要懸崖勒馬，不可以再往前去一步。因為想久了，自己的身體、語言就失控了，到那個時候再想把它拉回來，就來不及了，所以一定要警惕自己的意業。"
  },
  "122": {
    "id": "希望新生-四季法語124",
    "title": "坦然面對錯誤",
    "content": "犯錯時有一條思路：走過了最黑的地方，光明就在前面。由於看到了心靈黑暗之處，就可以去對治它，對治後這個弱點就不存在了。基於這個原因，我們可以坦然面對自己的錯誤。"
  },
  "123": {
    "id": "希望新生-四季法語125",
    "title": "滴水之惡不可輕",
    "content": "像水滴那樣小的惡業，由於不懺悔，日積月累地繼續造作下去，到最後它可能會變成像大海那麼沉重的惡業。在嘻笑著、很輕鬆的狀態下造作的惡業，未來的果報可能是我們承擔不起的。"
  },
  "124": {
    "id": "希望新生-四季法語126",
    "title": "包容他人的理路",
    "content": "為什麼他會這樣？因為他很苦啊！事實上每個人都很苦，所以沒必要在彼此的矛盾上苦上加苦，一直要在他受不了的地方再去折磨他。何妨就給他一個空間，讓他可以度過毛病還沒改的這個時候。"
  },
  "125": {
    "id": "希望新生-四季法語127",
    "title": "懺悔須知惡因",
    "content": "必須要找到「因」是什麼，為什麼我一直要做這件事？到底合不合理？佛陀說這樣做是不對的，為什麼我一直要這樣做，我到底有沒有道理？把它想清楚！懺悔要這樣。"
  },
  "126": {
    "id": "希望新生-四季法語128",
    "title": "沾髒了更該洗淨",
    "content": "我們犯了錯，通常會在那裡恐懼啊、憂惱啊。其實這除了更深地折磨自己，絲毫幫助也沒有。如果沾染了罪惡，更應急速地跳進清淨的水池，洗滌自己，因為罪業是可以懺悔淨化的。"
  },
  "127": {
    "id": "希望新生-四季法語129",
    "title": "修出懺悔的善法",
    "content": "道歉的心如果生不起來，或者有了道歉的心，卻沒有勇氣跟別人道歉，不能任由它這樣。懺悔是個大善法，一定要把這個善法修出來！"
  },
  "128": {
    "id": "希望新生-四季法語130",
    "title": "拜佛改變命運",
    "content": "專一至誠，以全部的身語意，禮佛！口中緣念佛名，意中想佛，身體禮佛，當下心境開朗真純，雜念全無。透過拜佛，可能會實現心中的夢。堅持拜下去，有一天，似乎就發現了一個全新的我，也發現了一個全新的世界。因為身心、氣質都改變了，所以此生後面的命運也都改變了。"
  },
  "129": {
    "id": "希望新生-四季法語131",
    "title": "迎向最亮麗的陽光",
    "content": "只要在佛前供上一盞燈、點上一炷香，或者站在佛前看著佛菩薩的容顏，那慈悲深邃的眼神，永遠像一束最亮麗的陽光，照亮我們的內心深處。"
  },
  "130": {
    "id": "希望新生-四季法語132",
    "title": "祈求時就不孤單",
    "content": "祈求的時候，會覺得佛菩薩在傾聽，至少在那時不會覺得是自己一個人面對困境，有佛菩薩和我在一起面對。"
  },
  "131": {
    "id": "希望新生-四季法語133",
    "title": "從更高的緣起看事情",
    "content": "一旦去皈依祈求，就會從一個很長遠的生命角度、很寬闊的緣起，去看待眼前發生的這件小小的事情。"
  },
  "132": {
    "id": "希望新生-四季法語134",
    "title": "皈依是永恆的依靠",
    "content": "皈依，就是在任何危險、孤獨無助的境界之中，有一個永恆保護的力量，那是我們生命深處一個非常非常溫暖、始終會發出力量的依靠。"
  },
  "133": {
    "id": "希望新生-四季法語135",
    "title": "依教奉行方能除苦",
    "content": "佛陀不是用水洗除我們的罪，或者用手拔除我們的痛苦，而是我們要依照他講的真理去認真地改變自己的生命，如果像他所說的那樣改變了，我們的痛苦就消失了。"
  },
  "134": {
    "id": "希望新生-四季法語136",
    "title": "一定要成佛",
    "content": "佛陀這麼圓滿的狀態，為我們的生命樹立了一個目標：我將來也要像他一樣！這就是學佛最究竟的目標，我們一定要成佛！"
  },
  "135": {
    "id": "希望新生-四季法語137",
    "title": "解決問題的良方",
    "content": "我們常常苦於事情到底該怎麼辦，冥思苦想地找辦法。其實有一種辦法就是祈求，它會讓我們的心從現有的智慧層面上，更上層樓地去考慮問題。當慧力提高的時候，就知道這個問題該怎麼解決了。"
  },
  "136": {
    "id": "希望新生-四季法語138",
    "title": "改變角度心更寬廣",
    "content": "祈求會改變我們的業力，改變我們看問題的角度。看問題的角度一變，很多問題就看開了。凡夫最大的問題，就是執著此時此刻的現象是諦實的、永恆不變的，所以必須改變自己的現行，我們的理路才能在更廣闊的空間悠遊。"
  },
  "137": {
    "id": "希望新生-四季法語139",
    "title": "挫敗只是虛妄的心情",
    "content": "（此頁面未抓取到段落）"
  },
  "138": {
    "id": "希望新生-四季法語140",
    "title": "戒律是什麼",
    "content": "沒有戒律就沒有佛教。戒律是什麼？就是二六時中看著自己的身口意，不要趣向惡行，要趣向如法行。"
  },
  "139": {
    "id": "希望新生-四季法語141",
    "title": "持戒是最深的回饋",
    "content": "世上有很多善，但有一種善叫戒善。受者戒從傳戒的善知識得到戒體，翻無始輪迴的「迷」為「覺」，翻害人為利人，心心念念只要持戒迴向這個世界，那就是最宏偉的資糧善，是對這個世界深深的報恩與回饋。"
  },
  "140": {
    "id": "希望新生-四季法語142",
    "title": "相信因果歡喜持戒",
    "content": "為什麼會好好持戒？相信因果呀！佛陀說現在快樂、將來還是快樂的事情，要不要做？要。現在快樂、但將來痛苦的事情，要不要做？不要。現在痛苦、將來快樂的事情，要不要做？要。"
  },
  "141": {
    "id": "希望新生-四季法語143",
    "title": "戒律的味道",
    "content": "戒律的味道就是清涼，可以熄滅內心煩惱的熾烈火焰，讓我們的生命安住在一種安全舒適的狀態。快樂的因會出生快樂的果，苦澀的因會出生痛苦的果。持戒就是快樂的因，所以會結快樂的果。"
  },
  "142": {
    "id": "希望新生-四季法語144",
    "title": "內心的一輪明月",
    "content": "為什麼要學戒、持戒、讓戒律清淨呢？就是為了得到快樂啊！因為所有生命都渴望內心的那一份清涼和悅意，而這一條路佛陀已經指給我們了，就是戒律！每一件事怎麼做全部都說得清清楚楚，如燈明照，腳下踏實，依之而行，大千雖闊，何事非持？持之越久，清涼越勝，彷彿有一輪明月，朗耀內心。"
  },
  "143": {
    "id": "希望新生-四季法語145",
    "title": "如是因如是果",
    "content": "我們必須清醒地知道，死後能帶往他世的是業，而業就是我面對別人造作身語意行為所累積的，這些到最後都會回到自己頭上。就像對著大風舉起火把，一定會燒到自己；如果對著風散花，回到自己身上的也是鮮花。"
  },
  "144": {
    "id": "希望新生-四季法語146",
    "title": "光明與力量的生源",
    "content": "在任何取捨的幽暗之處，唯有藉著善知識點亮的這盞燈，我們才能夠看清腳下的路。在心靈面臨非常艱苦的斷崖時，也唯有憶念善知識的教誡、想到善知識對我的慈悲，才能生出一個力量，就是「我不要退！」"
  },
  "145": {
    "id": "希望新生-四季法語147",
    "title": "修信能生無窮心力",
    "content": "對善知識的信心是一件非常奇妙的事情，它產生的力量能讓我們穿越數不清的困境，好像心力無窮。有時遇到困難會覺得：啊！大概沒有什麼力了。但是只要憶念到善知識，就會堅決地想到：因為他走在前面，我必須跟隨，沒有退路！力量也就生起了！"
  },
  "146": {
    "id": "希望新生-四季法語148",
    "title": "領受照進身心的陽光",
    "content": "善知識的心，像一個完美的世界，是我們在這個苦難的世間，被很多業障、邪見所障蔽時，能夠照臨到我們身心深處的陽光。只要用心去感受這陽光，生命就會無限地溫暖。"
  },
  "147": {
    "id": "希望新生-四季法語149",
    "title": "善知識在乎什麼",
    "content": "善知識不在乎你過去怎樣，他在乎的是你未來會怎樣。因為在乎你的未來是否幸福，所以會格外珍惜你的當下。"
  },
  "148": {
    "id": "希望新生-四季法語150",
    "title": "飲水思源",
    "content": "當我們站在一棵千年的大樹前，會驚歎它怎麼葉子這麼繁茂、樹幹這麼粗壯，而有心人就會感恩：是誰種了這棵樹，我才有今日的蔭涼！"
  },
  "149": {
    "id": "希望新生-四季法語151",
    "title": "轉變追尋快樂的方向",
    "content": "修信念恩會讓我們的生命有所轉變，不再依靠外在物質或者感官的滿足來讓自己快樂。由於善知識不停地指引，真正的快樂就在省察自心的過程中真實地產生。"
  },
  "150": {
    "id": "希望新生-四季法語152",
    "title": "信心由不斷串習而來",
    "content": "修信，就是讓我們的心經過不斷地觀察、串習，成為那個信本身。所謂的修，就是原來內心沒有的證德，透過數數地熟練、數數地串習，令它生起、令它茁壯、令它圓滿。"
  },
  "151": {
    "id": "希望新生-四季法語153",
    "title": "走向美好的秘訣",
    "content": "如何擺脫心靈的重壓，吸取到正能量？就是面對事情時，嘗試看到它積極的一面，擺脫只看到不好一面的習慣。心靈之眼一直注視著美好，就會下意識地跟著它，走在美好、光明之中。"
  },
  "152": {
    "id": "希望新生-四季法語154",
    "title": "養成光明的思路",
    "content": "一定要去想：這件事它積極的一面是什麼？要不辭辛苦地訓練自己，養成光明正向的思路習慣之後，遇到任何問題都會很勇敢、很歡喜，因為眼睛總是能看到那些美好。視野之下，遍佈生機，一路光明，喜樂倍增！"
  },
  "153": {
    "id": "希望新生-四季法語155",
    "title": "明天的我可以不一樣",
    "content": "今天的我，明天可能煥然一新，這是佛法最不可思議的地方！所以千萬不要把自己或別人看死了。"
  },
  "154": {
    "id": "希望新生-四季法語156",
    "title": "愛自即是眾苦因",
    "content": "以自我為中心的偏執，攪擾著那一湖靜水，但凡有事發生，怪外境的習氣便魚貫而出，甚至一發不可止，無奈越執著苦越多，不如對境當下，痛擊我愛執，生命方獲幾許清涼。"
  },
  "155": {
    "id": "希望新生-四季法語157",
    "title": "決斷前行必勇悍",
    "content": "所有的苦難，最終都會讓我變得更勇悍！所以必須在這條菩提路上決斷前行，沒有剎那的猶豫，也不要有一絲絲的退意。"
  },
  "156": {
    "id": "希望新生-四季法語158",
    "title": "改惡習要真修實練",
    "content": "什麼東西做久了都會習慣，不停在惡行面前屈服也是習慣。不停作小丑也是習慣，不停欺騙別人、欺騙自己也是習慣。修行這件事情是不能靠謊言來撐的，對治習氣必須要付出極其紮實的努力。"
  },
  "157": {
    "id": "希望新生-四季法語159",
    "title": "時時覺照自心",
    "content": "修行要能夠每時每刻洞悉到自己的心靈在發生什麼事情，並且善於引導自己的心走向正確的方向，不停地棄暗投明。學習覺照的第一步，要先打擊最粗猛的煩惱。"
  },
  "158": {
    "id": "希望新生-四季法語160",
    "title": "善知識示現悲智行",
    "content": "好好學經論，就會在親近善知識的過程中，看到很多很多如經論上所寫的佛菩薩的事蹟。它不只是一個古老的傳說，或很遙遠的行徑，而是從善知識身語意的示現中，會清晰地看到一種真實悲智功德的流露。"
  },
  "159": {
    "id": "希望新生-四季法語161",
    "title": "轉換苦樂標準",
    "content": "由於我們的心一直在正法上串習的緣故，會慢慢不喜歡散亂的狀態。因為一旦品嚐到寧靜、微妙、不可言喻的喜悅時，誰還會去希求那種會帶來很多過患、讓心裡不寂靜的所謂「快樂」呢？由於薰習佛法的原因，我們生命中苦樂的標準會發生轉換，我們的行為方式也會發生轉換。"
  },
  "160": {
    "id": "希望新生-四季法語162",
    "title": "有限生命中該追求的",
    "content": "人生就這麼短，得在有限的時間裡取得最有用的訊息。什麼叫做有用？對眾生離苦得樂最有價值的、不隨著時代變遷而改變的真理。"
  },
  "161": {
    "id": "希望新生-四季法語163",
    "title": "佛陀最深的悲心",
    "content": "不必恐懼談生死，因為佛陀最深的悲心，就顯示在大家無法可想的生死問題上。佛陀想出辦法、走出了出路，而且那麼多修行人都衝出了輪迴，為什麼你我要一直在這苦難的生死城裡流連呢？"
  },
  "162": {
    "id": "希望新生-四季法語164",
    "title": "千古真理如百鍊金",
    "content": "佛法如果經不起質疑，怎麼能夠成為千古傳頌、這麼多傑出的人都依之修行成就的一個真理？所以它經得起質疑，越質疑會越顯示它的純度，就像黃金被火鍊一樣。"
  },
  "163": {
    "id": "希望新生-四季法語165",
    "title": "律己是修行根本",
    "content": "解脫之路、成佛之道是從要求自己開始的。在一切境界中，請把目光轉向自己的心念，再看看嘴在說什麼、身在做什麼，一定要把持不要造惡業，這是修行最重要的事情。"
  },
  "164": {
    "id": "希望新生-四季法語166",
    "title": "靠近佛菩薩的機會",
    "content": "碰到的困難越多，提醒自己向佛菩薩祈求的機會就越多，這樣的話，每一次的困難都更加密切了自己和佛菩薩的聯繫，到最後就密不可分了！"
  },
  "165": {
    "id": "希望新生-四季法語167",
    "title": "依戒如理作善友",
    "content": "利益一個人、幫助一個人要依於戒，讓他對戒律生起希求心、信心。令他作惡的時候作不成，做善的時候都能成就，這樣的人就叫作善知識和善友吧！"
  },
  "166": {
    "id": "希望新生-四季法語168",
    "title": "依善士語淨惡業",
    "content": "如果做了壞事就永遠不可救藥，那懺悔不就是空話了？所以在苦果還沒有成熟之前，依止善知識的教誡，對惡業進行有力的淨治，會產生不可思議的力量。"
  },
  "167": {
    "id": "希望新生-四季法語169",
    "title": "修信以為根本",
    "content": "信心是怎麼來的？修來的。所以在親近善知識的時候，修信是最重要的根本，這也是整個成佛之道的命脈、根本。「根本」是什麼意思？如果沒有這個，就不會有其他的枝幹或花果。"
  },
  "168": {
    "id": "希望新生-四季法語170",
    "title": "萬善根本由師出",
    "content": "「萬善根本從師出，能生利樂如良田」，每斷一個過失、生一個功德全賴於善知識。從開始發心、中集資糧到最後成佛，整個成佛之路我們不可能離開善知識獨自去成就。所以值遇善知識後，最重要的一點就是要持續不斷地修信念恩。"
  },
  "169": {
    "id": "希望新生-四季法語171",
    "title": "溝通從傾聽開始",
    "content": "每個人都可以做溝通的高手，先要學會尊重他人，不要強硬地把自己的觀點塞給別人。如果能付出真心聽對方說話，花時間了解別人內心的苦楚和難點，那就更佳。因為你願意作他的忠實聽眾，有一天當你說出真知灼見，他也會認真地傾聽。"
  },
  "170": {
    "id": "希望新生-四季法語172",
    "title": "法如明珠能淨濁",
    "content": "法本身的作用就是清涼，有滌淨煩惱的作用。就像一杯渾濁的水，一顆明珠放下去之後，水就變得澄澈。"
  },
  "171": {
    "id": "希望新生-四季法語173",
    "title": "相互撞擊進步快",
    "content": "一堆馬鈴薯如果單獨一顆一顆洗，會費時良久。若集中一起，放入水中，不停攪動，相互撞擊，泥巴就掉得很快。大家的優缺點不一樣，互相碰撞、互相學習，很快地一些問題就解決了。"
  },
  "172": {
    "id": "希望新生-四季法語174",
    "title": "主宰自己的幸福",
    "content": "就內心的狀態來說，感恩就代表著幸福，抱怨就代表著不幸。所以活在天堂還是活在地獄裡，自己能不能主宰呢？"
  },
  "173": {
    "id": "希望新生-四季法語175",
    "title": "對境覺察提正念",
    "content": "改變世界從改變內心開始，改變內心從改變知見開始；要改變自己的行為，從每一次對境提起正念開始；而提起正念，是從每一次對境的時候要覺察現行煩惱開始。"
  },
  "174": {
    "id": "希望新生-四季法語176",
    "title": "拔除惡習最痛快",
    "content": "只有對付自己，打倒自己的惡習的時候，才會感受到真正的痛快。"
  },
  "175": {
    "id": "希望新生-四季法語177",
    "title": "心念決定生命方向",
    "content": "語言就是思路的一個騰飛，一念一念的連結。你最初的動機趣向哪裡，你的語言就會帶著你趣向哪裡，心念趣向哪裡，最後生命就會趣向那裡。"
  },
  "176": {
    "id": "希望新生-四季法語178",
    "title": "命運握在自己手上",
    "content": "一分善業一分快樂，真實不虛，命運就握在自己手上。已經知道了什麼叫惡、什麼叫善，只要在克制自己習氣的部分再努力一些、再努力一些，快樂的路就會越走越堅定。"
  },
  "177": {
    "id": "希望新生-四季法語179",
    "title": "久練成精熟",
    "content": "在對治自心的經驗上慢慢積累、慢慢積累，這樣練個十年、二十年。生生世世練下去，就成為高手了。修行熟練的人就知道怎麼對付自心的煩惱。"
  },
  "178": {
    "id": "希望新生-四季法語180",
    "title": "最大的勇士",
    "content": "佛陀是大勇士，從來不避諱人生的每一分痛苦，不會用一種塗清涼油或者掩耳盜鈴的方式，去解決我們生命的苦果和苦因。他都是直擊性的，直接抽劍、直接擊斃痛苦，從不躲閃。"
  },
  "179": {
    "id": "希望新生-四季法語181",
    "title": "揮別缺憾種未來因",
    "content": "與其抱怨生命中有這麼多缺憾，不如把那些缺憾的，在自己生命裡種植出來，以後就不缺了。"
  },
  "180": {
    "id": "希望新生-四季法語182",
    "title": "修行要從自身找問題",
    "content": "希望我們能習慣一種思路：在自己身上找問題，並設法解決它。修行之路即是如此。"
  },
  "181": {
    "id": "希望新生-四季法語183",
    "title": "決斷力能破一切難",
    "content": "對我們的生命來說，一旦決斷了就沒有困難，因為我將衝破一切困難。"
  },
  "182": {
    "id": "希望新生-四季法語184",
    "title": "痛苦真正的原因",
    "content": "希望大家真實地洞悉到，是什麼原因使自己過得這麼痛苦，是不是沒遇到好的人、沒遇到好的事情，還是自己不會快樂的方法？如果是不會快樂的方法，那麼可以「學」如何快樂，可以「練」這個心，讓它學會朝著快樂的思路去。"
  },
  "183": {
    "id": "希望新生-四季法語185",
    "title": "痛苦來自錯誤的思路",
    "content": "痛苦從哪裡產生？錯誤的理路。想錯了，生命就越來越苦；想對了，生命就越來越快樂。如果越想越痛苦、越想越痛苦，要趕快從你的思路裡把心拉回來，這個方向顯然是不對的；如果越想心裡越慈悲、越寬容，那麼這樣的思路是我們應該採取的。"
  },
  "184": {
    "id": "希望新生-四季法語186",
    "title": "擺脫苦難是最輝煌的事",
    "content": "我們看事情就會只看現在的苦，所以修行感到辛苦時就會想退，但實際上我們現在正在做一件最輝煌的事——正在經歷擺脫苦難的過程。"
  },
  "185": {
    "id": "希望新生-四季法語187",
    "title": "煩惱絕對不能累積",
    "content": "如果有一件事不能累積的話，那一定是煩惱！如果有一件事需要馬上去做的話，那一定是對治煩惱！因為放縱我們的心容蓄煩惱，是對自己最大的傷害。"
  },
  "186": {
    "id": "希望新生-四季法語188",
    "title": "善用智慧能安忍",
    "content": "佛法中所謂的「安受苦忍」，就是用非常智慧的方式去處理痛苦。本來痛苦已經這麼多了，如果不智慧地處理，可能會變成極難堪忍，但是如果能用智慧面對，至少會降低大半，甚或可以全部淨除。"
  },
  "187": {
    "id": "希望新生-四季法語189",
    "title": "踐踏痛苦最痛快",
    "content": "哪有比踐踏痛苦更痛快的？「你壓迫我，我就把你踩在腳下！」這樣心力會越來越強大，生命會越來越散發出一種強大的光芒。所以痛苦沒有毀滅我們，恰恰是這種種痛苦成就了我們！"
  },
  "188": {
    "id": "希望新生-四季法語190",
    "title": "何必被怨氣所綁",
    "content": "其實怨氣綁住的不是一個人，是兩個人或者更多人。所以還是寬恕了比較好，寬恕了別人，自己也被寬恕了。"
  },
  "189": {
    "id": "希望新生-四季法語191",
    "title": "用短暫人生創造無限價值",
    "content": "很多人都想要變得更美，那就好好修忍辱，利用這短暫的人生是可以達到的。想變得更有智慧的話要怎麼辦？研習經典、尊敬有智慧的人、恭敬法寶，還有在佛前供燈等等。在這一小段生命的努力，對於我們無限生命的影響是非常非常深遠的。"
  },
  "190": {
    "id": "希望新生-四季法語192",
    "title": "斬除生氣的習慣",
    "content": "正因為有人總是惹我們生氣，最好把自己喜歡生氣這個毛病徹底改了，這樣就算所有的有情有一天都來敵對我們，我們都不會再生氣了。要訓練自己的心，在對境的時候能夠非常熟練地調伏，有一天我們就會變成徹底不會生氣的人，像彌勒佛一樣，永遠都開心。"
  },
  "191": {
    "id": "希望新生-四季法語193",
    "title": "轉苦澀為快樂",
    "content": "當發現自己有一種習慣的思路，會讓自己的人生過得非常苦澀，那麼就要把這個習慣改掉，改成快樂的思路。有快樂的思路就會有快樂的心境，有快樂的心境就會有快樂的人生。如果自己快樂，就會帶給家人、朋友快樂，無論走到哪裡都會帶給人家快樂。所以快樂真是一件非常珍貴的禮物，擁有它的人會非常非常地富足。"
  },
  "192": {
    "id": "希望新生-四季法語194",
    "title": "凡夫的苦受",
    "content": "當痛苦來臨，感覺苦受似乎被無限增大時，要意識到：這是一個凡夫感受上的認知，並非感受的那般真實！"
  },
  "193": {
    "id": "希望新生-四季法語195",
    "title": "從初發點擊潰苦",
    "content": "（此頁面未抓取到段落）"
  },
  "194": {
    "id": "希望新生-四季法語196",
    "title": "學習以法調心",
    "content": "學會用法調伏心，學會用法穿越困境，學會用感恩的心看待你所得到的一切——包括痛苦。"
  },
  "195": {
    "id": "希望新生-四季法語197",
    "title": "抓出煩惱背後的堅固見解",
    "content": "任何熾盛的煩惱後面都有一個堅固的見解，要把它找出來，才能真正降伏煩惱。"
  },
  "196": {
    "id": "希望新生-四季法語198",
    "title": "氾濫成災的思路",
    "content": "想要達到生命深沉的寧靜和喜悅，就必須戰鬥內心中那些亂七八糟的見解。沒有用理性分析過的思路，就像潰堤的河道一樣，會造成災難。"
  },
  "197": {
    "id": "希望新生-四季法語199",
    "title": "不要對自己失去耐心",
    "content": "要懂得欣賞自己與煩惱戰鬥的過程，不要每次都看成是失敗。哪怕比上一次多堅持一秒，都是成功！多鼓勵自己，不要常常對自己失去耐心。"
  },
  "198": {
    "id": "希望新生-四季法語200",
    "title": "方法正確還需上陣練",
    "content": "我們已經找到能對治內心煩惱的法，它悲憫和清涼的力量，能讓生命的痛苦慢慢變弱。接下來，就要透過聞思把理路學習清楚，然後上陣實練。"
  },
  "199": {
    "id": "希望新生-四季法語201",
    "title": "下决心讓自己幸福",
    "content": "下個決心讓自己幸福、快樂，別習慣生活在憂悲苦惱和各種情緒的糾結之中，這才是真正漂亮的選擇！"
  },
  "200": {
    "id": "希望新生-四季法語202",
    "title": "痛苦來自錯誤的安立",
    "content": "當一個人開始為「我」辯解時，我愛執會極度膨脹，其實我們並不會因此感到快樂。正是因為迷失了對空性的觀察，以為過失完全都是在對方那邊，沒有一個自己的分別心安立上去的作用，我們才會有這麼多痛苦。"
  },
  "201": {
    "id": "希望新生-四季法語203",
    "title": "以歡喜心滅除憂瞋",
    "content": "有了歡喜心就沒有憂慮，沒有憂慮就不會有瞋恨，沒有瞋恨就不會有傷害，不會去做傷害自己和他人的事。"
  },
  "202": {
    "id": "希望新生-四季法語204",
    "title": "正理源於淨智",
    "content": "正理是什麼呢?正確無垢的道理。非常簡單地說，它是清淨的智慧對於事物所安立出來的量則。"
  },
  "203": {
    "id": "希望新生-四季法語205",
    "title": "訓練心的力量",
    "content": "當我們的心越來越有力量的時候，就可以挑戰越來越大的痛苦；克服痛苦之後，心又會越來越有力量。力量一直增長，到最後就可以摧滅一切痛苦。"
  },
  "204": {
    "id": "希望新生-四季法語206",
    "title": "智慧是幸福第一要素",
    "content": "我最想要擁有的財富就是智慧，最不能捨離的摯友、導師也是智慧，最不能離開的光明也是智慧，最不能失去的、像山一樣的依靠，也是智慧，因為它是幸福的第一要素。"
  },
  "205": {
    "id": "希望新生-四季法語207",
    "title": "澈見一切得大樂",
    "content": "有了對一切都了解的智慧，就能遠離一切恐怖、遠離一切顛倒的認識，生命會進入徹底大樂的境界。"
  },
  "206": {
    "id": "希望新生-四季法語208",
    "title": "溝通的基礎",
    "content": "溝通要在不散夥的狀態下才能進行，如果老存著一種想另起爐灶自己幹的心，是沒辦法溝通的。"
  },
  "207": {
    "id": "希望新生-四季法語209",
    "title": "起點無論高低",
    "content": "不管自己的起點有多低，都要敢於面對，並且就從這樣的起點上開始修行，這沒有什麼不光彩的！因為所有的生命，都需要在自己的起點上開始向前邁進。"
  },
  "208": {
    "id": "希望新生-四季法語210",
    "title": "比生命還重要的珍寶",
    "content": "無論什麼理由、什麼困境，都不足以使我們放棄佛法！因為它是比生命更重要的珍寶！佛菩薩在因地裡甚至捨棄生命，都沒有捨棄佛法，我們那一點點困境又算什麼?"
  },
  "209": {
    "id": "希望新生-四季法語211",
    "title": "靜心能生善行",
    "content": "一旦我們的心安靜下來，不再被情緒所控制的時候，就能夠看清楚自己怎麼了，這個時候該行的善就都能起步行起來。"
  },
  "210": {
    "id": "希望新生-四季法語212",
    "title": "以法調心自清涼",
    "content": "如果不用法向內調伏，大大小小的事都會帶來痛苦和麻煩；如果能藉助法的力量向內調伏，內心就會獲得安穩和清涼。"
  },
  "211": {
    "id": "希望新生-四季法語213",
    "title": "常保快樂的方法",
    "content": "練習每天警醒、覺照自己的心，這樣的話到八十歲、九十歲，甚至也有人一百多歲了還是很開心。老就老，很開心，越老越開心；病就病，病也可以開心，躺在床上也可以開心。"
  },
  "212": {
    "id": "希望新生-四季法語214",
    "title": "瑣碎中彰顯真理",
    "content": "用平庸的認知，面對每天的生命，那些瑣碎煩擾也只是瑣碎煩擾。換一種神聖的心態，看待生命中的林林總總，如一片水晶折射太陽的光輝，當你定睛觀看，哪怕是一件樸素無華的平常事，也能顯現出真理的璀璨光芒。"
  },
  "213": {
    "id": "希望新生-四季法語215",
    "title": "法語是行事的準繩",
    "content": "當有什麼事需要找一個依靠作為準繩去抉擇的時候，祖師、佛菩薩的法語，就是我們的心該朝向那裡動轉的一個指示燈，只有依著它動轉心的方向，我們才能夠離苦得樂。"
  },
  "214": {
    "id": "希望新生-四季法語217",
    "title": "努力造善趣向佛果",
    "content": "如果心續就是出生佛果的地方，我永遠不會失去我的心續，那為什麼要憂悲苦惱?只要在每一次會墮落的境界上，努力去造善業往上走，最終一定會超越惡業的追討，乃至成就圓滿的佛果。"
  },
  "215": {
    "id": "希望新生-四季法語218",
    "title": "薰習正法生命昇華",
    "content": "當下一念的痛苦，實際上並沒有實質的自性，就像陽燄和閃電一樣虛妄。了解這個道理，對自己執著為苦的這點，就會覺得很可笑。隨著不停地薰習正法，對自我的認識會不停加深，對自己執著的東西會一次又一次放掉，慢慢增長智慧和慈悲。觀察觀察，焠煉焠煉，漸行見行，行到雲深處，心無半點塵，胸中皎潔，自然天遼地闊。"
  },
  "216": {
    "id": "希望新生-四季法語219",
    "title": "心靈風暴的庇護所",
    "content": "就像大風雨來了，鳥都躲到樹林裡，好像躲進媽媽的懷抱一樣，那心靈的風暴來了，我們要躲到哪裡去?一定是躲到佛菩薩的教言之中，這樣就會得到清涼。所以越是危險、越是煩惱的時候，越要去憶念佛菩薩的法語。"
  },
  "217": {
    "id": "希望新生-四季法語220",
    "title": "注視死亡才知道該怎麼活",
    "content": "有人說：「不要一談佛法就談生死。」實際上必須注視死亡，我們才會知道該怎麼活著！"
  },
  "218": {
    "id": "希望新生-四季法語221",
    "title": "辯論的意義",
    "content": "要學著去喜歡跟自己唱反調的人，因為沒有他的挑戰，我的正理寶劍怎麼會越來越銳利?正由於他總是站在反方，一直提出對立的觀點，我們就得拼命學習教理來對付他。一直交鋒，一直對決，最後佛陀的正理在我們內心，就如持劍的勇士，劍鋒光華璀璨，威震一切邪解誤解！我們的心胸坦蕩如大海，正見堅固如須彌山王。"
  },
  "219": {
    "id": "希望新生-四季法語222",
    "title": "捨自能得大自在",
    "content": "「愛自己就是痛苦的因，愛眾生就是快樂的因」，這句話佛在兩千五百多年前已經講了，我們信不信呢?信了之後，到關鍵時刻捨不捨得放下自己?捨得下你就贏了！現在捨不下，到最後死主來時也是都拿走了，什麼也留不下。所以還是早一點捨，就早一點自在！"
  },
  "220": {
    "id": "希望新生-四季法語223",
    "title": "勿因他惡毀自善",
    "content": "當你被深深地傷害的時候，請不要放棄做一個好人的理想，因為只有心裡想好的、嘴上說好的，身口意都做善行，生命才會越趨完美。如果相信因果，就不要因為別人的錯誤而毀滅自己。"
  },
  "221": {
    "id": "希望新生-四季法語224",
    "title": "心情不好更要堅守目標",
    "content": "有的人心情不好會放棄目標，其實心情不好更要堅守目標。因為就是過去造了惡業，沒有好好修行佛法，才會心情不好。如果在心情不好的時候，再放棄造善業的機會，那接下去可能會更加地心情不好。"
  },
  "222": {
    "id": "希望新生-四季法語225",
    "title": "聞法能生智慧",
    "content": "為什麼聽佛法就會發現自己錯了？因為聽法會讓心慢慢地平靜下來，平靜的心才能夠生起取捨的智慧，看到孰是孰非；就如一方靜湖，白晝可照雲霞飛鳥，夜晚懷抱燦燦星空。"
  },
  "223": {
    "id": "希望新生-四季法語226",
    "title": "妄想才是最危險的敵人",
    "content": "最危險的敵人，是自己那些狂妄的想像。一件很小的事，透過非理作意的扭曲，會變得面目猙獰，如同鬼怪，完全不符合事實的真相，此時如何能做出正確的判斷？"
  },
  "224": {
    "id": "希望新生-四季法語227",
    "title": "壓力越大越能撐出剛骨",
    "content": "面對困難苦練久了之後，越大的壓力壓到你頭上，你的反抗力越大，到最後就變成大力士，可以撐起一片天！別人都倒了就你站著。然後看你站著，旁邊有些人就會跟著撐起來站著，所以經歷的苦難越來越多、越來越多，一個一個修行人的剛骨就全都立起來了。"
  },
  "225": {
    "id": "希望新生-四季法語228",
    "title": "助人也是自助",
    "content": "每個人的成長都需要有他人的幫忙，善知識就是這樣生生世世帶著我，我才走到今天。現在輪到我幫助別人，實際上這也是一個幫助自己的過程，就是去學習如何幫助別人，學習如何在很多很多壓力下，堅守利他心，不斷地朝著光明的方向精進思惟，勇悍前行。"
  },
  "226": {
    "id": "希望新生-四季法語229",
    "title": "淨化惡習的緣起",
    "content": "正是要靠著幫助別人的緣起，淨化無量劫以來的種種惡習：以自我為中心、無視他人，不希求般若智慧等等，所以一直都在無明的束縛下，過著暗無天日的生活。常常思惟一下，向前走就會有力量！"
  },
  "227": {
    "id": "希望新生-四季法語230",
    "title": "締造神話的信念",
    "content": "我的生命有一個締造神話的信念，非常希望跟諸位分享，就是：我不向厄運屈服！我覺得現在的生命狀態是不圓滿的，我就要改變它。不到無死國，精進永無止。"
  },
  "228": {
    "id": "希望新生-四季法語231",
    "title": "鑄造未來的神祕之手",
    "content": "有一雙神秘的手在鑄造我們的命運——那就是心，我們心中的每個起心動念，就在鑄造自己的未來。"
  },
  "229": {
    "id": "希望新生-四季法語232",
    "title": "與煩惱奮戰到底",
    "content": "面對一個邪惡的煩惱習氣，我們必須要數數地修，就是一天一天、一月一月、一年一年，乃至一生一生，矢志不移地戰鬥下去。"
  },
  "230": {
    "id": "希望新生-四季法語233",
    "title": "與其擔憂不如奮鬥",
    "content": "與其胡思亂想、擔憂自己的未來，不如打定主意當下好好奮鬥。"
  },
  "231": {
    "id": "希望新生-四季法語234",
    "title": "四字箴言",
    "content": "有的時候一直努力、一直努力，結果還沒有出現，這時就看一看：我努力的目標有沒有偏誤？如果依據經論確定方向沒有錯誤，次第沒有倒亂，現在還沒有出現結果怎麼辦？四個字——「繼續努力」！"
  },
  "232": {
    "id": "希望新生-四季法語235",
    "title": "苦樂操之在我",
    "content": "一旦發現我們的心，對自己是否快樂負有決定性的責任時，就會特別振奮，用很大的力度來了解自心。了解了苦樂是自己可以去造作的時候，怎麼能坐在那裡白白受苦呢？一定會行動起來，去息滅惡業、廣造善業！"
  },
  "233": {
    "id": "希望新生-四季法語236",
    "title": "轉心",
    "content": "這個世界是不是很不完美？那佛陀為什麼以指按地，它就變成金色的淨土？到底是它真的不完美，還是由於我們的心不完美，使得映入我們眼簾的世界就是不完美的？那麼要訣在哪裡？就是轉心！"
  },
  "234": {
    "id": "希望新生-四季法語237",
    "title": "離苦得樂必須勤學苦練",
    "content": "如果想了解離苦得樂是怎麼回事的話，我們必須勤學苦練——勤奮地學習教理，然後對境當下要徹底掃蕩自己的無明煩惱！"
  },
  "235": {
    "id": "希望新生-四季法語238",
    "title": "不要停止對真理的追尋",
    "content": "不要停止廣學多聞，不要停止聞思修空性，不要停止對內心中苦受錯誤的根源再再地尋覓、再再地探察，一定要找出到底是什麼原因使自己這麼痛苦，然後去息滅它。"
  },
  "236": {
    "id": "希望新生-四季法語239",
    "title": "佛法的了悟在心",
    "content": "佛法的「懂」和一般的「懂」完全是兩回事，那麼它的區分到底在什麼地方？看內心有無轉變。"
  },
  "237": {
    "id": "希望新生-四季法語240",
    "title": "苦不會因怕就不見",
    "content": "我們的生命能不能真正離苦得樂？百分之百可以！因為造什麼業就感什麼果。如果遇到事情就只想到困難或抱怨，就會陷入負面情緒的泥沼中，完全不能動彈，也會越來越沒有膽量、越來越萎縮。可是苦不會因為我們怕就不見了，必須提起所有心力超越它去造作善業。"
  },
  "238": {
    "id": "希望新生-四季法語241",
    "title": "生死事大、修行最急",
    "content": "死盯著眼前的小事反覆串習的話，就會變得好像很大。就像眼皮上沾了東西，看出去就會覺得很龐大，但把它拿下來看，可能還沒有芝麻大。實際上到底什麼事最大？生死事大！什麼東西最急？修行最急！"
  },
  "239": {
    "id": "希望新生-四季法語242",
    "title": "修行人的習慣",
    "content": "正知正念是用來護戒的，以正知力常常去觀察，看自己的正念在不在。修行人的習慣就是這樣的，它是一種不斷調伏自心的過程。"
  },
  "240": {
    "id": "希望新生-四季法語243",
    "title": "苦樂由心安立",
    "content": "快樂和痛苦都是我們的心製造出來的。當別人罵我們、不承認我們，或者歪曲事實，把話都顛倒著說，就用它來製造快樂、造作善行吧！因為一切境界都是沒有自性的，苦樂取決於我們內心對境的安立。"
  },
  "241": {
    "id": "希望新生-四季法語244",
    "title": "把壓力轉為動力",
    "content": "學會把壓力變成動力、把弱點變成優點，如果在內心上訓練這種能力的話，再多流言蜚語來的時候，我們可能會越來越感覺到平靜，乃至極其深度的平靜。"
  },
  "242": {
    "id": "希望新生-四季法語245",
    "title": "最強大的軍隊",
    "content": "有時候我們正念的軍隊，還是打不過煩惱的強敵，所以需要對佛法大量地串習、思惟。在這種狀態下，精進如法地聽聞，就是在培訓我們摧伏煩惱最強大的軍隊。"
  },
  "243": {
    "id": "希望新生-四季法語246",
    "title": "洞察秋毫抉擇身心",
    "content": "聽法的時候，必須抖擻精神、全力以赴，要非常注意自己三業的造作。應該讓我們的慧眼不染塵埃，洞察秋毫，對三業的觀察要像粉末一樣細緻，不可以像大塊的砂石一樣非常粗糙，自己在做什麼都不知道。這就是用所聞的法，數數抉擇自己的身心。"
  },
  "244": {
    "id": "希望新生-四季法語247",
    "title": "超越生死的正見",
    "content": "佛說的正見有兩種：一種是世間的正見——業果見，它可以讓我們好好持戒，不墮落三惡趣，得到人、天的果報；另一種是出世間的正見——空正見，可以讓我們無視於死主的挑戰，超越生死輪迴、得大自在。"
  },
  "245": {
    "id": "希望新生-四季法語248",
    "title": "微笑的力量",
    "content": "實際上一個微笑的力量，在內心中存留的感覺是很久的，而且是正向的，所以請多布施你那燦爛的微笑。"
  },
  "246": {
    "id": "希望新生-四季法語249",
    "title": "忍耐寬容並非怯懦",
    "content": "其實忍耐和寬容不是一種怯懦，反而正是一個人大度和勇悍的表示。就如靜靜的大海，沉靜恢宏、溫柔而雄渾，像微笑著的勇士。"
  },
  "247": {
    "id": "希望新生-四季法語250",
    "title": "不必憂愁的理由",
    "content": "「若事尚可為，云何不歡喜？若已不濟事，憂惱有何益？」如果把這兩句話實踐在生活中，這樣的人生簡直太壯麗了！因為再也沒有什麼事可以嚇倒我們了。可以改變的痛苦我不愁，不可以改變的痛苦我也不愁，那請問還有什麼愁事嗎？"
  },
  "248": {
    "id": "希望新生-四季法語251",
    "title": "苦難賜予的禮物",
    "content": "儘管生命中有很多痛苦，如果能以苦為道，就能在每一個痛苦中發現苦難的價值，讓自己成長；在自己成長了之後，發現又有陷在苦難裡的人，還可以去救他。所以，苦難給我們的禮物不僅是提升自己，還能幫助他人。"
  },
  "249": {
    "id": "希望新生-四季法語252",
    "title": "從反省中超越自我",
    "content": "每一次發生爭端時，如果能反省到：我是在無明生死中，會顛倒苦樂的真相，實際上這就是一個凡夫的基本行相。那麼每一次的爭端，都讓我立志要超越凡夫、成為聖者，要看清一切事情的根源，把苦的根本全部拔掉。"
  },
  "250": {
    "id": "希望新生-四季法語253",
    "title": "頑石可雕心定能轉",
    "content": "認真學、認真去體會，照著佛菩薩講的那樣認真地去改變自己，一定會被改變的！心又不是石頭，為什麼不能改？就算是石頭都可以雕出傳世精品來，為什麼我的心不能轉變？"
  },
  "251": {
    "id": "希望新生-四季法語254",
    "title": "選擇當個勇士",
    "content": "挫敗感其實只是一種心情，不停地戰勝它，就是勇士的風采，否則就永遠陷溺在困境裡裹足不前。選擇權是在自己手裡，看你要怎麼做。"
  },
  "252": {
    "id": "希望新生-四季法語255",
    "title": "更紮實的努力",
    "content": "嫉妒心，就是總覺得自己擁有的比別人少，但這樣並不能得到想擁有的東西。如果缺福報就趕快培福，缺智慧就趕快去聞思，這樣努力更腳踏實地。"
  },
  "253": {
    "id": "希望新生-四季法語256",
    "title": "歡喜心何處尋",
    "content": "覺得自己什麼也做不對，什麼也不會，生不出歡喜心的時候，聽聽佛菩薩的故事，或思惟暇滿人身以及善知識的功德，想這些就會生歡喜心。所以當你的生命周圍好像找不到值得歡喜的事時，要記得去找佛菩薩。"
  },
  "254": {
    "id": "希望新生-四季法語257",
    "title": "以慧力削弱煩惱",
    "content": "痛苦來臨的時候，會發現痛苦好像黏在身心上、綑綁著我們，甚至是死纏爛打，一直逼迫著我們，怎麼甩也甩不掉。一定要想辦法用慧力對治它，用智慧善巧地削弱煩惱這種緊密黏著的力道。"
  },
  "255": {
    "id": "希望新生-四季法語258",
    "title": "注視生命的大苦",
    "content": "一旦注視到生死大苦的時候，眼前的這些小事情根本不會放在心上，因為再痛也比不了生死的痛、墮落惡趣的痛。"
  },
  "256": {
    "id": "希望新生-四季法語259",
    "title": "絕不向惡念屈服",
    "content": "絕對不要向心中的惡念屈服！不要在乎它有多惡，也不要在乎它有多可怕，我們要做的就是跟它鬥，把它殲滅！"
  },
  "257": {
    "id": "希望新生-四季法語260",
    "title": "空性的利斧",
    "content": "空性慧就是一把利斧，可以把輪迴的根剎那砍掉，從此永脫生死，不再輪迴。"
  },
  "258": {
    "id": "希望新生-四季法語261",
    "title": "離苦先助人",
    "content": "在自己痛苦的時候，能選擇先去幫助別人，這樣的人一定會幸福的！"
  },
  "259": {
    "id": "希望新生-四季法語262",
    "title": "秋日的感恩",
    "content": "秋日的田野，五色斑爛，一片豐收的喜悅，善知識啊！我望著善行的心田，感恩您慈悲的恩賜啊！"
  },
  "260": {
    "id": "希望新生-四季法語263",
    "title": "發現寬恕",
    "content": "當我們反省自心的時候，就會發現寬恕。"
  },
  "261": {
    "id": "希望新生-四季法語264",
    "title": "蓮花出自淤泥",
    "content": "勇士是從什麼地方出生的？膽小怯弱、自私自利、嫉妒比較、心裡跌宕起伏、名聞利養心一大堆，就是從這些爛泥灘裡生出了勇士的蓮花。不要小看自心中的佛性，一旦它得到善知識的啟發而萌芽，就會在這些煩惱的糞土中，開出最美的蓮花，亭亭出塵，卓爾不群。"
  },
  "262": {
    "id": "希望新生-四季法語265",
    "title": "要怎麼收穫先那麼栽",
    "content": "幸福是索求來的，還是因為付出而收穫的？要想得到別人尊重，先尊重別人；要想得到別人的感恩，先去感恩別人；要想得到別人的恭敬，先去禮敬別人，常常禮敬佛菩薩、禮敬眾生，自然會得到他人的敬重。"
  },
  "263": {
    "id": "希望新生-四季法語266",
    "title": "從心深處拔除苦因",
    "content": "佛陀說，所有痛苦的因都在我們心中。所以必須把內心深處的問題解決之後痛苦才不會再發生。"
  },
  "264": {
    "id": "希望新生-四季法語267",
    "title": "正遍知之義",
    "content": "佛陀又叫「正遍知」，就是對所有事情都有正確、不顛倒的了解。他也是透過長久的修行，不斷增長內心的悲智而達到的。"
  },
  "265": {
    "id": "希望新生-四季法語268",
    "title": "戰爭由瞋起",
    "content": "在任何地方我們都應該息滅爭端，達成人與人、人與自然之間的和平，希望全世界的人都能和平相處，息滅心靈的戰爭。所有的唇槍舌戰，乃至流血的殺戮等等，這一切戰爭都是從內心的瞋恨、對立開始的。"
  },
  "266": {
    "id": "希望新生-四季法語269",
    "title": "轉動命運的巨輪",
    "content": "行持不只是身口的行為，實際上行持是從內心開始的，要從內心的意樂改起，思惟正理即可轉動命運的巨輪。"
  },
  "267": {
    "id": "希望新生-四季法語270",
    "title": "胸懷天下蒼生",
    "content": "慢慢地擴大自己的心量，以後就可以胸懷天下蒼生，不依靠他人，自願承擔所有眾生離苦得樂的責任，這就是增上意樂。"
  },
  "268": {
    "id": "希望新生-四季法語271",
    "title": "大乘道的扼要",
    "content": "佛陀的教誨就像一盞明燈，告訴我們對境的時候，應該捨什麼、應該取什麼。在整個大乘道中，最重要的扼要就是菩提心，如果沒有菩提心，就無法成佛；不能成佛的話，就達不到生命最美妙、無悔的境界；不要說利他，自利也是不圓滿的。"
  },
  "269": {
    "id": "希望新生-四季法語272",
    "title": "實現美好的願望",
    "content": "一定要相信善有善報、惡有惡報，把心底裡的惡徹底清除掉，生命才能如自己所想要的那樣。想要親近善知識、常隨佛學、快點證得空性，或者生起剎那也不忘失的菩提心，這些美好的願望，都會因為努力斷惡修善而實現。"
  },
  "270": {
    "id": "希望新生-四季法語273",
    "title": "充滿內心的幸福",
    "content": "如果能夠把握值遇到善知識的因緣，好好地跟他學習，善知識的恩澤就足以充滿我們的心。當我們的內心充滿之後，我們就可以獻出更多的關愛給他人，讓幸福充滿世界。"
  },
  "271": {
    "id": "希望新生-四季法語274",
    "title": "修行樂無憂",
    "content": "經典裡的每一條理路，都是針對我們內心的煩惱，如果能好好依教奉行，一一調伏，心裡真的就會快樂無憂。"
  },
  "272": {
    "id": "希望新生-四季法語275",
    "title": "走向生命的大自由",
    "content": "每個人都想得到自由，其實能不被煩惱束縛，才是生命的最大自由！讓內心徹底從無明中醒覺，就像從惡夢中醒來，得到一種完全清晰無謬的認知。切斷煩惱的根本及其習氣，心靈才得以擺脫重擔，行到彼岸，自由飛翔。"
  },
  "273": {
    "id": "希望新生-四季法語276",
    "title": "徹底拔除苦根",
    "content": "為什麼要去除無明的根本？因為所有的衰損、痛苦，包括所有的心情不好、人際關係不好、沮喪等等這些麻煩，都是源自無明。如果我們不把這些痛苦的根源徹底地去除，總是在一些枝末上掙扎，想要解決生命的問題，實際上還是從一個深坑掉到另一個深坑，繼續承受不一樣的苦罷了。"
  },
  "274": {
    "id": "希望新生-四季法語277",
    "title": "遇困難時自我提問",
    "content": "在遇到困難時去琢磨：我遇到了什麼事？遇到了這件事，我的反應是什麼？而這個反應的結果又是什麼？反之，這件事的正確反應應該是什麼？它的結果又是什麼？兩者對比一下，何者能真正的離苦得樂，我們就應該選擇那一個。"
  },
  "275": {
    "id": "希望新生-四季法語278",
    "title": "困境不過是念頭",
    "content": "所謂的困境、所謂的低沉和絕望，也就是幾個念頭來回轉的問題。你用對了方法就會發現：心好像一個風車一樣，這邊的風一大，嘩！朝那邊，那邊的風一大，朝這邊。它是很靈巧的轉動。"
  },
  "276": {
    "id": "希望新生-四季法語279",
    "title": "雲後有明月",
    "content": "不要被遇到的困境所困。困境雖然如黑暗陰沉、厚重、恐怖，但它依然具有暫時性，待我們勇敢地穿越了它，就會看到雲層後面的月輪有多麼美、多麼皎潔！我們的心就像那深邃的天空，也是很博大的，當有一天真正認識到它的時候，就會發現最寬廣的是心，最美麗的也是心。"
  },
  "277": {
    "id": "希望新生-四季法語280",
    "title": "心的力量",
    "content": "我們的內心有極其罕見的力量，一定要善於運用這種力量，把它變成是善的力量、和平的力量、慈悲的力量，讓這種力量充滿自他的生命。"
  },
  "278": {
    "id": "希望新生-四季法語281",
    "title": "修出歡喜如湧泉",
    "content": "開心是怎麼來的？修出來的，不是從天上掉下來砸到自己的，是修出來的。是要天天用功夫，歡喜才會在心裡像泉水一樣一直湧出來、一直湧出來。"
  },
  "279": {
    "id": "希望新生-四季法語282",
    "title": "佛教確實的利益",
    "content": "佛教之所以千百年來被很多人矢志不移地追求，是因為它確實能帶來心靈的和平與清涼，以及人與人之間的相互尊重。它能化解仇怨、使頹廢變精進，甚至給病弱在床、飽受人生重創的人們一股強勁的力量，讓他再度奮起。"
  },
  "280": {
    "id": "希望新生-四季法語283",
    "title": "光明溫暖的大樹",
    "content": "我們的信仰可以讓我們的心成為這個世界的光明，慈悲心會成為很多很多人一個溫暖的依靠。就像一棵大樹，各種小鳥都來了，無論是習慣放聲高歌的，或淺唱低吟的；白色的、黑色的、彩色的，身著各色衣衫的小動物；大如雄鷹、小如螞蟻都來了。因為有一棵大樹，大家都聚集在一起，依靠著大樹而居。"
  },
  "281": {
    "id": "希望新生-四季法語284",
    "title": "勿輕小善",
    "content": "你現在對境每一步的善、每一步的自我超越，也許你自己覺得比芝麻粒還小，但是實際上它所產生的作用、果報，可能連虛空都不能容受！"
  },
  "282": {
    "id": "希望新生-四季法語285",
    "title": "堅持正確的道路",
    "content": "不要怕、不要猶疑、不要退却，堅持下去一定會成功的。只要方向百分之百正確，為什麼我們不能達到快樂呢？"
  },
  "283": {
    "id": "希望新生-四季法語286",
    "title": "超越痛苦便是喜悦",
    "content": "身心上的痛苦，有的時候透過修行，可以產生忽然超越它的感覺。那麼一個瞬間，你覺得超越了它，就好像痛苦突然消失了，內心充滿了感動和喜悦。"
  },
  "284": {
    "id": "希望新生-四季法語287",
    "title": "法喜從何而來",
    "content": "所謂的法喜是怎麼得到的？從聽聞經典的當下，會諸根愉悦，心湧歡喜。再再研究智者的理路，數數思惟，感動如雲，歡喜如雨。進而學會更廣泛的、更清晰的抉擇角度，來調伏身心相續的問題，所得到的法喜更是喜不自勝啊！"
  },
  "285": {
    "id": "希望新生-四季法語288",
    "title": "困境是自我超越的契機",
    "content": "如果用一種非常積極的心態，去面對所遇到的困境，有可能現在覺得過不去的這個關，正是你展翅高飛的時刻，因為你會完成對自己極限的超越。"
  },
  "286": {
    "id": "希望新生-四季法語289",
    "title": "澈見真理盡除諸苦",
    "content": "如果沿著正確的知見去努力，有一天澈見真理的時候，也就是所有的苦惱都消除的時候。"
  },
  "287": {
    "id": "希望新生-四季法語290",
    "title": "真理如何澈見",
    "content": "真理到底如何澈見？如何勵力心志去探討真理？那令自他都能夠得到饒益的正知見是什麼？要走向從所未經之地，沒有一個良好的環境，不跟隨真正了解的嚮導善知識去走，沒有幾個人能走過去吧！懈怠、散亂、我慢、怯懦等諸多的內外障礙，還有身心的種種病苦，這些都足以摧殘自己的道心。所以應矢志不移，緊隨師行。"
  },
  "288": {
    "id": "希望新生-四季法語291",
    "title": "沒有學不會的道理",
    "content": "遇到自己不會的、不懂的，要怎樣？要學！學了不懂怎樣？再學！再學還不懂怎樣？再學！那再學還不懂呢？繼續學！直到把它學會、直到把它學懂。實際上，方法如果對，又有老師教，怎麼可能永遠都學不會？"
  },
  "289": {
    "id": "希望新生-四季法語292",
    "title": "苦樂自心作主",
    "content": "這一生是苦惱還是快樂，誰來作主？修行人要自己作主。要過苦惱、墮落、絕望，乃至悲觀的一生，還是欣喜、慈悲、智慧的一生，抉擇權完全在自己手裡。就像訓練有力的手臂，透過心智的訓練，當心越來越有力的時候，不但自己容易化苦惱為清涼，也能有力地支援他人離開痛苦。"
  },
  "290": {
    "id": "希望新生-四季法語293",
    "title": "開發內心無限的潛力",
    "content": "如何從自己的眼、耳、鼻、舌、身所認知的狹小範圍上，去加深對於這個宇宙或內心世界的探索？因此佛菩薩為我們宣說了修心之道，一定要把所有的力量專注於內心。因為內心的能力被開發後，會遠遠地超越現在眼見、耳聞的一切，這種探索在時空的跨度上，將會是無限的。"
  },
  "291": {
    "id": "希望新生-四季法語294",
    "title": "佛法是省察自心的教育",
    "content": "佛教更像一種教育，就像上大學的感覺，因為佛陀有太多的思路，會跟自己碰撞。當我們完成一種對自我心靈的省察、提升，乃至淨化，就能超越表面這些不停波動的現象，用非常審慎而理性的態度去看待問題。"
  },
  "292": {
    "id": "希望新生-四季法語295",
    "title": "菩提心的大威神力",
    "content": "了解了菩提心的功德，看到諸佛菩薩的威神之力，就會生起非常羨慕歡喜的心，也想做一個偉大的菩薩。因為所有的有情都想要最美好的東西，菩提心既然如此美好、如此超勝，如此具有大威神力，為什麼我們不要呢?"
  },
  "293": {
    "id": "希望新生-四季法語296",
    "title": "改變世界的開始",
    "content": "希望我們一起讓這個世界變得更美好！哪怕你的努力就發生在一盞燈光下，就只面對一個人，你對他說幾句感恩的話，哪怕寒冬臘月，一句良言善語，亦能暖心暖意，實際上世界會因為你的感恩心而改變。讓這改變就從感恩我們身邊的人開始吧！"
  },
  "294": {
    "id": "希望新生-四季法語297",
    "title": "生命的目標",
    "content": "佛法偉大的力量，透過一年一年地聽聞、討論，慢慢浸潤我們枯燥的身心。佛陀的悲智力，透過善知識的教誨，一點一滴滋潤我們的生命，讓我們從只注視今生的苦樂想到來世，了知生命的目標是要究竟離苦得樂、要成佛，而且要幫忙所有的眾生都走上這條路，都成佛。"
  },
  "295": {
    "id": "希望新生-四季法語298",
    "title": "累積福報回向菩提",
    "content": "如果我們能依外在的殊勝境，又依內在的殊勝發心，累積到很大的福報，要將這個福報迴向正法久住、眾生安樂；迴向為了芸芸眾生的解脫，我早一天生起菩提道的證德、早一天去證得佛果。尤其大乘道是以菩提心為根本，這個發心非常非常需要廣大的資糧。"
  },
  "296": {
    "id": "希望新生-四季法語299",
    "title": "聽法啟發抉擇慧",
    "content": "法音入耳，抉擇取捨的美玉瑽瑢之聲，充遍身心。耽著感受、昧於取捨的愚癡濃霧，漸散漸去，我們輕輕騰躍，脫離現行煩惱的泥潭，飛翔於清晰喜樂的抉擇之天空下，目及遼遠，審慎當下。"
  },
  "297": {
    "id": "希望新生-四季法語300",
    "title": "生命長遠的贏家",
    "content": "每個人都是自己生生世世這家公司的董事長，你自己決定，是只忙眼前利益，還是要注意到更長遠的利益。用眼、耳、鼻、舌、身、意運行的這家公司，你看得越遠、贏得越多。"
  },
  "298": {
    "id": "希望新生-四季法語301",
    "title": "問題如山也如紙",
    "content": "不要把自己的問題看得太嚴重，其實有的問題差不多就像隔一層窗紙那樣，一捅就透，你就突然明白了。明白之後就不會再覺得像一座巨山一樣壓在自己的身心上。"
  },
  "299": {
    "id": "希望新生-四季法語302",
    "title": "珠寶的河流",
    "content": "為大眾效命的人，福報是不會窮盡的，就像一條珠寶的河流，怎麼看也看不到盡頭。"
  },
  "300": {
    "id": "希望新生-四季法語303",
    "title": "淨化心續的事業",
    "content": "佛法的事業，它的核心就是淨化我們的心續，如果我們把以自我為中心這種習性從內心全部淨化掉，成為堅固的菩提心等流，那輝煌佛果，便指日可待。"
  },
  "301": {
    "id": "希望新生-四季法語304",
    "title": "在菩提心樹下乘涼",
    "content": "教小孩教到心情煩躁時，可否找到一棵菩提心樹，輕輕坐下，閉目納涼？體會陣陣利他清風拂面待心頭熱惱漸漸清涼，你便更有心力，去面對第一千次的挑戰，陪伴一顆年幼的心漸漸長大。"
  },
  "302": {
    "id": "希望新生-四季法語305",
    "title": "無限生命的視野",
    "content": "生命是一個無限的、無限的延伸，不是只有這一生就完了。因此，大可以把目光從眼前望向無盡的未來，打造更美好的來生。"
  },
  "303": {
    "id": "希望新生-四季法語306",
    "title": "平凡中的偉大",
    "content": "不一定要去做什麼驚天動地的事，最驚天動地的就是你的心了。你可能只是掃個地、擦個桌子，做這些看起來很平常的事，一旦用一個偉大的目標統攝時，就能成就偉大的一生！有一天就突然發現，你的心發出了萬道光明照耀這個世界，那即是你心性光明的非凡綻放。"
  },
  "304": {
    "id": "希望新生-四季法語307",
    "title": "溫暖的教化",
    "content": "關注他人苦樂的心，要努力讓它變得越來越真誠、越來越無染，慢慢會發現與他人的關係開始改善了，改善之後就可以令「教化」發生，實際上就是用你身口意的行為感化他人，這股暖流會溫暖很多很多痛苦的心，讓很多人有勇氣去行善，遇到挫折時他也會繼續前行。"
  },
  "305": {
    "id": "希望新生-四季法語308",
    "title": "永恆的光明能源",
    "content": "大乘發心是這個世界永恆的能源體，永恆的光明、永恆地發起善業之地。一切的佛菩薩看到這個發心的人會有什麼感覺？就珍愛啊！因為珍愛他就等於珍愛很多很多人的生命，有這個心就會保護很多人不受傷害。"
  },
  "306": {
    "id": "希望新生-四季法語309",
    "title": "編織善的共業網",
    "content": "平常最好能多心存善念、口說善言，多表達內心的感恩，把這個共業網，像織布一樣織得非常地絢爛，不要讓它襤褸不堪，乃至到最後被惡業反撲而撕毀，因為自己的苦樂和他人是息息相關的。"
  },
  "307": {
    "id": "希望新生-四季法語310",
    "title": "修道種樂因",
    "content": "「無上菩提」就是所有的快樂都圓滿的佛陀果位，而這個「道」就是能引生佛陀果位的方法。所謂的修道，也就是一定要在善所緣上數數地令心安住、令心堅固，廣泛種下能達到快樂的因。到處都是快樂的因之後，自然就能快樂無窮。"
  },
  "308": {
    "id": "希望新生-四季法語311",
    "title": "誰也奪不走的喜悅",
    "content": "修行人要慢慢學會依靠法得到快樂。法，就是從捨惡取善開始。面對痛苦，一次又一次地以法為依靠，取捨對了，歡喜力就會漸漸生起來。這樣的習慣練成之後，會發現生命變得自由，無論別人讚賞或是批評，總之內心降伏煩惱的那一分喜悅，是誰也奪不走的。"
  },
  "309": {
    "id": "希望新生-四季法語312",
    "title": "學會跟困難鬥智",
    "content": "在遇到困難的時候，要學會和它鬥智、鬥勇，一定要想方設法超越。"
  },
  "310": {
    "id": "希望新生-四季法語313",
    "title": "天堂與地獄的差別",
    "content": "傳說天堂的人用的勺子很長，他們吃飯都是互相餵的，所以大家都能吃飽，過得很幸福；地獄的人也用長勺子吃，但只想給自己吃，結果誰也吃不到。這說明了什麼？「以他人為中心的幸福人生觀，以自己為中心的痛苦人生觀。」"
  },
  "311": {
    "id": "希望新生-四季法語314",
    "title": "生命的價值感",
    "content": "我們在相互幫助中，會體會到自己的生命在他人生命中的價值感，這種價值感能讓一個人不會自尋死路。一旦發現自己是一個有用的人，就不會選擇毀滅自己。"
  },
  "312": {
    "id": "希望新生-四季法語315",
    "title": "未來的希望",
    "content": "只要我們不絕望，孩子們就有希望了！要相信人是可以改變的！假以時間、假以智慧、假以無盡的慈悲，是可以改的！"
  },
  "313": {
    "id": "希望新生-四季法語316",
    "title": "堅持最美好的希望",
    "content": "在這條路上我們必須堅持努力下去，守護著希望。這個希望到底是什麼？佛陀說的，所有的眾生都可以轉變，都可以變成最美好、最無私、最有智慧的那個人，這是佛陀用他最清淨的慧眼澈見的真實。"
  },
  "314": {
    "id": "希望新生-四季法語317",
    "title": "二種心情",
    "content": "「這個問題把我卡死了」，為此感到焦灼沮喪；和「這個問題是我準備超越的，這只是顯示了我的慧力不足」，積極地去找辦法把它超越。後者的心情是欣喜的，有點躍躍欲試的期待感，而且會覺得希望無窮。"
  },
  "315": {
    "id": "希望新生-四季法語318",
    "title": "最快樂的職業是修行",
    "content": "希望從每天、每分每秒的努力之中，我們都慢慢地學會如法的修行。一旦體會到修行的美，就會打你也不走、駡你也不走，就是一定要修行。天上人間最快樂的一個職業就是修行人了！因為他只是運用自己的心來操作，就可以得到最完美的快樂，實在是妙不可言！"
  },
  "316": {
    "id": "希望新生-四季法語319",
    "title": "助人得以離自苦",
    "content": "有沒有這樣的經驗？你心中有一件很煩惱的事情，結果出去之後發現一個很苦惱的人，你就特別想要幫助他。在幫助他的過程中也遇到一些困難，但是你一直想幫他，結果這件事結束了之後，你突然發現自己那個很可怕的情緒，或者很可怕的低落的階段就過去了。"
  },
  "317": {
    "id": "希望新生-四季法語320",
    "title": "助人之心離無明",
    "content": "我發現當我靠近每一顆心，想要幫助每一顆心的時候，實際上每一顆心都在幫忙我，幫我去除對另一顆心的無明。"
  },
  "318": {
    "id": "希望新生-四季法語321",
    "title": "佛法出生一切美善",
    "content": "佛法美啊！般若美啊！美在哪裡呢？就是誰碰到誰就得到益處。你這樣修了之後，自己得救了，然後把你得救的方法告訴其他人，誰修了誰就得救。它會出生一切善的、樂的、美的一切好東西，所以才叫寶啊！"
  },
  "319": {
    "id": "希望新生-四季法語322",
    "title": "真實之法最有魅力",
    "content": "人啊，你要是找到一個他最喜歡的事情，他是可以一直做下去的。那你說學佛法可以像網路遊戲那麼迷人嗎？為什麼不可能呢？虛假的東西都可以那麼有力，真實的東西難道不是更有魅力嗎？"
  },
  "320": {
    "id": "希望新生-四季法語323",
    "title": "利他的喜悅",
    "content": "雖然我們自己的心中對道的某一些體悟，也會喜悅，也是會清涼的；但是看到他有情的心續中，自己辛勤播下的善種子開始冒出嫰芽，長出綠葉，在陽光下隨風搖曳，那種喜悅更是凌空欲飛，波湧如海，風光無限。"
  },
  "321": {
    "id": "希望新生-四季法語324",
    "title": "歡喜的修法行",
    "content": "喜悅，只能從感受上獲得嗎？超越了感受，讓思惟進入到正向光明的作意時，是否那嚴謹的思路，也會出生喜悅呢？在每件事發生的時候，要清淨發心，正行時，將護三業。做對的部份，隨喜自己；做不對的部份，向內調伏、懺悔；再將自己所做的善，悉數迴向無上菩提。那麼，總結起來，可清晰明現的是自己在斷惡修善的征途上，勇悍前行。至此，可歡喜嗎？"
  },
  "322": {
    "id": "希望新生-四季法語325",
    "title": "振奮心力一念間",
    "content": "當你把心力振奮起來的時候，困難就變小了;如果不振奮，芝麻點大的事也可以讓你粉身碎骨。心志就是這樣的一個東西！"
  },
  "323": {
    "id": "希望新生-四季法語326",
    "title": "當自己生命的導演",
    "content": "每一刻生命的光陰，都是你自己可以操縱，用來達到快樂的時光。你是自己生命的導演，自己寫劇本、自己主演，自己受樂、受苦。"
  },
  "324": {
    "id": "希望新生-四季法語327",
    "title": "常敗將軍",
    "content": "我是一直失敗，但為什麼是將軍而不是逃兵呢？因為我確定再一直一直努力下去，這個困境是會被突破，乃至苦根也是會被徹底摧毀的。"
  },
  "325": {
    "id": "希望新生-四季法語328",
    "title": "如覆大地的防護力",
    "content": "《入行論》說：「片革墊靴底，即同覆大地。」對境如何防護自心？就像你的腳穿了鞋，等於覆蓋了整個大地，沒有東西可以刺到你的腳，那就是正念正知的力量。"
  },
  "326": {
    "id": "希望新生-四季法語329",
    "title": "讓世界更美好",
    "content": "如果我們能踏實地從此棄惡從善，都變成一個非常良善的人，這個世界會因為我們改變自己而變得更加美好。"
  },
  "327": {
    "id": "希望新生-四季法語330",
    "title": "虛妄與真實",
    "content": "世上很多事情看起來很有誘惑力、很有魅力，但是你真正走進它的時候，實際上是很空虛的，這就是五欲八風的滋味。但是如果聞思正法，你越靠近它、用心去琢磨它，慢慢地學會結合內心的話，會對自他的生命產生真實的饒益，會得到真實的法喜。"
  },
  "328": {
    "id": "希望新生-四季法語331",
    "title": "和合能生究竟樂",
    "content": "為什麼我們要朝著與他人和合的方向串習，不朝著發展自我而不管別人的方向串習呢？因為你看佛陀慈愛眾生，就知道快樂是怎麼出生的；你看眾生都只愛自己，就應該知道痛苦是怎麼出生的。"
  },
  "329": {
    "id": "希望新生-四季法語332",
    "title": "善業豐收念師恩",
    "content": "當你看到滿眼善業豐收的美麗風光時，一定會想到：是誰使這一切變得這麼美？那個時候對師長恩德的憶念就不只是文字，在自己的身心上可以找到落腳點，是很真實的——我靠近他，聽聞他說法，得到了這些！"
  },
  "330": {
    "id": "希望新生-四季法語333",
    "title": "學習的心",
    "content": "一旦我們的內心調到一個學習的角度，無論面對任何境界，我們只會計算學到了什麼——昇華內心，服務他人。我們最在意的是內心的收穫，所謂欲平天下者，先平自心。"
  },
  "331": {
    "id": "希望新生-四季法語334",
    "title": "如何讓正法久住",
    "content": "對難可值遇的佛法，一定要生起珍惜、祈願它久住的心。怎樣令正法久住？聽法的如法地聽，講法的如法地講，佛法就會久住。"
  },
  "332": {
    "id": "希望新生-四季法語335",
    "title": "增長慈悲就減少傷害",
    "content": "佛法告訴我們，要讓心從一種不原諒、瞋恨，或者憂傷的狀態，調整到理解、感恩，增長智慧和慈悲的方向。一旦調整到這樣的方向，我們慢慢會感覺到自心的力量，就不會那麼害怕別人的傷害。"
  },
  "333": {
    "id": "希望新生-四季法語336",
    "title": "發心剎那即成菩薩",
    "content": "當生起菩提心那一剎那間，縱然是個還沒有證得空性的凡夫，你已經是菩薩了。微風吹過你的衣服、吹過你的頭髮，再吹到另一個眾生身上，他就得到益處了。有了菩提心，你就是大寶藏、人天的應供處。"
  },
  "334": {
    "id": "希望新生-四季法語337",
    "title": "速成菩提慰蒼生",
    "content": "讓我們早一點發起真實的菩提心，證悟甚深的空性，乃至用最速疾的修法去成就無上菩提，以慰天下蒼生！"
  },
  "335": {
    "id": "希望新生-四季法語338",
    "title": "禮敬大雄世尊",
    "content": "佛陀是最強大、最勇悍的，沒有什麼可以難倒他，禮敬那不再被業惑之繩捆綁的大自在！他在輪迴中無數次將陷溺在惡業裡的我們拯救出來，過程雖然壯烈，但勝利實在輝煌！從發心起，直至成佛，所有努力皆為利益有情，禮敬那白蓮花般聖潔的志向！禮敬大雄世尊！"
  },
  "336": {
    "id": "希望新生-四季法語339",
    "title": "終極幸福絕對可能",
    "content": "所有的生命有沒有終極幸福的可能性呢？佛陀給出了令我們心悅誠服的答案：是絕對可能的！為什麼呢？因為所有的生命都有離苦得樂的趨向性。就是這樣的能力，會促使大家去尋覓，如何達到那沒有一絲絲痛苦、永恆快樂的生命境界？有無數的佛陀都已圓滿實現了那個夢。"
  },
  "337": {
    "id": "希望新生-四季法語340",
    "title": "修行人的快樂",
    "content": "物質的依賴已退居到最小的角落，盛滿心靈饗宴的法餐，豐盛而極度奢華。華衣美食的喧擾，已化成月下禪思的寧靜。一朵出塵之花，在人生的各種境遇中傲然地綻放，清香遠逸。"
  },
  "338": {
    "id": "希望新生-四季法語341",
    "title": "步步減過分分生德",
    "content": "痛苦的腳下如何生出快樂的蓮花？解脫的輕風怎樣拂去煩惱的塵埃？功德無不圓過失無不離的美月，何時胸中朗耀？步步減過，分分生德，漸行漸趨，直至菩提。"
  },
  "339": {
    "id": "希望新生-四季法語342",
    "title": "衣帶漸寬終不悔",
    "content": "修行ㄧ定要有「衣帶漸寬終不悔」的決心。歷經風雨的艱辛後，總有一天，打開那窗子：哇！千樹萬樹梨花開！走進我期待的那座離塵的花園，美妙的覺受競相盛開，我的心就成為功德花海。"
  },
  "340": {
    "id": "希望新生-四季法語343",
    "title": "最終極的孝道",
    "content": "佛法是最終極的孝道，因為他把每一生的父母都放在心上，想要給予父母最究竟的快樂，從衣食奉養，承歡膝下，昇華到拔除父母所有痛苦最究竟的苦根！這是作為學佛的弟子，報答這一世乃至無量劫來的父母親，所要盡的一個大孝。"
  },
  "341": {
    "id": "希望新生-四季法語344",
    "title": "生命真正的歸宿",
    "content": "能發心趣向大乘的人，會令佛菩薩的心無限地喜悅，因為這是所有生命真正的歸宿。必須捨己為人，為很多人效命，自己的生命才能夠得到真正的昇華，才能夠擺脫痛苦的困境，也同時撐持了天上人間最美的教法。"
  },
  "342": {
    "id": "希望新生-四季法語345",
    "title": "離苦得樂的舟航",
    "content": "教典是離苦得樂的舟航，每一條理路，都會消滅我們內心中的非量、建立合量的理路。所謂的合量，就是什麼是快樂、什麼是痛苦；什麼是快樂的因、快樂的果，什麼是苦因和苦果，教典中廣泛無謬地宣說這些真理。"
  },
  "343": {
    "id": "希望新生-四季法語346",
    "title": "困境中的收穫",
    "content": "一切困境終究會過去，烏雲不可能永遠遮住太陽的光輝，這只是一個短暫的過程。關鍵是走過的時候，你帶了一些什麼禮物？穿越這段時光，你帶著什麼寶貝走到下一段？到底增加了一些什麼本事，長養了多少慈悲與智慧？這是我們要算計的。"
  },
  "344": {
    "id": "希望新生-四季法語347",
    "title": "立定信念走大乘",
    "content": "立定一個當菩提薩埵的堅定信念，而且從此做每一件事都立定這個心念，你就開始走向了大乘之路。"
  },
  "345": {
    "id": "希望新生-四季法語348",
    "title": "思惟的力量",
    "content": "將違緣轉為順緣是一個艱辛的歷程，但只要矢志不移、方法正確，人類最了不起的是什麼力量？就是心力。心力是怎麼獲得的？由思惟獲得的。一旦得到這種力量，你是可以轉變命運的。轉變命運是什麼？就是改變現狀和未來。"
  },
  "346": {
    "id": "希望新生-四季法語349",
    "title": "調伏自心之路",
    "content": "修行的第一步，從親近善知識開始就要調伏自心，到後面的六度，都是要調伏自心，沿著這樣的方向，我們才能完成自覺覺他的這條路。"
  },
  "347": {
    "id": "希望新生-四季法語350",
    "title": "超越輪迴的希望",
    "content": "宇宙有兩大類現象，一類就是生死，另一類就是涅槃。生死是痛苦的，涅槃是快樂的。我從小就想探索有沒有超越生死的可能，是不是所有生命在這裡邊都沒有辦法？後來居然找到了希望——佛陀，他就超越了這個苦難的生死輪迴！"
  },
  "348": {
    "id": "希望新生-四季法語351",
    "title": "偉大的心靈教育",
    "content": "佛陀的心靈教育，正好可以突破現代教育的瓶頸，如果這個教育能夠深入到家庭、深入到各行各業，實際上大家會很和樂的。"
  },
  "349": {
    "id": "希望新生-四季法語352",
    "title": "幸福之路就在腳下",
    "content": "學習佛法，做一個幸福、和平的人，甚至給周圍的生命也帶來這種希望，其實並不困難，從布施一個微笑，說一句感恩的話開始，路就在腳下。"
  },
  "350": {
    "id": "希望新生-四季法語353",
    "title": "佛法真實不虛",
    "content": "佛陀的真理之所以震撼人心，是因為它太真實了！面對它的時候，你不能迴避、不能躲藏。它是一種靈魂深處最真摰的相對。"
  },
  "351": {
    "id": "希望新生-四季法語354",
    "title": "最大的恩人",
    "content": "佛陀是我們最大的大恩人，他從最初發心、中集資糧、最後成就正等正覺，全都是為了拯救你我痛苦的生命，他經歷了難以數計的苦行，生生世世為你我無悔地奉獻，這樣的恩情，我們何以為報？"
  },
  "352": {
    "id": "希望新生-四季法語355",
    "title": "聞法最直接的利益",
    "content": "聽聞佛法帶給我們最直接的利益，就是真的會變得聰慧，聰慧的人就知道到哪去找幸福。"
  },
  "353": {
    "id": "希望新生-四季法語356",
    "title": "正法久住生命向榮",
    "content": "正法如果能夠久住，我們又能夠跟法相應，並且引領更多的人跟法相應，即便是在這個苦難的輪迴，生命還是欣欣向榮的。"
  },
  "354": {
    "id": "希望新生-四季法語357",
    "title": "成佛的意義",
    "content": "成佛意味著我們的生命沒有一點點遺憾，沒有一點點不圓滿，沒有一點點錯謬，對一切事物悉知悉見。"
  },
  "355": {
    "id": "希望新生-四季法語358",
    "title": "菩薩的願行",
    "content": "菩薩，能給絕望的人帶來無窮的希望，在沒有路的地方走出千萬條路，幫助他人從痛苦走向無盡的快樂，這就是菩薩的願行。"
  },
  "356": {
    "id": "希望新生-四季法語359",
    "title": "自利利他的人生",
    "content": "改變自己的心，給自己帶來希望、光明和充實的人生，從而影響他人，利益他人。佛法就是這樣的——「自利利他」。"
  },
  "357": {
    "id": "希望新生-四季法語360",
    "title": "為利眾生願成佛",
    "content": "看到一個小生命，即使他不認識我們，也想要讓他離開痛苦得到歡樂，把這種心推而廣之，願所有的生命都離開所有的痛苦，願所有的生命都得到至極的快樂。那怎樣才能有力量荷擔所有眾生離苦得樂這件事？一定要成佛！"
  },
  "358": {
    "id": "希望新生-四季法語361",
    "title": "正理之路",
    "content": "一切佛語皆可現為當前ㄧ念的修行，用以斬斷煩惱，趣向智慧，離開非理作意的泥潭，踏上如理作意的寶洲。因為所有的理路，都可以讓我們心靈的腳更健壯，越跑越快，到最後健步如飛，用一個理路就跑到死亡見不到的地方，那這ㄧ輩子就徹底贏了！"
  },
  "359": {
    "id": "希望新生-四季法語362",
    "title": "走出一條康莊大道",
    "content": "要好好珍惜過去生辛辛苦苦得來的善果，要讓它越變越大、越變越大，創造出自己生生世世都受用不盡的幸福。這都是由於師長三寶在前面引路、在左右陪伴，我們才能在世間這個充滿苦惱的荊棘叢裡，走出一條康莊大道。"
  },
  "360": {
    "id": "希望新生-四季法語363",
    "title": "生命的劇本",
    "content": "生命就是這樣，剎那剎那不停地向前流去，而未來會怎樣，則跟我們現在做什麼有直接關係。所以現在就是在寫劇本，自己就是導演，然後未來自己去演出。因此在撰寫下ㄧ世的腳本的時候，不要把自己塑造成悲劇的主角，一定要是一個歡歡喜喜、吉祥如意、莊嚴聰慧、善根豐厚的人。"
  },
  "361": {
    "id": "希望新生-四季法語364",
    "title": "最完美的生命",
    "content": "用我們的生命、用我們的眼淚、用我們所有的一切的一切，讓大乘佛法的瑰寶在世界上傳承下去，而且從現在開始，盡未來際都做這件事，天上人間實在是找不到比這更完美的生命！"
  },
  "362": {
    "id": "希望新生-四季法語365",
    "title": "光明海載黃金舟",
    "content": "光明的大海，傳承著黃金之舟，每ㄧ縷光波，輝耀的是佛陀千古的悲心、永恆的智慧。那在黑暗中痛苦、摸索、沉淪的有情啊！快來這裡，這裡有溫暖！這裡有光明、希望和力量！快登上這大乘的黃金之舟，速到彼岸！"
  },
  "363": {
    "id": "希望新生-心之勇士001",
    "title": "枯樹亦不能輕視",
    "content": "冬日，下了很厚的雪。那天，我在窗邊看到一隻鳥，牠精神抖擻地站在雪地上，一直在啄一朵乾掉的花。因為裡邊有花籽吧？一隻小鳥就一直吃那個花籽，吃得津津有味的。站在窗邊的我不禁想到：連枯乾的小花叢都不能輕視它呀！因為它餵養了冬天的小鳥。"
  },
  "364": {
    "id": "希望新生-心之勇士002",
    "title": "看見身旁的美好",
    "content": "專注凝視，青青翠草上，晶瑩露珠，那草色入了心，露珠滋潤了眼。透亮的寧靜，彷彿從一滴露珠的光中，進入了我們的世界。生命中有很多可以讓人們精神愉悅、很滿足、很感恩的事，包括認真凝視一棵草的翠綠，一顆露珠的晶瑩，其實都可以讓你的心在那一刻徹底地打開，感覺到這個世界的美好。"
  },
  "365": {
    "id": "希望新生-心之勇士003",
    "title": "善觀緣起",
    "content": "我們每個人內心中，都有一個自己的純淨世界，它是怎樣出現的？就是透過心造作出來的。所以在面對每一個緣起的時候，不要把它看得那麼平庸！"
  },
  "366": {
    "id": "希望新生-心之勇士004",
    "title": "你擁有快樂的能力",
    "content": "感受快樂是一種能力，要讓我們的心能夠敏銳地感受愉悅，不能變得麻木。這種能力，比萬貫家財更值得擁有。最妙的是，它居然可以藉自心努力訓練而成！"
  },
  "367": {
    "id": "希望新生-心之勇士005",
    "title": "愉悅旅程的開始",
    "content": "無論何時，無論何地，內心的修持只要開始起步，都將開啟一段令人非常愉悅的旅程。"
  },
  "368": {
    "id": "希望新生-心之勇士006",
    "title": "把握生命的航向",
    "content": "生命像一條船，在各種顛簸的境界中行進，我們得把握住生命的航向，朝著最高的夢想一直前進，不能被自己的煩惱、執著拖住，更不能被痛苦的狂風掀翻。"
  },
  "369": {
    "id": "希望新生-心之勇士007",
    "title": "石頭的可能性",
    "content": "磨難，像一塊石頭，只是有人選擇讓這塊石頭壓住自己，有人選擇把它當墊腳石，攀上下一座高峰。"
  },
  "370": {
    "id": "希望新生-心之勇士008",
    "title": "保持適中的節奏",
    "content": "匆匆忙忙，有時會忘掉大事。稍稍放緩速度，便有餘暇注意呼吸、步伐、心態，可以有餘力隨時調整自己，應付不可預知的挑戰的到來。"
  },
  "371": {
    "id": "希望新生-心之勇士009",
    "title": "善用清單整頓心緒",
    "content": "紛亂的節奏，忙也忙不完的事情，剛剛完成一個，另一個任務已立刻到眼前。面對生活中疲於奔命的壓力，彷彿永遠有未完成的下一個在控訴自己。此時，請坐下來，深呼吸，整理一下。拿張單子將應做之事列目錄、排先後、確定時間。一定要留下時間，休息一下，靜下心來，祈求。"
  },
  "372": {
    "id": "希望新生-心之勇士011",
    "title": "傷害奪不走快樂",
    "content": "你雖然被傷害，但你依然擁有快樂的權利，那權利是屬於你自己的，沒有人可以奪走。"
  },
  "373": {
    "id": "希望新生-心之勇士012",
    "title": "抱怨的結果",
    "content": "抱怨像雜亂的音聲，攪擾著聽的人和說的人。如果這種聲音不絕於耳，人生將何以堪！人們在抱怨聲中痛楚、忍受，壓抑著內心的憤怒，不想傷害那個抱怨的人。只因不想傷害，有人寧可選擇離家出走。常常選擇抱怨的人，小心有一天，你的同伴會逃走！"
  },
  "374": {
    "id": "希望新生-心之勇士013",
    "title": "在波折中成長",
    "content": "事情發生後，省下抱怨的時間、體力，積極思考改善的方法，譬如：我遇到了什麼問題？應如何改善？何時改善？能幫我的助緣是什麼？我真的想改善嗎？如果讓我們的心處在積極思考的狀態，努力把損失降到最低，就一定會收穫成長。久而久之，我們會不怕被挑戰，因為每一次波折，都讓我們收穫勇氣和智慧，甚至因此結交良師益友，體驗精彩人生。"
  },
  "375": {
    "id": "希望新生-心之勇士014",
    "title": "面對痛苦的選擇",
    "content": "世上的人們，都會經歷痛苦的磨鍊，有人選擇在痛苦中沉淪，有人選擇在痛苦中崛起。"
  },
  "376": {
    "id": "希望新生-心之勇士015",
    "title": "別讓淚水淹沒心志",
    "content": "哭泣的時候，淚水模糊了雙眼，那因痛苦而流下的淚水。在傾訴內心的時候，也希望能夠適度，不要選擇在悲傷中沉溺太久。過度悲傷，不是個好習慣，一者傷身，二者傷心，三者傷害關心你的人。"
  },
  "377": {
    "id": "希望新生-心之勇士016",
    "title": "自心之刺",
    "content": "我們真正的痛苦，其實就是貪瞋等的煩惱，究其根本原因，並不是別人造成的。真正的痛苦之刺，是自心的無明啊！"
  },
  "378": {
    "id": "希望新生-心之勇士017",
    "title": "為人生負責的方法",
    "content": "誰來為自己的不幸負責呢？誰又可以負責呢？當我們慢慢長大，必須為自己的人生負責。如何負責？在當下，每一個當下，改變苦因、種樂因。"
  },
  "379": {
    "id": "希望新生-心之勇士018",
    "title": "改變苦受的念頭",
    "content": "如果你心裡裝滿了某一個人對你的傷害，而你又不得不每天面對他，也許你應該靜下心來想一想他曾經有幾多善意、有幾多貢獻？在你遭遇諸多痛苦時，他可曾有幾多陪伴？"
  },
  "380": {
    "id": "希望新生-心之勇士019",
    "title": "重新書寫記憶",
    "content": "記憶可以重新書寫嗎？當我們經歷了一段歲月，我們心中滿是苦楚，可否在這痛苦歷程中成長？找到一些希望和收穫，別讓痛苦白白折磨自己。成長，是生命的重要課題。"
  },
  "381": {
    "id": "希望新生-心之勇士020",
    "title": "給困難下正確的定義",
    "content": "當安立了一個正確目標，在完成它的過程中遇到困境時，我們要給它下一個正確的定義：「這是我遇到的困難，不是我做不到。」不能只因遇到困難，就直接否定自己內心的力量。"
  },
  "382": {
    "id": "希望新生-心之勇士021",
    "title": "事情總有辦法解決",
    "content": "不要讓自己輕易進入失望或絕望的消極心態，事情總是有辦法解決的！不要把時間浪費在痛苦上，趕快行動！讓我們一起來努力解決！久了之後，會轉變成另一種習慣，成為一個非常積極進取而且幸福的人。"
  },
  "383": {
    "id": "希望新生-心之勇士022",
    "title": "從負面思路中突圍",
    "content": "痛苦是纏人的軟鏈，在不經意時，我們已經被團團圍困，鋪天蓋地的負面思路，有如疼痛般蔓延。我們必須掙脫這痛苦的束縛，衝出負面思路的包圍，一定要提起正念。哪怕那正念細如毛髮、小如芥子，也都珍貴無比。只要它出現，就是拯救。"
  },
  "384": {
    "id": "希望新生-心之勇士023",
    "title": "撥開心眼的翳障",
    "content": "病人將眼睛上的翳障撥掉，便可見大千萬種風光；訓練自己，讓心眼明亮，看清內心的種種，哪怕是發現了自己的缺失和改善的方向，也大有醒悟的明媚之感。"
  },
  "385": {
    "id": "希望新生-心之勇士024",
    "title": "解開傷痛的繫繩",
    "content": "繞著一種傷痛，走它千百回，終歸是在原地，沒有長進。可否拋掉舊習，離開繫驢樁，奔向開朗的人生？"
  },
  "386": {
    "id": "希望新生-心之勇士025",
    "title": "與其憂傷不如行善",
    "content": "用反覆憂傷的時間去做個善行吧！比如去幫忙一個痛苦的人，不然也只是在自己的痛苦裡消磨了人生。光陰是寶貴的，與其用憂傷糟蹋自己，不如行善，留下黃金般的記憶。"
  },
  "387": {
    "id": "希望新生-心之勇士026",
    "title": "堅持正念見光明",
    "content": "當負面思路如狂風惡浪般襲來，我們應堅定地朝向正向的作意，將自己的正念分分延續、秒秒堅持。只要堅守正念、絕不放棄，希望的日輪，一定會在心中升起。"
  },
  "388": {
    "id": "希望新生-心之勇士027",
    "title": "拒過嚼蠟人生",
    "content": "思念眾生之苦，才下眉頭又上心頭，便發願成佛作祖，以慰群生。耽著自己的苦樂，終日長噓短嘆，苦不堪言，虛耗人生，豈不味同嚼蠟？"
  },
  "389": {
    "id": "希望新生-心之勇士028",
    "title": "讓不如意過去吧！",
    "content": "白雲輕輕飛過去了，流水潺潺流過去了，那件事也早已消失在昨天。很多事就那樣過了，可否揮揮手，讓不愉快飛走？"
  },
  "390": {
    "id": "希望新生-心之勇士029",
    "title": "加油！傷者，痊癒吧！",
    "content": "對方真的錯了，而你選擇大家還要在一起生活，你堅忍地承載著傷害的重壓，繼續履行著生命賦予我們的責任。你辛苦了！可否不要把那件別人做錯的事在心裡一遍一遍地想？想一遍就像喝一遍痛苦的毒藥，這樣串習的話，那個痛苦只會刻得更深。不妨用一種重新開始的心情面對，積極在每一個緣起下，去創造新鮮的善業，讓生命重新煥發創造的活力，迅速地癒合傷口，健步而行。加油！你可以的！"
  },
  "391": {
    "id": "希望新生-心之勇士030",
    "title": "探索感受後的見解",
    "content": "感受不是憑空而出的，它是源於一種見解，所以要去探索感受後面的這個見解。讀聖賢書，與良師益友交談，認真觀察、練習，改變造成苦受的那個見解，即是一見解千愁。"
  },
  "392": {
    "id": "希望新生-心之勇士032",
    "title": "遇見更完美的自己",
    "content": "找一本心靈的教科書，照著讀下去、修鍊下去，就會遇見更完美的自己。"
  },
  "393": {
    "id": "希望新生-心之勇士033",
    "title": "享受閱讀的沉靜",
    "content": "飛機上，總會發現有長者手不釋卷；在公園的大樹下、長椅上，也有人津津有味地讀著紙本的書。他們的神情專注，和周圍的景物構成了一幅畫。那幅畫，是沉靜的、安詳的，甚至是愉悅的。"
  },
  "394": {
    "id": "希望新生-心之勇士034",
    "title": "書房內的聚會",
    "content": "如果你去一個人家裡串門，你最想看他們家哪個房間？我最想去他們家書房。大家聚在一起，人手一冊，靜靜地看書，這樣的聚會是不是會有別樣的樂趣？"
  },
  "395": {
    "id": "希望新生-心之勇士035",
    "title": "發掘心靈之美",
    "content": "心靈就像一本書，假以時日，潛心閱讀，會發現那本書裡藏著很多秘密、很多美麗、很多動人、很多意想不到的奇遇。"
  },
  "396": {
    "id": "希望新生-心之勇士036",
    "title": "學習聖人之學",
    "content": "明了自心的問題，是需要認真觀察的。而這種觀察，應始於一個正確的見解。而這正確見解的來源，最可靠的是學習聖人之學。"
  },
  "397": {
    "id": "希望新生-心之勇士037",
    "title": "收穫一方寧靜",
    "content": "心從鬧哄哄的嘈雜中走入一間靜室，好像在高溫的天氣裡走到大樹下，綠蔭如蓋，陣陣清涼，會讓我們的頭昏腦脹漸漸解除。我們會發現我們原來很緊張、很掙扎、思考混亂，而這時才能真實地感覺到自己在做什麼。坐在樹下，觀察自己，心裡那些亂飛的、亂叫的思路，像一隻鴿子般安靜下來，靜靜地俯在草地上。此時，我們能收穫一方寧靜。"
  },
  "398": {
    "id": "希望新生-心之勇士038",
    "title": "喝茶之道",
    "content": "喝茶的時候，看著茶葉在水中慢慢落下、片片落下，所有的茶葉都落在了杯底。如果讓浮躁時時落下，我們的心就如處在溫柔的水波中，滋潤甘甜，品嚐生命的回甘。"
  },
  "399": {
    "id": "希望新生-心之勇士039",
    "title": "聽聞法音靜心波",
    "content": "能否從忙碌的事項上迅速地切換到聽法的頻道？當法音響起，我們的心不由自主投入其中，像一個隔離帶；忙碌的內心荒漠，被聽法的綠茵隔離了。我們從戰火硝煙的奔命中，進入了無事的和平境界。法音，如一顆神奇的明珠，令翻滾的內心之水，迅速地平靜、澄清。"
  },
  "400": {
    "id": "希望新生-心之勇士040",
    "title": "正念能過千重關",
    "content": "憂傷之習，助不得；淒神寒骨處，留不得。應起身早早振作，換作積極思路，但凡那思路啟動，便如春風暢意。乘正念之風而行，輕舟已過千重難關。"
  },
  "401": {
    "id": "希望新生-心之勇士041",
    "title": "選擇善樂人生",
    "content": "回憶，用心去想某件事、畫面、聲音、想法。我們習慣看悲劇還是喜劇？如是悲劇，看完後，痛楚悲憤，想找人算帳，花了時間，又串習了別人的錯，結果毀了今日的時光！如發現自己又放錯片子，趕快停下來！改換頻道，開啟善樂的航程吧！畢竟心可為地獄，亦可作天堂。"
  },
  "402": {
    "id": "希望新生-心之勇士042",
    "title": "放掉自我更幸福",
    "content": "若只關注、憐愛自己，覺得自己最重要，小小境界之刺，便會導致痛苦萬狀，那正是縱容我愛執的結果，真是苦難無窮；若移些目光，開始關注他人，注視到更廣闊的生命，試著開始看重別人的苦樂，幫忙需要幫助的人，也許境界並沒有變，但面對境界的那個自己就會好過多了。在每一次歷事練心中，我們終將見證自己的成長！"
  },
  "403": {
    "id": "希望新生-心之勇士043",
    "title": "小心毀滅性的概念",
    "content": "「你是不是不太在乎我？」這個概念一旦入心之後，就在一切境界中發芽，碰到什麼都往這兒想，憂傷便尾隨而至，這實在是一場與他人關係的浩劫！這浩劫，始於一個毀滅性的概念。"
  },
  "404": {
    "id": "希望新生-心之勇士044",
    "title": "狹隘的監獄",
    "content": "我們的眼界是非常狹小的，耳朵也只能聽到很少的部分。如果只憑眼睛看到、耳朵聽到的東西，而不以正理觀察的話，那生命將有如鎖在監獄裡面一般。"
  },
  "405": {
    "id": "希望新生-心之勇士045",
    "title": "選擇向上的習氣",
    "content": "在任何時候選擇向上一步，久了之後自然會養成一種勇悍的習氣：知道困難是暫時的，因為那麼多困難我都穿越了，為什麼眼前這個不能穿越？"
  },
  "406": {
    "id": "希望新生-心之勇士046",
    "title": "俐落地斬斷煩惱",
    "content": "遇到困難時，就想要找其他的理由裹足不前，甚至想逃跑，或者乾脆在苦裡沉淪，就是不肯向上邁。實際上這樣對自己打擊更大，不如直接面對困難，找出解決方式，乾脆俐落地把怯懦的煩惱斬斷！"
  },
  "407": {
    "id": "希望新生-心之勇士047",
    "title": "摧伏忿心開幸福門",
    "content": "摧伏自己的忿心，比起調伏別人容易太多了！而且一開始走上這條路，我們就打開了幸福之門，遠離了瞋恨對自己的禍害。"
  },
  "408": {
    "id": "希望新生-心之勇士048",
    "title": "讓生命遠離苦難",
    "content": "無論我們在這一生中遇到什麼痛苦，都應選擇最正確的方式來改變痛苦的因和果。痛苦是有原因的，了解那個原因，就變得非常重要。在苦果成熟時不再種下苦因，是最明智的選擇，因為只有這樣，將來才會離苦。"
  },
  "409": {
    "id": "希望新生-心之勇士049",
    "title": "踏上栽種善因之路",
    "content": "佛法是智慧之學，教導我們如何從痛苦的泥沼中把腿拔出來，下一步踏在清淨、富饒的綠洲上。而那下一步，便是當下無論苦與樂，都應努力種下善因。善因，是讓生命遠離苦難的條件。"
  },
  "410": {
    "id": "希望新生-心之勇士050",
    "title": "拔除無明之刺",
    "content": "佛陀教誡我們：實際上痛苦是源於我們內心深處的無明！無明是內心對事物顛倒的認知，產生了錯誤的判斷，而導致種種痛苦。如果內心這根無明之刺不拔掉，我們永遠都體會不到無苦的快樂。"
  },
  "411": {
    "id": "希望新生-心之勇士051",
    "title": "無限生命的希望",
    "content": "正因為問題出在我們自心，所以無限的生命就有無限的希望！因為當下就可以知道：我這一念對不對？有沒有純淨的發心？把握住當下一念，也就把握住未來的幸福。"
  },
  "412": {
    "id": "希望新生-心之勇士052",
    "title": "苦樂自己作主",
    "content": "在自心上尋找苦因的時候，恰恰是給了自己一條生路，因為這件事是我可以作主、可以滅除的。如果痛苦的因是長在別人心裡，可能不知道該怎麼辦，但正因為是在我心裡，自己學會了滅苦的方法，就可以滅除苦因，這叫「凡事求諸己」。"
  },
  "413": {
    "id": "希望新生-心之勇士053",
    "title": "扼住痛苦的咽喉",
    "content": "痛苦怎樣才能止息呢？必須發起對治力。痛苦是從哪兒開始的呢？心上的念頭。控制心念就可以扼住痛苦的咽喉，不讓命運墮到最苦的地方。"
  },
  "414": {
    "id": "希望新生-心之勇士054",
    "title": "真正的問題不在外境",
    "content": "真正的問題，究其根本原因，都不是出在外境上。我們總覺得是外境出了問題，所以拚命地改變外境，以擺脫痛苦。不管外境出現什麼，如能專注於內心對外境的認知，認真觀察真正的問題以及解決之道，我們便離幸福不再遙遠。"
  },
  "415": {
    "id": "希望新生-心之勇士055",
    "title": "決定心念的方向",
    "content": "苦樂跟什麼有關係？業。業跟什麼有關係？身語意。而最先造業的是什麼？是心念。心是怎麼造業的？就是面對一件事情時，我們的看法，會決定心念的方向；如果朝的是善業的方向，將結出令人喜樂的結果；如果是朝惡業的方向，收穫的則是哭泣、憂傷的苦果。"
  },
  "416": {
    "id": "希望新生-心之勇士056",
    "title": "轉念對付絕望",
    "content": "想到絕望並不一定是絕望，只是你還沒有找到對付這種絕望的辦法。其實一轉念就是另一番風景，一轉念就是另一種人生。"
  },
  "417": {
    "id": "希望新生-心之勇士057",
    "title": "良師心慈愛心",
    "content": "一位在佛法上真正的老師，可以成為你心裡永遠的皈依處。不管你的人生經歷什麼風霜，在任何時候，他都會用滿滿的慈愛始終如一地關注著你、用清晰的智慧引導著你。"
  },
  "418": {
    "id": "希望新生-心之勇士058",
    "title": "修鍊歡喜心",
    "content": "歡喜心是可以修鍊的。當我們步入晨光中，瞥見頂著露珠的綠葉、枝頭上婉轉歌唱的鳥、行色匆匆的人們……可否給他們歡喜的笑容、美麗的祝福？"
  },
  "419": {
    "id": "希望新生-心之勇士059",
    "title": "降伏心中四魔",
    "content": "《般若經》中提到有四魔—煩惱魔、天子魔、死魔、五蘊魔。這些魔從哪兒來？根本是心魔。佛法最有魅力的地方，就是它瞄準了我們的心，降伏了內心，一切魔類都不能危害了。"
  },
  "420": {
    "id": "希望新生-心之勇士060",
    "title": "注入真誠的訊息",
    "content": "每天有多少次回覆他人的訊息？如果在每一次回覆中，都有一個潔淨的發心，將自己的真誠心力注入其中，願一切變得美好！這也是一種修鍊。"
  },
  "421": {
    "id": "希望新生-心之勇士061",
    "title": "情緒的倉儲",
    "content": "憂傷憂傷加憂傷，會成為一種累積；憤怒憤怒再憤怒，會成為一種累積；快樂快樂再快樂，也會成為一種累積。你更願意在你的倉儲中，看到哪種積蓄呢？"
  },
  "422": {
    "id": "希望新生-心之勇士062",
    "title": "生死事大",
    "content": "平常這些林林總總、芝麻綠豆的事，有時我們會覺得比天還大，但是真正比天還大的事就是生死。生死要是用空性解脫了，還有什麼重擔能把我們壓得這麼透不過氣來？"
  },
  "423": {
    "id": "希望新生-心之勇士063",
    "title": "財富在心唾手可得",
    "content": "一旦我們意識到痛苦的根本是在內心深處，應該會很振奮，也會很開心吧！如果是藏在海洋裡就比較麻煩，因為海洋太大了，很難找。如果是在心上，那只要我下定決心，就可以找到痛苦的因在哪裡，把它去除掉；比騎腳踏車還簡單，不費什麼錢，就可以賺到超過萬兩黃金的快樂。"
  },
  "424": {
    "id": "希望新生-心之勇士064",
    "title": "光陰中的無悔",
    "content": "萬里長空，潔淨無染，大雁成行，奮力飛翔，何處是心靈的故鄉？瑣瑣碎碎也罷，大是大非也罷，人生總有珍貴價值。在輕輕流動的光陰中，我們做了多少無悔的事？"
  },
  "425": {
    "id": "希望新生-心之勇士065",
    "title": "不妨且行且懺",
    "content": "有些錯誤可以彌補，有些卻只能扼腕嘆息。人生在世，孰能無過，且行且懺，過失宜減不宜增，如能常常勤拂拭，便能將心鏡漸漸擦亮。"
  },
  "426": {
    "id": "希望新生-心之勇士066",
    "title": "播下發心的種子",
    "content": "有些事力所不能，但可發心。發心，不需要一分錢。就像在路邊，灑下野花的種子，待明年春來，便有花開。"
  },
  "427": {
    "id": "希望新生-心之勇士067",
    "title": "感恩的眼處處皆美",
    "content": "司空見慣的事，就一定會麻木嗎？媽媽每天為我們做早餐，老師每天為我們上課，日月星辰每天為我們帶來光明，如能用感恩的眼睛凝視人生，心中會有幾多溫暖、幾多歡喜！"
  },
  "428": {
    "id": "希望新生-心之勇士068",
    "title": "心之柔風",
    "content": "微風吹拂，總令人愜意；狂風掃蕩，暴雨傾盆，也讓人痛快。可內心的瞋恨之風，卻有如颶風過境，毀壞善的林苑，掃蕩美的城鎮，不可稍縱！不可發動！心中瞋恨，應用二字：「止、息」。應興慈悲之柔風善意，行於天地，暖於人間。"
  },
  "429": {
    "id": "希望新生-心之勇士069",
    "title": "去除憂惱的力量",
    "content": "像月亮一樣圓滿、皎潔的慈悲心，能帶給憂惱的眾生清涼，讓這個世界變得聖潔。"
  },
  "430": {
    "id": "希望新生-心之勇士070",
    "title": "想為他人做什麼的心",
    "content": "寫在眼睛裡，表現在臉上，或隱藏在語言中—他人的痛苦如果留心觀察，便可略知一二。當我們意識到旁邊有一個痛苦的人，會不會想說些什麼，或為他做些什麼，甚至只是真誠地微笑一下？那一刻，這個世界不是很美麗嗎！"
  },
  "431": {
    "id": "希望新生-心之勇士071",
    "title": "心中的繁花美景",
    "content": "認真地凝視一朵花在夏日的風中輕輕搖曳的時候，柔和像花香一般從我們的眼中、從嘴邊的微笑中蕩漾開來。繁花有如我們心中的善意，當它在心內盛開，我們的整個人就向這個世界傳遞慈悲的馨香。"
  },
  "432": {
    "id": "希望新生-心之勇士072",
    "title": "人群中的寧靜之地",
    "content": "你的眼是柔和親切的，你的笑容是發自內心的，你的話語那般真誠，你在人群中，呵護著周邊的一切。走進你，就走進了溫暖，走進了調柔，走進了靈魂的寧靜。"
  },
  "433": {
    "id": "希望新生-心之勇士073",
    "title": "慈悲若春風",
    "content": "慈悲，像和煦的春風般，吹開了人們心中的善意、臉上的笑容。"
  },
  "434": {
    "id": "希望新生-心之勇士074",
    "title": "思想和語言的奇蹟",
    "content": "思想和語言，都會創造奇蹟。慈悲的思想和語言，更會深刻地饒益自他。"
  },
  "435": {
    "id": "希望新生-心之勇士075",
    "title": "打開心扉迎進光明",
    "content": "慈悲有如光束，驅走孤獨痛苦的幽靈。慈悲之人，將他的心打開向宇宙。宇宙的光明，便灑進他的心。"
  },
  "436": {
    "id": "希望新生-心之勇士076",
    "title": "代人受苦的心",
    "content": "當我們深受一種痛苦的折磨，我們可以在苦受中陷得更深，也可以有一種思路：在感受痛苦時，立刻想到所有和我同病相憐的生命，願他們所受的痛苦，我能代受，而把沒有苦受的善業之樂布施給所有的人。在痛苦的時候，心中浮現這樣的念頭，有如苦海升起的第一縷光明。待那光明日益壯大，便可成為慈悲的日輪，遍照苦受之海。那海的每一滴水，都溢滿慈悲之光，因慈悲而奪目，成為晶瑩之海。"
  },
  "437": {
    "id": "希望新生-心之勇士077",
    "title": "助人之心最珍貴",
    "content": "不論你遇到痛苦也好、快樂也好，別人讚美也好、否定也好，遇到能幫人的機會，不可失去助人之心。雖然助人的方式，需要審慎考慮，但助人之心，卻彌足珍貴！"
  },
  "438": {
    "id": "希望新生-心之勇士078",
    "title": "行走間的感恩",
    "content": "整潔的環境，源於他人的辛勞。我們行走於熙熙攘攘的街頭，腳下的這條路，每天都有人掃過。而他掃的時候，可能流著汗，可能腰很痠，我應珍惜和守護這份整潔。"
  },
  "439": {
    "id": "希望新生-心之勇士079",
    "title": "少用的慈悲",
    "content": "你開始不用或少用塑料製品了嗎？很多人都為地球上越來越多的塑料微粒憂心忡忡，塑料已經威脅到水中的游魚、天空的飛鳥，單單是信天翁的幼兒，因為誤食塑料，每年死去二十萬隻。救救牠們，少用或不用塑料製品吧！"
  },
  "440": {
    "id": "希望新生-心之勇士080",
    "title": "單純的心能量",
    "content": "很多天花亂墜的訊息，紛亂了我們的世界。我們也許只需要了解得到快樂和去除痛苦的訊息，就可以了。也許單純會造就深沉的思考，活潑的發現會釋放我們心的能量，從此生機勃勃、靈動美好。"
  },
  "441": {
    "id": "希望新生-心之勇士081",
    "title": "感恩趁現在",
    "content": "現在用一種方式表達自己的感恩，或打電話、或寫卡片，把自己一直想要感恩的心意，送到那個人的耳畔或眼前。不再拖延、不再找藉口，就是現在！"
  },
  "442": {
    "id": "希望新生-心之勇士082",
    "title": "道歉請勿拖延",
    "content": "現在用一種方式表達自己的歉意，或打電話，或親自登門，用最真誠的心、柔和的態度，說：「我錯了，對不起！請你不要再傷心！」不再拖延、不再找藉口，就是現在！"
  },
  "443": {
    "id": "希望新生-心之勇士084",
    "title": "孤兒的傷痛",
    "content": "曾經遇到一個孤兒，他最大的人生目標，就是找到他的父母親。從他懂事開始尋找，找到了四十歲，還沒找到。他身為人而不知父母是誰，不能凝視父母的眼睛，不能聽他們說一句愛自己的話，誰能理解這種傷痛的深度？他們又是懷著怎樣的心，看著那些擁有父母又天天抱怨的孩子？"
  },
  "444": {
    "id": "希望新生-心之勇士085",
    "title": "飲食中的感恩心",
    "content": "一杯淨水，一桌佳餚，但思來處實屬不易，豈能麻木受用？這個世界，還有很多生命，為一杯淨水、一桌佳餚，拚死拚活。古詩云：「誰知盤中飧，粒粒皆辛苦。」可見從古至今，生命賴飲食而生存，但思飲食來處，誰能不感恩在心。"
  },
  "445": {
    "id": "希望新生-心之勇士086",
    "title": "美妙的習慣",
    "content": "給予快樂、拔除痛苦，是美妙的習慣。任陰晴圓缺、人事紛擾，若此心常在，便如皓月常明，朗耀人生。"
  },
  "446": {
    "id": "希望新生-心之勇士087",
    "title": "選擇只有一個",
    "content": "無論是快樂的境界來臨了，還是痛苦的境界來臨了，我們的選擇只有一個，什麼？造善業。快樂來了也不能造惡業，痛苦來了也不能造惡業，為什麼？原因非常簡單，有因果。什麼叫因果？只要這個因出生，在你還沒有對治它之前，果報一定跟著來，這就是因果。"
  },
  "447": {
    "id": "希望新生-心之勇士088",
    "title": "總結的學問",
    "content": "總結是很重要的事情，千萬不能草草結論。應認真在自己的生命經歷中找出動力、找出趨向於善的力量、找出人性的美好。"
  },
  "448": {
    "id": "希望新生-心之勇士089",
    "title": "萬物的貢獻",
    "content": "當我們用感恩的眼睛向四方環顧，我們會發現：樹貢獻了它的綠蔭、花貢獻了它的芬芳、父母貢獻了他們的慈愛……而我自己要為這一切貢獻什麼呢？"
  },
  "449": {
    "id": "希望新生-心之勇士090",
    "title": "想畫什麼樣的面貌",
    "content": "如果你用畫筆，細細地畫出一尊菩薩像，在描繪的整個過程中，你的心想著如何表現菩薩的慈悲；如果你用畫筆，畫一個凶神惡煞，每一筆都要考慮怎樣顯示他的凶殘、恐怖。臨摹誰，想畫誰，就會像誰。問問自己的心：想畫誰呢？"
  },
  "450": {
    "id": "希望新生-心之勇士092",
    "title": "思考力如金剛鑽",
    "content": "思考力，像一個金剛鑽石的鑽頭，帶著我們超越感受，向生命深度理性的狀態沉浸下去。我們會慢慢地擺脫對表面現象的執著，去觀察正理。這樣的觀察，帶著深度洞悉的力量，直面迷惑。"
  },
  "451": {
    "id": "希望新生-心之勇士093",
    "title": "拒當境界的奴隸",
    "content": "如果外面一出現不順心的事我就不高興，那我就完全是被境界左右的一個奴隸。"
  },
  "452": {
    "id": "希望新生-心之勇士094",
    "title": "做該做的事就是成長",
    "content": "我們要訓練自己、為難自己，去做那些「該做可是自己不喜歡做」的事情，要學會去控制「想做卻不該做」的事情；有些事你不想做，但是應該做的就去做，這就是成長。"
  },
  "453": {
    "id": "希望新生-心之勇士095",
    "title": "放大眼界事情便不同",
    "content": "有時我們的眼界，縮為一個針尖，鋒利地盯住眼前的事情，便覺眼前的事情非常地刺目、難以招架。可是一旦把這件事放在一生中去看待，甚至放在生生世世的旅程中去看待，甚至放在芸芸眾生中去看待，甚至把這件事放在聖者的眼前去看待，那這件事又會變成怎樣呢？"
  },
  "454": {
    "id": "希望新生-心之勇士096",
    "title": "心放寬路便顯現",
    "content": "一旦心慢慢地沉靜，會感到心好像寬廣很多，思路就會出來，眼前那道題就難不倒你了；越是急，越會攪成一團，越是沒有出路。"
  },
  "455": {
    "id": "希望新生-心之勇士097",
    "title": "在痛苦中提升心靈",
    "content": "痛苦，對我們的生命會有幫助嗎？痛苦除了折磨我們，還有其他用處嗎？可否在痛苦中昇華自心，看看這個痛苦教會了我們什麼？在疼痛的時候，我們也必須抽出心力思考；一旦思考，我們會特別在乎在這一場摧殘中我收穫了什麼？我的慧力，我對他人的同理心有增加嗎？當一扇門關閉時，我們可以打開另一扇門。"
  },
  "456": {
    "id": "希望新生-心之勇士098",
    "title": "命運解碼在自己手中",
    "content": "生命中發生了什麼事，這確實很重要，但還有更重要的—發生事情的時候我們在想什麼？這件事才是命運本身。如果命運的解碼就在自己手裡，那就不用無語問蒼天了。如果透過努力改善自心，生命真的可以越來越好，那麼為什麼要怨天尤人？"
  },
  "457": {
    "id": "希望新生-心之勇士099",
    "title": "從委屈中解放自己",
    "content": "離苦得樂的第一要點是正知見，就是在自己特別委屈、受傷的事情上，學習停止報復、傷害，從種種想要得到別人償還的思路和行為中，把自己解脫出來，甩掉報復的重擔。"
  },
  "458": {
    "id": "希望新生-心之勇士100",
    "title": "決斷對境造善",
    "content": "對境造善業是我們要決斷的，不管這個境是什麼，我要造的是利益他人的業。如果養成這種習慣，就一定會成為一個幸福的人。"
  },
  "459": {
    "id": "希望新生-心之勇士101",
    "title": "怕苦不能離苦",
    "content": "困境中需要的是毅力和勇氣。一旦我們在遭遇挫折的時候，只想到難，負面的思路蜂擁而至，以為不去面對苦就會變小，那麼我們的生命就會陷入泥沼，在困境中越來越沒有膽量、越來越萎縮。可是生命中的苦，不會因為我們怕就不見了，必須提起心力去超越它。"
  },
  "460": {
    "id": "希望新生-心之勇士102",
    "title": "多多吸取正能量",
    "content": "好事聽多了，會不會感覺好像要飛？難過的事、不好的事想多了，會覺得走不動路、沒力氣吃飯，甚至沒力氣睜開眼睛。如何擺脫心靈的重壓呢？多多吸取正能量，就好像綠葉在吸收陽光一樣。對待事情一定要看到它的積極面，這樣的思路，會大大增加我們的免疫力，讓我們的身心像健康的小樹一樣，滿照著陽光，在大地上精神抖擻。"
  },
  "461": {
    "id": "希望新生-心之勇士103",
    "title": "走在美好光明中",
    "content": "當你遇到困境的時候，一定要去想：這件事情的積極面是什麼？養成這樣一個思路之後，你就會很勇敢、很歡喜。因為你的眼睛總是能看見那些美好的、能給生命帶來光明快樂的東西。一直看著那些美好的東西，就會下意識地跟著它，所以你就走在美好和光明中。"
  },
  "462": {
    "id": "希望新生-心之勇士104",
    "title": "利益他人路更寬",
    "content": "當利益他人的心越來越強大時，生命就會越來越寬廣，你所希求的都會一個一個實現。如果只在意自己，就會越來越貧窮，所得越來越少，生命越來越枯燥。"
  },
  "463": {
    "id": "希望新生-心之勇士105",
    "title": "改變「自己」得安寧",
    "content": "與其期待所有的人都不要傷害我，那還不如改變一個人，改掉這個人的思想和行為，自己心裡就會得到安寧。那個人是誰呢？自己！"
  },
  "464": {
    "id": "希望新生-心之勇士106",
    "title": "百分之百的迷思",
    "content": "師父說：「當你覺得自己百分之百對的時候，你就百分之百錯了！」為什麼？因為我們是凡夫啊！怎麼可能在一個對境上完全找不到自己的毛病，都是別人的毛病？一旦我們認為自己百分之百對，我們容易犯下的過失就是對內心失察，對此，修行人要警惕囉！要警惕囉！"
  },
  "465": {
    "id": "希望新生-心之勇士107",
    "title": "放空自我傾聽他心",
    "content": "北國長大的蘋果，很想知道熱帶長大的榴槤在想什麼？如果蘋果一直用北國的溫度去想，永遠也不了解榴槤的生活。可以換位思考嗎？如何在自己的感受裡，去體會一個跟自己經歷完全不同的人的感受？放空自己，專注聆聽。假如我是他，我會怎樣？這樣是否可以靠近他的感受？應專心探索，努力向能者學習。"
  },
  "466": {
    "id": "希望新生-心之勇士108",
    "title": "成為他人的知音",
    "content": "要學習跟別人溝通，體會他人的需要，然後在他人需要的時刻能夠提供幫助。人與人之間如果能努力達成理解，共同成辦善業，就如溫暖的風，會遇春天的花樹，每個人都想看到理解的鮮花盛開，感受春風拂面。"
  },
  "467": {
    "id": "希望新生-心之勇士109",
    "title": "是我愛執的錯",
    "content": "被別人講到自己的痛處時一定會痛嗎？可不可以改變成很歡喜、很期待的事呢？當你被別人刺到苦受現起時，請問是什麼東西被刺到了？是我愛執被刺到了，所以真正的傷痛是我愛執。醫治我愛執，才能免痛。"
  },
  "468": {
    "id": "希望新生-心之勇士110",
    "title": "八正道即快樂道",
    "content": "每一個善念，都是在為自己的未來造就快樂，所以要積極去造作內心的善念、口中的善語、身體的善行。一定要養成正念、正思、正語、正行……，用這些非常光明的理路，去戰勝內心的憂鬱和身體的疾病。"
  },
  "469": {
    "id": "希望新生-心之勇士111",
    "title": "收拾煩惱趁輕時",
    "content": "「煩惱纔出，即用正念之矛數數擊刺」，收拾煩惱必須趁它尚輕微、力氣還沒有長到太大的時候，這一點祈請諸位一定要放在心上。一旦煩惱成習是非常可怕的，一定會令心情不好，而且來生的去處堪慮！"
  },
  "470": {
    "id": "希望新生-心之勇士112",
    "title": "改變生生世世",
    "content": "透過改變內心、改變性格、改變我們對事物的看法，就改變了業；改變業，就改變了苦樂；改變了苦樂，就改變了生命；改變了今生，就改變了生生世世。"
  },
  "471": {
    "id": "希望新生-心之勇士113",
    "title": "修行功夫在覺察",
    "content": "如果覺察力是一把寶劍，那麼拔劍的速度要快！覺察煩惱的速度，要跟昨天的自己比，是幾個念頭才發現在緣想不該想的？能不能立刻停下來？修行的勇士啊，請努力地訓練拔劍的速度，那是成敗的關鍵！"
  },
  "472": {
    "id": "希望新生-心之勇士114",
    "title": "看見世界的善美",
    "content": "如果一天從早晨到晚上都在發現別人很罪惡、自己很無辜，這樣是否有利於行善？我們會不會覺得這個世界很醜惡，這一天過得很悲哀？而觀功念恩就會使我們看到別人的付出、別人的善意，以及那些不為人知、埋藏在人們內心裡的善良。"
  },
  "473": {
    "id": "希望新生-心之勇士115",
    "title": "從經論中得喜悅",
    "content": "如果得到別人的承許和讚美，心中自然多些溫暖和力量；但假如沒有這些，我們也大可不用淒風苦雨。不用別人承許，也不用別人讚美，只要心中裝著佛菩薩的理路，在艱辛困苦中堅定自己的信仰，那些從智慧和悲心所流淌出來的美妙理路，浸潤了幾許，就清涼了幾許；堅持調伏自我，自然喜悅盈心。"
  },
  "474": {
    "id": "希望新生-心之勇士116",
    "title": "打開經論離煩擾",
    "content": "不管外面到底發生什麼、經歷了什麼，打開經典的時候，發現一本書、一本論，好像就把整個世界的嘈雜和喧囂，還有那些傷感、誤解隔離開來，開啟了一個寧靜舒適的內心世界。"
  },
  "475": {
    "id": "希望新生-心之勇士117",
    "title": "耕耘內心的完美世界",
    "content": "經典上的每個字，都在指示我們如何開展內心前所未有的世界，我們老想追逐外面的色聲香味觸，卻荒蕪了自心美麗的田園。如果能夠學會探索內心，就會發現內心的世界比外面的還要美妙、還要豐富多彩！"
  },
  "476": {
    "id": "希望新生-心之勇士118",
    "title": "小善能結大樂果",
    "content": "業增長廣大的道理，雖然會令我們覺得很害怕，因為做了一件小的壞事，如果沒懺悔，會長成一個很大的苦果。但是還有令人振奮的另一面，就是當做了一個很小的善業後，如果不追悔、不用瞋心去破壞它，那麼它將結出不可思議的樂果。"
  },
  "477": {
    "id": "希望新生-心之勇士119",
    "title": "看看佛陀的看法",
    "content": "到底痛苦如何才能夠淨除？人類想了各種辦法讓自己過得快樂，總是不能如願，是不是可以看一看，佛陀是怎樣把痛苦的根本究竟地去除？"
  },
  "478": {
    "id": "希望新生-心之勇士120",
    "title": "聞思教言知取捨",
    "content": "在聞思時，佛陀的教言會落在我們的心上。當我們去面對世間的種種，那些美麗深刻的教言就像晚上的月亮一樣出現，靜靜地照耀我們的生命。雖然是黑夜，我們卻能看清腳下的取捨。那些忽而歡樂、忽而悲哀的情緒泡沬，不再困頓我們。我們穿越了這種泡沫，清澈地凝視內心，安穩地邁出有光明照耀的每一步。"
  },
  "479": {
    "id": "希望新生-心之勇士121",
    "title": "對治煩惱要覺察",
    "content": "人為什麼會執著煩惱？就是因為覺得我有道理，認為這個煩惱是不用對治的，甚至不覺得它是煩惱。因此，對治煩惱最大的關鍵是—要覺察、要了知過患，然後要像光速那樣切斷煩惱，不要再繼續轉，因為煩惱轉深了之後就很難對治。"
  },
  "480": {
    "id": "希望新生-心之勇士122",
    "title": "憤怒時不決斷",
    "content": "憤怒時說的話，事後會後悔的。有人喜歡在生氣時解決問題，可是人憤怒的時候智商會下降，思考模式非此即彼、很狹隘，很難解決棘手問題。最好等心情平靜下來，再談改善的措施。畢竟這樣做更有效、更省力，而且少受傷及傷人。"
  },
  "481": {
    "id": "希望新生-心之勇士123",
    "title": "戰勝退惰的習氣",
    "content": "如果能在每一次怯弱、懶惰、找藉口的種種習氣出現時，把它踩在腳下，朝前走，做一回戰勝自己的人，我們的生命將會領略戰勝自我的喜悅，猶如登高望遠，遍眼遼闊！反之，在困難面前節節敗退，一旦養成退惰的習氣，久而久之，做什麼都沒有勇氣，自己失去了最大利益，無法成辦自他究竟的快樂。"
  },
  "482": {
    "id": "希望新生-心之勇士124",
    "title": "修行最實惠",
    "content": "用一分功，你就得一分力；得一分力，你的現在和未來就更多一分希望和快樂。這件事再實惠不過了，沒有什麼比修行更實惠的事情，絕對沒有欺誑，做多少是多少，因果就是這樣成熟的。"
  },
  "483": {
    "id": "希望新生-心之勇士125",
    "title": "苦時更需造善",
    "content": "什麼叫以苦為道？就是當你實在已經感到非常辛苦、改變環境無能為力時，可選擇改變內心。在苦的時候生一個善念，譬如想一下和我一樣痛苦的人，我要努力去了解真理，去解決自他的痛苦，這即是一個積極的思路。我們內心的痛苦，沒有阻礙我們修行，反而成了修行的助緣。"
  },
  "484": {
    "id": "希望新生-心之勇士126",
    "title": "打敗憂傷的虎豹",
    "content": "憂傷會徹底摧毀我們的戰鬥力，所以做為一個修行人，要徹底打敗憂傷，不管它現在已經成為面前的一隻老虎還是豹子，我們都必須把它制伏！"
  },
  "485": {
    "id": "希望新生-心之勇士127",
    "title": "感恩傷害自己的人",
    "content": "我們要用佛陀的教法，真實地改善自己生命的苦楚，把它全部轉成一種向善的力量。這樣努力下去，我們就會非常感恩深深傷害過自己的人，因為是他讓我們練習把想報復他人的惡念、想對別人不負責任的冷酷，全部用佛法的方式對治掉，只留下滿滿的感恩。"
  },
  "486": {
    "id": "希望新生-心之勇士128",
    "title": "瞋心毀善最嚴重",
    "content": "要控制自己的脾氣，瞋心毀壞善行最嚴重。我們常常會覺得某個人傷害了自己，實際上可能他對你傷害的程度，遠不如你發一頓火來得大。"
  },
  "487": {
    "id": "希望新生-心之勇士129",
    "title": "何不振作斷苦因",
