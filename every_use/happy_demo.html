    "content": "你必須要動腦筋超越絕望的思緒，不能沉淪在其中，要像作戰一樣去考慮對治它的策略。與其整天滿面愁容、哭天搶地、怨天尤人，我們不如選擇想辦法戰勝困難。時間都是這樣過，何不打起精神，在斷除苦因上痛下功夫！"
  },
  "488": {
    "id": "希望新生-心之勇士130",
    "title": "真實之法堪久品",
    "content": "如果它是謊言，走得越近、過得越久，會越覺得空虛；如果它是真實，時間越久、花的功夫越多，越能品嚐其中的快樂。"
  },
  "489": {
    "id": "希望新生-心之勇士131",
    "title": "苦惱也有功德",
    "content": "苦惱也有功德，它可以變成我們生命的養分，有多少苦惱，就能生出多少摧毀苦惱的力量和功德。"
  },
  "490": {
    "id": "希望新生-心之勇士132",
    "title": "別讓憂鬱傷身",
    "content": "整天不高興、傷感，到最後就什麼都做不了了。為什麼？錯誤的思路導致了身心非常無力的狀態，所以不可以小看憂鬱對我們自己的傷害。"
  },
  "491": {
    "id": "希望新生-心之勇士133",
    "title": "把敵人變成朋友",
    "content": "要真實地改變身處的環境，就必須改變自己對人的方式，積極主動地去表達自己的誠意、善意，把對立的關係變成是好朋友。雖然並不容易，但是每個人都不希望自己身處的環境越變越糟，所以都得努力，不是嗎？也許消滅敵人最好的方式，就是把敵人變成朋友。"
  },
  "492": {
    "id": "希望新生-心之勇士134",
    "title": "用智慧充電",
    "content": "要學會給自己充電，充滿希望。用什麼充電？智慧。智慧從哪裡出現？從聞思正確的理路。"
  },
  "493": {
    "id": "希望新生-心之勇士135",
    "title": "超越苦痛長養美德",
    "content": "在感受到強烈的痛苦時，我們是選擇造惡傷害別人，還是選擇忍耐不去傷害別人，完善自己的美德？後者看起來表面上好像失去很多，但是內心經過這個境界的磨鍊之後，會發現在這樣的困境中，自己居然可以堅持行善、長養美德，反倒是得到了更多！"
  },
  "494": {
    "id": "希望新生-心之勇士136",
    "title": "如是因如是果",
    "content": "有人說業力就像向空中撒米一樣，最後都落到自己身上；誹謗別人就像仰空吐口水、迎風舉火，最後會全部都落到自己的身上。"
  },
  "495": {
    "id": "希望新生-心之勇士137",
    "title": "傷害源於思路",
    "content": "別人可以一直罵我們，二十年、三十年，甚至罵一百年好了；那是他的事情，但是否要把罵我們的這一點變成是真正的傷害，全部取決於我們的思路。"
  },
  "496": {
    "id": "希望新生-心之勇士139",
    "title": "奉還也是一種智慧",
    "content": "佛陀說：當有人送給你禮物，你不想要的時候怎麼辦？退還給他。當無理的謾罵撲面而來，我們可以選擇拒絕收下這些謾罵，奉還本人。"
  },
  "497": {
    "id": "希望新生-心之勇士140",
    "title": "幸福的起點",
    "content": "不是對方給了我們多少理解、多少安慰，成為我們幸福的依靠；而是我們自己內心的善意，才是幸福真正的起點。"
  },
  "498": {
    "id": "希望新生-心之勇士141",
    "title": "出來走走吧",
    "content": "北國的夏日，風裡帶著花香，拂過山巒，拂過田野，拂過人們。有多少時光你沒有認真地聞過花香、感受過微風吹拂了？住在鋼筋混凝土的建築物裡，常常與電腦為伴，不要忘記大自然清新的空氣、和煦的陽光，它會撫慰你的心，出來走走吧！"
  },
  "499": {
    "id": "希望新生-心之勇士142",
    "title": "享受愉悅的交談",
    "content": "在快節奏的計劃和忙碌中，偶爾泡杯茶，坐下來跟家人談心一下，關心他們的近況，笑著看著他，聽聽他們的煩心事，甚至是讚美一下他們的進步。一個手捧著茶杯、笑咪咪地看著自己的傾聽著的親人，你會不會覺得那一刻坐在他身邊慢慢地放鬆自己，很愉悅？"
  },
  "500": {
    "id": "希望新生-心之勇士143",
    "title": "面對失業的心態",
    "content": "如果有人失去了工作，不知道該做什麼，先不要慌張，要注意自己的身心狀況，失去健康，比失去錢財更可怕！有了一個好的身心狀況，還可以再找到一個新的工作。不妨練習一下，克服焦慮、沮喪的情緒，多深呼吸，保有健康的心態，是下一個工作必須的條件。"
  },
  "501": {
    "id": "希望新生-心之勇士144",
    "title": "明珠必有識貨人",
    "content": "有人不被老闆賞識，明明很努力，卻感到總是得不到公正的待遇。如果一直去計較得失，就會更加辛苦。不如增加自己的實力，想辦法讓自己的內心變得更強大。如果我們的工作，可以擴大我們服務他人的心量，這即是收穫本身。如果是一顆明珠，早晚別人會發現你的光芒！"
  },
  "502": {
    "id": "希望新生-心之勇士145",
    "title": "讓愛若春意明朗",
    "content": "冬天過了，如果草沒有綠，如果柳枝沒有抽芽、花樹沒有開花，你會覺得這是春天嗎？如果你沒有明白而真摯地說出你對家人的愛與關懷，怎能讓家人明確地感到溫暖呢？怎樣去化解衝突後的冰凍呢？春天的表達是那麼清楚—草綠了，花紅了，水柔了。你的表達呢？"
  },
  "503": {
    "id": "希望新生-心之勇士146",
    "title": "傾聽孩子的話語",
    "content": "一個小小孩，也在用他所有的能力感知這個世界、判斷這個世界，他也很想把他的觀點告訴給大人，他也渴望大人能夠傾聽。可是大人都忙著做什麼呢？提醒他們，教訓他們，讓他們聽話，辛苦地為小孩付出著。可否在某個時間，尊重一下小小生命的看法，讓他們在成長的時候不要感到那麼壓迫？那他們以後也許就不會那麼叛逆了。"
  },
  "504": {
    "id": "希望新生-心之勇士147",
    "title": "參與可以增進責任感",
    "content": "跟孩子一起討論問題的時候，會發現他們的參與度非常高，他們很想參與管理和制定規則。如果這個規矩是和孩子們一起訂出來的，他們就不會覺得是大人在壓迫。參與感，讓他們感覺到自己的力量，在執行規矩的時候也容易負起他自己的責任。"
  },
  "505": {
    "id": "希望新生-心之勇士148",
    "title": "管教不悖關愛",
    "content": "用語言表達關愛，是非常重要的一件事，尤其是要對一個孩子常常表達，包括你在管教他的時候。這樣，他不會產生爸爸媽媽不愛我，或老師討厭我這樣的想法，小孩不會因此感到失去依靠的恐怖和孤單。"
  },
  "506": {
    "id": "希望新生-心之勇士149",
    "title": "小心憤怒的遮蔽",
    "content": "雲，會遮住星空；你的憤怒，也會遮蔽你的慈愛。大人的憤怒，會讓一個孩子感到恐懼，但孩子真的會從你的憤怒中學到什麼嗎？萬一他只學會憤怒怎麼辦？"
  },
  "507": {
    "id": "希望新生-心之勇士150",
    "title": "疼惜幼小脆弱的心靈",
    "content": "對待孩子，請不要在你憤怒的時候對他說過份的話，因為他幼小的心還很脆弱。儘量不要在自己憤怒的時候管教他，因為有可能過頭。等你自己平靜，一定會找出恰當的方式，讓孩子慢慢地學會。"
  },
  "508": {
    "id": "希望新生-心之勇士151",
    "title": "嬌縱讓愛偏失方向",
    "content": "一味地嬌縱孩子，沒有任何的邊界和規則，以為一切他都會自己明白，這樣的小孩和被管得太嚴的小孩，都會出現某種偏失吧！"
  },
  "509": {
    "id": "希望新生-心之勇士152",
    "title": "尊重沒有長幼之別",
    "content": "表達關愛，在尊重孩子的前提下確立原則，當你表示出足夠的尊重，與孩子對話的空間便會變大。孩子需要尊重嗎？很需要的！想想自己小時候吧！"
  },
  "510": {
    "id": "希望新生-心之勇士153",
    "title": "不收錢的愛",
    "content": "有一個小孩，開始思考到價值交換的問題。那天，小孩有點感冒，他發現爸爸給他煮飯，又勸他吃飯，孩子吸了一下鼻涕，對父親講出了心聲：「爸爸，我要去學校告訴所有的人，爸爸給我煮飯又不收錢，爸爸是大傻瓜！」爸爸正端著粥給他吃，控制一下自己，認真地看著小孩說：「我給你煮飯不收錢，是因為我愛你！」"
  },
  "511": {
    "id": "希望新生-心之勇士154",
    "title": "轉逆緣為道用",
    "content": "有人罵我，有一個非常簡單的思路：為什麼他會誹謗我，可能我過去世誹謗他了，這是一個果報的出現。也可以發願：因為你罵我，所以與我有緣共證菩提，我努力學法，將來一定要度你！如果把所有負面的力量，都變成是正面成就無上菩提的力量，那就無須為此而憂悲苦惱。"
  },
  "512": {
    "id": "希望新生-心之勇士155",
    "title": "回首發現的幸福",
    "content": "有的時候幸運來臨時，人們也會莫名其妙地感傷和退縮，因為看起來好像是很痛苦、很危險的事，但是過後回頭一看，才發現：哇！原來是這麼美的一件事。所以不要對眼前的境遇太快下結論。"
  },
  "513": {
    "id": "希望新生-心之勇士156",
    "title": "知錯能改佛所讚",
    "content": "看到自己煩惱所生的過失之後，要馬上改正。佛陀說：有一種人從來沒有過失，那很難得；還有一種人非常難得，就是他知錯能改，佛陀讚美這種人，就像優缽羅花一般地稀有可愛。"
  },
  "514": {
    "id": "希望新生-心之勇士157",
    "title": "懺悔得清涼",
    "content": "在佛陀的教育裡有一個特別的理路，就是懺悔得清涼。如果錯了不道歉，會不會像一團東西塞在心口，讓你很不舒服？但是道歉之後，很多人都馬上覺得如釋重負，因為就好像把欠的債還了一樣。"
  },
  "515": {
    "id": "希望新生-心之勇士158",
    "title": "抉擇慧從佛法出",
    "content": "抉擇，像一雙眼睛，為我們辨別方向，何處應行、何處不應行。如果這雙眼睛欲窮千里目，就要去了解遍智佛陀的智慧。想要了解佛陀的智慧，最好的方式就要去聞思修佛所說的法。"
  },
  "516": {
    "id": "希望新生-心之勇士159",
    "title": "因緣流轉用心當下",
    "content": "實際上因緣是不停地改變的，對我們的生命來說，剎那剎那的念頭都在改變之中，在變化中，讓一切朝著快樂的方向去轉變。我們的雙手，並不能抓住過去，也許放開不愉快的過往，才會注意到當下有很多創造快樂的機遇。"
  },
  "517": {
    "id": "希望新生-心之勇士160",
    "title": "如何度過一生",
    "content": "天天吵著、天天討厭著對方，也是這樣度過一生；天天微笑著、感恩著對方，也是這樣度過一生。那為什麼不微笑著面對他？時光像風一般地前進，相聚的此生還會有多長呢？不要留下太多的遺憾，留下感恩吧！"
  },
  "518": {
    "id": "希望新生-心之勇士162",
    "title": "善待美好的自己",
    "content": "廣泛的十善，猶如良田，長養一切善行。戒律猶如強勁的不老松，高高挺立於生命的原野，頭頂星辰，根深於大地。我們的生命，沐浴行善、律己的德光，每天都珍貴無比！請善待這值遇了教法的美好的自己！"
  },
  "519": {
    "id": "希望新生-心之勇士163",
    "title": "調適心弦路更長",
    "content": "一把琴，琴弦鬆緊適中，才能彈出悅耳之曲。焦灼，就是太緊的琴弦，應小心地調適，不只是忙著衝鋒陷陣，要看看自己當下的狀態是否能走很遠的路，而且儘量減少失誤。柔韌度，是在反覆調適中練就的。如果你常常覺得要崩潰，看看你的心弦是否太緊？"
  },
  "520": {
    "id": "希望新生-心之勇士164",
    "title": "掃除心靈的霧霾",
    "content": "焦慮和憂鬱，是心靈的霧霾，負面思路就像污染的空氣一樣，是它的來源。開始正向思惟吧！看看我們的生命中，有多少美好是被忽略的？有多少他人的恩德是我們沒有念及的？找出心中令我們感恩和歡喜的，常常放在心上想，可以拿筆做記錄，一天記錄十件美好，心靈的空氣就會日漸清新。"
  },
  "521": {
    "id": "希望新生-心之勇士165",
    "title": "一日如花籃",
    "content": "一天，有如一個空籃子，我們應該謹慎選擇放入籃中之物。如果你放入籃中的是朵朵鮮花的話，你提著的便是一籃幽香。"
  },
  "522": {
    "id": "希望新生-心之勇士167",
    "title": "重視親情關懷及時",
    "content": "由於工作太忙，家人感到被忽略。如果一直以自己太忙為藉口，不去注視忽略感給他人造成的傷害，不久就會釀成風暴。花點時間和精力，常常表達自己對家人的關注，這樣就不會突然出現情緒火災，只能沒日沒夜地搶救。"
  },
  "523": {
    "id": "希望新生-心之勇士168",
    "title": "莫輕忽小事積成災",
    "content": "在該問候的時候不問候，該提供幫助的時候不幫助，甚至是該買禮物的時候沒買禮物，甚至想聽一句話、那個人沒說……，我們清清楚楚在帳本中記下這些債務。當債務不停地累積，成為巨額的時候，你會不去討債嗎？你準備用什麼方式討債呢？會評估一下自己討債後的結果嗎？"
  },
  "524": {
    "id": "希望新生-心之勇士169",
    "title": "柔和的魅力",
    "content": "室內柔和的顏色，舒緩著人們的情緒；柔和的臉色，會給他人心靈一個舒適空間。"
  },
  "525": {
    "id": "希望新生-心之勇士170",
    "title": "尊重並非一種技巧",
    "content": "當我們想要對別人坦誠相助，出自一片真心，一定先建立在充分尊重他人的基礎。如果沒法做到尊重別人，很難想到別人會全心接受你的建議。而尊敬他人，並非技巧，而是發乎於內心，行之於容色。"
  },
  "526": {
    "id": "希望新生-心之勇士171",
    "title": "找出共同的目標",
    "content": "這個世界已越來越多緊張、焦慮，在與別人交談處事中，儘量避免讓別人感到壓力。先找出共同目標，再談差異性，往往是一個很好的溝通的開始。"
  },
  "527": {
    "id": "希望新生-心之勇士172",
    "title": "真的表達清楚了嗎",
    "content": "我們常常怪別人缺乏配合，但自己有把問題講清楚嗎？如果別人不明白你的所說、所指，更何談在行為上與你的配合？清晰地表述自己的需要，確定別人聽清楚是蠻重要的。"
  },
  "528": {
    "id": "希望新生-心之勇士173",
    "title": "詆毀他人不明智",
    "content": "自己做了壞事，卻放出謠言先詆毀別人，這麼做的用意是為了保護自己，還是怕別人知道自己的所作？如果這種把戲一再重複，別人也不是傻子，人們會慢慢發現詆毀別人是你的習慣，而你自我的形象也將定格於此。這樣放出謠言的破壞性方式，並非明智之舉，應針對自身問題負責任。我們並不能夠透過謾罵他人而自顯清白無辜。"
  },
  "529": {
    "id": "希望新生-心之勇士174",
    "title": "幽默的安全守則",
    "content": "有人受不了開玩笑，但有人喜歡挖苦別人讓大家一笑。在大眾中，如果很「機智」地損傷別人的自尊而未經他人同意，久之，可能會埋下禍根。幽默，應以自己為主角進行，比較安全。"
  },
  "530": {
    "id": "希望新生-心之勇士175",
    "title": "憤怒將成內心黑霧",
    "content": "緊張憤怒的臉，會讓人有壓力，會讓人害怕，甚至由於一個人緊張，周邊的人也跟著緊張。深呼吸，調整你的緊張，讓你自己從一團黑霧變成一道曙光。"
  },
  "531": {
    "id": "希望新生-心之勇士176",
    "title": "小心習慣成麻木",
    "content": "有位男士對每天回家就可以吃到飯越來越麻木。有一天，他回到家，習慣性地坐在餐桌旁，忽然發現，桌上一捆稻草。這時，他才很驚訝，太太走過來說：「反正你沒感覺，你就吃草吧！」"
  },
  "532": {
    "id": "希望新生-心之勇士177",
    "title": "打掃房間打掃心",
    "content": "在電腦前坐一整天，亂翻一些雜七雜八的消息，最後，心裡會七上八下，彷彿懸在空中，沒有個落處，那是一種不安。當你發現你又坐在電腦前準備消耗時日的時候，有個最簡單的方式――打掃房間。在掃的時候，認真觀察自己打掃的心，隨著屋子越變越乾淨，心也隨著秩序井然。"
  },
  "533": {
    "id": "希望新生-心之勇士178",
    "title": "請深呼吸吧",
    "content": "當你走過樹的時候，樹告訴你要深呼吸；當你看到花的時候，花告訴你要深呼吸；連天空的每一片雲朵都在深呼吸著飄飛，滿世界都是深呼吸的消息，你聽見了嗎？"
  },
  "534": {
    "id": "希望新生-心之勇士179",
    "title": "生命之樹的馨香",
    "content": "玉蘭花開了，大朵的花，白燦燦地在綠樹的枝頭上，陽光下分外耀眼；一朝修成歡喜心，也如那株白玉蘭，純淨的歡悅開滿生命之樹。"
  },
  "535": {
    "id": "希望新生-心之勇士180",
    "title": "生死中唯法可依",
    "content": "因為有死亡，身體是不能帶往來世的，它是像瓦器一樣脆弱不可依靠的東西。不用在身體之上安立什麼很堅固的執著，因為它就是會壞、就是會老、就是會變。在生與死的思考之中，我們要非常清楚――唯有「法」，才是永久的依靠！"
  },
  "536": {
    "id": "希望新生-心之勇士181",
    "title": "出離輪迴的明燈",
    "content": "「燈」字意喻著光明、溫暖，在輪迴的暗夜裡，佛陀的悲心就像一盞明燈，照耀著六道輪迴的苦難有情，也引領著我們朝著出離六道的方向，向永遠拔除一切痛苦的方向前行。"
  },
  "537": {
    "id": "希望新生-心之勇士182",
    "title": "光明的發心",
    "content": "一件事情的開始，就像一天的開始—旭日東升，我們要有光明的發心。這光明的發心，會讓我們所做的事從光明中開始。綠樹紅花，猶如周邊的環境。我們不能忽略我們的合作伙伴，很多事都要靠眾人成辦。在做事的時候，不忘善心，你本身就如在晨光中綻放的花朵，自己懷有馨香，也是他人眼中的一道美麗風景。"
  },
  "538": {
    "id": "希望新生-心之勇士183",
    "title": "每步登頂路都有意義",
    "content": "努力地發心利他之後，應常常憶念發心的勝利，這就有如登山的時候，常常遙望在雲霧繚繞中的美麗峰頂。為了一朝凌絕頂，我們每一步堅忍的攀登，那灑下的淚水和汗水，都具有非凡的意義。每一步、每一步，都在生命的征程中，留下了為利他而努力的珍貴足跡。"
  },
  "539": {
    "id": "希望新生-心之勇士184",
    "title": "探尋真理最快樂",
    "content": "世上最大的快樂是探尋真理，不是欲望的滿足；探尋真理會帶給人類生命第一等的快樂。"
  },
  "540": {
    "id": "希望新生-心之勇士185",
    "title": "久品正法妙味",
    "content": "佛法的味道就是要慢慢地品嚐，像喝茶一樣，煮水、洗茶、泡茶，將那一注清香的茶水緩緩注入杯中，再靜靜地端著那一杯暖熱在手中，慢慢地品嚐，體會到它的初味、中味、回味。這所有的過程，一旦馬虎、草率，便不得其味，它是一種要永久品嚐的正法馨香；每一個起心動念的觀察、抉擇、調伏，就像一道一道品茶的工序，徐緩清晰，莊嚴靜美。"
  },
  "541": {
    "id": "希望新生-心之勇士186",
    "title": "清心若水可映月",
    "content": "真理並不選擇美醜貧富，就像月亮並不選擇是江是海還是湖，甚至是院子裡的水盆，只要是有清水，月亮便投影其中。將自己化為那柔柔清水吧！"
  },
  "542": {
    "id": "希望新生-心之勇士187",
    "title": "善念若雪能覆大地",
    "content": "潔白的、晶瑩的雪花，一朵一朵飄落下來，從天空冉冉而降。每朵雪花，那麼輕、那麼小，誰能想像會慢慢地覆蓋大地、覆蓋屋頂、覆蓋樹林，直到整個世界一片銀白。我們的善念，雖然很小、很輕，但當它不停地生起、不停地生起，也會瀰漫整個相續，成為皎潔的心、皎潔的世界。"
  },
  "543": {
    "id": "希望新生-心之勇士188",
    "title": "讓心燈照亮世界",
    "content": "聖者之心，如照世明燈，先教人覺察自心，明了種種得失、禍福的因由，人們便可以修改痛苦及痛苦的因，廣種快樂及快樂的因。如能潛心聖人之學，便是點亮自己的心燈。這盞燈會照亮自己，也會照亮他人。有一天，會照亮世界。"
  },
  "544": {
    "id": "希望新生-心之勇士189",
    "title": "守護自他心中的善",
    "content": "不但守護自己心中的善，也守護、啟發他人心中的善，這是我們做為人，來到這個世界上最美麗的一件事情。因為能夠使自己和他人變得越來越善良、越來越慈悲，就像手捧著光明的燈盞，永遠在傳播著希望。"
  },
  "545": {
    "id": "希望新生-心之勇士190",
    "title": "輕鬆修行之道",
    "content": "搬一個一百斤的石頭和搬一個兩公斤的石頭，哪一個更輕鬆？剛掉進水裡的木頭和已經泡了十天的木頭，哪一個更容易打撈？對付煩惱也是一樣。心力不要等到已經完全沉淪時再想把它提起來，那會非常艱難；一定要在稍微沉沒的時候就將之提起，這樣的話修行就很輕鬆！"
  },
  "546": {
    "id": "希望新生-心之勇士191",
    "title": "修行自己的利益",
    "content": "修行自己是我們最美的方向。當我們精勤地看清自己、了解自己、徹悟自己，將心中增益或損減的過失去除，有如去掉蓋住眼睛的黑布，我們將看到朗朗乾坤，那即是生命呈現出前所未有的大智、大悲、大力的圓滿狀態。"
  },
  "547": {
    "id": "希望新生-心之勇士192",
    "title": "二六時中觀心為要",
    "content": "作為一個修行人，踏實地改變自己的業是非常重要的。能不能不偷懶放水，真的以降伏煩惱做為最重要的事情？「二六時中，唯應觀察自心，豈有餘事？」觀察自心做什麼？捨惡取善。"
  },
  "548": {
    "id": "希望新生-心之勇士193",
    "title": "為治煩惱須廣學",
    "content": "為什麼要學這麼多佛法？因為煩惱太多了、痛苦太多了，我們要對付自己的痛苦，就需要特別多的正理。"
  },
  "549": {
    "id": "希望新生-心之勇士194",
    "title": "利眾永遠利己",
    "content": "利益眾生的事情，從來都是利益自己的，有時候看起來好像自己有損失，實際上是傷害了以自我為中心的惡習。私欲只能給我們生命帶來痛苦和無盡地遺憾，所以棄捨私欲，堅持利益他人吧！"
  },
  "550": {
    "id": "希望新生-心之勇士195",
    "title": "真誠的祝願",
    "content": "祝願大家能孝順父母、友愛同學、關心社區，奉獻你的愛心。不管是在飛機上、在火車、在路上、在隨處，要記著奉獻自己的愛心。這是多麼美好的一件事情！"
  },
  "551": {
    "id": "希望新生-心之勇士196",
    "title": "一念緣盡有情",
    "content": "菩提心的勝利是什麼？一念緣盡法界的有情，就造集了那麼廣大的善業！其實菩提心最利益的人是自己，發心為利有情，到最後自己先成就了。"
  },
  "552": {
    "id": "希望新生-心之勇士197",
    "title": "心志高為大乘心",
    "content": "你的心能夠飛多高，就看你的志向有多高；你到底是不是大乘，就看你的發心是不是為利一切有情，立志成佛！"
  },
  "553": {
    "id": "希望新生-心之勇士198",
    "title": "慈悲心能與萬物共鳴",
    "content": "慈悲心，是跟萬物打交道的一個主旋律，對待一切我們面對的人事物，能給予歡樂、拔除痛苦，這也是成就菩提心的資糧。"
  },
  "554": {
    "id": "希望新生-心之勇士199",
    "title": "溫暖光明的輻射",
    "content": "在黑夜中，我們這一群人走在一起，一顆心點亮一顆心，黑暗就變成光明了。然後越來越多、影響越來越大，這種溫暖的力量，就會輻射整個社會、整個世界、整個宇宙！"
  },
  "555": {
    "id": "希望新生-心之勇士200",
    "title": "描繪來生的幸福",
    "content": "來世的臉，就是此生我們平常的思想和行為畫出來的；來世跟人的關係如何，也在於今生與人為伴時，是否善待我們身邊的人。每一件事，每一個心念，都不會白白流過。小心握著心念的筆，以真誠之心，描繪來生的幸福。"
  },
  "556": {
    "id": "希望新生-心之勇士201",
    "title": "有一個佛果在等待",
    "content": "心靈的收穫，是人世間最高的獎賞，依著佛法會提升心靈對問題剖析的深刻度，將生命的時間軸，一下子拉到了無窮的過去、無窮的未來，而這無窮的未來有一個佛果在那裡等待！"
  },
  "557": {
    "id": "希望新生-心之勇士202",
    "title": "心甘情願遠離憂惱",
    "content": "以自己為中心的這個習慣，其實是長久以來練就的。以他人為中心的習慣也同樣可以練就出來，關鍵是：我們要心甘情願。一開始心甘情願嗎？不會！但如果真的想改變生命，真的很厭倦自己總是像這樣煩煩惱惱地度過一生，那麼就朝著這個方向去練習吧！"
  },
  "558": {
    "id": "希望新生-心之勇士203",
    "title": "不離初心惜緣以待",
    "content": "就像中秋的明月，每一年看它大家都覺得是新的，不會覺得：啊！去年中秋的月亮又出來了。人與人之間，雖然在一起很久很久了，你也可以像剛剛遇到一樣珍惜他，好好用最真誠的心幫助他離苦得樂。"
  },
  "559": {
    "id": "希望新生-心之勇士204",
    "title": "佛陀愛子之心",
    "content": "佛菩薩一定不會忽略任何一個可以利益我的瞬間，因為他的心就是等著這一刻，要把最完美、最美好的一切，趕快給予我這個獨一愛子，讓我從此變得幸福。這是所有的佛陀，從初發心到最後成正等覺永遠不變的熱切願望！"
  },
  "560": {
    "id": "希望新生-心之勇士205",
    "title": "追隨智者的人生",
    "content": "人生就應該要追隨智者，追隨智者的心靈該有多豐富啊！智慧的珠寶將會像湧泉般源源而來，這樣的人生多亮麗啊！"
  },
  "561": {
    "id": "希望新生-心之勇士206",
    "title": "傳遞和諧的心意",
    "content": "希望天空的飛鳥、水裡的游魚、草叢裡的小小生命，都能感受到和諧、互助的心意。希望這種心意遍滿宇宙，讓一切眾生都能夠得到心靈深處的慰藉和溫暖。"
  },
  "562": {
    "id": "希望新生-心之勇士207",
    "title": "螢火之光亦燃燒",
    "content": "哪怕自己只是一點點螢火的光明，也要發願去照亮他人的路，令他明辨內心的取捨。"
  },
  "563": {
    "id": "希望新生-心之勇士208",
    "title": "成為希望的緣起",
    "content": "慈悲心猶如一片花香，被美麗的願望之風吹拂鼓盪，讓這個苦難的世界有更多吉祥的消息，令人們的愉悅和幸福感持續增長。希望每一個人都成為這個世界幸福、希望的緣起！"
  },
  "564": {
    "id": "希望新生-心之勇士209",
    "title": "關愛與成長的智慧",
    "content": "真正地關愛一個生命，一定會幫他成長。幫他成長意味著幫他了解自己應負的責任，幫他探尋他自我的使命，在關愛中建立紀律，在紀律中展現關愛。過份的嚴苛和過份的縱容，都不是最好的選擇。這兩者的尺度如何拿捏，是每一個想關愛他人的人要學習和訓練的。最令人振奮的是，我們人類有驚人的學習能力，只要能夠利益他人，下決心學，沒有學不會的道理。"
  },
  "565": {
    "id": "希望新生-心之勇士210",
    "title": "種子的驚天之力",
    "content": "一顆小小的種子，會有驚天的能力，它穿越寒冬，在冰天雪地涵養自己的力量。一朝春暖，它會鼓起全部的勇氣，突破它自己的硬殼，奮力地抽出兩片嫩葉，舉出生命最奮發向上的奪人綠意。如果是一棵橡木的芽，別在意它那麼幼小，終有一日，它會挺立於大地上，忍受狂風暴雪，在天地間展現它的生命力，鼓舞著人們，用堅強的意志去面對一切挑戰。"
  },
  "566": {
    "id": "希望新生-心之勇士211",
    "title": "什麼種發什麼芽",
    "content": "什麼樣的種子，便會長出什麼樣的樹苗。菩提心種，會孕育佛果的大樹。"
  },
  "567": {
    "id": "希望新生-心之勇士212",
    "title": "讓心內雄獅醒來",
    "content": "如果我們在困境中得不到援助，你期待會援助到自己的力量反而成了傷害；就好像在戰場上，你的援軍成了叛軍，你被打得落花流水。儘管如此，只要一息尚存，我們就不應該忽略我們內心的力量。一旦內心的力量被真理喚醒，就會發現每個人的心中都有一頭雄獅。我們的任務是：透過學習，讓雄獅醒來！"
  },
  "568": {
    "id": "希望新生-心之勇士213",
    "title": "業果之道在行動",
    "content": "與其在不幸中獨自慨嘆、哭泣、埋怨，白白消耗時日，讓自己越來越苦，不如積極思考，努力除掉苦因。命運就在自己的手中，業果的道理就是行動起來！"
  },
  "569": {
    "id": "希望新生-心之勇士214",
    "title": "乘著思惟的翅膀",
    "content": "如何出離生死？我們乘著飛行的翅膀，就是思惟的力量，心可以帶著我們飛離痛苦的地方。"
  },
  "570": {
    "id": "希望新生-心之勇士215",
    "title": "病也可以修行",
    "content": "病是這個世界的現象，是很多生命都會經歷的苦楚，可以用苦不堪言來形容。病，會奪去健康，不能奪去正念。有病的時候，可以運用病來修行。每次，多忍耐一點，甚至對照顧自己的人多體諒一點，也可以想想比自己更苦的人，可以聽法，可以想自己曾經做過的善事，尤其是可以憶念佛菩薩。焦灼的時候，深呼吸，訓練自己面對病苦！這顆心還是能斷惡修善！我們並沒有失去學習修行的能力，為此，也可以產生歡喜心。"
  },
  "571": {
    "id": "希望新生-心之勇士216",
    "title": "依法得樂不絕望",
    "content": "當水路不暢的時候，大水就會積聚成災。暢通水路，高築堤壩，是人類在暴雨前應做的準備。當我們覺得不快樂像雨點一般降下來，這個時候不要選擇一頭栽在苦受的洪水中，要努力地從苦受裡掙脫，去觀察，運用正念觀察當下的苦受，它的強烈程度會慢慢降低。遇到痛苦的時候，我們是否有選擇不痛苦的權利？很多經驗告訴我們是可以的。"
  },
  "572": {
    "id": "希望新生-心之勇士218",
    "title": "情感永恆的歸所",
    "content": "情歸何處？皈依佛、皈依法、皈依僧。"
  },
  "573": {
    "id": "希望新生-心之勇士219",
    "title": "覺照才能見明月",
    "content": "你是我非，你對我錯，這些人我間的討論和爭鬥中，我們到底收穫了什麼？如何才能明見心頭那一輪朗月？內心中平靜深沉的力量如何出現？我們應揀擇自己的生命，尤其是思考的方向。人世擾擾，應持續深度思考，深度覺照。"
  },
  "574": {
    "id": "希望新生-心之勇士220",
    "title": "辨別自心的是非",
    "content": "用太多的時間，用太多的心思，去辨別別人的是非好惡，心續會煩亂、會吵鬧、會膚淺嗎？如果產生了這些問題，可能要撥出時間，辨別自己的是非好惡。"
  },
  "575": {
    "id": "希望新生-心之勇士221",
    "title": "看好腳下把握方向",
    "content": "有時候覺得別人節奏紛亂，眼睛一直看著別人，一直想調整別人，稍不留神，就會被自己腳邊的大石頭絆倒。忽略了自心的省察，就如同有眼睛卻不看路，一旦摔傷，只能自己承受痛苦。看腳下，穩健行路！看遠方，把握生命的方向！"
  },
  "576": {
    "id": "希望新生-心之勇士222",
    "title": "靜觀呼吸回歸本心",
    "content": "有時覺得內心和外境都很混亂，焦灼和緊張正在淹沒自己。怎麼辦？深呼吸！再深呼吸！如果能把注意力轉移到出入息上，呼吸慢慢地平穩，緊張和焦慮慢慢地降低，心也會隨之平靜。請常常練習！"
  },
  "577": {
    "id": "希望新生-心之勇士223",
    "title": "律己才能律人",
    "content": "花很多的時間大喊著利他，如果忽略了內心的修為，讓自己的行為和思想一直下滑，自己也知道這是一種欺騙。如果不律己，如何教人自律？如果不以身作則，誰會相信你說的？"
  },
  "578": {
    "id": "希望新生-心之勇士224",
    "title": "讚美聲中不執取",
    "content": "喜歡聽好聽的話，喜歡聽別人讚美自己，要小心自己成為讚美之聲的奴隸。一旦失去這個讚美，我們生命裡還有什麼？"
  },
  "579": {
    "id": "希望新生-心之勇士225",
    "title": "面對災難先自省",
    "content": "在一場災難中，一定要正確地評估自己應負的責任。在我們去找別人算帳之前，這件事很重要！"
  },
  "580": {
    "id": "希望新生-心之勇士226",
    "title": "讚美與關注行善的人",
    "content": "讚美他人的善思和善舉，是我們該選擇的社會行為。因為人們都讚美和關注善思、善舉，就會在自己的生命中創造善思和善舉，這是大環境的影響力。一旦醜陋、罪惡，成了人們熱衷的茶餘飯後的話題，尤其是成了孩子們津津樂道的東西時，我們是否應該憂慮這樣的方向會將人類帶向何處？"
  },
  "581": {
    "id": "希望新生-心之勇士227",
    "title": "展現給孩子的風景",
    "content": "注視孩子們的眼睛—那充滿純真和好奇的心靈之窗，當那窗口打開向著我們的時候，我們是否應該負責向那窗口展現什麼？"
  },
  "582": {
    "id": "希望新生-心之勇士228",
    "title": "身教的神聖性",
    "content": "孩子們的模仿力和學習力是驚人的，他會看著你、聽著你、想著你，你想讓他成為怎樣的人，就可以表現那樣的行為。在孩子們面前，我們通常選擇第一要則是管教孩子，也許大人們在管孩子之前，應先管好自己。因為正如同神明在看著你，孩子，在看著你。"
  },
  "583": {
    "id": "希望新生-心之勇士229",
    "title": "一切美好在當下",
    "content": "很多遺憾、很多錯失，在自己沒發覺的狀態下已經發生了。回首往事，會發現已經錯失了太多美好，這個時候選擇哭泣，我們又會錯過當下的美好！當下，多麼珍貴的當下！我到底能拿出什麼最好的奉獻？"
  },
  "584": {
    "id": "希望新生-心之勇士230",
    "title": "希望就在你身邊",
    "content": "頭上的星辰，地上的燈塔，心中的善良，都會讓我們感覺到希望。"
  },
  "585": {
    "id": "希望新生-心之勇士232",
    "title": "菩提心如金礦",
    "content": "如果能找到金礦，這一生乃至後世的子孫都不愁吃喝；如果可以發起菩提心，我們生生世世便可擁有所有的美好！"
  },
  "586": {
    "id": "希望新生-心之勇士233",
    "title": "追尋心寶莫猶疑",
    "content": "稀世珍寶，都會令世人欽慕和追逐；菩提心寶，也是我們生命最熱烈的嚮往。"
  },
  "587": {
    "id": "希望新生-心之勇士234",
    "title": "慈心與瞋心之別",
    "content": "一念慈心，到底有怎樣的福報？一念瞋心，到底有怎樣的災禍？誰說命運在別人手中？"
  },
  "588": {
    "id": "希望新生-心之勇士235",
    "title": "一念真心福無邊",
    "content": "哪怕只唸一句嗡嘛呢唄咪吽，如果是為了所有有情離苦得樂而唸、是為每一個有情而唸，有情無邊，我們便獲得無邊的福祉。"
  },
  "589": {
    "id": "希望新生-心之勇士236",
    "title": "一秒勝過千年",
    "content": "珍貴的心念啊，在一秒鐘，如果想著無量的有情，想要去除他們的痛苦，哪怕是一絲絲的痛苦，這一秒鐘，比痴痴呆呆活過一千劫更加長遠、更加真實。"
  },
  "590": {
    "id": "希望新生-心之勇士237",
    "title": "菩提心的利益",
    "content": "布施可以換來財富，持戒可以換來高貴，忍辱可以換來美貌莊嚴，美麗的菩提心呢，可以為我們換來什麼？"
  },
  "591": {
    "id": "希望新生-心之勇士238",
    "title": "禮佛的福報",
    "content": "舉世罕見的寶貝，如果能讓我們看上一秒鐘，是多麼難得的福份和榮耀！如果能以虔誠之心禮佛一拜，如果能以虔誠之眼注視佛菩薩片刻，我們將獲得無邊的福報，為什麼？因為我們禮敬的佛菩薩，他們的心續中擁有著比稀世珍寶更珍貴的菩提心！"
  },
  "592": {
    "id": "希望新生-心之勇士239",
    "title": "動物的菩薩行",
    "content": "有一些小動物，牠們秉性善良，天生就知道照顧牠的同類和異類。在這些小生命面前，看著牠們的良善和奉獻，不由自主地猜想：這是不是佛菩薩的示現。"
  },
  "593": {
    "id": "希望新生-心之勇士240",
    "title": "憂慮的方向",
    "content": "我們憂慮沒有財富、沒有健康、沒有美貌、沒有好的人際關係，我們可曾憂慮有沒有菩提心？"
  },
  "594": {
    "id": "希望新生-心之勇士241",
    "title": "最健康的渴望",
    "content": "沒有知識的人渴望知識，沒有財富的人渴望財富，沒有飲食的人渴望飲食，將菩提心看成是生命所需的人，渴望生起菩提心。"
  },
  "595": {
    "id": "希望新生-心之勇士242",
    "title": "採釀菩提心蜜",
    "content": "花朵豔麗芬芳，蜜蜂精勤地忙碌，牠們將花粉釀成蜂蜜；我們精進地修行，晝夜不息，定能將心續善行的花粉釀成菩提心蜜。"
  },
  "596": {
    "id": "希望新生-心之勇士243",
    "title": "溫暖這個世界",
    "content": "佛陀用他的光明點亮了我這顆心，我也可以為這個世界增添更多的光亮和溫暖。在自己得到人身的這個寶貴光陰時，可以多用自心去溫暖家人、鄰居、同事，乃至溫暖這個世界！"
  },
  "597": {
    "id": "希望新生-心之勇士244",
    "title": "一生比一生美好",
    "content": "如果我們用潔白的善行充滿自己生命中的每一天，成為一個具信的三寶弟子，這樣的生命實在是分秒都沒有空過。如此我們的後世自然不用憂慮，結果一定是一生比一生更美好！"
  },
  "598": {
    "id": "希望新生-心之勇士245",
    "title": "有願必成",
    "content": "心願有如種子，春種什麼，秋收什麼。想要怎樣的未來，就請那樣發願！如同春種之後的雨水和陽光，我們精勤地集聚資糧，春種一粒粟，秋收萬顆籽。美麗的善心善願，一定會得到最好的回報。"
  },
  "599": {
    "id": "希望新生-心之勇士246",
    "title": "證無自性脫輪迴",
    "content": "佛陀說輪迴可以結束，因為輪迴是有因的，證得心上的無自性，把「『我』在五蘊上的安立」這個問題搞清楚，去除無明，輪迴就結束了！"
  },
  "600": {
    "id": "希望新生-心之勇士247",
    "title": "寧靜的偉大力量",
    "content": "寧靜的心往往善於孕育偉大而強悍的力量，在心裡沒什麼雜念，非常非常寧靜的時候，很多平常思考不清楚的東西就會很清晰；感恩心、慈悲心，還有追求空性智慧的力量，也會很容易在我們的心中生起。"
  },
  "601": {
    "id": "希望新生-心之勇士248",
    "title": "把我們的心變美好",
    "content": "所有的人類，甚至動物，都想活在慈悲的氣氛裡，沒有人喜歡冷酷的世界。那麼為什麼我們不創造慈悲、創造感恩、創造寬恕，非常積極地去營造這樣美好的世界？這是我們每一個人的責任！"
  },
  "602": {
    "id": "希望新生-心之勇士249",
    "title": "願心若泉源源不絕",
    "content": "一定要堅固地生起「為利有情願成佛」的願心和行心，讓它在我們心中像瀑流水一般一直洶湧而出，剎那都不停止，直至生生世世，這便是最有價值的人生。"
  },
  "603": {
    "id": "希望新生-心之勇士250",
    "title": "真正應該做的事",
    "content": "盡心盡力幫忙別人的時候，可能會遭遇到很多誤解，但還是要去幫他，因為想要擊毀、粉碎「以我愛執、自我私欲為中心」的生命習慣，這才是我們存活於天地間真正應該做的事情。"
  },
  "604": {
    "id": "希望新生-心之勇士251",
    "title": "成為正能量之源",
    "content": "我們要在全世界發散正能量、發出正念！我們在這宇宙間行走著、生活著、奉獻著，用什麼？用我們的正念。乃至走過一個人的身邊，不要忽略能夠對他微笑的時刻，我們懷著熱忱的心，溫暖著自己，溫暖著他人，溫暖著這個世界。"
  },
  "605": {
    "id": "希望新生-心之勇士252",
    "title": "亮起心燈利他行",
    "content": "白晝，去除著黑夜。夜晚的燈，引導著人們回家的路。大智大慧的佛陀，用真理點亮了我們的心，我們選擇利他的這條回家的路。"
  },
  "606": {
    "id": "希望新生-心之勇士253",
    "title": "正念為導不迷航",
    "content": "岸上的燈塔在閃亮，水中的行船便不會迷失方向；心中的正念在閃亮，邁出的腳步便不再迷茫。"
  },
  "607": {
    "id": "希望新生-心之勇士254",
    "title": "慈護生命如大地",
    "content": "如同大地的母親以她無限寬廣的胸懷，承載著無數生命的成長和生老病死。我們也有義務去保護生命，不要由於自己的粗心大意，或過分地以自我為中心的生存方式，而忽視了其他小生命的存在。我們尊敬並且接納不同生命，就會感受到大家一同存在的和樂、喜悅，以及相互陪伴的愉悅之感。"
  },
  "608": {
    "id": "希望新生-心之勇士255",
    "title": "共享共存的生命觀",
    "content": "希望所有的生命都相互尊重、相互關心，珍惜我們共同擁有的空間、共同擁有的資源。我們熱愛藍天、我們熱愛綠地、我們熱愛森林、我們熱愛澄澈的河流，我們要為這份熱愛付出行動！"
  },
  "609": {
    "id": "希望新生-心之勇士256",
    "title": "為利有情勇悍行",
    "content": "菩薩為了利益有情廣學一切道，不畏懼生死酷烈的寒冷與痛楚，數數地來到輪迴世界救拔一切有情，我們怎能不深深地感念佛菩薩如此勇悍、大無畏的慈悲心意！"
  },
  "610": {
    "id": "希望新生-心之勇士257",
    "title": "菩薩之愛永不離",
    "content": "我永遠都不會沒有人疼！因為從初發心一直到證得十地最後續流的菩薩，他們成佛的所有目標，就是要成熟有情，就是會好好地帶我、好好地教我，我永遠沒有被他捨棄的理由，因為他捨棄了我的話，便捨棄了他的願，便捨棄了他自己的未來。所以不知道有多少佛菩薩把我放在心上，不論我認不認識他們，從無始劫來都一直照顧我到今天，從來都沒有離開過我!"
  },
  "611": {
    "id": "希望新生-心之勇士258",
    "title": "陪我走完最後一程",
    "content": "不管你遇到什麼樣的困難，處在各式各樣的糾結困境中，你對自己有多少多少的不滿意，但是佛菩薩永遠都不會捨棄我們！就像師父的誓言：只要你不放棄，我很樂意陪你走完最後一程！"
  },
  "612": {
    "id": "希望新生-心之勇士259",
    "title": "報恩必發菩提心",
    "content": "我一定要發菩提心！就是只為了報答我此世的母親我也要發，何況無限生命中還有無量無邊的母親。因為我知道她有生死之痛，她不願意在生死中和我別離，如果不把這個痛苦去除，讓她每一生流淚和我別離，是極度地對不起她的。我想做一個能報父母恩的孩子，所以必定會選擇發菩提心，救度自他出生死的苦海！"
  },
  "613": {
    "id": "希望新生-心之勇士260",
    "title": "心續修鍊的爆發力",
    "content": "透過對於心續的修鍊，我們的生命可以達到現在不可企及的一個高度，佛菩薩在經典裡再再地啟示要注意到這種爆發力。它可以爆發出對整個宇宙眾生無所不緣的菩提心—為利一切有情願成佛；爆發出達到究竟的頂級智慧—成就證達一切如所有性、盡所有性的遍智，能解救一切有情的痛苦！"
  },
  "614": {
    "id": "希望新生-心之勇士261",
    "title": "點心成金的寶貝",
    "content": "假如我們的生命是像石頭一般普通，那麼把石頭點成黃金的會是什麼呢？如果能擁有菩提心，我們的心就會如金子一般具有無限的價值。而這個菩提心是不用借錢也不用做生意，只要透過反覆串習教典就可以策發出來。"
  },
  "615": {
    "id": "希望新生-心之勇士262",
    "title": "菩提心寶去障礙",
    "content": "菩提心是最大程度顯示我們生命潛能的一個法寶，我們只要轉動思惟的巨輪，緣著菩薩戒、緣一切有情生起那樣的善心，就會累積極大的福報！以這樣大的福報回向於聞思修，何苦障礙不除呢？"
  },
  "616": {
    "id": "希望新生-心之勇士263",
    "title": "菩提心果生生不息",
    "content": "種一棵蘋果樹，在它結果之後，它便年年生果，而且越長越大、越結越多；菩提心，像蘋果樹一樣，會無窮次地結出善樂的果，生生不息。"
  },
  "617": {
    "id": "希望新生-心之勇士264",
    "title": "最美好的祈願",
    "content": "希望大家拚命地努力，把最美好的法留在世界上。希望能令所有的善知識都能夠歡喜地久住世間，不停地引領、教化我們對無明做徹底地抗爭。也希望所有有情的生命，因為我們的付出，都變得越來越清淨和圓滿。"
  },
  "618": {
    "id": "希望新生-心之勇士265",
    "title": "祈願有情心歡喜",
    "content": "希望能把大家學佛的這分歡喜心，成倍地布施到所有有情的心中，讓每個人都得到文殊菩薩法水的潤澤，生命綻放出比霞光更美的喜悅，並且源源不絕地增廣、增廣！"
  },
  "619": {
    "id": "希望新生-心之勇士266",
    "title": "良機在前不可失",
    "content": "如果用一步登天來形容生起菩提心的榮耀，那也是遠遠不夠的。得到了人身，值遇了教法，彷彿一座天梯，在自己的面前降臨，生起菩提心的機會唾手可得。如果將握在手中的機會白白丟掉，還有什麼比這個失去更令我們痛心的！"
  },
  "620": {
    "id": "希望新生-心之勇士267",
    "title": "辨別輕重的心尺",
    "content": "有什麼仇人比生起傷害他人的心更可怕？有什麼親友比生起利益他人的心更親？在我們的生命中，孰是孰非？當以菩提心為尺來丈量。"
  },
  "621": {
    "id": "希望新生-心之勇士268",
    "title": "一心所在善樂根",
    "content": "我們忍受饑渴寒熱，忍受悲痛憤怒，所有的一切忍耐，只要不丟失菩提心，我們便不會丟失善樂的根本。"
  },
  "622": {
    "id": "希望新生-心之勇士269",
    "title": "最璀璨的稀世珍寶",
    "content": "眺望群山，菩提心寶有如高山之巔；放眼星河，菩提心寶最為璀璨、明耀！"
  },
  "623": {
    "id": "希望新生-心之勇士270",
    "title": "永恆不離的菩提心",
    "content": "親友會離散，容顏會衰老，命根會捨離；菩提心寶永不離！"
  },
  "624": {
    "id": "希望新生-心之勇士271",
    "title": "最有價值的交換",
    "content": "以一顆普利有情之心，換卻所有人世的傷痛，這樣的交換實在值得！"
  },
  "625": {
    "id": "希望新生-心之勇士272",
    "title": "最美的歌唱",
    "content": "百花能夠爭豔芬芳，流水日夜淙淙歌唱，清風徐過無際的林海，一切都被大地養護、為大地而歌唱。菩提心寶，承載著一切生命的喜樂、一切良善的存在，我被菩提心養護，我為菩提心歌唱。"
  },
  "626": {
    "id": "希望新生-心之勇士273",
    "title": "一心慈悲能澤萬物",
    "content": "風吹過了擁有慈悲心的人，將慈悲的力量，吹拂到下一個人，再吹到樹木、田野，草木也盡染了慈悲的光輝。"
  },
  "627": {
    "id": "希望新生-心之勇士274",
    "title": "從關注小生命開始",
    "content": "早晚有一天，我們要成為勇悍的菩薩、要去成佛，所以每一位有情都是我關注的對象。那麼就從我們的家人、每個遇到的人，甚至我們見到的一隻飛鳥、一個很不起眼的小生命，開始關注他們吧！\n一旦我們把目光注視到生死問題的時候，就會覺得：人生其他的事都算小事，最大的就是這件事情—「生死事大，無常迅速！」因為時間很短，所以必須清晰地抉擇出最有用、最該做的事情，把精力都投注在上面。"
  },
  "628": {
    "id": "希望新生-心之勇士275",
    "title": "能知能行是修行",
    "content": "把所知的內容行於自己每天的生活之中，就是一個修行人的本色。"
  },
  "629": {
    "id": "希望新生-心之勇士276",
    "title": "智勇兼備",
    "content": "能夠發現問題的，是很有眼力的人；而能夠解決問題的，才是勇士和智者！"
  },
  "630": {
    "id": "希望新生-心之勇士277",
    "title": "智慧寶劍",
    "content": "佛法不是高高在上，也不是遠在深山中、大海裡，就在我們碰到各種麻煩的人、事、物中，它是讓心靈擺脫所有困擾的智慧武器，就像文殊菩薩手中的智慧寶劍一樣。"
  },
  "631": {
    "id": "希望新生-心之勇士278",
    "title": "惡習是唯一的敵人",
    "content": "為什麼說修行是要那種冰心鐵骨之士？沒有勇氣、沒有毅力的人堅持不了。因為要打的是自己，戰鬥的是自己，沒有其他敵人，只有自己是要降伏的。其他都不是修行人的敵人，自己的惡習煩惱才是真正的敵人。"
  },
  "632": {
    "id": "希望新生-心之勇士279",
    "title": "起點再低也不怕",
    "content": "面對煩惱，不管我們多麼膽小、起點多麼低、現狀多麼糟糕，只要肯對治，哪怕進步一點點，都是很可喜的！十個惡念中，降伏了兩個就剩八個，明天再降伏一個就剩七個了。這一次煩惱攪了兩個小時，下次就攪一小時五十九分，少一分鐘就是成績。要從這樣一點點地推進，讓煩惱的大軍在你面前步步退卻。"
  },
  "633": {
    "id": "希望新生-心之勇士280",
    "title": "步步前進不離善知識",
    "content": "怎麼樣才會發現自己目標偏差？一定得有個對比，一個是正確的、一個是偏差的，才比得出來。那個正確的東西，你一定要看到，才能知道自己偏差了。所以，為什麼在行進的途中，每一步都不可以離開善知識；因為，每一步都有可能走岔，要靠善知識一直校對、一直校對，才能走對。"
  },
  "634": {
    "id": "希望新生-心之勇士281",
    "title": "最強大的力量",
    "content": "善知識是三寶的總聚體，一旦把內心堅固的信心修起來時，會發現在斷惡修善上，最偉大、最強悍、最源源不斷的力量就是上師相應。你的心成為打不倒的勇悍者，因為背靠著佛菩薩的大軍，永遠和這種光明的續流在一起。"
  },
  "635": {
    "id": "希望新生-心之勇士282",
    "title": "美妙輕鬆的路",
    "content": "快樂從哪兒出生？如理作意！這種方式不花一毛錢，也不需要什麼，比騎腳踏車還容易。因為，騎腳踏車還得有輛車讓你踏，這個修行它完全是由自心操作；就是理路前後的運轉，運轉完了之後就開始歡喜了。你說，這條路有多美、多輕鬆！"
  },
  "636": {
    "id": "希望新生-心之勇士283",
    "title": "衝出惡業的繫縛",
    "content": "對治煩惱的過程中，無論失敗多少次，都必須戰鬥到底！就算是拚到死，也要從惡業的繫縛裡衝出去，一定要把惡習打垮！只要我們抱著這樣的心不退，煩惱惡業一定會退。"
  },
  "637": {
    "id": "希望新生-心之勇士284",
    "title": "點滴積累成美德",
    "content": "只要我們一直在改善自己就夠了！如果朝著一個光明的方向不斷改善，哪怕只有一點點進步也是非常珍貴的，因為那可是多少眼淚和汗水換來的。別小看這一點點啊，就像在沙子裡淘金一樣，雖然一個微小如塵埃的善行，它的質地可是金子。"
  },
  "638": {
    "id": "希望新生-心之勇士285",
    "title": "珍惜生命的程度",
    "content": "怎麼珍惜我們的每一天、每一分鐘、每一秒鐘？想想菩薩是怎麼珍惜的—吸氣，把所有眾生的業障、痛苦、生老病死苦全吸過來；呼氣，把所有的善根和快樂，平等地布施給所有的有情。一呼、一吸間都在造善業，珍惜生命到那種程度！"
  },
  "639": {
    "id": "希望新生-心之勇士286",
    "title": "心弱難成就",
    "content": "要做好每個善行，累積到每個資糧，就必須要有毅力，敢於接受挫折、挑戰，努力戰勝自己，必須有勇氣才能修行，否則什麼善事都別做，所以《入行論》說：心弱難成就。"
  },
  "640": {
    "id": "希望新生-心之勇士287",
    "title": "心力的鍛鍊",
    "content": "修行路上，一會兒有心力，一會兒沒心力，怎麼辦？找到沒心力的規律，把這個時間縮短，不停加強自己的力量就可以了。要去觀察：是什麼原因導致沒心力？沒心力又會導致什麼結果？如理地思惟提策自心。這樣練習一段時間，心力就容易提起來，不會在沒心力的狀態中沉淪太久。"
  },
  "641": {
    "id": "希望新生-心之勇士288",
    "title": "世上沒有沒心力的人",
    "content": "世上沒有沒心力的人，只有不會提心力的人，只要把心力提起來就可以了。但是心力怎麼提呢？不要等到都掉進深海去了你才打撈，這會很麻煩！必須在心有點疲憊或無力時，及時地警覺，善巧地調治，修歡喜心，讓自己奮鬥的衝力保持在一個穩步前進的速度上。"
  },
  "642": {
    "id": "希望新生-心之勇士289",
    "title": "絕處逢生的喜悅",
    "content": "對於修心的人，每一個面臨的境遇都是機會，絕路也就是生路、就是希望，就看我們怎麼想。很多偉大的發現，恰恰是在走投無路時另闢蹊徑。一旦衝出重圍，我們發現希望之路，就會領略創造的喜悅。"
  },
  "643": {
    "id": "希望新生-心之勇士290",
    "title": "人身難得正法難遇",
    "content": "當一個珍寶遇到另一個珍寶，兩個珍寶合起來，會發揮難以想像的妙用！正如人身既珍貴又短暫，我們能用來學習正法的時光也是很有限的，而能值遇到這樣圓滿的教法，更是絕對地稀有難得，應當對這樣的值遇倍加珍惜。"
  },
  "644": {
    "id": "希望新生-心之勇士291",
    "title": "修行的腳步要適中",
    "content": "我們應注意到已經前進了多少，如果眼睛一直盯著沒做到的事情，是否會累積焦躁、憤怒，不知不覺開始埋怨自己，同時也到處觀過、埋怨他人，為什麼？因為太急躁了，過於求速，在每一個應該關注內心的當下，我們都想到下一件事，忽略了此時的觀察，這也是一種浪費時間。修行的腳步要不疾不緩，速度適中，才能走得最長遠！"
  },
  "645": {
    "id": "希望新生-心之勇士292",
    "title": "修行升進依次第",
    "content": "修行如何能夠獲得進步？就是不能想要一步登天，否則你就會一直遭遇到挫折，覺得這個理想永遠實現不了。所以修行應循序漸進，不可操之過急！修行的次第是先從聽聞建立正知見，然後開始無害行的戒律行持。如果我們已經走在這樣非常如法的修學步驟之中，那就不必有太多憂惱，沿著這條路走下去，就能夠達到最輝煌的目的地。"
  },
  "646": {
    "id": "希望新生-心之勇士293",
    "title": "懂得量度自己的進展",
    "content": "知道自己從何處出發，現在又到了哪裡，要一把合量的尺、一種詳細計算的態度。我們到底已經前進了多少，從此地到彼地，有移動嗎？我的內心多了幾許正知見、改變了多少習慣？對於關注內心，我是否比過去頻率多很多？我對三寶的虔誠，是否日益加深？"
  },
  "647": {
    "id": "希望新生-心之勇士294",
    "title": "學佛是清醒還是迷信",
    "content": "有人說：「學佛法是迷信。」如果越學越開智慧，為什麼叫迷信？比之盲目地迷亂於五欲、八風之中，迷亂於財、色、名、食、睡，那更是一種迷信。佛法是讓我們清醒的，看到改善生命的起點在哪裡，當下的一步在哪裡。所以，一定要建立正確的信心，依著皈依學處去努力，生命一定會被改變！"
  },
  "648": {
    "id": "希望新生-心之勇士295",
    "title": "最不避世的學問",
    "content": "有人認為佛法是避世之學，其實佛法恰恰是勇敢地迎向生命最難以解決的問題，去正視它的一門學問。比如說，為什麼會有生老病死？因為有生老病死的因。生老病死的因是什麼？無明。那麼生老病死的因可以去除掉嗎？可以的。正因為有前賢清醒地看待這些痛苦，修證過了、成功過了，所以我們這些後學才願意追隨聖者的足跡前行，勇悍地解決生死之痛。"
  },
  "649": {
    "id": "希望新生-心之勇士296",
    "title": "難題中的期許",
    "content": "在別人給我們的每個難題中，都可以埋藏著對自己的期待—在這個難題中，我會交出怎樣的答卷？我會有什麼新發現？在跟別人的心互動時，我會做出怎樣的超越？我們可以多看看經典上的智慧，當思路越來越多的時候，對一個問題的看法就像多切面的水晶一樣，會呈現很多不同的角度。最終，我們一定會找到令自己心神愉悅的答案。"
  },
  "650": {
    "id": "希望新生-心之勇士297",
    "title": "修行就是超越自己",
    "content": "修行人走的是超越自己的一條路，就是在困境面前一定要如理思惟，去琢磨：我要怎樣正確地去突破它？用學習到的智慧去超越困境，就會不停地獲得超越自己現有能力的一種喜悅。"
  },
  "651": {
    "id": "希望新生-心之勇士298",
    "title": "造善淨業須行動",
    "content": "按照正確的方法淨化自己，開始造善淨的業，生命就改善了。躺在自己的苦難裡怨天尤人，這並不能改變生命，必須起來行動，好好地沿著佛陀的教導認真地修行！苦樂是有原因的，我們應多造善業，因為善業是快樂的因；不要造惡業，因為惡業是痛苦的因。"
  },
  "652": {
    "id": "希望新生-心之勇士299",
    "title": "對治習氣須耐苦",
    "content": "每一個習氣的對治，都需要我們花下耐心，要捨得讓自己吃苦，不然是改不了的。師父說：「一生一世到底能動得了自己的煩惱習氣多少？能動一動都是很了不起的修行人。」"
  },
  "653": {
    "id": "希望新生-心之勇士300",
    "title": "務必走向成功",
    "content": "我對大家最深的祝願就是：速疾離苦得樂！在修行的路上不要掉隊，也不要因為這樣那樣的困難停止，要勇敢地走過去，一定要成功！"
  },
  "654": {
    "id": "希望新生-心之勇士301",
    "title": "打不死的意志",
    "content": "現在我們想造善業可能自己作不了主，正因為這樣所以要奮鬥！沒有天上白白掉下的餡餅，每一分修行都是奮鬥出來的，我們就是要從白天到黑夜地跟煩惱鬥，直到把它打垮，要有這種打不死的意志，雖然常常失敗，但我永不放棄！勇做常敗將軍！"
  },
  "655": {
    "id": "希望新生-心之勇士302",
    "title": "掃蕩一切生死貧窮",
    "content": "對治煩惱就像治療一個大瘡一樣，你要看著它，不要讓它潰爛，不要讓它繼續惡化，要及時消毒。這樣日復一日、年復一年精勤地努力，終有一天這個大瘡會痊癒，不再因為一點境界的碰觸，就痛苦難耐。我們將永無生死之痛，成就無邊的善業，像大威德一樣威風，掃蕩一切生死貧窮。"
  },
  "656": {
    "id": "希望新生-心之勇士303",
    "title": "好好修行無畏死主",
    "content": "在每一件事上殷重發心：為求無上菩提，好好護持自己的律儀。死主來算帳時，自我評估這一生因為好好修行，越靠近死主越不怕，越靠近來生越覺得有希望，因為這輩子要完成的善業都努力完成了，尤其是如果生起菩提心，你想想這樣的一生該有多麼高興！"
  },
  "657": {
    "id": "希望新生-心之勇士304",
    "title": "虔信三寶力非凡",
    "content": "煩惱是很可怕的，必須依靠修習正念的力量、信心的力量、學習教典的慧力，乃至修慈悲心和空性的力量來對治。如果能在修道伊始，修出對上師三寶的堅強信心，這些都是對治煩惱非常強大的力量！"
  },
  "658": {
    "id": "希望新生-心之勇士305",
    "title": "跟命運抗爭的修行者",
    "content": "如果我們在病苦面前，在複雜難理，甚至是惡劣的人際關係等這些逆境面前倒下去，那就成了只能被痛苦凌虐的懦夫。如果遇到困難能奮力向上，打起精神去跟命運抗爭，這樣反倒能夠戰勝命運，把厄運踏在腳下！"
  },
  "659": {
    "id": "希望新生-心之勇士306",
    "title": "真正的災難與財富",
    "content": "我們行善，不是要人知道，不是要人感恩，只是改變自己的行為和思想。如果沒人知道、沒人感恩；還有人你越對他好，他越不知分寸，甚至恩將仇報……，如果生命裡發生了這樣的事情，打擊了我們行善的動力，甚至因此放棄了行善的目標，那才是真正的災難！失去善心，遠遠比一個恩將仇報的人對自己的傷害大多了。善心是我們真正的財富，不可以因為逆境而被劫奪！"
  },
  "660": {
    "id": "希望新生-心之勇士307",
    "title": "鬥煩惱要當勇士",
    "content": "要修行就要向內心鬥煩惱。鬥煩惱的時候要當勇士，用盡最後一分力氣，也不要向煩惱屈服，死也要死在求取無上菩提的路上。打定主意堅持到底就可以了，不要中途退怯。煩惱是很厲害、很不好對治的，但是只要你不退，它就會退。每天在佛前發誓非常重要，因為誓言會成為內心一種強大的力量！"
  },
  "661": {
    "id": "希望新生-心之勇士308",
    "title": "最開心的活法",
    "content": "當幫忙別人和自己的利益發生衝突的時候，選擇以別人為主，這樣的人生是幸福的，不信你去試試！也不要試個兩次就下結論，你要一直試、一直做，十年、二十年這樣試下去。終究你會發現：以利他為生命的第一目標，這才是會令自己最開心的活法！"
  },
  "662": {
    "id": "希望新生-心之勇士309",
    "title": "善惡抉擇莫迷惘",
    "content": "為了保護自己，我們常常會有一些奇怪的理路，讓我們在該抉擇善惡的時候，突然迷惑、不知所從。無論如何一定要堅定自心走利他的路，不要傷害他人，要利益他人，這才是所有佛菩薩、智者的選擇。"
  },
  "663": {
    "id": "希望新生-心之勇士310",
    "title": "恆心練習終有成",
    "content": "正因為學得慢，所以要不停地練練練練，練熟了就快了。學習任何事情都是開始先聽聞，再思惟，不斷地練習，到最後非常熟練的過程。"
  },
  "664": {
    "id": "希望新生-心之勇士311",
    "title": "給得越多收得越多",
    "content": "保持著一種利益大眾、奉獻他人的心，最容易聚集善業的財富。不是索取的，而是給予的心。你給得越多，收穫會成倍地回來，這是佛所說的因果的道理。"
  },
  "665": {
    "id": "希望新生-心之勇士312",
    "title": "珍惜練心的機會",
    "content": "一定要珍惜時間，不要放過每一次訓練心的機會，訓練久了之後，心力將變得非常強大，這時無論把它專注在任何善所緣上，都會取得意想不到的成就！"
  },
  "666": {
    "id": "希望新生-心之勇士313",
    "title": "祈求加持心不退",
    "content": "祈求文殊菩薩加持、祈求師長加持，當你發現寸步難行的時候，就要祈求加持，即使暫時突破不了，至少讓自己心念上不能輸。"
  },
  "667": {
    "id": "希望新生-心之勇士314",
    "title": "團隊激發勇悍力",
    "content": "能夠攀登到頂峰的是勇者，只有勇者才能登頂。但是如果這是一個凝聚力很強的團隊，就會產生出特別多的勇者。因為大家都熱愛這個團隊，捨不得任何人離開，會把那些心力弱的同伴的勇悍力激發出來。最好的和合，是大家一起攀登，一起登頂。"
  },
  "668": {
    "id": "希望新生-心之勇士315",
    "title": "真理的作用",
    "content": "不要覺得當我們有一個正確的道理時，態度好像就可以有點高傲。從他處聽來了一個真理，難道我就是真理嗎？真理應該讓我們更謙虛、更尊重別人，更能體諒別人的難處。真理最先照亮的，是自己的心，明辨自己的取捨。"
  },
  "669": {
    "id": "希望新生-心之勇士316",
    "title": "常修隨喜路平坦",
    "content": "我們調心的時候不能太緊、也不能太鬆，必須常常修隨喜。隨喜很重要，可以少造許多惡業，多造很多很多善業，修行之路會日漸平坦。"
  },
  "670": {
    "id": "希望新生-心之勇士317",
    "title": "修善斷惡心晶瑩",
    "content": "大海因蔚藍而美麗，樹木因綠蔭而清涼，鳥兒因歌聲而悅意，而我自己努力修十善、斷十惡，我的心因善意而晶瑩。"
  },
  "671": {
    "id": "希望新生-心之勇士318",
    "title": "忍現苦造未來樂",
    "content": "佛陀說：眼前是苦、將來是樂的事情，這是對的，是我們應該做的。但是我們通常就只看到眼前的苦，就以為未來都會是苦的，因為畏懼痛苦，不明了當下種善因的積極意義，結果令光陰虛度，令人深深惋惜。"
  },
  "672": {
    "id": "希望新生-心之勇士319",
    "title": "修行者的自在",
    "content": "經年累月、持續地用功下去，直到體會到做為一個修行者的自在。不再那麼需要依靠物質的條件，不再那麼執著周圍的人對自己的配合、逢迎。不管怎樣的境界，心裡都自在地現起想要利益、恭敬對方的心。那心思明豔如夏日的花園，充滿生機！無論風雨如何，花開依舊；那是由於堅定和善之心擎舉出的繁花，它無畏自在地盛開。"
  },
  "673": {
    "id": "希望新生-心之勇士320",
    "title": "接受指正善友多",
    "content": "關注我們的人，有時候會給我們一些建議，也許有些聽起來並不是很舒服，一旦我們抱持著寬容、向別人學習的態度，我們會感受到別人的善意，會交到很多好朋友，而且生命也不會處於封閉的狀態。有人敢於對我們提醒一些事情，無論那些事情是我們自己意識到，還是沒有警覺的，先接受下來，觀察一下。多一雙眼睛，幫我們看著腳下的路，這也是一種親切的陪伴。"
  },
  "674": {
    "id": "希望新生-心之勇士321",
    "title": "挑戰難題須平靜",
    "content": "焦灼會使問題變得複雜，乃至變成災難性的擴散，因此當挑戰難題時，必須保持內心的平靜，再去觀察解決的辦法。"
  },
  "675": {
    "id": "希望新生-心之勇士322",
    "title": "生死中沒有退路",
    "content": "要不停地讓自己的膽識變大，讓自己的雄心壯志變得更加威猛，因為在生死中沒有退路，我們只能咬牙切齒，哪怕含淚也必須向著解脫前行！所以要努力學習經論，找尋能解決生死無明的那道光明，來照破自己和所有有情心中的黑暗。"
  },
  "676": {
    "id": "希望新生-心之勇士323",
    "title": "造善最有道理",
    "content": "離苦得樂的原則，就是要朝著能造善業的方向去想，因為造善業畢竟是最有道理的；滿口的道理卻造了一堆惡業，這算是什麼道理？"
  },
  "677": {
    "id": "希望新生-心之勇士324",
    "title": "遇困不退更向前",
    "content": "在學習的過程中，如果產生困境了，注意！不要想退，突破它就是了，向後逃也是沒有用的。因為如果是宿業成熟，那是逃不掉的，只有如法地面對才能解決。"
  },
  "678": {
    "id": "希望新生-心之勇士325",
    "title": "培養正念的力量",
    "content": "如果一個煩惱對付它好多年還沒有成功，那是不是你沒能力呢？不能這麼定義！因為必須日日夜夜、分分秒秒，在每一次對境的痛苦之中不屈服，倒了再爬起來、倒了再爬起來，一定要經過這種艱苦的訓練，才能夠培養出一種執持正念的力量！"
  },
  "679": {
    "id": "希望新生-心之勇士326",
    "title": "平復自心的荊棘",
    "content": "我們常會覺得：很多事情的過失，都是「境」那方面的問題，我的心是沒有過失的，所以就一直調整「境」，一直在心外馳求，不停地去擺平這個、擺平那個、擺平天下，卻忘了平復自心的煩惱荊棘。"
  },
  "680": {
    "id": "希望新生-心之勇士327",
    "title": "透過修行超越苦難",
    "content": "沒有什麼苦難是不能透過修行超越的！就連死苦，這是所有有情最恐懼的痛苦，但是透過真實的修為，卻可以讓心面對死亡產生非常歡喜的感覺，那還有什麼困難不能轉苦為樂呢？"
  },
  "681": {
    "id": "希望新生-心之勇士328",
    "title": "微小進步也隨喜",
    "content": "祖師說：慢慢走，快快到！所以要有耐心，哪怕你這次攪煩惱和上次相比有一秒鐘的進步，就很厲害了！因為我們無始劫來攪煩惱的習氣非常強大，逆流而上是要花一番功夫的。"
  },
  "682": {
    "id": "希望新生-心之勇士329",
    "title": "感受過不去只是習慣",
    "content": "沿著正理去抉擇，不會讓我們走到痛苦的深淵裡，可是感受上卻過不去。那是什麼東西在作祟？習慣！是因為過去習慣了才會這樣，所以就要不斷地串習正理、改變習慣。"
  },
  "683": {
    "id": "希望新生-心之勇士330",
    "title": "飛越感受的泥沼",
    "content": "逃離感受對自心的控制吧！可否給我一雙翅膀，飛越被感受控制的泥沼？請問那一雙翅膀是什麼？是不甘於沉淪在感受中，使我不能去造善業、不能修行的心；是想要超越自己、實現人生夢想的心啊！"
  },
  "684": {
    "id": "希望新生-心之勇士331",
    "title": "主動道歉是勇者",
    "content": "怎麼處理家庭矛盾？先別攪煩惱、生悶氣，學佛的人應先觀察自己的不足，主動去道歉。其實先道歉的才是勇者，勇者才懂得寬恕。"
  },
  "685": {
    "id": "希望新生-心之勇士332",
    "title": "搭建溝通的管道",
    "content": "溝通時，要本著去了解別人處境的心去傾聽別人，想辦法給別人一個能講話的管道。你要搭建溝通的階梯，用平等、尊敬、和善、利他這些積極的心念，步步溝通、步步學習，見證自他在溝通中的自我成長。"
  },
  "686": {
    "id": "希望新生-心之勇士333",
    "title": "和合的妙方",
    "content": "不要懷著我慢的心去溝通，一定要別人接受自己，我們可以先傾聽別人、接受別人、理解別人的感受。這要訓練自己，不要處處都以自我為中心。在某一個時刻可否打開內心，認真地傾聽、判斷、感受別人的生命到底發生了什麼？在理解上，先走一步也很美好。常常選擇先理解別人，久久行之，和合便應運而生。"
  },
  "687": {
    "id": "希望新生-心之勇士334",
    "title": "沒有理由向後退",
    "content": "我們可以說自己不知道怎麼修行，但不要懷疑修行能否改變生命，因為已經有太多人證明過，這條路可以走得如此光采！所以你我無論遇到多少挫折和苦難，都沒有理由說：我要退、我要逃、我不幹了。不是你修不成，只是還沒找對方法，或堅持力不夠。"
  },
  "688": {
    "id": "希望新生-心之勇士335",
    "title": "學會欣賞自己的輝煌",
    "content": "我們應該學會欣賞自己生命成長的偉大過程，它常常悄悄地發生在內心深處，可能外表看起來還是很糟，可是實際上已經對自己生命做了最深刻的挑戰、最偉大的奮鬥。這是一個非常輝煌的過程！"
  },
  "689": {
    "id": "希望新生-心之勇士337",
    "title": "勇悍趣入甚深法義",
    "content": "對於經典上的甚深難解處，千萬不要怖畏！因為我們是要成就一切遍智，一切遍智要掃蕩一切無知、疑惑，一切難解、邪解處，所以面對這些新的、自己不知道的法義，要有一種勇悍趣入的決心。"
  },
  "690": {
    "id": "希望新生-心之勇士338",
    "title": "成為命運的主宰者",
    "content": "在森然萬境的每一次對境中，要不要行善？要不要修德？考慮一下：我的痛苦是自己要負責任，還是把痛苦的原因都推給別人？其實把責任推給別人的同時，也把自己成為命運主宰者的機會推掉了！為什麼呢？如果是別人有錯，只有別人改，我才會幸福，那我還能做什麼呢？好像我是一個無力成辦自己幸福的人，只能等著靠他人的給予，那我還能做什麼呢？"
  },
  "691": {
    "id": "希望新生-心之勇士339",
    "title": "痛苦的價值",
    "content": "當我們遭受強大的痛苦時，依然可以為自己的親人、為這個世界、為一切我想要饒益的人們奉獻。所以痛苦並沒有成為我生命的鎖鏈，反而由於它的壓迫，讓我綻放出內心更強大的光芒。因此，痛苦沒有毀滅我，反而幫了我！"
  },
  "692": {
    "id": "希望新生-心之勇士340",
    "title": "生命的自由度",
    "content": "每一次攝心，功夫都不會白費，久了之後，我們的心就不會常常被痛苦綑綁和傷害。當我們一次一次地把自己的注意力從外境收攝回來，注意自己的身、口、意！注意自己的呼吸，我們會發現一些平常沒有注意到的事情，會避免一些正在進行的錯誤和痛苦，讓這個心一次又一次地回歸平靜、回歸調柔、回歸寬廣和慈悲。這個訓練變得非常嫻熟之後，我們生命的自由度就會越來越高。"
  },
  "693": {
    "id": "希望新生-心之勇士341",
    "title": "在苦海上凌波起舞",
    "content": "當我們被疾病折磨得難以堪忍，醫藥也沒用、親人的安慰都沒用的時候，靠什麼？信仰、祈求的心！可以病、可以死，但是不用那麼慘。雖然不能做到百分之百瀟灑，但也可以在病魔摧殘的苦海上，提著正念的寶劍凌波起舞！"
  },
  "694": {
    "id": "希望新生-心之勇士342",
    "title": "永遠的明燈",
    "content": "在看不見天日、看不到希望、看不到光明的時候，我們憑什麼堅持下去？心中的信念！心中的信念就是希望本身，因為它來自於佛菩薩和善知識的言教，是清淨的正知見，是依照聖言量而建立的價值觀。所以它是絕對的一盞明燈，永遠散發出智慧的光芒！"
  },
  "695": {
    "id": "希望新生-心之勇士343",
    "title": "托舉日輪的人",
    "content": "「老師」像托舉日輪的人，因為他會把光明和正義的力量一直守護著、增長著，從一代一代學生心中，再傳遞到下一代，讓這個世界溫暖、讓這個世界明亮，這是一個非常非常神聖的職業！"
  },
  "696": {
    "id": "希望新生-心之勇士344",
    "title": "法音在耳須納受",
    "content": "雷聲轟隆隆地從天際傳來，響徹宇宙；甘霖般的細雨漫天飄灑，滋潤大地；我們善於傾聽的耳朵，要能聽雷鳴般的法音；我們的心，要能接受正法甘露的滋潤。"
  },
  "697": {
    "id": "希望新生-心之勇士345",
    "title": "憶念善知識挑戰生死",
    "content": "由於憶念善知識的原因，會讓我們的心非常堅固。雖然生死如此寒冷、令人怖畏，但是依靠著這個光明的能量，我們會開始不怕心靈的苦楚，也不怕別人製造出來的困境。久而久之，我們就會發現—自己的勇氣和智慧已經足以挑戰死亡了！"
  },
  "698": {
    "id": "希望新生-心之勇士346",
    "title": "勝利屬於永不放棄的人",
    "content": "修行這條路不會一帆風順，不是一開始就可以輕鬆地把自心的惡念全部降伏；而是要朝朝暮暮努力，衣帶漸寬終不悔地度過很多很多失敗再起來、失敗再起來的日子。但「勝利屬於永遠不放棄的人！」，當勝利沒有來到，即使倒了、即使死了，修行者的心念也要永遠朝著降伏自心煩惱的方向。這生做不到，來生還要做！來生做不到，生生世世努力，一定要把它做到！"
  },
  "699": {
    "id": "希望新生-心之勇士347",
    "title": "成為自心的主宰",
    "content": "修行人就是要徹底地戰勝自我，讓這顆心徹底地被馴服，不能失控；讓它修信念恩就修信念恩、不觀過就不觀過、不貪就不貪、不瞋就不瞋、不痴就不痴。控制了自己的心，就主宰了自己的命運！"
  },
  "700": {
    "id": "希望新生-心之勇士348",
    "title": "戰勝自己真勇士",
    "content": "受點氣、忍點委屈，能夠管住自己的身語意不要去造惡，這才是勇士！能夠對付自己的心，徹底戰勝自己的人，是最大的勇士！"
  },
  "701": {
    "id": "希望新生-心之勇士349",
    "title": "不屈惡習真英雄",
    "content": "一個人最讓人敬佩的，就是在苦難中掙扎奮進，保持著自己的夢想，不肯屈服於惡習的挑戰，這就是英雄！在修心的戰場上，即使其他的同行都紛紛落馬，自己也要撐著一面大旗挺立在那裡—「這是正念的陣地，煩惱習氣你不能完全侵占！」那時會顯示出一個人生命真正的韌度。"
  },
  "702": {
    "id": "希望新生-心之勇士350",
    "title": "歡喜修行成佛路",
    "content": "要學會快樂地修行，常常要給自己的心歡喜振奮的力量。如果不快樂，這條路這麼艱難，要學的這麼廣博深奧，你能走多遠？歡喜心可以讓你走很久，一直走到成佛，這點很重要、很重要！"
  },
  "703": {
    "id": "希望新生-心之勇士351",
    "title": "祈求加持超越水準",
    "content": "怎麼樣把事情辦到最好？祈求應該是第一要務！因為以自己的能力水準、以自己的智慧高度，所有的事情也就辦成今生這樣了，只有三寶的加持才能夠使我們超越水準，出奇地好。"
  },
  "704": {
    "id": "希望新生-心之勇士352",
    "title": "戰鬥到最後一刻",
    "content": "縱使是躺在病床上不能動了的時候，我們還是要學習做一個鬥煩惱的勇士，不可以屈服於生老病死的挑戰，一定要戰鬥到最後一刻！其實，最後一刻也就是即將走向來生的起始；這樣，在我們的心續就會養成一股堅定面對人生苦難的力量，延續到下一生。"

    let textKeys = Object.keys(cardTexts);
    let randomTextKey = "";

    function handleOrientationCheck() {
        const blocker = document.getElementById('portrait-blocker-overlay');
        if (!blocker) return;
        blocker.style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
    }

    window.addEventListener('resize', handleOrientationCheck);
    window.addEventListener('orientationchange', () => { setTimeout(handleOrientationCheck, 150); });

    function updateRandomDisplay() {
        if (textKeys.length === 0) return;
        const cardStage = document.getElementById('cardStage');
        cardStage.classList.add('fade-out');

        setTimeout(() => {
            const randomImgNum = Math.floor(Math.random() * 40) + 1;
            const paddedImgNum = String(randomImgNum).padStart(2, '0');
            cardStage.style.backgroundImage = `url('images/bg_${paddedImgNum}.webp')`;

            randomTextKey = textKeys[Math.floor(Math.random() * textKeys.length)];
            const selectedData = cardTexts[randomTextKey];

            const cardTitle = document.getElementById('cardTitle');
            const cardContent = document.getElementById('cardContent');
            const bottomRightBadge = document.getElementById('bottomRightBadge');

            cardTitle.textContent = selectedData.title;
            cardContent.textContent = selectedData.content;

            // 鎖定穩定容器高度基準 (cH)
            const stageHeight = cardStage.clientHeight || window.innerHeight;
            const cH = stageHeight * 0.815; 
            const maxH = cH - 12; // 嚴格保留 12px 底部緩衝空間

            // ==========================================
            // 💡 最佳字體範圍：33px 到 20px
            // ==========================================
            let size = 33;
            const minSize = 20;

            cardContent.style.fontSize = size + "px";
            cardTitle.style.fontSize = (size + 2) + "px";

            let tH = cardTitle.offsetHeight + cardContent.offsetHeight;

            // 往下縮減迴圈，直到符合高度限制或達到 20px 下限
            while (tH > maxH && size > minSize) {
                size--;
                cardContent.style.fontSize = size + "px";
                cardTitle.style.fontSize = (size + 2) + "px";
                tH = cardTitle.offsetHeight + cardContent.offsetHeight;
            }

            // 取得該筆資料的完整 ID（例如 "希望新生-四季法語001"）
            const displayId = selectedData.id || randomTextKey;

            // 右下角只留下 ID 顯示，無黑框、無背景
            bottomRightBadge.textContent = displayId;

            cardStage.classList.remove('fade-out');
        }, 300);
    }

    // LINE 截圖分享功能：先進入全螢幕並等待渲染穩定（400ms），保留右下角 ID，僅隱藏按鈕後截圖
    async function shareToLine() {
        const actionsBar = document.querySelector('.actions-bar');
        
        // 1. 強制請求進入全螢幕模式，消除瀏覽器工具列避免高度壓縮
        try {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            }
        } catch (e) {
            console.log("Fullscreen request skipped or not allowed:", e);
        }

        // 2. 等待 400 毫秒，確保全螢幕展開完成、字體與畫面完全渲染不被裁切
        await new Promise(resolve => setTimeout(resolve, 400));

        // 3. 僅隱藏下方的 5 個按鈕（保留右下角綠色 ID 顯示於截圖中）
        actionsBar.style.display = 'none';
        
        const cardStage = document.getElementById('cardStage');
        
        try {
            const canvas = await html2canvas(cardStage, {
                scale: 2,
                useCORS: true,
                allowTaint: true
            });
            
            canvas.toBlob(async (blob) => {
                let clipboardSuccess = false;
                
                try {
                    if (navigator.clipboard && navigator.clipboard.write) {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        clipboardSuccess = true;
                    }
                } catch (e) {
                    console.log('Clipboard API restricted:', e);
                }
                
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = '歡喜背書卡片.png';
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
                
                if (clipboardSuccess) {
                    alert('✨ 畫面截圖已成功複製到剪貼簿並下載圖片！\n您可直接貼上或至相簿選取分享至 LINE！');
                } else {
                    alert('📥 畫面截圖已成功下載至您的裝置！\n請至相簿開啟圖片，即可直接分享至 LINE！');
                }
                
                // 恢復顯示按鈕
                actionsBar.style.display = 'flex';
            }, 'image/png');
            
        } catch (err) {
            console.error('截圖失敗: ', err);
            actionsBar.style.display = 'flex';
            alert('截圖功能執行發生錯誤，請確保在支援的環境下使用。');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        handleOrientationCheck();
        updateRandomDisplay();
    });
</script>
