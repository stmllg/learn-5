<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡喜背書・陪伴卡與法語祈福 (V128 文字框左擴版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0B0F19;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background: #1E293B;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            border: 2px solid #38BDF8;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* 橫式 16:9 規格，背景圖片固定不動[cite: 2] */
        .card-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1200 / 675;
            background-color: #0F172A;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.9);
        }
        /* 右上角「希望新生 + 編號」：純綠色字體[cite: 2, 4] */
        .top-right-badge {
            position: absolute;
            top: 2%;
            right: 2.5%;
            color: #10B981;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 40;
            pointer-events: none;
        }

        /* 
          【文字框左擴調整 (V128)】：
          將 left 從 33% 往左延伸至 28%（大約多出 4 個字的寬度），
          讓每一行可以容納更多字，字體就不會被壓得太小。
        */
        .card-text-container {
            position: absolute;
            top: 6%;
            bottom: 6%;
            left: 28%;
            right: 9%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
            z-index: 10;
            pointer-events: none;
            gap: 4px;
            overflow: hidden;
        }

        .card-title {
            font-weight: 900;
            color: #581C87;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95), 0 0 10px rgba(255,255,255,0.8);
            width: 100%;
            line-height: 1.2;
            flex-shrink: 0;
        }
        .card-content {
            font-weight: 800;
            color: #0F172A;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 1px 3px rgba(255,255,255,0.95), 0 0 10px rgba(255,255,255,0.8);
        }

        /* 右下角直立長條按鈕設計 */
        .btn-blessing {
            position: absolute;
            bottom: 6%;
            right: 2.5%;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #FFFFFF;
            border: 2px solid #FDE68A;
            width: 42px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 900;
            border-radius: 21px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 50;
            transition: transform 0.1s, background 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", serif;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-blessing:hover {
            background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%);
            transform: scale(1.05);
        }
        .btn-blessing:active { 
            transform: scale(0.95); 
        }

        .status-bar {
            font-size: 13px;
            color: #38BDF8;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-stage" id="cardStage">
        <div class="top-right-badge" id="topRightBadge">希望新生</div>

        <div class="card-text-container" id="textContainer">
            <div class="card-title" id="cardTitle">載入中...</div>
            <div class="card-content" id="cardContent">請稍候，正在讀取外部資料...</div>
        </div>

        <!-- 右下角直立長條祈福按鈕 -->
        <button class="btn-blessing" onclick="updateRandomDisplay()">今天祈求</button>
    </div>

    <div class="status-bar" id="statusBar">狀態: 文字框左擴 4 字版 (V128)</div>
</div>

<script>
    let cardTexts = {};
    let textKeys = [];

    function updateRandomDisplay() {
        if (textKeys.length === 0) return;

        // 1. 隨機抽取背景圖 (bg_01 至 bg_40)[cite: 2]
        const randomImgNum = Math.floor(Math.random() * 40) + 1;
        const paddedImgNum = String(randomImgNum).padStart(2, '0');
        const imgPath = `images/bg_${paddedImgNum}.webp`;

        // 2. 從外部讀入的資料中隨機抽取一句法語文字[cite: 2]
        const randomTextKey = textKeys[Math.floor(Math.random() * textKeys.length)];
        const selectedData = cardTexts[randomTextKey];

        let titleText = selectedData.title;
        let rawContent = selectedData.content;

        if (titleText.length > 14) titleText = titleText.substring(0, 14);

        cardTitle.textContent = titleText;
        cardContent.textContent = rawContent;

        // 更新右上角顯示純綠色「希望新生 + 當前隨機編號」[cite: 2, 4]
        document.getElementById('topRightBadge').textContent = `希望新生 ${randomTextKey}`;

        // 最大化自適應填入演算：從 26px 開始嘗試，自動縮小至能完整塞入畫面的大小 (minSize: 7px)
        let size = 26; 
        const minSize = 7; 
        
        cardContent.style.fontSize = size + "px";
        cardTitle.style.fontSize = (size + 2) + "px";

        while ((textContainer.scrollHeight > textContainer.clientHeight) && (size > minSize)) {
            size--;
            cardContent.style.fontSize = size + "px";
            cardTitle.style.fontSize = (size + 2) + "px";
        }

        statusBar.textContent = `隨機背景: bg_${paddedImgNum}.webp | 代號: ${randomTextKey} (字數: ${rawContent.length}, 適配字體: ${size}px)`;
        cardStage.style.backgroundImage = `url('${imgPath}')`;
    }

    // 啟動時讀取同目錄下的 images_text.json 檔案[cite: 2]
    fetch('images_text.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('無法讀取 images_text.json 檔案');
            }
            return response.json();
        })
        .then(data => {
            cardTexts = data;
            textKeys = Object.keys(cardTexts);
            
            // 讀取成功後立即顯示第一張隨機卡片
            updateRandomDisplay();
        })
        .catch(error => {
            statusBar.textContent = `⚠️ 讀取 images_text.json 失敗: ${error.message}`;
            cardTitle.textContent = "資料載入失敗";
            cardContent.textContent = "請檢查專案資料夾是否包含 images_text.json 檔案";
        });
</script>

</body>
</html>
