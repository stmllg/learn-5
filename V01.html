<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聲音音節測試 V02</title><style>
*{box-sizing:border-box}body{font:20px system-ui,sans-serif;background:#f8f5eb;color:#263b32;margin:0;padding:12px}main{max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 8px}button{font: bold 20px system-ui;border:1px solid #b8c4b5;border-radius:10px;padding:12px;background:#e6efe5;color:#185b36;cursor:pointer}button:disabled{opacity:.4}#next{background:#17643b;color:white;flex:2}#retry{background:#ffe5bf;color:#933c21}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}#sentence{font-weight:bold;font-size:clamp(28px,5.8vw,46px);text-align:center;background:#fff;border:2px solid #d5c9a5;border-radius:12px;padding:22px 10px;margin:12px 0}#count{font-size:44px;font-weight:bold;color:#17643b}#status{min-height:1.5em;font-weight:bold}canvas{width:100%;height:86px;background:#fff;border:1px solid #ddd;border-radius:8px}small{font-size:15px}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}#history{max-height:180px;overflow:auto}#meter{height:8px;background:#ddd;border-radius:4px}#level{height:100%;background:#4d9564;width:0} </style><main><h1>聲音音節測試 V02</h1><small>20句，每句10字。只估算音節，不判定對錯。念完一句稍停，再按下一句。</small><div class="row"><button id="start">開始收音</button><button id="stop" disabled>停止收音</button><button id="export" disabled>匯出 JSON</button></div><div id="status">請按開始收音，先安靜一秒校正環境。</div><div id="savedCount" style="font-weight:bold;color:#17643b">已記錄 0 / 20 句</div><div id="backupStatus" style="font-size:15px"></div><div id="position">第 1 / 20 句</div><div id="sentence"></div><div class="row"><div>估計音節 <span id="count">0</span> / 10</div><div>有效發音 <b id="voice">0.00</b> 秒<br><small>經過 <span id="elapsed">0.00</span> 秒</small></div></div><div id="meter"><div id="level"></div></div><canvas id="plot" width="800" height="86"></canvas><div class="row"><button id="retry" disabled>本句重念</button><button id="next" disabled>下一句</button></div><small>每次重念也會保留紀錄。音節數是聲音波峰估算，並非文字辨識。資料留在本機，不上傳。</small><div id="history"><table><thead><tr><th>句次</th><th>音節</th><th>有效秒數</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const SENTENCES=[{"id": 2, "text": "欲護學處者，策勵當護心；"}, {"id": 3, "text": "若不護此心，不能護學處。"}, {"id": 4, "text": "若縱狂象心，受難無間獄；"}, {"id": 5, "text": "未馴大狂象，為患不及此。"}, {"id": 6, "text": "若以正念索，緊拴狂象心，"}, {"id": 7, "text": "怖畏盡消除，福善悉獲至。"}, {"id": 8, "text": "虎獅大象熊、蛇及一切敵、"}, {"id": 9, "text": "有情地獄卒、惡神並羅剎，"}, {"id": 10, "text": "唯由繫此心，即攝彼一切；"}, {"id": 11, "text": "調伏此一心，一切皆馴服。"}, {"id": 12, "text": "實語者佛言：一切諸畏懼、"}, {"id": 13, "text": "無量眾苦痛，皆從心所生。"}, {"id": 14, "text": "有情獄兵器，施設何人意？"}, {"id": 15, "text": "誰製燒鐵地？妖女從何出？"}, {"id": 16, "text": "佛說彼一切，皆由惡心造。"}, {"id": 17, "text": "是故三界中，恐怖莫甚心。"}, {"id": 18, "text": "若除眾生貧，始圓施度者，"}, {"id": 19, "text": "今猶見飢貧，昔佛云何成？"}, {"id": 20, "text": "心樂與眾生，身財及果德，"}, {"id": 21, "text": "僅此施度圓，故施唯依心。"}];
const $=id=>document.getElementById(id);let ctx,stream,source,node,silent,calibrating=false,active=false,index=0,attempt=0,records=[],frames=[],noise=[],floor=-60,calMs=0,started=false,voicedMs=0,elapsed=0,pre=[],done=false,frameMs=10,sessionInfo={},lastUI=0;
const SETTINGS={frameMs:10,calibrationMs:1000,voiceAboveNoiseDb:10,minVoiceDb:-65,peakMinDistanceMs:85,peakProminenceDb:3.5,peakLookaroundMs:70};
const STORAGE_KEY="syllable-test-v02"; let draft=null;
function progress(){const n=new Set(records.filter(r=>r.frames.length>0).map(r=>r.sentenceIndex)).size; $("savedCount").textContent=`已記錄 ${n} / 20 句（${records.length} 筆）`; $("export").disabled=!(records.length||frames.length||draft);}
function snapshot(reason){const peaks=analyze(frames);let last=frames.length-1;while(last>=0&&!frames[last].speech)last--;return {sentenceIndex:index+1,sourceId:SENTENCES[index].id,text:SENTENCES[index].text,expectedCharacters:10,attempt,reason,estimatedSyllables:peaks.length,voicedMs,elapsedMs:elapsed,voiceSpanMs:last>=0?frames[last].ms+10:0,tailSilenceMs:last>=0?elapsed-frames[last].ms-10:elapsed,noiseFloorDb:floor,peaks,frames:frames.slice()};}
function backup(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({index,attempt,records,done,sessionInfo,draft}));$("backupStatus").textContent="本機備份成功";}catch(e){$("backupStatus").textContent="本機備份失敗，請立即匯出："+e.message;}progress();}
function addRow(r){const tr=document.createElement("tr");for(const x of [r.sentenceIndex,r.estimatedSyllables,(r.voicedMs/1000).toFixed(2),r.reason]){const td=document.createElement("td");td.textContent=x;tr.append(td)}$("rows").append(tr);}
function quantile(a,p){if(!a.length)return -80;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor((b.length-1)*p)]}
function analyze(a){if(!a.length)return [];const smooth=a.map((f,i)=>{let z=0,n=0;for(let j=Math.max(0,i-2);j<=Math.min(a.length-1,i+2);j++){z+=a[j].bandDb;n++}return z/n});const out=[];for(let i=1;i<a.length-1;i++){if(!a[i].speech||smooth[i]<smooth[i-1]||smooth[i]<=smooth[i+1])continue;let l=smooth[i],r=smooth[i];for(let j=Math.max(0,i-7);j<i;j++)l=Math.min(l,smooth[j]);for(let j=i+1;j<=Math.min(a.length-1,i+7);j++)r=Math.min(r,smooth[j]);const prominence=smooth[i]-Math.max(l,r);if(prominence<SETTINGS.peakProminenceDb)continue;const peak={ms:a[i].ms,db:+smooth[i].toFixed(2),prominenceDb:+prominence.toFixed(2),leftLowDb:+l.toFixed(2),rightLowDb:+r.toFixed(2)};const prev=out[out.length-1];if(prev&&peak.ms-prev.ms<SETTINGS.peakMinDistanceMs){if(peak.db>prev.db)out[out.length-1]=peak}else out.push(peak)}return out}
function reset(){frames=[];pre=[];started=false;voicedMs=elapsed=0;attempt++;render();}
function render(){ $('position').textContent=done?'20句測試完成':`第 ${index+1} / 20 句`; $('sentence').textContent=done?'測試完成，請匯出 JSON':SENTENCES[index].text;$('next').textContent=index===19?'完成第20句':'下一句';updateUI();}
function updateUI(){const peaks=analyze(frames);$('count').textContent=peaks.length;$('voice').textContent=(voicedMs/1000).toFixed(2);$('elapsed').textContent=(elapsed/1000).toFixed(2);const c=$('plot'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);const f=frames.slice(-500),start=f[0]?.ms||0;g.strokeStyle='#aaa';let y=db=>Math.max(0,Math.min(c.height,c.height-((db+80)/80)*c.height));g.beginPath();g.moveTo(0,y(Math.max(SETTINGS.minVoiceDb,floor+10)));g.lineTo(c.width,y(Math.max(SETTINGS.minVoiceDb,floor+10)));g.stroke();g.strokeStyle='#39865c';g.beginPath();f.forEach((v,i)=>{const x=i/499*c.width;i?g.lineTo(x,y(v.bandDb)):g.moveTo(x,y(v.bandDb))});g.stroke();g.fillStyle='#c18424';for(const p of peaks){if(p.ms>=start){g.beginPath();g.arc((p.ms-start)/10/499*c.width,y(p.db),3,0,7);g.fill()}}}
function frame(rms,band,zc){if(!active||done)return;const db=20*Math.log10(Math.max(rms,1e-8)),bandDb=20*Math.log10(Math.max(band,1e-8));$('level').style.width=Math.min(100,Math.max(0,(db+65)*2))+'%';if(calibrating){noise.push(bandDb);calMs+=10;if(calMs>=1000){floor=quantile(noise,.7);calibrating=false;$('status').textContent='請念出聲，念完再按下一句';$('next').disabled=$('retry').disabled=false;}return}const speech=bandDb>=Math.max(-65,floor+10);const v={ms:0,rmsDb:+db.toFixed(2),bandDb:+bandDb.toFixed(2),zeroCrossings:zc,speech};if(!started){pre.push(v);if(pre.length>10)pre.shift();if(pre.slice(-4).filter(x=>x.speech).length<3)return;started=true;const first=pre.findIndex(x=>x.speech);for(const f of pre.slice(first)){f.ms=elapsed;frames.push(f);elapsed+=10;if(f.speech)voicedMs+=10}pre=[];}else{v.ms=elapsed;frames.push(v);elapsed+=10;if(speech)voicedMs+=10}if(frames.length>=12000){$('status').textContent='本句已達120秒記錄上限，請按下一句或重念';active=false;return}if(performance.now()-lastUI>150){lastUI=performance.now();$('status').textContent=speech?'念誦中':'等待下一個聲音／念完請按下一句';updateUI();progress()}}
function save(reason){if(!frames.length)return false;const r=snapshot(reason);records.push(r);draft=null;addRow(r);backup();return true;}
$('next').onclick=()=>{if(!save('next')){$('status').textContent='本句尚無收音紀錄，請先念誦';return;}if(index===19){done=true;active=false;shutdown();$('status').textContent='已完成，請匯出 JSON';$('next').disabled=$('retry').disabled=true;reset();backup();return}index++;reset();backup();active=true;$('status').textContent='請念出聲'};
$('retry').onclick=()=>{save('retry');reset();draft=null;backup();active=true;$('status').textContent='請從頭再念一遍'};
async function shutdown(){active=false;try{node?.disconnect();source?.disconnect();silent?.disconnect()}catch{}stream?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')await ctx.close().catch(()=>{});$('start').disabled=done;$('stop').disabled=true;$('next').disabled=$('retry').disabled=true;}
$('stop').onclick=async()=>{save('stop');await shutdown();reset();backup();$('status').textContent='已停止，仍可匯出紀錄'};
$('start').onclick=async()=>{if(done)return;$('start').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('瀏覽器未提供麥克風，請使用 HTTPS 網頁或 localhost');ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});source=ctx.createMediaStreamSource(stream);sessionInfo={sampleRate:ctx.sampleRate,trackSettings:stream.getAudioTracks()[0].getSettings(),userAgent:navigator.userAgent};const work=`class Meter extends AudioWorkletProcessor{constructor(){super();this.n=0;this.ss=0;this.bs=0;this.z=0;this.last=0;this.lp=0;this.hp=0;this.target=Math.round(sampleRate/100)}process(inputs){const a=inputs[0]?.[0];if(!a)return true;for(const x of a){this.lp+=0.035*(x-this.lp);const h=x-this.lp;this.hp+=0.25*(h-this.hp);this.ss+=x*x;this.bs+=this.hp*this.hp;if((x>=0)!=(this.last>=0))this.z++;this.last=x;if(++this.n>=this.target){this.port.postMessage([Math.sqrt(this.ss/this.n),Math.sqrt(this.bs/this.n),this.z]);this.n=this.ss=this.bs=this.z=0}}return true}}registerProcessor('meter',Meter);`;const url=URL.createObjectURL(new Blob([work],{type:'application/javascript'}));try{await ctx.audioWorklet.addModule(url);node=new AudioWorkletNode(ctx,'meter');node.port.onmessage=e=>frame(...e.data);sessionInfo.capture='AudioWorklet'}finally{URL.revokeObjectURL(url)}silent=ctx.createGain();silent.gain.value=0;source.connect(node);node.connect(silent);silent.connect(ctx.destination);noise=[];calMs=0;calibrating=true;active=true;if(draft){records.push(draft);addRow(draft);draft=null;}reset();backup();$('status').textContent='請安靜一秒，校正環境音';$('stop').disabled=false;}catch(e){await shutdown();$('status').textContent='無法啟動收音：'+e.message+'。請確認麥克風權限與 HTTPS。'}};
$('export').onclick=()=>{if(frames.length&&!done)draft=snapshot('unfinished');backup();if(!records.length&&!draft){$('status').textContent='沒有收音紀錄，請先念誦';return;}const data={version:'V02',createdAt:new Date().toISOString(),settings:SETTINGS,sessionInfo,sentences:SENTENCES,records,unfinished:draft};const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='音節測試V02_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('backupStatus').textContent=`已準備匯出 ${records.length} 筆完整紀錄${draft?'及本句暫存':''}，請確認下載。`;};
window.addEventListener('pagehide',()=>{if(frames.length&&!done)draft=snapshot('unfinished');backup();});
try{const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(old&&Array.isArray(old.records)){records=old.records;index=Math.max(0,Math.min(19,old.index||0));attempt=old.attempt||0;done=!!old.done;sessionInfo=old.sessionInfo||{};draft=old.draft||null;records.forEach(addRow);$('status').textContent='已恢復本機紀錄，可繼續收音或匯出';$('start').disabled=done;}}catch(e){$('backupStatus').textContent='無法讀取本機備份：'+e.message;}
const clear=document.createElement('button');clear.textContent='重新測試（清除紀錄）';clear.style.marginTop='12px';document.querySelector('main').append(clear);clear.onclick=async()=>{if(!confirm('確定清除本次全部測試紀錄？'))return;await shutdown();records=[];draft=null;index=0;done=false;attempt=0;sessionInfo={};$('rows').textContent='';reset();$('start').disabled=false;backup();$('status').textContent='請按開始收音';};render();progress();
</script></html>
