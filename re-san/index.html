<!DOCTYPE html>

  <!-- ========================================================================== -->
  <script>
    const CURRENT_CLASSIC_ID = 'er_sheng'; // ⚠️ 新經典請改此英文代碼：如 'bo_re'、'fa_hua'
    const GAS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbx_YOUR_ID/exec'; // 雲端共用 Apps Script 網址
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ECEFF1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* 主播放器容器（橫向全螢幕最佳化） */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 頂部資訊列 */
    header {
      height: 48px;
      background: #1E1E1E;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    /* 影音播放區 */
    main {
      flex: 1;
      display: flex;
      position: relative;
      background: #000;
    }
    #video-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* 底部控制區 */
    footer {
      height: 64px;
      background: #1A1A1A;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2C2C2C;
      padding: 0 12px;
    }
    .btn-action {
      background: #2A2A2A;
      color: #ECEFF1;
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-action.primary {
      background: #D4AF37;
      color: #1A120B;
      font-weight: bold;
      border: none;
    }

    /* ======================================================== */
    /* 🌟 21 天心靈陪伴卡：全螢幕宣紙浮層 UI                     */
    /* ======================================================== */
    #companion-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #companion-overlay.active {
      display: flex;
      opacity: 1;
    }

    #companion-card {
      position: relative;
      width: 86vw;
      max-width: 720px;
      height: 82vh;
      max-height: 420px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 38px;
      box-sizing: border-box;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-seal {
      background: #A33A31;
      color: #FFF8E7;
      font-size: 14px;
      padding: 3px 12px;
      border-radius: 4px;
      letter-spacing: 3px;
      font-weight: bold;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
    }
    .card-day-indicator {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 2px;
    }

    .card-body {
      text-align: center;
      padding: 8px 0;
    }
    .card-title {
      margin: 0 0 14px 0;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #FDF6E2;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .card-message {
      margin: 0 auto;
      max-width: 580px;
      font-size: 16.5px;
      line-height: 1.8;
      color: #F5F5F5;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed rgba(255, 255, 255, 0.25);
      padding-top: 14px;
    }
    .card-quote {
      font-size: 14px;
      color: #E0D2B4;
      font-style: italic;
      letter-spacing: 1px;
    }
    .btn-enter {
      background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
      color: #231700;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
    }
    .btn-enter:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

        <h2 class="card-title" id="card-title">步履初啟・甘露入心</h2>
        <p class="card-message" id="card-message">萬里之行始於當下一念。今天在心田種下的種子，未來必成參天菩提。放寬心，跟隨引導歡喜念誦！</p>
      </div>

      <div class="card-footer">
        <span class="card-quote" id="card-quote">「千里之行，始於足下。」</span>
        <button class="btn-enter" onclick="closeCompanionCard()">🙏 領受心意・開始背誦</button>
      </div>
    </div>

  <script>
    // ==========================================================================

    // ==========================================================================

    // 網址參數解析
    const urlParams = new URLSearchParams(window.location.search);

    const groupID = urlParams.get('group') || 'DEFAULT';

    // ==========================================================================

        bg: "linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), radial-gradient(circle at 80% 20%, #d97736 0%, #3e2723 60%, #1a120b 100%)"

        bg: "linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), radial-gradient(circle at 50% 80%, #0288d1 0%, #0f3057 55%, #051424 100%)"

      },
      {
        day: 12, stage: "生定力", title: "鐘聲清徹・心地平明", quote: "「晨鐘暮鼓，喚醒迷途。」",
        message: "每個念出的字句，如山中古剎的清亮鐘聲，震落塵勞，使內心深處恢復應有的平靜與明朗。",

      },
      {
        day: 13, stage: "潤心田", title: "隨風潛入・潤物無聲", quote: "「好雨知時節，潤物細無聲。」",
        message: "不用刻意死記硬背，法音如春雨自然滋潤心田。不知不覺中，經句已深植於記憶與日常言行。",
        bg: "linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), radial-gradient(circle at 30% 40%, #1b5e20 0%, #0d3813 55%, #051a08 100%)"
      },
      {
        day: 14, stage: "雙週成", title: "兩週蓄力・舌音成韻", quote: "「由生轉熟，純任自然。」",
        message: "克服了最初的生澀，經文已漸漸融入呼吸。音聲從口入耳、由耳入心，這份恆心正是世間最真功夫！",

      },
      {
        day: 15, stage: "照自性", title: "水平如鏡・倒映萬象", quote: "「心平何勞持戒，行直何用修禪。」",

      },

      },
      {
        day: 20, stage: "臨圓成", title: "根深柢固・將成大器", quote: "「不經一番寒徹骨，怎得梅花撲鼻香。」",
        message: "明天就是二十一日！二十天的扎實積累，好習慣已然在生命深處扎下深根，隨喜您不可思議的堅持！",
        bg: "linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), radial-gradient(circle at 40% 70%, #2e7d32 0%, #144217 55%, #081e0a 100%)"
      },
      {
        day: 21, stage: "習慣成", title: "朗月高懸・習慣圓成", quote: "「行遠自邇，篤志不移。」",
        message: "整整二十一日，這部經典已真正化作您生命的一部分！習慣已然深植，隨喜讚歎您無比殊勝的精進功德！",
        bg: "linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), radial-gradient(circle at 80% 30%, #fbc02d 0%, #5d4037 35%, #1a120b 100%)"
      }
    ];

    // ==========================================================================
    // 🚀 開機入口：自動判斷測試模式、21 天陪伴或雲端節慶卡
    // ==========================================================================
    let currentActiveSeenKey = null;

    async function initPlatform() {
      // 1. 初始化標題
      document.getElementById('classic-title-display').innerText = `歡喜背誦【${CURRENT_CLASSIC_ID}】`;

      // 2. 暖心卡片檢測流程
      await handleWarmCards();

      // 3. 載入相對天數排程 schedule.json
      loadSchedule();
    }

    async function handleWarmCards() {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      // 🌟【測試模式】：若網址沒有帶 ?start 參數，每次重整自動輪播 1~21 天展示
      if (!startDateStr) {
        let testIdx = parseInt(localStorage.getItem(STORAGE_KEY_PREFIX + 'TEST_CARD_INDEX') || '0', 10);
        const card = COMPANION_21_CARDS[testIdx % COMPANION_21_CARDS.length];
        showCardUI(card, `測試輪播・第 ${card.day} 天`);
        localStorage.setItem(STORAGE_KEY_PREFIX + 'TEST_CARD_INDEX', (testIdx + 1).toString());
        return;
      }

      // 📌【正式模式】：推算相對天數
      const start = new Date(startDateStr);
      const diffTime = today - start;
      const currentDay = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

      // 防疲勞檢查：今日已看過則跳過
      const seenKey = STORAGE_KEY_PREFIX + 'SEEN_CARD_' + todayStr;
      if (localStorage.getItem(seenKey)) {
        return; // 今天已領受過，直接靜音進入
      }

      // 軌道一：前 21 天，顯示個人陪伴卡（本地優先）
      if (currentDay >= 1 && currentDay <= 21) {
        const card = COMPANION_21_CARDS.find(c => c.day === currentDay) || COMPANION_21_CARDS[0];
        showCardUI(card, `第 ${card.day} 天・習慣養成`, seenKey);
        return;
      }

      // 軌道二：超過 21 天，連線檢查是否有歲時節日祝福卡
      if (navigator.onLine) {
        try {
          const res = await fetch(`${GAS_BACKEND_URL}?action=getFestivalCard&date=${todayStr}&classicId=${CURRENT_CLASSIC_ID}`);
          const data = await res.json();
          if (data && data.active) {
            showCardUI({
              stage: data.stage || "歲時叮嚀",
              title: data.title,
              message: data.message,
              quote: data.quote,
              bg: data.bg || "linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), #1a120b"
            }, "歲時關懷", seenKey);
          }
        } catch (e) {
          console.log('節日卡檢查略過');
        }
      }
    }

    function showCardUI(card, dayLabel, seenKey = null) {
      currentActiveSeenKey = seenKey;
      const overlay = document.getElementById('companion-overlay');
      const cardBox = document.getElementById('companion-card');

      cardBox.style.background = card.bg;
      document.getElementById('card-stage').innerText = `〔 ${card.stage} 〕`;
      document.getElementById('card-day-indicator').innerText = dayLabel;
      document.getElementById('card-title').innerText = card.title;
      document.getElementById('card-message').innerText = card.message;
      document.getElementById('card-quote').innerText = card.quote;

      overlay.classList.add('active');
    }

    function closeCompanionCard() {
      const overlay = document.getElementById('companion-overlay');
      if (currentActiveSeenKey) {
        localStorage.setItem(currentActiveSeenKey, 'true'); // 正式環境下標記今日已閱
      }
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.classList.remove('active');
        overlay.style.opacity = '';
      }, 400);
    }

    // ==========================================================================
    // 📅【排程讀取與播放控制】
    // ==========================================================================
    async function loadSchedule() {
      try {
        const res = await fetch('schedule.json');
        const schedule = await res.json();
        
        let targetDay = 1;
        if (startDateStr) {
          const diff = new Date() - new Date(startDateStr);
          targetDay = Math.max(1, Math.floor(diff / (1000 * 60 * 60 * 24)) + 1);
        }
        
        const todayPlan = schedule.find(s => s.day === targetDay) || schedule[schedule.length - 1];
        document.getElementById('schedule-status-display').innerText = 
          `今日進度: 第 ${todayPlan.day} 天 (第 ${todayPlan.start} 句～第 ${todayPlan.end} 句)`;
      } catch (e) {
        document.getElementById('schedule-status-display').innerText = '自主復習模式';
      }
    }

    const video = document.getElementById('main-video');
    function togglePlay() {
      const btn = document.getElementById('btn-play-pause');
      if (video.paused) {
        video.play();
        btn.innerText = '⏸ 暫停';
      } else {
        video.pause();
        btn.innerText = '▶ 播放';
      }
    }

    function jumpSentence(dir) {
      video.currentTime += (dir * 5); // 快速跳轉示範
    }

    function submitCoinsModal() {
      alert(`已將功德幣記錄至【${CURRENT_CLASSIC_ID}】專屬功德保險箱！`);
    }

    // 開機執行
    window.addEventListener('DOMContentLoaded', initPlatform);
  </script>
</body>
</html>
