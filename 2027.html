<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>種樹護地球-福智美</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #0d1b2a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 133.33vh; /* 4:3 滿版比例 */
  max-height: 75vw;
  background: #1b263b;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
@media (max-aspect-ratio: 4/3) {
  #game-container {
    width: 100vw;
    height: 75vw;
  }
}
@media (min-aspect-ratio: 4/3) {
  #game-container {
    height: 100vh;
    width: 133.33vh;
  }
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}
#fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 42px;
  height: 42px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 8px;
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <button id="fullscreen-btn" title="全螢幕">⛶</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// 遊戲狀態機
let state = {
  level: 1, // 1: 育苗, 2: 上山種樹, 3: 守護, 4: 圓滿成林
  score: 0,
  waterCount: 0,
  maxWater: 10,
  // 第二關變數
  plantStep: 0, // 0: 挖坑, 1: 放苗, 2: 填土, 3: 澆透水
  // 第三關變數
  guardScore: 0,
  targetGuardScore: 15,
  basketX: 400,
  items: [],
  lastItemTime: 0,
  // 觸控互動
  touchX: 400,
  touchY: 300,
  isDown: false,
  potX: 200,
  potY: 200,
  isDraggingPot: false
};

// 座標轉換
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

// 觸控與滑鼠事件監聽
function handleStart(e) {
  e.preventDefault();
  const pos = getCanvasPos(e);
  state.isDown = true;
  state.touchX = pos.x;
  state.touchY = pos.y;

  if (state.level === 1) {
    // 檢查是否點到水壺
    const dist = Math.hypot(pos.x - state.potX, pos.y - state.potY);
    if (dist < 70) {
      state.isDraggingPot = true;
    }
  } else if (state.level === 2) {
    // 點擊進行下一步種樹流程
    const moundX = 400, moundY = 420;
    const dist = Math.hypot(pos.x - moundX, pos.y - moundY);
    if (dist < 120) {
      state.plantStep++;
      if (state.plantStep > 3) {
        state.level = 3;
        state.lastItemTime = performance.now();
      }
    }
  } else if (state.level === 3) {
    state.basketX = pos.x;
  } else if (state.level === 4) {
    // 重新開始
    state.level = 1;
    state.waterCount = 0;
    state.plantStep = 0;
    state.guardScore = 0;
    state.items = [];
    state.potX = 200;
    state.potY = 200;
  }
}

function handleMove(e) {
  e.preventDefault();
  const pos = getCanvasPos(e);
  state.touchX = pos.x;
  state.touchY = pos.y;

  if (state.level === 1 && state.isDraggingPot) {
    state.potX = pos.x;
    state.potY = pos.y;
    // 判斷是否在樹苗上方澆水
    if (Math.abs(state.potX - 400) < 60 && Math.abs(state.potY - 260) < 60) {
      state.waterCount += 0.05;
      if (state.waterCount >= state.maxWater) {
        state.level = 2;
        state.isDraggingPot = false;
      }
    }
  } else if (state.level === 3) {
    state.basketX = pos.x;
  }
}

function handleEnd(e) {
  state.isDown = false;
  state.isDraggingPot = false;
}

canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart, { passive: false });
window.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd, { passive: false });

// 全螢幕切換
document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// 第三關掉落物生成與更新
function updateLevel3(now) {
  if (now - state.lastItemTime > 800) {
    state.lastItemTime = now;
    const isGood = Math.random() > 0.3; // 70% 是甘露或陽光
    state.items.push({
      x: Math.random() * 700 + 50,
      y: 50,
      type: isGood ? (Math.random() > 0.5 ? 'water' : 'sun') : 'wind',
      speed: Math.random() * 2 + 3
    });
  }

  for (let i = state.items.length - 1; i >= 0; i--) {
    let item = state.items[i];
    item.y += item.speed;

    // 碰撞偵測（守護網籃子）
    if (item.y > 480 && item.y < 530 && Math.abs(item.x - state.basketX) < 60) {
      if (item.type === 'water' || item.type === 'sun') {
        state.guardScore++;
      } else {
        state.guardScore = Math.max(0, state.guardScore - 2);
      }
      state.items.splice(i, 1);
      if (state.guardScore >= state.targetGuardScore) {
        state.level = 4;
      }
      continue;
    }

    if (item.y > 600) {
      state.items.splice(i, 1);
    }
  }
}

// 繪製背景與物件
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state.level === 1) {
    // 第一關：育苗階段
    let grad = ctx.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#70e000');
    grad.addColorStop(1, '#38b000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 600);

    // 育苗室平台
    ctx.fillStyle = '#6f4e37';
    ctx.fillRect(0, 450, 800, 150);

    // 盆栽
    ctx.fillStyle = '#b05c31';
    ctx.beginPath();
    ctx.moveTo(330, 480);
    ctx.lineTo(470, 480);
    ctx.lineTo(450, 560);
    ctx.lineTo(350, 560);
    ctx.closePath();
    ctx.fill();

    // 幼苗成長度
    let progress = Math.min(1, state.waterCount / state.maxWater);
    let sproutH = 40 + progress * 70;
    ctx.strokeStyle = '#2d6a4f';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(400, 480);
    ctx.lineTo(400, 480 - sproutH);
    ctx.stroke();

    // 嫩葉
    ctx.fillStyle = '#52b788';
    ctx.beginPath();
    ctx.ellipse(375, 480 - sproutH + 15, 25, 12, -Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(425, 480 - sproutH + 15, 25, 12, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();

    // 水壺
    ctx.save();
    ctx.translate(state.potX, state.potY);
    ctx.fillStyle = '#48cae4';
    ctx.beginPath();
    ctx.roundRect(-40, -30, 80, 60, 10);
    ctx.fill();
    // 壺嘴
    ctx.fillStyle = '#0077b6';
    ctx.beginPath();
    ctx.moveTo(30, 0);
    ctx.lineTo(65, -25);
    ctx.lineTo(65, -15);
    ctx.lineTo(35, 15);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 澆水中的水滴效果
    if (state.isDraggingPot && Math.abs(state.potX - 400) < 60 && Math.abs(state.potY - 260) < 60) {
      ctx.fillStyle = '#00b4d8';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(400 + (Math.random() * 40 - 20), 300 + Math.random() * 80, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 提示說明
    drawText('第一關：用心育苗', 400, 50, 32, '#ffffff');
    drawText('👉 用手指按住水壺，移至幼苗上方進行澆灌', 400, 95, 20, '#d8f3dc');
    drawText(`培育進度: ${Math.floor(progress * 100)}%`, 400, 130, 22, '#fff');

  } else if (state.level === 2) {
    // 第二關：上山種樹階段
    let sky = ctx.createLinearGradient(0, 0, 0, 350);
    sky.addColorStop(0, '#a2d2ff');
    sky.addColorStop(1, '#bde0fe');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 800, 600);

    // 高山大地
    ctx.fillStyle = '#588157';
    ctx.beginPath();
    ctx.moveTo(0, 400);
    ctx.quadraticCurveTo(250, 280, 500, 360);
    ctx.quadraticCurveTo(680, 410, 800, 340);
    ctx.lineTo(800, 600);
    ctx.lineTo(0, 600);
    ctx.closePath();
    ctx.fill();

    // 種植地穴
    ctx.fillStyle = '#3a5a40';
    ctx.beginPath();
    ctx.ellipse(400, 450, 70, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    const stepTexts = [
      '第一步：點擊土地掘出樹穴 (1/4)',
      '第二步：點擊將健壯苗木植入土中 (2/4)',
      '第三步：點擊回填沃土 (3/4)',
      '第四步：點擊澆灌定根水，扎根大地 (4/4)'
    ];

    if (state.plantStep >= 1) {
      // 樹苗樹幹
      ctx.strokeStyle = '#582f0e';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(400, 450);
      ctx.lineTo(400, 320);
      ctx.stroke();

      // 樹葉團
      ctx.fillStyle = '#2d6a4f';
      ctx.beginPath();
      ctx.arc(400, 300, 45, 0, Math.PI * 2);
      ctx.arc(370, 315, 35, 0, Math.PI * 2);
      ctx.arc(430, 315, 35, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state.plantStep >= 2) {
      // 覆土
      ctx.fillStyle = '#7f4f24';
      ctx.beginPath();
      ctx.ellipse(400, 450, 60, 20, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state.plantStep >= 3) {
      // 充足水痕
      ctx.fillStyle = 'rgba(0, 180, 216, 0.5)';
      ctx.beginPath();
      ctx.ellipse(400, 450, 75, 25, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    drawText('第二關：上山種樹', 400, 50, 32, '#1d3557');
    drawText('將所學化為實踐行動，親手植入高山大地', 400, 90, 22, '#333333');
    drawText(stepTexts[state.plantStep], 400, 130, 24, '#b7094c');
    drawText('👉 點擊山坡中心土堆完成動作', 400, 560, 20, '#ffffff');

  } else if (state.level === 3) {
    // 第三關：守護心苗
    let grad = ctx.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#1d3557');
    grad.addColorStop(1, '#457b9d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 600);

    // 山地
    ctx.fillStyle = '#283618';
    ctx.fillRect(0, 520, 800, 80);

    // 中間的希望之樹成長
    let treeScale = 1 + (state.guardScore / state.targetGuardScore) * 0.8;
    ctx.strokeStyle = '#603808';
    ctx.lineWidth = 18 * treeScale;
    ctx.beginPath();
    ctx.moveTo(400, 540);
    ctx.lineTo(400, 540 - 140 * treeScale);
    ctx.stroke();

    ctx.fillStyle = '#52b788';
    ctx.beginPath();
    ctx.arc(400, 540 - 150 * treeScale, 55 * treeScale, 0, Math.PI * 2);
    ctx.arc(360, 540 - 130 * treeScale, 45 * treeScale, 0, Math.PI * 2);
    ctx.arc(440, 540 - 130 * treeScale, 45 * treeScale, 0, Math.PI * 2);
    ctx.fill();

    // 掉落物繪製
    state.items.forEach(item => {
      ctx.beginPath();
      if (item.type === 'water') {
        ctx.fillStyle = '#00b4d8';
        ctx.arc(item.x, item.y, 14, 0, Math.PI * 2);
        ctx.fill();
      } else if (item.type === 'sun') {
        ctx.fillStyle = '#ffb703';
        ctx.arc(item.x, item.y, 16, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#e63946'; // 風害／蟲害
        ctx.arc(item.x, item.y, 15, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // 守護之網（由觸控左右拖曳控制）
    ctx.fillStyle = '#f4a261';
    ctx.beginPath();
    ctx.roundRect(state.basketX - 55, 490, 110, 22, 10);
    ctx.fill();

    drawText('第三關：守護心苗', 400, 45, 32, '#f1faee');
    drawText('細心呵護心苗不退轉，防範風害、接引甘霖', 400, 85, 20, '#a8dadc');
    drawText(`守護能量: ${state.guardScore} / ${state.targetGuardScore}`, 400, 125, 24, '#ffe6a7');
    drawText('👉 用手指在螢幕上左右滑動接取水滴與陽光', 400, 570, 20, '#ffffff');

  } else if (state.level === 4) {
    // 圓滿結尾：成林成佛
    let grad = ctx.createLinearGradient(0, 0, 0, 600);
    grad.addColorStop(0, '#ffd166');
    grad.addColorStop(1, '#06d6a0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 600);

    // 菩提巨樹茂盛
    ctx.strokeStyle = '#4a2810';
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.moveTo(400, 600);
    ctx.lineTo(400, 300);
    ctx.stroke();

    ctx.fillStyle = '#1b4332';
    ctx.beginPath();
    ctx.arc(400, 240, 140, 0, Math.PI * 2);
    ctx.arc(300, 260, 100, 0, Math.PI * 2);
    ctx.arc(500, 260, 100, 0, Math.PI * 2);
    ctx.fill();

    // 碩果纍纍
    ctx.fillStyle = '#e63946';
    const fruits = [
      [360, 220], [440, 210], [310, 280], [490, 270], 
      [400, 280], [380, 170], [420, 160]
    ];
    fruits.forEach(([fx, fy]) => {
      ctx.beginPath();
      ctx.arc(fx, fy, 12, 0, Math.PI * 2);
      ctx.fill();
    });

    drawText('🌱 圓滿成林・心靈扎根 🌱', 400, 80, 36, '#0b090a');
    drawText('育苗 ➔ 上山種樹 ➔ 守護成就', 400, 125, 22, '#212529');
    drawText('點擊螢幕任何處即可再次體驗', 400, 560, 22, '#ffffff');
  }
}

function drawText(text, x, y, size, color) {
  ctx.save();
  ctx.font = `bold ${size}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// 動畫循環主迴圈
function gameLoop(now) {
  if (state.level === 3) {
    updateLevel3(now);
  }
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
